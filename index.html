  <title>乐宝麦宝学习平台</title>
  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --pink-50:#FFF0F5; --pink-100:#FFE0EC; --pink-200:#FFC1D9; --pink-400:#FF6B9D; --pink-600:#D6336C; --pink-800:#A61E4D;
      --orange-50:#FFF4E6; --orange-200:#FFD9A8; --orange-400:#FF9800; --orange-600:#E65100;
      --cyan-50:#E0F7FA; --cyan-200:#80DEEA; --cyan-400:#00BCD4; --cyan-600:#00838F;
      --purple-50:#F3E5F5; --purple-200:#CE93D8; --purple-400:#9C27B0; --purple-600:#6A1B9A;
      --green-50:#E8F5E9; --green-400:#4CAF50; --green-600:#2E7D32;
      --amber-50:#FFF8E1; --amber-400:#FFC107; --amber-600:#FF8F00;
      --red-50:#FFEBEE; --red-400:#EF5350; --red-600:#C62828;
      --indigo-50:#E8EAF6; --indigo-400:#5C6BC0; --indigo-600:#3949AB;
      --teal-50:#E0F2F1; --teal-400:#26A69A; --teal-600:#00695C;
      --gray-50:#FAFAFA; --gray-100:#F5F5F5; --gray-200:#EEEEEE; --gray-400:#BDBDBD; --gray-600:#757575; --gray-800:#424242; --gray-900:#212121;
      --bg-page:#FAFAFA; --bg-card:#FFFFFF; --border:#E5E5E5; --border-soft:#F0F0F0;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; color:var(--gray-900); background:var(--bg-page); font-size:14px; line-height:1.5; }
    button { font-family: inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
    input { font-family: inherit; font-size:14px; }

    /* ===== 应用容器（手机框 / 学习机大屏自适应） ===== */
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; padding-bottom: 76px; }

    /* ===== 顶部导航 ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg-card);
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar h1 { margin:0; font-size: 17px; font-weight: 600; }
    .topbar .actions { display:flex; gap:8px; }
    .icon-btn { width:36px; height:36px; border-radius: 10px; display:flex; align-items:center; justify-content:center; background: var(--gray-100); }
    .icon-btn svg { width:18px; height:18px; }

    /* ===== 底部 Tab Bar ===== */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      max-width: 480px; width: 100%;
      background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border-soft);
      display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding: 6px 0; color: var(--gray-600); }
    .tab.active { color: var(--pink-600); }
    .tab svg { width:22px; height:22px; }
    .tab span { font-size: 11px; }

    /* ===== 通用卡片 / 容器 ===== */
    .page { padding: 12px 16px 16px; }
    .section { background: var(--bg-card); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; border: 0.5px solid var(--border-soft); }
    .section h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display:flex; align-items:center; justify-content: space-between; }
    .section h3 .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 500; }

    /* ===== 入口页 ===== */
    .entry-hero {
      background: linear-gradient(135deg, var(--pink-400) 0%, #C2185B 100%);
      color: #fff; padding: 48px 24px 64px; text-align: center;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    }
    .entry-hero .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
      background: rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .entry-hero h2 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
    .entry-hero p { margin: 0; opacity: 0.9; font-size: 13px; }

    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; margin-top: -32px; }
    .role-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px 16px;
      border: 0.5px solid var(--border-soft); text-align: center; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .role-card:active { transform: scale(0.97); }
    .role-card .icon { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; }
    .role-card.mom .icon { background: var(--purple-50); color: var(--purple-600); }
    .role-card.kid .icon { background: var(--pink-50); color: var(--pink-600); }
    .role-card h4 { margin: 0 0 2px; font-size: 15px; }
    .role-card p { margin: 0; font-size: 12px; color: var(--gray-600); }
    .role-card svg { width: 28px; height: 28px; }

    /* ===== 密码 / PIN 输入 ===== */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 0 auto; }
    .pin-key {
      aspect-ratio: 1.6/1; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border);
      font-size: 22px; font-weight: 500;
    }
    .pin-key:active { background: var(--gray-100); }
    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 24px 0 32px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gray-200); }
    .pin-dot.filled { background: var(--pink-400); }
    .pin-title { text-align: center; margin: 32px 0 4px; font-size: 18px; font-weight: 600; }
    .pin-sub { text-align: center; margin: 0 0 24px; color: var(--gray-600); font-size: 13px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px; margin-bottom: 24px; }
    .avatar-cell {
      aspect-ratio: 1/1; border-radius: var(--radius-md);
      background: var(--gray-100); display:flex; align-items:center; justify-content:center;
      font-size: 28px; cursor: pointer; border: 2px solid transparent;
    }
    .avatar-cell.active { border-color: var(--pink-400); background: var(--pink-50); }

    /* ===== 单词打卡 ===== */
    .wq-bar { height: 8px; border-radius: 4px; background: var(--gray-100); overflow: hidden; }
    .wq-bar-in { height: 100%; background: linear-gradient(90deg, var(--pink-400), var(--pink-600)); border-radius: 4px; transition: width .3s; }
    .wq-done { background: var(--green-50); color: var(--green-600); border-radius: var(--radius-md); padding: 12px; text-align: center; font-weight: 500; }
    .wq-word-card { background: linear-gradient(135deg, var(--pink-400), #C2185B); color: #fff; border-radius: var(--radius-lg); padding: 28px 16px; text-align: center; margin-bottom: 12px; }
    .wq-word-card .w { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .wq-word-card .cn { font-size: 15px; opacity: .92; margin-top: 4px; }
    .wq-sound-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.25); color: #fff; display: flex; align-items: center; justify-content: center; margin: 14px auto 0; font-size: 28px; }
    .wq-sound-btn:active { transform: scale(.92); }
    .wq-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .wq-choice { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 8px; font-size: 15px; text-align: center; }
    .wq-choice:active { transform: scale(.97); }
    .wq-choice.ok { border-color: var(--green-400); background: var(--green-50); color: var(--green-600); }
    .wq-choice.bad { border-color: #ef5350; background: #FFEBEE; color: #C62828; animation: wqshake .3s; }
    @keyframes wqshake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .wq-step-tag { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 600; margin-bottom: 8px; }
    .wq-spell { width: 100%; text-align: center; font-size: 22px; letter-spacing: 3px; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); text-transform: lowercase; }
    .wq-spell.bad { border-color: #ef5350; animation: wqshake .3s; }
    .wq-hint { text-align: center; color: var(--gray-600); font-size: 12px; margin-top: 8px; }
    /* ---- 单词三段式闯关 ---- */
    .wq-stages { display:flex; gap:6px; margin-bottom:12px; }
    .wq-stage { flex:1; text-align:center; font-size:12px; font-weight:600; padding:7px 2px; border-radius:9px; background:var(--gray-100); color:var(--gray-600); }
    .wq-stage.done { background:var(--green-50); color:var(--green-600); }
    .wq-stage.on { background:var(--pink-50); color:var(--pink-600); box-shadow:inset 0 0 0 1.5px var(--pink-200); }
    .wq-round-tip { text-align:center; font-size:12px; color:var(--gray-600); margin-bottom:10px; }
    .good { border-color:var(--green-400) !important; background:var(--green-50) !important; color:var(--green-600) !important; }
    .btn-text { background:none; border:none; color:var(--gray-600); font-size:13px; cursor:pointer; padding:6px; text-decoration:underline; }
    /* ---- 听写 ---- */
    .dic-hero { background:linear-gradient(135deg,var(--indigo-400),var(--indigo-600)); color:#fff; border-radius:var(--radius-lg); padding:26px 16px; text-align:center; margin-bottom:12px; }
    .dic-hero .n { font-size:13px; opacity:.9; }
    .dic-hero .tip { font-size:21px; font-weight:600; margin-top:8px; line-height:1.5; word-break:break-all; }
    .dic-hero .sub { font-size:13px; opacity:.85; margin-top:8px; }
    .dic-play { width:88px; height:88px; border-radius:50%; background:rgba(255,255,255,.22); color:#fff; display:flex; align-items:center; justify-content:center; margin:16px auto 0; font-size:34px; border:none; cursor:pointer; }
    .dic-play:active { transform:scale(.94); }
    .dic-input { width:100%; text-align:center; font-size:22px; padding:14px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--bg-card); }
    .dic-dots { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:12px; }
    .dic-dot { width:22px; height:22px; border-radius:50%; background:var(--gray-100); color:var(--gray-600); font-size:11px; display:flex; align-items:center; justify-content:center; }
    .dic-dot.now { background:var(--pink-400); color:#fff; }
    .dic-dot.ok { background:var(--green-50); color:var(--green-600); }
    .dic-dot.no { background:var(--red-50); color:var(--red-600); }
    .dic-result { text-align:center; padding:18px; border-radius:var(--radius-lg); background:var(--green-50); margin-bottom:12px; }
    .dic-wrong-item { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-radius:10px; background:var(--bg-card); border:1px solid var(--border); margin-bottom:6px; font-size:14px; }
    .dic-wrong-item .right { color:var(--green-600); font-weight:600; }
    .dic-wrong-item .mine { color:var(--red-600); text-decoration:line-through; }
    /* ---- 任务类型 ---- */
    .kind-row { display:flex; gap:6px; }
    .kind-pill { flex:1; padding:9px 4px; border-radius:10px; background:var(--gray-100); color:var(--gray-600); font-size:13px; font-weight:600; text-align:center; cursor:pointer; border:1.5px solid transparent; }
    .kind-pill span { display:block; font-size:11px; font-weight:400; margin-top:3px; opacity:.85; }
    .kind-pill.on { background:var(--pink-50); color:var(--pink-600); border-color:var(--pink-200); }
    .kind-tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px; margin-right:5px; font-weight:600; vertical-align:middle; }
    .kt-read { background:var(--cyan-50); color:var(--cyan-600); }
    .kt-video { background:var(--indigo-50); color:var(--indigo-600); }
    .btn-sm { width:auto; padding:7px 14px; font-size:13px; margin-top:8px; }
    /* ---- 看视频任务播放器（严格模式）---- */
    .sv-stage { position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; }
    .sv-stage video { display:block; width:100%; max-height:52vh; background:#000; }
    .sv-cover { position:absolute; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.35); color:#fff; border:none; font-size:40px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .sv-cover span { font-size:13px; margin-top:6px; }
    .sv-bar { height:8px; border-radius:4px; background:var(--gray-200); overflow:hidden; margin-top:10px; }
    .sv-bar-in { height:100%; width:0; background:linear-gradient(90deg,var(--indigo-400),var(--indigo-600)); border-radius:4px; }
    .sv-time { display:flex; justify-content:space-between; font-size:12px; color:var(--gray-600); margin-top:5px; }
    .sv-ctrl { display:flex; gap:6px; margin-top:10px; }
    .sv-ctrl button { flex:1; padding:9px 2px; border-radius:9px; border:1px solid var(--border); background:var(--bg-card); font-size:13px; cursor:pointer; }
    .sv-tip { text-align:center; font-size:12px; color:var(--gray-600); margin-top:10px; }
    .sv-subrow { display:none; margin-top:9px; text-align:center; }
    .sv-subrow .btn-sm { min-width:96px; }
    .sv-subrow.on .btn-sm { background:var(--indigo-50); border-color:var(--indigo-400); color:var(--indigo-600); }
    .sv-subinfo { display:block; font-size:12px; color:var(--gray-600); margin-top:6px; line-height:1.5; }
    .sv-stage video::cue { font-size:19px; color:#fff; background:rgba(0,0,0,.62); line-height:1.55; }
    .res-sub-tag { display:inline-block; margin-left:5px; padding:0 5px; border-radius:5px; background:var(--indigo-50); color:var(--indigo-600); font-size:11px; vertical-align:middle; }
    /* ---- 作业栏 ---- */
    .hw-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
    .hw-head { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    .hw-who { font-size:12px; font-weight:600; color:var(--gray-600); }
    .hw-text { font-size:14px; line-height:1.65; white-space:normal; word-break:break-word; }
    .hw-imgs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .hw-img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; }

    /* ===== 星星乐园 ===== */
    .fun-hero { background: linear-gradient(135deg, #7C4DFF, #448AFF); color:#fff; border-radius: var(--radius-lg); padding:18px 16px; margin-bottom:12px; text-align:center; }
    .fun-hero .big { font-size:26px; font-weight:700; }
    .fun-hero .gate { font-size:12px; opacity:.92; margin-top:4px; }
    .game-card { display:flex; align-items:center; gap:12px; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-lg); padding:14px; margin-bottom:10px; cursor:pointer; }
    .game-card:active { transform: scale(.98); }
    .game-card .gicon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--purple-50); }
    .game-card .ginfo { flex:1; }
    .game-card .ginfo h4 { margin:0; font-size:15px; }
    .game-card .ginfo p { margin:2px 0 0; font-size:12px; color:var(--gray-600); }
    .game-card .cost { font-size:12px; font-weight:600; color:var(--amber-600); background:var(--amber-50); border-radius:8px; padding:4px 8px; white-space:nowrap; }
    .wheel-wrap { position:relative; width:250px; height:250px; margin:16px auto 6px; }
    .wheel { width:100%; height:100%; border-radius:50%; border:8px solid #fff; box-shadow:0 4px 16px rgba(0,0,0,.18); transition: transform 3.2s cubic-bezier(.15,.85,.25,1); }
    .wheel-pointer { position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:26px; z-index:2; }
    .wheel-label { position:absolute; left:50%; top:50%; font-size:12px; font-weight:600; color:#fff; transform-origin:0 0; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .wheel-hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:2; }
    /* 列数由 JS 按难度内联设置（原来写死 8 列，10×10/12×12 全被挤成长方形）
       格子高度用 padding-top:100% 撑正方形，不用 aspect-ratio —— 学习机的老内核不支持 */
    .mine-grid { display:grid; gap:3px; margin:12px auto; width:100%; }
    .mine-cell { position:relative; width:100%; padding-top:100%; border-radius:6px; background:linear-gradient(135deg,#B0BEC5,#78909C); font-size:inherit; font-weight:700; cursor:pointer; overflow:hidden; }
    .mine-cell .mct { position:absolute; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; }
    .mine-cell:active { transform: scale(.92); }
    .mine-cell.open { background:var(--bg-card); border:0.5px solid var(--border-soft); cursor:default; }
    .mine-cell.boom { background:var(--red-50); }
    .mine-cell.mn-1 { color:#1976D2; } .mine-cell.mn-2 { color:#388E3C; } .mine-cell.mn-3 { color:#D32F2F; } .mine-cell.mn-4 { color:#6A1B9A; }
    .mine-cell.mn-5 { color:#E65100; } .mine-cell.mn-6 { color:#00838F; } .mine-cell.mn-7 { color:#37474F; } .mine-cell.mn-8 { color:#7B1FA2; }
    .diff-row { display:flex; gap:8px; margin-bottom:10px; }
    .diff-pill { flex:1; text-align:center; padding:9px 0; border-radius:14px; background:var(--bg-card); border:1.5px solid var(--border-soft); font-size:13px; font-weight:600; cursor:pointer; }
    .diff-pill.on { background:var(--purple-50); border-color:var(--purple-400); color:var(--purple-600); }
    .mem-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:330px; margin:12px auto; }
    .mem-card { aspect-ratio:3/4; border-radius:10px; background:linear-gradient(135deg,var(--purple-200),var(--purple-400)); display:flex; align-items:center; justify-content:center; font-size:26px; color:transparent; cursor:pointer; transition: transform .15s; }
    .mem-card:active { transform: scale(.95); }
    .mem-card.open { background:var(--bg-card); border:1.5px solid var(--purple-200); color:inherit; }
    .mem-card.done { background:var(--green-50); border:1.5px solid var(--green-400); color:inherit; }
    .game-status { text-align:center; font-size:14px; font-weight:600; margin:8px 0; }
    .proof-badge { display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--amber-50); color:var(--amber-600); font-weight:600; }
    .proof-shot { width:100%; max-height:280px; object-fit:contain; border-radius:12px; background:var(--gray-100); }
    .rec-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#E53935; animation:blink 1s infinite; margin-right:6px; }
    @keyframes blink { 50% { opacity:.15; } }
    .game-score-bar { display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:10px; font-size:13px; }

    /* ===== 任务卡片 ===== */
    .task { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--gray-50); margin-bottom: 8px; cursor: pointer; }
    .task:last-child { margin-bottom: 0; }
    .task .checkbox {

    }

    .task.done .checkbox svg { color: #fff; }
    .task .title { flex:1; }

    .task .title .meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .task.done .name { text-decoration: line-through; color: var(--gray-600); }
    .task .pts { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--amber-50); color: var(--amber-600); font-weight: 500; }
    .task.done .pts { background: var(--green-50); color: var(--green-600); }
    /* 妈妈端任务操作按钮（孩子端不给，孩子不能自己删任务） */
    .task-ops { display: flex; gap: 6px; flex: none; }
    .task-ops .icon-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--gray-100); }

    .task-ops .icon-btn.danger { background: #FFEBEE; color: #C62828; }
    .fut-day { font-size: 12px; font-weight: 600; color: var(--gray-600); margin: 12px 0 2px; }
    .del-warn { font-size: 13px; color: var(--gray-700); line-height: 1.7; }

    /* ===== 学科色块 ===== */
    .subject-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .subject-card {
      border-radius: var(--radius-md); padding: 14px; color: #fff; cursor: pointer;

    }
    .subject-card .emoji { font-size: 24px; }
    .subject-card .name { font-weight: 600; margin-top: 4px; font-size: 14px; }

    .subject-card.s-art { background: linear-gradient(135deg, #FFC107, #FF8F00); }

    /* ===== 资源项 ===== */
    .resource {

    .kid-row {

      background: var(--gray-50); margin-bottom: 8px;
    }
    .kid-row .avatar { width: 40px; height: 40px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 20px; background: var(--pink-50); }
    .kid-row .info { flex: 1; }
    .kid-row .info .name { font-weight: 600; font-size: 14px; }

    .kid-row .progress-bar { width: 80px; height: 4px; background: var(--gray-200); border-radius: 2px; overflow: hidden; margin-top: 4px; }
    .kid-row .progress-bar div { height: 100%; background: var(--pink-400); }
    .kid-row .pts { font-size: 14px; font-weight: 600; color: var(--pink-600); }

    /* ===== 奖励视频 ===== */
    .reward {
      display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-md);

      content: '🔒'; position: absolute; top: 50%; right: 16px; transform: translateY(-50%); font-size: 20px;

    .reward .thumb {
      width: 64px; height: 64px; border-radius: var(--radius-sm);

    }
    .reward .info { flex: 1; min-width: 0; }
    .reward .info .name { font-size: 14px; font-weight: 500; }
    .reward .info .threshold { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

    /* ===== 顶部数据卡 ===== */
    .stat-card {
      background: linear-gradient(135deg, var(--pink-400), var(--purple-400));
      color: #fff; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 12px;
    }
    .stat-card .label { font-size: 12px; opacity: 0.9; }
    .stat-card .big { font-size: 32px; font-weight: 600; margin: 4px 0 8px; }
    .stat-card .meta { font-size: 12px; opacity: 0.9; display:flex; gap: 16px; }
    .stat-card .meta div span { font-weight: 600; }

    /* ===== FAB ===== */
    .fab {
      position: fixed; bottom: 90px; right: 16px; width: 52px; height: 52px;
      border-radius: 50%; background: var(--pink-400); color: #fff;

    .fab svg { width: 24px; height: 24px; }

    /* ===== 表单 ===== */
    .field { margin-bottom: 12px; }

      border: 0.5px solid var(--border); background: var(--bg-card); font-size: 14px;

    .btn-primary {
      width: 100%; padding: 12px; border-radius: var(--radius-md);
      background: var(--pink-400); color: #fff; font-size: 14px; font-weight: 500;
    }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-secondary {
      width: 100%; padding: 12px; border-radius: var(--radius-md);
      background: var(--gray-100); color: var(--gray-900); font-size: 14px; font-weight: 500;
    }
    .btn-row { display:flex; gap: 8px; margin-top: 16px; }
    .btn-row button { flex: 1; }

    /* ===== Modal ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: var(--bg-card); width: 100%; max-width: 480px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; text-align: center; }
    .modal .close { float: right; margin-top: -8px; }

    /* ===== 视频播放器 ===== */
    .video-mask { align-items: center; padding: 16px; }
    .video-modal { border-radius: var(--radius-lg); padding: 16px; max-height: 90vh; }
    .video-modal h3 { margin-bottom: 12px; padding-right: 24px; text-align: left; }
    .video-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* 宽松模式（B站等外站）的网页全屏：纯 CSS 铺满，不依赖系统播放器。
       有些设备（华为自带浏览器、老 WebView）点了播放器自己的全屏没反应，
       这个兜底在那些环境下也能把视频放大到整屏。 */
    .modal.lv-fs { position: fixed; inset: 0; z-index: 120; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 0; border-radius: 0; overflow: hidden; background: #000; display: flex; flex-direction: column; }
    .modal.lv-fs h3, .modal.lv-fs .wq-hint, .modal.lv-fs .lv-normal-bar { display: none; }
    .modal.lv-fs .close { position: absolute; top: 10px; right: 12px; z-index: 6; float: none; margin: 0; background: rgba(0,0,0,0.45); }
    .modal.lv-fs .video-wrap { flex: 1 1 auto; padding-top: 0 !important; height: 100%; border-radius: 0; }
    .modal.lv-fs .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lv-fs-bar { display: none; }
    .modal.lv-fs .lv-fs-bar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #111; }
    .modal.lv-fs .lv-fs-bar button { flex: 1; }
    .video-modal .video-meta { font-size: 12px; color: var(--gray-600); margin-top: 10px; text-align: center; }

    /* ---- 影院模式（B站弹窗也用同一套）----
       B站播放器在跨域 iframe 里点全屏，走的是它自己的「网页全屏」，
       只会在 iframe 自己的视口里铺满，永远不会变大。
       所以由外层把容器直接拉到整屏，它跟着变大，这才是真能变大的办法。 */
    .bili-fs-bar { display: none; }
    .modal.lv-fs .bili-fs-bar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #111; }
    .modal.lv-fs .bili-fs-bar button { flex: 1; }
    .modal.lv-fs .bili-more { position: absolute; top: 10px; right: 56px; z-index: 6; float: none; margin: 0; background: rgba(0,0,0,0.45); }
    /* 全屏时备用播放方式改成浮层，不占高度、不挤压视频 */
    .modal.lv-fs .bili-fallback { position: absolute; top: 58px; left: 12px; right: 12px; z-index: 7; max-height: 68vh; overflow-y: auto; margin-top: 0; }

    /* ===== PDF 阅读器（PDF.js 画到 canvas）=====
       Android WebView 没有 Chrome 那套 PDF 插件，<iframe src="xx.pdf"> 在 APP 壳
       和学习机里永远是空白、或者直接变成下载。所以统一用 PDF.js 逐页画到 canvas，
       壳 / 学习机 / 手机浏览器表现一致，也不跳出平台（家长控制不会漏）。
       前提：PDF 所在服务器必须开 CORS，否则 pdf.js 的 fetch 连数据都拿不到。 */
    .pdf-stage { position: relative; width: 100%; height: 58vh; min-height: 300px; background: #525659; border-radius: 10px; overflow: auto; -webkit-overflow-scrolling: touch; }
    .pdf-stage-inner { display: flex; justify-content: center; padding: 10px; min-width: 100%; min-height: 100%; }
    .pdf-canvas { display: block; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.28); max-width: none; }
    .pdf-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pdf-bar .pdf-btn { min-width: 46px; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border-soft); background: #fff; color: var(--gray-800); font-size: 14px; font-weight: 600; cursor: pointer; }
    .pdf-bar .pdf-btn:active { background: var(--gray-100); }
    .pdf-page { font-size: 13px; color: var(--gray-600); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pdf-page input { width: 56px; text-align: center; padding: 6px 4px; border: 1px solid var(--border-soft); border-radius: 8px; font-size: 13px; }
    .pdf-tip { font-size: 12px; color: var(--gray-600); margin-top: 8px; text-align: center; line-height: 1.7; }
    .pdf-err { margin: 10px 0 0; padding: 12px 14px; background: #fff4e6; border: 1px solid #ffd9a8; border-radius: 10px; font-size: 12.5px; color: #8a5a00; line-height: 1.9; text-align: left; }
    .pdf-err b { color: #7a4a00; }
    .pdf-err code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
    .pdf-err ol { margin: 6px 0 0; padding-left: 18px; }
    .pdf-err li { margin: 2px 0; }
    .pdf-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 260px; padding: 28px 16px; color: #e8e8e8; font-size: 13px; text-align: center; }
    .pdf-spin { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.25); border-top-color: var(--pink-400); border-radius: 50%; animation: pdfspin .8s linear infinite; }
    @keyframes pdfspin { to { transform: rotate(360deg); } }
    .pdf-prog { width: 190px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
    .pdf-prog > i { display: block; height: 100%; width: 0; background: var(--pink-400); transition: width .2s; }
    /* PDF 全屏：只铺满，不通知 APP 壳 —— 壳会强制横屏，而课本竖着看才舒服 */
    .modal.lv-fs .pdf-stage { flex: 1 1 auto; height: auto; border-radius: 0; }

    .modal.lv-fs .pdf-bar .pdf-btn { background: #222; color: #fff; border-color: #3a3a3a; }

    .modal.lv-fs .pdf-page { color: #ccc; }
    .modal.lv-fs .pdf-page input { background: #222; color: #fff; border-color: #3a3a3a; }
    .modal.lv-fs .pdf-tip, .modal.lv-fs .pdf-err { display: none; }

    .bili-card { background: linear-gradient(180deg,#ffffff 0%,var(--pink-50) 100%); border:1px solid var(--pink-200); border-radius:14px; padding:22px 16px 16px; text-align:center; }

    .episode-list { display: flex; flex-direction: column; gap: 6px; max-height: 56vh; overflow-y: auto; padding: 2px; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 10px 16px; border-radius: var(--radius-md); font-size: 13px; z-index: 200; }

  // ---- 传输瘦身 ----
  // 坑（重要）：B站分集每集都存一份完整 URL，「美国儿童启蒙英语动画」1000 集独占 132KB，
  // 整包 237KB，单次上传要 2.8 秒，同步窗口太大，极易被其他设备的写入冲掉。
  // 同步时把 episodes 压成 _eb(基础URL) + _et(标题数组)，本地结构和渲染完全不变。
  function packForSync(d) {
    let o;
    try { o = JSON.parse(JSON.stringify(d || {})); } catch (e) { return d; }
    const rs = o.resources || [];
    for (let n = 0; n < rs.length; n++) {
      const r = rs[n], eps = r.episodes;
      if (!eps || !eps.length || eps.length < 3) continue;
      // 分集挂了字幕就不压缩：压成 _eb+_et 会把每集的 sub 丢掉
      if (r.sub || eps.some(e => e && e.sub)) continue;
      const base = String(eps[0].url || '').split('?p=')[0];
      if (!base) continue;
      let ok = true;
      for (let k = 0; k < eps.length; k++) {
        if (String(eps[k].url || '') !== base + (k > 0 ? '?p=' + (k + 1) : '')) { ok = false; break; }
      }
      if (!ok) continue; // 格式不规整就不压，宁可大也绝不能丢数据
      r._eb = base;
      r._et = [];
      for (let k = 0; k < eps.length; k++) r._et.push(eps[k].title);
      delete r.episodes;
    }
    return o;
  }
  // 还原分集。注意：_eb/_et 保留不删，老版本页面回传时也不会把分集弄丢
  function unpackFromSync(d) {
    let o;
    try { o = JSON.parse(JSON.stringify(d || {})); } catch (e) { return d; }
    const rs = o.resources || [];
    for (let n = 0; n < rs.length; n++) {
      const r = rs[n];
      if (Array.isArray(r._et) && typeof r._eb === 'string' && !r.episodes) {
        const eps = [];
        for (let k = 0; k < r._et.length; k++) {
          eps.push({ title: r._et[k], url: r._eb + (k > 0 ? '?p=' + (k + 1) : '') });
        }
        r.episodes = eps;
      }
    }
    return o;
  }

  // ---- 合并式同步 ----
  // 坑（重要）：原来是「谁后写谁赢」的整包覆盖 —— 妈妈刚加的词库，只要孩子端在
  // 这 2.8 秒里打了一次卡，整包就被冲掉。改成按 id 取并集，两边的新增都能活下来。
  const MERGE_KEYS = ['resources', 'wordSets', 'wordTasks', 'dictations', 'homeworks', 'tasks', 'rewards', 'pointsHistory', 'children'];
  // 墓碑：删掉的东西记一笔，别的设备推回来时不许复活
  // （合并规则是「本地新增一律保留」，只删数组会被另一台设备的旧缓存救回来）
  const TOMB_KEYS = ['tasks', 'homeworks'];
  const TOMB_TTL = 14 * 86400000;
  function tombAdd(kind, id) {
    if (!id) return;
    if (!DATA.tomb) DATA.tomb = {};
    if (!Array.isArray(DATA.tomb[kind])) DATA.tomb[kind] = [];
    DATA.tomb[kind] = DATA.tomb[kind].filter(x => x && x.id !== id);
    DATA.tomb[kind].push({ id: id, t: Date.now() });
  }
  function tombGc(d) {
    const o = (d && d.tomb) || {};
    const now = Date.now();
    Object.keys(o).forEach(k => {
      o[k] = (o[k] || []).filter(x => x && (now - (x.t || 0)) < TOMB_TTL);
    });
  }
  function mergeData(base, incoming, localWins) {
    let out;
    try { out = JSON.parse(JSON.stringify(base || {})); } catch (e) { out = {}; }
    if (!incoming || typeof incoming !== 'object') return out;
    // 墓碑取两边并集：任何一台设备删掉的，都不许再出现
    const tombA = (base && base.tomb) || {};
    const tombB = incoming.tomb || {};
    const tomb = {};
    for (let i = 0; i < TOMB_KEYS.length; i++) {
      const k = TOMB_KEYS[i];
      const m = [];
      (tombA[k] || []).forEach(x => { if (x && x.id && !m.some(y => y.id === x.id)) m.push(x); });
      (tombB[k] || []).forEach(x => { if (x && x.id && !m.some(y => y.id === x.id)) m.push(x); });
      if (m.length) tomb[k] = m;
    }
    out.tomb = tomb;
    // 标量设置项（妈妈密码等）以远端为准
    for (const k in incoming) {
      if (!Object.prototype.hasOwnProperty.call(incoming, k)) continue;
      if (MERGE_KEYS.indexOf(k) >= 0) continue;
      if (typeof incoming[k] === 'object') continue;
      out[k] = incoming[k];
    }
    if (Array.isArray(incoming.safeDomains) && incoming.safeDomains.length) {
      out.safeDomains = incoming.safeDomains.slice();
    }
    for (let n = 0; n < MERGE_KEYS.length; n++) {
      const key = MERGE_KEYS[n];
      const a = (base && Array.isArray(base[key])) ? base[key] : [];
      const b = Array.isArray(incoming[key]) ? incoming[key] : [];
      if (!a.length && !b.length) continue;
      const merged = [];
      // 远端为准（孩子的打卡、妈妈在别的设备上的改动能同步过来）
      for (let x = 0; x < b.length; x++) {
        let local = null;
        for (let y = 0; y < a.length; y++) { if (a[y] && a[y].id && a[y].id === b[x].id) { local = a[y]; break; } }
        merged.push((localWins && local) ? local : b[x]);
      }
      // 本地新增（还没推上去的词库、资源等）一律保留
      for (let x = 0; x < a.length; x++) {
        const cur = a[x];
        if (!cur || !cur.id) { merged.push(cur); continue; }
        let has = false;
        for (let y = 0; y < b.length; y++) { if (b[y] && b[y].id === cur.id) { has = true; break; } }
        if (!has) merged.push(cur);
      }
      out[key] = merged;
    }
    // 墓碑过滤：删掉的条目即使被别的设备推回来也不收
    for (let i = 0; i < TOMB_KEYS.length; i++) {
      const k = TOMB_KEYS[i];
      if (!Array.isArray(out[k]) || !tomb[k]) continue;
      out[k] = out[k].filter(x => !(x && tomb[k].some(y => y.id === x.id)));
    }
    return out;
  }

  function normalizeData(d) {
    if (!d) return d;
    if (!d.wordSets) d.wordSets = JSON.parse(JSON.stringify(DEFAULT_DATA.wordSets));
    if (!d.wordTasks) d.wordTasks = [];
    if (!d.dictations) d.dictations = [];
    if (!d.tomb) d.tomb = {};
    tombGc(d);
    (d.resources || []).forEach(r => {
      // 兜底自愈：压缩格式若没被解开，这里重建分集
      if ((!r.episodes || !r.episodes.length) && Array.isArray(r._et) && typeof r._eb === 'string') {
        r.episodes = r._et.map((t, k) => ({ title: t, url: r._eb + (k > 0 ? '?p=' + (k + 1) : '') }));
      }
      if (!r.category) r.category = 'learn';
      if (SUBJECT_MIGRATE[r.subject]) r.subject = SUBJECT_MIGRATE[r.subject];
      if (!SUBJECTS[r.subject]) r.subject = 'suyang';
    });
    (d.tasks || []).forEach(t => {
      // 老任务没 kind 字段：按打卡方式推断；挂了视频的算看视频任务
      if (!t.kind) {
        const r = (t.resId && d.resources) ? d.resources.find(x => x.id === t.resId) : null;
        const rv = r || (t.resUrl ? { type: /\.(mp4|webm|m4v|mov|m3u8)$/i.test(t.resUrl) ? 'video' : '' } : null);
        t.kind = (t.proof === 'audio') ? 'read' : (rv && rv.type === 'video' && !t.proof ? 'video' : 'normal');
      }
      if (!('proof' in t)) t.proof = '';
      if (!('remindAt' in t)) t.remindAt = '';
      if (!('doneAt' in t)) t.doneAt = null;
      if (!('subject' in t)) t.subject = '';
      if (SUBJECT_MIGRATE[t.subject]) t.subject = SUBJECT_MIGRATE[t.subject];
    });
    (d.rewards || []).forEach(r => { if (!r.cat || !REWARD_CATS[r.cat]) r.cat = 'cartoon'; });
    if (!Array.isArray(d.safeDomains)) d.safeDomains = JSON.parse(JSON.stringify(DEFAULT_DATA.safeDomains));
    return d;
  }
  function syncUrl() { return 'https://textdb.dev/api/data/flp-lebaomaibao-' + encodeURIComponent(SYNC.code.trim()); }
  function scheduleSyncPush() {
    if (!SYNC.code || SYNC.status !== 'on') return;
    SYNC.pending = true;
    if (!SYNC.busy) doSyncPush();
  }
  async function doSyncPush(retry) {
    if (!SYNC.code || SYNC.busy) return;
    SYNC.busy = true; SYNC.pending = false;
    try {
      // 推送前先合并远端：否则会用本地旧数据把别人刚写的东西（孩子的打卡、妈妈在
      // 另一台设备加的词库）整个冲掉。本地有未推送改动时本地优先，保住自己的新增。
      try {
        const rm = await fetchRemote();
        if (rm && rm.d && rm._ts && rm._ts !== SYNC.lastRemoteTs) {
          const inc = normalizeData(unpackFromSync(rm.d));
          const mg = mergeData(DATA, inc, SYNC.dirty);
          SYNC.lastRemoteTs = rm._ts;
          if (rm._ts > SYNC.lastTs) SYNC.lastTs = rm._ts;
          if (JSON.stringify(mg) !== JSON.stringify(DATA)) { DATA = mg; saveLocalOnly(DATA); }
        }
      } catch (e) { /* 拉不到就照常推，不阻塞 */ }
      const ts = Date.now();
      const res = await fetch(syncUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ _ts: ts, d: packForSync(DATA) })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      SYNC.lastTs = ts;
      SYNC.lastRemoteTs = ts;
      SYNC.dirty = false;
      SYNC.lastErr = '';
      SYNC.status = 'on';
    } catch (e) {
      SYNC.status = 'err';
      SYNC.lastErr = String((e && e.message) || e);
      SYNC.dirty = true; // 没推上去 -> 拉数据时本地优先，绝不让它被冲掉
      if (!retry) {
        setTimeout(() => { SYNC.pending = true; if (!SYNC.busy) doSyncPush(true); }, 3000);
      } else if (typeof toast === 'function') {
        toast('⚠️ 这次没保存到云端，数据已存在本机');
      }

  async function fetchRemote() {

  async function syncPull(silent) {

      if (remote && remote._ts && remote.d && remote._ts !== SYNC.lastRemoteTs) {

        const merged = mergeData(DATA, incoming, SYNC.dirty);

          saveLocalOnly(DATA);
          applied = true;

          render();
        }
      }

      SYNC.lastErr = '';
    } catch (e) {

    SYNC.code = code;

    await adoptRemote(true);
  }
  async function adoptRemote(first) {
    SYNC.status = 'on';
    try {
      const remote = await fetchRemote();
      const hasRemote = remote && remote._ts && remote.d;
      if (hasRemote) {
        if (first) {
          const useRemote = confirm('云端已有这台设备之外的同步数据。\n\n「确定」= 采用云端数据（推荐，其他设备的打卡会拉过来）\n「取消」= 用本机数据覆盖云端');
          if (useRemote) {
            SYNC.lastRemoteTs = remote._ts;
            SYNC.lastTs = remote._ts;
            SYNC.dirty = false;
            DATA = normalizeData(unpackFromSync(remote.d));
            saveLocalOnly(DATA);
            render();
          } else {
            await doSyncPush();
          }
        } else {
          // 非首次：合并，绝不整包覆盖
          const incoming = normalizeData(unpackFromSync(remote.d));
          const merged = mergeData(DATA, incoming, SYNC.dirty);
          SYNC.lastRemoteTs = remote._ts;
          if (remote._ts > SYNC.lastTs) SYNC.lastTs = remote._ts;
          if (JSON.stringify(merged) !== JSON.stringify(DATA)) {
            DATA = merged; saveLocalOnly(DATA); render();
          }
        }
      } else {
        await doSyncPush();
      }
      SYNC.status = 'on';
      if (first) toast('✅ 云端同步已开启，全家设备连成一体');
      startSyncPoll();
    } catch (e) {
      SYNC.status = 'err';
      SYNC.lastErr = String((e && e.message) || e);
      toast('同步通道暂时连不上，会自动重试');
      startSyncPoll();
    }
    render();
  }
  function disableSync() {
    SYNC.code = '';
    localStorage.removeItem('flp-sync-code');
    if (SYNC.poll) { clearInterval(SYNC.poll); SYNC.poll = null; }
    SYNC.status = 'off';
    render();
    toast('已关闭同步，数据回到本机模式');
  }

  // ========== 工具 ==========
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const TODAY = todayStr(); // 动态日期，每天自动滚动

  // ========== 视图渲染 ==========
  function render() {
    const app = document.getElementById('app');
    const route = location.hash.slice(1).split('?')[0] || 'entry';
    const [, q] = location.hash.split('?');
    const params = Object.fromEntries(new URLSearchParams(q || ''));

    const routes = {
      entry:         viewEntry,
      'mom-pin':     viewMomPin,
      'mom-today':   viewMomToday,
      'mom-resources':viewMomResources,
      'mom-rewards': viewMomRewards,
      'mom-words':   viewMomWords,
      'mom-settings':viewMomSettings,
      'kid-select':  viewKidSelect,
      'kid-pin':     viewKidPin,
      'kid-tasks':   viewKidTasks,
      'kid-resources':viewKidResources,
      'kid-rewards': viewKidRewards,
      'kid-words':   viewKidWords,
      'kid-word-quiz': viewWordQuiz,
      'kid-dictation': viewKidDictation,
      'kid-fun':     viewKidFun,
      'kid-mine':    viewKidMine,
      'kid-memory':  viewKidMemory,
      'subject':     viewSubject,
    };

    const fn = routes[route] || viewEntry;
    app.innerHTML = fn(params);
    bindGlobal();
  }

  function bindGlobal() {
    document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
      if (b.dataset.to) location.hash = b.dataset.to;   // 显式指定返回目标（不依赖浏览器历史）
      else history.back();
    });
    if (typeof window.__afterRender === 'function') window.__afterRender();
  }

  // 清理本设备缓存：只清 Cache Storage（页面/图标/图片/视频缓存），
  // 绝不碰 localStorage 里的业务数据（任务、打卡、积分、凭证、词库都在那儿）。
  async function clearDeviceCache() {
    if (!window.caches) { toast('这个浏览器不支持缓存管理'); return; }
    let keys = [];
    try { keys = await caches.keys(); } catch (e) { keys = []; }
    if (!keys.length) { toast('本机没有离线缓存'); return; }
    let usage = 0;
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        if (est && est.usage) usage = est.usage;
      }
    } catch (e) { usage = 0; }
    const size = usage ? (usage / 1048576).toFixed(1) + ' MB' : '未知大小';
    if (!confirm('确定清理本设备的离线缓存吗？\n\n当前占用约 ' + size +
      '\n\n只删临时文件（页面、图标、图片、视频缓存），\n任务、打卡、积分、凭证、词库都不会丢。\n\n清理后页面会自动刷新。')) return;
    await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
    toast('缓存已清理，释放约 ' + size);
    setTimeout(() => { try { location.reload(); } catch (e) {} }, 900);
  }

    // 看视频任务：孩子点卡片 = 打开播放器，不能直接勾完（看完才自动打卡）
    if (isKid && !t.done && (t.kind || 'normal') === 'video') { openTaskVideo(id); return; }
    if (t.proof) {
      if (isKid) {
        if (t.done) { if (t.proofData) openProofView(t); return; } // 已打卡只能回看凭证，不能取消
        openProofModal(id);
        return;
      }
      // 妈妈端：点击看凭证；没凭证时可直接代勾
      if (t.proofData) { openProofView(t); return; }
    }

    if (t.done) {
      t.doneAt = Date.now();
      const k = DATA.children.find(c => c.id === t.childId);
      k.points += t.points;
      DATA.pointsHistory.unshift({ id: 'h'+Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
      toast(`+${t.points} 分 · 已记录给 ${k.name}`);
    } else {
      t.doneAt = null;
      const k = DATA.children.find(c => c.id === t.childId);
      k.points = Math.max(0, k.points - t.points);
      DATA.pointsHistory = DATA.pointsHistory.filter(h => !(h.childId===k.id && h.title===t.title && h.date===(t.date||TODAY)));
    }

  }

  // ========== 闹钟提醒引擎 ==========
  function fmtClock(ts) { return ts ? new Date(ts).toTimeString().slice(0, 5) : ''; }
  const REMIND_KEY = 'notified-' + TODAY;
  const notifiedTasks = new Set(JSON.parse(localStorage.getItem(REMIND_KEY) || '[]'));
  function remindTick() {
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const due = DATA.tasks.filter(t => t.date === TODAY && t.remindAt && !t.done && t.remindAt <= hhmm && !notifiedTasks.has(t.id));
    if (!due.length) return;
    due.forEach(t => notifiedTasks.add(t.id));
    try { localStorage.setItem(REMIND_KEY, JSON.stringify([...notifiedTasks])); } catch (e) {}

    showRemindModal(list, isKid);
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('⏰ 打卡时间到！', { body: due.map(t => t.title).join('、') });
      }
    } catch (e) {}
  }
  function showRemindModal(list, isKid) {
    if (document.querySelector('.remind-mask')) return;

    modal.onclick = e => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `

          <div class="task" style="margin-bottom:8px">
            <div class="title"><div class="name">${esc(t.title)}</div><div class="meta">${k ? k.avatar + ' ' + esc(k.name) : ''} · ${t.remindAt} 提醒</div></div>
            ${isKid ? `<button class="btn-primary" style="padding:6px 14px;white-space:nowrap" onclick="document.querySelector('.remind-mask').remove();location.hash='kid-tasks'">去打卡 ▶</button>` : ''}
          </div>`).join('')}

      </div>`;

  }
  if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) {} }
  setInterval(remindTick, 30 * 1000);
  setTimeout(remindTick, 2500);

  // ========== 凭证打卡：拍照 / 朗读录音 ==========
  let PROOF_STASH = null; // { type:'photo'|'audio', data:dataURL }
  let REC = null;
  function openProofModal(id) {
    const t = DATA.tasks.find(x => x.id === id);
    if (!t || t.done) return;
    const needPhoto = t.proof === 'photo';
    PROOF_STASH = null;
    const modal = document.createElement('div');

    modal.innerHTML = `
      <div class="modal">

        `}
        <div class="btn-row" style="margin-top:14px">
          <button class="btn-secondary" onclick="proofClose()">取消</button>
          <button id="proof-ok" class="btn-primary" onclick="confirmProof('${t.id}')" disabled>完成打卡 +${t.points} 分</button>

      if (rb) rb.style.display = 'none';

  }
  function proofClose() {
    if (REC && REC.state === 'recording') { try { REC.stop(); } catch(e){} }
    if (REC) { try { REC.stream.getTracks().forEach(tr => tr.stop()); } catch(e){} REC = null; }
    document.querySelectorAll('.modal-mask').forEach(m => m.remove());
  }
  function proofPick(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => { img.src = rd.result; };
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.6);
      PROOF_STASH = { type: 'photo', data };
      const pv = document.getElementById('proof-preview');
      if (pv) pv.innerHTML = `<img class="proof-shot" src="${data}" alt="打卡照片">`;
      const ok = document.getElementById('proof-ok');
      if (ok) ok.disabled = false;
    };
    rd.readAsDataURL(f);
  }
  async function proofRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      REC = new MediaRecorder(stream);
      const chunks = [];
      REC.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      REC.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        const blob = new Blob(chunks, { type: REC.mimeType || 'audio/webm' });
        const fr = new FileReader();
        fr.onload = () => {
          PROOF_STASH = { type: 'audio', data: fr.result };
          const pv = document.getElementById('proof-preview');
          if (pv) pv.innerHTML = `<audio controls style="width:100%" src="${fr.result}"></audio>`;
          const ok = document.getElementById('proof-ok');
          if (ok) ok.disabled = false;
        };
        fr.readAsDataURL(blob);
      };
      REC.start();
      if (btn) { btn.textContent = '⏹ 录音中…点这里结束'; btn.style.background = 'var(--red-50)'; btn.style.color = 'var(--red-600)'; }
      if (st) st.innerHTML = '<span class="rec-dot"></span>正在录音，大声朗读吧！';
      // 5 分钟自动停
      REC._timer = setTimeout(() => { if (REC && REC.state === 'recording') proofRecStop(); }, 5 * 60 * 1000);
      btn.onclick = proofRecStop;
    } catch (e) {
      if (st) st.textContent = '打不开麦克风，检查权限后重试';
      const fb = document.getElementById('proof-fallback');
      if (fb) fb.style.display = 'block';
    }
  }
  function proofRecStop() {
    if (!REC) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    if (REC._timer) clearTimeout(REC._timer);
    if (REC.state === 'recording') REC.stop();
    if (btn) { btn.textContent = '🔄 重新录一遍'; btn.style.background = ''; btn.style.color = ''; }
    if (st) st.textContent = '录好了！听一听，不满意可以重录';
  }
  function proofManual() { PROOF_STASH = { type: 'audio', data: null }; const ok = document.getElementById('proof-ok'); if (ok) ok.disabled = false; }
  function confirmProof(id) {
    const t = DATA.tasks.find(x => x.id === id);

  function openProofView(t) {

        <div class="btn-row" style="margin-top:14px"><button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">关闭</button></div>

  function viewTaskProof(e, id) {

  }

  // ========== 单词打卡 ==========
  // ========== 朗读（三级降级：有道真人发音 → 系统语音引擎 → 提示）==========
  // 为什么不用单纯的 speechSynthesis：安卓手机 / 学习机常常没装英文语音包，
  // 调用时不报错但一点声音都没有（用户反馈的"喇叭点了没声音"就是这个）。
  // 所以优先走有道发音接口（标准 mp3、真人发音、任何设备都能响），拿不到再降级系统语音。
  let SPK = { audio: null, lastText: '' };
  function isCn(t) { return /[\u4e00-\u9fa5]/.test(String(t == null ? '' : t)); }
  function speakUrl(text) {
    const q = encodeURIComponent(String(text == null ? '' : text).trim());
    if (!q) return '';
    // type=2 美音；le=zh 中文。中文也能读，语文听写就用它
    return isCn(text)
      ? 'https://dict.youdao.com/dictvoice?audio=' + q + '&le=zh'
      : 'https://dict.youdao.com/dictvoice?audio=' + q + '&type=2';
  }
  function speakStop() {
    try { if (SPK.audio) { SPK.audio.pause(); SPK.audio.currentTime = 0; } } catch (e) {}
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }
  // 系统语音兜底。注意：Chrome 有个已知 bug —— cancel() 之后立刻 speak() 会静默失败，必须延迟一拍
  function speakByTts(text, rate) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    try {
      window.speechSynthesis.cancel();
      setTimeout(function () {
        try {
          const cn = isCn(text);
          const u = new SpeechSynthesisUtterance(text);
          u.lang = cn ? 'zh-CN' : 'en-US';
          u.rate = rate || (cn ? 0.9 : 0.75);
          u.pitch = 1.05; u.volume = 1;
          try {
            const vs = window.speechSynthesis.getVoices() || [];
            const want = vs.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().indexOf(cn ? 'zh' : 'en') === 0);
            if (want.length) u.voice = want[0];
          } catch (e) {}
          u.onerror = function () {};
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }, 120);
    } catch (e) {}
  }
  // opt: { rate, onEnd }  onEnd 在播放结束时回调（听写要用来控制"读几遍、间隔几秒"）
  function speak(text, opt) {
    opt = opt || {};
    const t = String(text == null ? '' : text).trim();
    if (!t) { if (opt.onEnd) opt.onEnd(); return; }
    speakStop();
    SPK.lastText = t;
    let settled = false;
    const giveUp = () => { if (settled) return; settled = true; try { if (SPK.audio) SPK.audio.pause(); } catch (e) {} speakByTts(t, opt.rate); };
    let a = SPK.audio;
    try {
      if (!a) { a = new Audio(); a.preload = 'auto'; SPK.audio = a; }
      a.onplay = () => { settled = true; };
      a.onplaying = () => { settled = true; };
      a.onerror = giveUp;
      a.onended = () => { if (opt.onEnd) opt.onEnd(); };
      a.src = speakUrl(t);
      a.load();
      const p = a.play();
      if (p && p.catch) p.catch(giveUp);
      // 2.5 秒还没出声（网络慢 / 接口挂了）就降级，别让孩子干等
      setTimeout(giveUp, 2500);
    } catch (e) { giveUp(); }
  }
  // 预加载语音列表（安卓首次 getVoices() 常返回空数组，提前取一次兜底时才有得选）
  try {
    if (window.speechSynthesis) {
      const _lv = () => { try { window.speechSynthesis.getVoices(); } catch (e) {} };
      _lv();
      window.speechSynthesis.onvoiceschanged = _lv;
    }
  } catch (e) {}
  function wtSet(wt) { return DATA.wordSets.find(s => s.id === wt.setId) || { title: '词库已删除', words: [] }; }
  function wtProgress(wt) { return Object.keys(wt.wordState || {}).filter(k => wt.wordState[k] >= 3).length; }
  function wtFirstIncomplete(wt) {
    const n = Math.min(wt.count, wtSet(wt).words.length);
    for (let i = 0; i < n; i++) { if ((wt.wordState[i] || 0) < 3) return i; }
    return -1;
  }
  function wqFinish(wt) {
    if (wt.done) return;
    wt.done = true;
    const k = DATA.children.find(c => c.id === wt.childId);
    k.points += wt.points;
    const s = wtSet(wt);
    DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: k.id, date: TODAY, title: `单词打卡：${s.title} ×${wt.count}`, points: wt.points });
    saveData(DATA);
    toast(`单词任务全部完成！+${wt.points} 分 🎉`);
  }

  // ---- 孩子端：单词任务列表 ----

      </div>
      <div class="page">
        ${wts.length ? wts.map(wt => {

            <p class="text-mute" style="margin:10px 0">三步走：🔊 全部跟读 → 🌏 全部考意思 → ⌨️ 全部考拼写。<b>错的词会自动再来一轮</b>，全做对 +${wt.points} 分。</p>
            ${wt.done
              ? '<div class="wq-done">🎉 今日单词已完成，太棒了！</div>'

        <div class="section">
          <h3>✍️ 听写</h3>
          ${(() => {
            const dts = (DATA.dictations || []).filter(t => t.childId === c.id && t.date === TODAY);
            if (!dts.length) return '<div class="text-mute" style="padding:6px 0">今天没有听写，等妈妈布置</div>';
            return dts.map(dt => {
              const s = dicSet(dt);
              const n = Math.min(dt.count, (s.words || []).length);
              const unit = setLang(s) === 'zh' ? '词语' : '单词';
              return `<div class="task">
                <div class="title"><div class="name">✍️ ${esc(s.title)}</div>
                <div class="meta">${n} 个${unit} · 每个读 ${dt.repeat || 1} 遍${dt.done ? ` · ✅ 对了 ${dt.score}/${dt.total}` : ''}</div></div>
                <button class="icon-btn" style="background:var(--indigo-50);color:var(--indigo-600);font-size:13px;font-weight:600" onclick="location.hash='kid-dictation?id=${dt.id}'">${dt.done ? '再练' : '开始'}</button>
              </div>`;
            }).join('');
          })()}
        </div>
      </div>
      ${kidTabBar('words')}
    `;
  }

  // ---- 孩子端：单词闯关（三段式）----
  // 流程：第 1 轮把布置的词全部跟读 → 全部考意思 → 全部考拼写；
  //      错的词自动挑出来，再来一轮（同样读→意思→拼写），直到全对。
  const WQ_STAGES = [
    { key: 'read',    icon: '🔊', label: '跟读' },
    { key: 'meaning', icon: '🌏', label: '意思' },
    { key: 'spell',   icon: '⌨️', label: '拼写' },
  ];
  // 进度存在 wt.wq 上（跟着云同步走，换设备或中途退出都能接着练）
  function wqInit(wt) {
    const n = Math.min(wt.count, wtSet(wt).words.length);
    const q = wt.wq;
    if (!q || !q.list || !q.list.length || !q.stage) {
      wt.wq = { round: 1, stage: 'read', idx: 0, list: Array.from({ length: n }, (_, i) => i), wrong: [] };
    } else if (q.list.some(i => i >= n)) {
      q.list = q.list.filter(i => i < n);
      if (q.idx >= q.list.length) { q.stage = 'read'; q.idx = 0; }
    }
    return wt.wq;
  }
  function wqStageIdx(stage) { for (let i = 0; i < WQ_STAGES.length; i++) if (WQ_STAGES[i].key === stage) return i; return 0; }
  function wqPercent(wt) {
    const q = wt.wq;
    if (!q || !q.list.length) return 0;
    const per = q.list.length * WQ_STAGES.length;
    return Math.min(100, Math.round((wqStageIdx(q.stage) * q.list.length + q.idx) / per * 100));
  }
  function wqMarkWrong(wt, wi) { const q = wt.wq; if (q && q.wrong.indexOf(wi) === -1) q.wrong.push(wi); }
  function wqTask(id) { return DATA.wordTasks.find(t => t.id === id); }

  // 推进到下一题 / 下一阶段 / 下一轮 / 完成
  function wqAdvance(wtId) {
    const wt = wqTask(wtId);
    if (!wt || wt.done) return;
    const q = wt.wq;
    if (!q) { render(); return; }
    q.idx++;
    if (q.idx < q.list.length) { saveData(DATA); render(); return; }
    const si = wqStageIdx(q.stage);
    if (si < WQ_STAGES.length - 1) {          // 进下一阶段
      q.stage = WQ_STAGES[si + 1].key; q.idx = 0; q.opts = null;
      saveData(DATA); render();
      if (q.stage === 'meaning') toast('读完啦！现在考考意思 🌏');
      else if (q.stage === 'spell') toast('意思都懂了！最后来拼写 ⌨️');
      return;
    }
    if (q.wrong.length) {                      // 三轮走完，还有错的 → 再来一轮，只练错词
      const n = q.wrong.length;
      wt.wq = { round: q.round + 1, stage: 'read', idx: 0, list: q.wrong.slice(), wrong: [] };
      saveData(DATA); render();
      toast(`错了 ${n} 个，再来一轮把它们拿下 💪`);
      return;
    }
    const n = Math.min(wt.count, wtSet(wt).words.length);   // 全对 → 完成
    for (let i = 0; i < n; i++) wt.wordState[i] = 3;
    wt.wq = null;
    saveData(DATA);
    wqFinish(wt);
    render();
  }

  function viewWordQuiz(params) {

    const si = wqStageIdx(q.stage);

  function wqMeaningPick(wtId, i) {

  function buildTransOptions(s, wi) {
    const pool = s.words.filter((_, i) => i !== wi).map(x => x.cn);
    const opts = [s.words[wi]];
    while (opts.length < 4 && pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      opts.push({ cn: pool.splice(idx, 1)[0] });
    }
    // 洗牌
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    return opts;
  }

  // 压缩到宽 720、JPEG 0.6，单张通常 40~90KB，避免撑爆同步数据
  function compressImg(file, maxW, quality, cb) {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / (img.width || maxW));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => cb(null);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function hwPickImgs(input) {
    const files = Array.from(input.files || []).slice(0, 3);
    if (!files.length) return;
    HW_STASH = HW_STASH || [];
    let left = files.length;
    files.forEach(f => compressImg(f, 720, 0.6, d => {
      if (d && HW_STASH.length < 3) HW_STASH.push(d);
      if (--left === 0) hwRenderPrev();
    }));
  }

  // ========== 听写（英语单词 / 语文词语）==========
  // 词库带 lang：'en' 读英文（英语听写）、'zh' 读中文（语文听写）。老词库默认 en。
  function setLang(ws) { return (ws && ws.lang === 'zh') ? 'zh' : 'en'; }
  function dicFind(id) { return (DATA.dictations || []).find(t => t.id === id); }
  function dicSet(dt) { return DATA.wordSets.find(s => s.id === dt.setId) || { title: '词库已删除', words: [] }; }
  function dicCount(dt) { return Math.min(dt.count || 0, (dicSet(dt).words || []).length); }

  let DIC = null; // 运行态 { dtId, list, idx, answers, phase:'run'|'done', timers, result }
  function dicClearTimers() {
    if (DIC && DIC.timers) DIC.timers.forEach(t => clearTimeout(t));
    if (DIC) DIC.timers = [];
  }
  function dicBegin(dtId) {
    const dt = dicFind(dtId);
    if (!dt) { location.hash = 'kid-words'; return; }
    if (dicCount(dt) < 1) { toast('这个词库是空的'); return; }
    DIC = { dtId, list: Array.from({ length: dicCount(dt) }, (_, i) => i), idx: 0, answers: {}, phase: 'run', timers: [], result: null };
    location.hash = 'kid-dictation?id=' + dtId;
    render();
    dicPlay();
  }
  // 一个词读 repeat 遍，遍与遍之间隔 gap 秒。
  // 不用 onEnd 链式回调：降级到系统语音时 onEnd 不一定触发，会卡住；用定时器更稳。
  function dicPlay() {
    const dt = dicFind(DIC && DIC.dtId);
    if (!dt || !DIC || DIC.phase !== 'run') return;
    const word = dicSet(dt).words[DIC.list[DIC.idx]];
    if (!word) return;
    const times = Math.max(1, Math.min(5, dt.repeat || 1));
    const gapMs = Math.max(0, Math.min(10, dt.gap == null ? 2 : dt.gap)) * 1000;
    const perMs = 1600 + gapMs;  // 一个词发音大约 1.5 秒
    dicClearTimers();
    let k = 0;
    const one = () => {
      if (!DIC || DIC.phase !== 'run') return;
      if (k >= times) return;
      speak(word.w);
      k++;
      if (k < times) DIC.timers.push(setTimeout(one, perMs));
    };
    one();
    toast(`第 ${DIC.idx + 1} 个，读 ${times} 遍`);
  }
  function dicNext() {
    if (!DIC || DIC.phase !== 'run') return;
    const input = document.getElementById('dic-input');
    DIC.answers[DIC.idx] = input ? input.value.trim() : '';
    dicClearTimers(); speakStop();
    if (DIC.idx < DIC.list.length - 1) { DIC.idx++; render(); dicPlay(); return; }
    dicSubmit();
  }
  function dicSkip() {
    if (!DIC || DIC.phase !== 'run') return;
    DIC.answers[DIC.idx] = '';
    dicClearTimers(); speakStop();
    if (DIC.idx < DIC.list.length - 1) { DIC.idx++; render(); dicPlay(); return; }
    dicSubmit();
  }
  function dicSubmit() {
    const dt = dicFind(DIC.dtId);
    if (!dt) { dicClearTimers(); DIC = null; render(); return; }
    const s = dicSet(dt);
    let right = 0; const wrong = [];
    DIC.list.forEach((wi, k) => {
      const w = s.words[wi];
      if (!w) return;
      const mine = String(DIC.answers[k] || '').trim();
      if (mine.toLowerCase() === String(w.w).trim().toLowerCase()) right++;
      else wrong.push({ w: w.w, cn: w.cn || '', mine });
    });
    const total = DIC.list.length;
    const gain = total ? Math.max(1, Math.round((dt.points || 5) * right / total)) : 0;
    const first = !dt.done;   // 只有第一次正式完成才加星，之后重练不重复给分
    dt.done = true; dt.score = right; dt.total = total; dt.wrong = wrong;
    if (first && gain > 0) {
      const c = DATA.children.find(x => x.id === dt.childId);
      if (c) awardStars(c, gain, `听写：${s.title} ${right}/${total}`);
    }
    saveData(DATA);
    DIC.phase = 'done';

  function dicRetryWrong() {
    if (!DIC || !DIC.result) return;
    const w = DIC.result.wrong;
    if (!w.length) { toast('全对了，不用再练啦'); return; }
    const s = dicSet(dicFind(DIC.dtId));
    const idxs = w.map(x => s.words.findIndex(y => y.w === x.w)).filter(i => i >= 0);
    if (!idxs.length) return;
    DIC.list = idxs; DIC.idx = 0; DIC.answers = {}; DIC.phase = 'run'; DIC.result = null;
    render(); dicPlay();
  }

    if (DIC.phase === 'done' && DIC.result) {

      return top + `
      <div class="page">
        <div class="dic-result" style="${allRight ? '' : 'background:var(--amber-50)'}">
          <div style="font-size:44px">${allRight ? '🎉' : '💪'}</div>

          <div style="font-size:13px;color:var(--gray-600);margin-top:6px">${r.first ? `+${r.gain} 颗星星 ⭐` : '这次是重练，不计分'}</div>

        ${allRight ? '<div class="wq-done">全部写对，太棒了！</div>' : `

          ${r.wrong.map(x => `<div class="dic-wrong-item">
            <span class="right">${esc(x.w)}${x.cn ? ' <small style="color:var(--gray-600);font-weight:400">' + esc(x.cn) + '</small>' : ''}</span>

    }

    // 进行中
    const len = DIC.list.length;
    const isLast = DIC.idx === len - 1;

  function addWordSet() {
    const title = document.getElementById('ws-title').value.trim();
    const raw = document.getElementById('ws-words').value;
    if (!title) { toast('给词库起个名'); return; }
    // 兼容两种写法： 「单词 中文」 或 只有「词语」（语文词表常不带释义）
    const words = raw.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^(\S+)\s+(.+)$/);
      return m ? { w: m[1], cn: m[2] } : { w: l, cn: '' };
    });
    if (!words.length) { toast('至少写一行，格式：「单词 中文」或每行一个词语'); return; }
    const langEl = document.getElementById('ws-lang');
    DATA.wordSets.push({ id: 'ws' + Date.now(), title, words, lang: langEl ? langEl.value : 'en' });
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast(`已保存 ${words.length} 个单词`);

  function kidTasksDone(c) {

  const FUN_GATE = '🔒 完成今天的打卡任务才能玩哦';

  // ---- 幸运转盘 ----
  // 成本 10★，整体期望值约 9.6★（原来是 4.5★，孩子怎么抽都亏，已整体上调）
  const WHEEL_SEGS = [
    { label: '+5★',  pts: 5,  w: 20 }, { label: '谢谢参与', pts: 0, w: 12 },
    { label: '+10★', pts: 10, w: 20 }, { label: '+15★', pts: 15, w: 13 },
    { label: '再来一次', pts: 0, again: true, w: 8 }, { label: '+25★', pts: 25, w: 8 },
    { label: '+8★',  pts: 8,  w: 13 }, { label: '+30★', pts: 30, w: 5 },
  ];
  const WHEEL_COLORS = ['#F06292','#BA68C8','#4DD0E1','#FFB74D','#81C784','#9575CD','#FF8A65','#4FC3F7'];
  let wheelRot = 0, wheelBusy = false;
  function wheelGradient() {
    return 'conic-gradient(' + WHEEL_COLORS.map((c, i) => `${c} ${i*45}deg ${(i+1)*45}deg`).join(',') + ')';
  }
  function spinWheel() {
    if (wheelBusy) return;
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (c.points < 10) { toast('星星不够啦，先去打卡赚星星吧 ⭐'); return; }
    c.points -= 10; saveData(DATA);
    wheelBusy = true; render();
    const total = WHEEL_SEGS.reduce((a, s) => a + s.w, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < WHEEL_SEGS.length; i++) { r -= WHEEL_SEGS[i].w; if (r <= 0) { idx = i; break; } }
    const desired = 360 - (idx * 45 + 22.5);
    const delta = ((desired - wheelRot) % 360 + 360) % 360 + 1800;
    wheelRot += delta;
    const el = document.getElementById('wheel');
    if (el) el.style.transform = `rotate(${wheelRot}deg)`;
    setTimeout(() => {
      wheelBusy = false;
      const seg = WHEEL_SEGS[idx];
      if (seg.again) { c.points += 10; saveData(DATA); toast('🎡 再来一次！星星已退回'); }
      else if (seg.pts > 0) { awardStars(c, seg.pts, `幸运转盘中奖 ${seg.pts} 星`); toast(`🎉 恭喜抽中 ${seg.pts} 颗星星！`); }

      render();
    }, 3350);
  }

  function startMine() {
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (MINE) return;
    if (c.points < 5) { toast('星星不够啦（需要 5★）⭐'); return; }
    c.points -= 5; saveData(DATA);
    const cfg = MINE_CFG[MINE_DIFF];
    const total = cfg.size * cfg.size;
    const cells = Array.from({length: total}, (_, i) => i);
    const mines = new Set();
    while (mines.size < cfg.mines) mines.add(cells[Math.floor(Math.random() * total)]);
    MINE = { size: cfg.size, mines: new Set(mines), open: new Set(), flags: new Set(), over: false, flagMode: false, first: true, reward: cfg.reward };
    const st = document.getElementById('mine-status');
    if (st) st.textContent = '翻开一个格子开始吧！数字表示周围有几颗雷';
    const fb = document.getElementById('mine-flagbtn');
    if (fb) fb.style.display = 'block';
  }
  function toggleFlagMode() {
    if (!MINE || MINE.over) return;
    MINE.flagMode = !MINE.flagMode;
    const fb = document.getElementById('mine-flagbtn');
    if (fb) { fb.textContent = `🚩 插旗模式：${MINE.flagMode ? '开' : '关'}`; fb.style.background = MINE.flagMode ? 'var(--amber-50)' : ''; fb.style.color = MINE.flagMode ? 'var(--amber-600)' : ''; }
    mineUpdateLeft();
  }
  // 剩余雷数 = 总雷数 - 已插旗数（原来这数字一直不变，插了旗也不减，孩子没法判断）
  function mineUpdateLeft() {
    if (!MINE) return;
    const el = document.getElementById('mine-left');
    if (el) el.textContent = MINE.mines.size - MINE.flags.size;
  }
  function mineAround(i) {
    const S = MINE.size;
    const r = Math.floor(i / S), col = i % S;
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = col + dc;
      if (nr >= 0 && nr < S && nc >= 0 && nc < S && MINE.mines.has(nr * S + nc)) n++;
    }
    return n;
  }
  // 格子内容写进内层 .mct（外层用 padding-top 撑正方形，直接写 textContent 会把高度撑破）
  function mcText(el, txt) {
    if (!el) return;
    const b = el.querySelector('.mct');
    if (b) b.textContent = txt; else el.textContent = txt;
  }
  function revealMine(i) {
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    MINE.open.add(i);
    const n = mineAround(i);
    el.classList.add('open');
    if (n > 0) { mcText(el, n); el.classList.add('mn-' + n); }
    else {
      const S = MINE.size;
      const r = Math.floor(i / S), col = i % S;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = col + dc;
        if (nr >= 0 && nr < S && nc >= 0 && nc < S) revealMine(nr * S + nc);
      }
    }
  }
  function tapMine(i) {
    if (!MINE || MINE.over) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    if (MINE.flagMode) {
      if (MINE.open.has(i)) return;
      if (MINE.flags.has(i)) { MINE.flags.delete(i); el.classList.remove('open'); mcText(el, ''); }
      else { MINE.flags.add(i); el.classList.add('open'); mcText(el, '🚩'); }
      mineUpdateLeft();
      return;
    }
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const total = MINE.size * MINE.size;
    const mineCount = MINE.mines.size;
    if (MINE.first && MINE.mines.has(i)) {
      // 第一次就点到雷 —— 把雷随机挪到别处，别让孩子开局就炸（原来固定挪到最靠前的空格，雷会挤在左上角）
      MINE.mines.delete(i);
      const cand = [];
      for (let j = 0; j < total; j++) if (j !== i && !MINE.mines.has(j)) cand.push(j);
      if (cand.length) MINE.mines.add(cand[Math.floor(Math.random() * cand.length)]);
    }
    MINE.first = false;
    if (MINE.mines.has(i)) {
      MINE.over = true;
      el.classList.add('open', 'boom'); mcText(el, '💣');
      MINE.mines.forEach(m => { const me = document.getElementById('mc' + m); if (me) { me.classList.add('open'); if (m !== i) mcText(me, '💣'); } });
      // 插错的旗标出来，让孩子知道错在哪
      MINE.flags.forEach(f => { if (!MINE.mines.has(f)) { const fe = document.getElementById('mc' + f); if (fe) { fe.classList.add('open'); mcText(fe, '❌'); } } });
      const st = document.getElementById('mine-status');
      if (st) st.textContent = '💥 踩到雷啦！别灰心，再开一局～';
      MINE = null;
      return;
    }
    revealMine(i);
    const oc = document.getElementById('mine-open');
    if (oc) oc.textContent = MINE.open.size;
    // 胜利有两种：① 所有安全格都翻开 ② 安全格全开 + 剩下的格子全插了旗，且旗全插对
    let win = MINE.open.size === total - mineCount;
    if (!win && MINE.open.size + MINE.flags.size === total) {
      let allRight = true;
      MINE.flags.forEach(f => { if (!MINE.mines.has(f)) allRight = false; });
      if (allRight) {
        MINE.flags.forEach(f => { const fe = document.getElementById('mc' + f); if (fe) { fe.classList.add('open'); mcText(fe, '🚩'); } });
        win = true;
      }
    }
    if (win) {
      MINE.over = true;
      MINE.mines.forEach(m => { const me = document.getElementById('mc' + m); if (me) { me.classList.add('open'); mcText(me, '🚩'); } });
      const st = document.getElementById('mine-status');
      if (st) st.textContent = `🎉 太厉害了！全部找出来了，奖励 ${MINE.reward}★`;
      const reward = MINE.reward; MINE = null;
      const c = kidCheck();
      if (c) { awardStars(c, reward, '扫雷通关奖励'); toast(`扫雷通关 +${reward}★ 🎉`); render(); }
    }
  }

  // ---- 记忆翻翻乐（三档难度 + 步数限制） ----

  function startMem() {
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (c.points < 5) { toast('星星不够啦（需要 5★）⭐'); return; }
    c.points -= 5; saveData(DATA);
    const cfg = MEM_CFG[MEM_DIFF];
    const picked = [...MEM_EMOJIS].sort(() => Math.random() - 0.5).slice(0, cfg.pairs);
    const deck = [...picked, ...picked].sort(() => Math.random() - 0.5);
    MEM = { cards: deck.map(e => ({ e, open: false, done: false })), first: null, lock: false, moves: 0, pairs: 0, limit: cfg.limit, reward: cfg.reward };
    const grid = document.getElementById('mem-grid');
    if (grid) { grid.style.gridTemplateColumns = `repeat(${cfg.pairs >= 20 ? 5 : 4},1fr)`; grid.style.fontSize = cfg.pairs >= 20 ? '20px' : ''; }
    renderMem();
    const st = document.getElementById('mem-status');
    if (st) st.textContent = `翻出两张一样的图案配对！${cfg.limit} 步内完成`;
  }
  function renderMem() {
    const grid = document.getElementById('mem-grid');
    if (!grid || !MEM) return;
    grid.innerHTML = MEM.cards.map((cd, i) =>
      `<div class="mem-card ${cd.done ? 'done' : cd.open ? 'open' : ''}" onclick="clickMem(${i})">${cd.e}</div>`
    ).join('');
    const m = document.getElementById('mem-moves'), p = document.getElementById('mem-pairs');
    if (m) m.textContent = MEM.moves;
    if (p) p.textContent = MEM.pairs;
  }
  function clickMem(i) {
    if (!MEM || MEM.lock) return;
    const cd = MEM.cards[i];
    if (cd.done || cd.open) return;
    cd.open = true;
    if (MEM.first === null) { MEM.first = i; renderMem(); return; }
    const fi = MEM.first;
    MEM.moves++; MEM.first = null;
    if (MEM.cards[fi].e === cd.e) {
      MEM.cards[fi].done = true; cd.done = true;
      MEM.cards[fi].open = false; cd.open = false;
      MEM.pairs++;
      renderMem();
      if (MEM.pairs === MEM.cards.length / 2) {
        const c = kidCheck();
        const st = document.getElementById('mem-status');
        if (st) st.textContent = `🎉 全部配对完成！用了 ${MEM.moves} 步，奖励 ${MEM.reward}★`;
        const reward = MEM.reward; MEM = null;
        if (c) { awardStars(c, reward, '翻翻乐通关奖励'); toast(`翻翻乐 +${reward}★ 🎉`); render(); }
      }
    } else {
      MEM.lock = true;
      renderMem();
      setTimeout(() => {
        if (MEM) { MEM.cards[fi].open = false; cd.open = false; MEM.lock = false; renderMem();
          if (MEM.moves >= MEM.limit && MEM.pairs < MEM.cards.length / 2) {
            const st = document.getElementById('mem-status');
            if (st) st.textContent = `😵 ${MEM.limit} 步用完啦！差 ${MEM.cards.length / 2 - MEM.pairs} 对，记住位置再来一局～`;
            MEM = null;
          }
        }
      }, 700);
    }
  }
