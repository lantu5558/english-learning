  <title>乐宝麦宝学习平台</title>
  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --pink-50:#FFF0F5; --pink-100:#FFE0EC; --pink-200:#FFC1D9; --pink-400:#FF6B9D; --pink-600:#D6336C; --pink-800:#A61E4D;
      --orange-50:#FFF4E6; --orange-200:#FFD9A8; --orange-400:#FF9800; --orange-600:#E65100;
      --cyan-50:#E0F7FA; --cyan-200:#80DEEA; --cyan-400:#00BCD4; --cyan-600:#00838F;
      --purple-50:#F3E5F5; --purple-200:#CE93D8; --purple-400:#9C27B0; --purple-600:#6A1B9A;
      --green-50:#E8F5E9; --green-400:#4CAF50; --green-600:#2E7D32;
      --amber-50:#FFF8E1; --amber-400:#FFC107; --amber-600:#FF8F00;
      --red-50:#FFEBEE; --red-400:#EF5350; --red-600:#C62828;
      --indigo-50:#E8EAF6; --indigo-400:#5C6BC0; --indigo-600:#3949AB;
      --teal-50:#E0F2F1; --teal-400:#26A69A; --teal-600:#00695C;
      --gray-50:#FAFAFA; --gray-100:#F5F5F5; --gray-200:#EEEEEE; --gray-400:#BDBDBD; --gray-600:#757575; --gray-800:#424242; --gray-900:#212121;
      --bg-page:#FAFAFA; --bg-card:#FFFFFF; --border:#E5E5E5; --border-soft:#F0F0F0;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; color:var(--gray-900); background:var(--bg-page); font-size:14px; line-height:1.5; }
    button { font-family: inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
    input { font-family: inherit; font-size:14px; }

    /* ===== 应用容器（手机框 / 学习机大屏自适应） ===== */
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; padding-bottom: 76px; }

    /* ===== 顶部导航 ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg-card);
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar h1 { margin:0; font-size: 17px; font-weight: 600; }
    .topbar .actions { display:flex; gap:8px; }
    .icon-btn { width:36px; height:36px; border-radius: 10px; display:flex; align-items:center; justify-content:center; background: var(--gray-100); }
    .icon-btn svg { width:18px; height:18px; }

    /* ===== 底部 Tab Bar ===== */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      max-width: 480px; width: 100%;
      background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border-soft);
      display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .tab { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding: 6px 0; color: var(--gray-600); }
    .tab .dot { position:absolute; top:3px; right:calc(50% - 20px); width:8px; height:8px; border-radius:50%; background:#F44336; box-shadow:0 0 0 2px var(--bg-card); }
    .tab.active { color: var(--pink-600); }
    .tab svg { width:22px; height:22px; }
    .tab span { font-size: 11px; }

    /* ===== 通用卡片 / 容器 ===== */
    .page { padding: 12px 16px 16px; }
    .section { background: var(--bg-card); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; border: 0.5px solid var(--border-soft); }
    .section h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display:flex; align-items:center; justify-content: space-between; }
    .section h3 .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 500; }

    /* ===== 入口页 ===== */
    .entry-hero {
      background: linear-gradient(135deg, var(--pink-400) 0%, #C2185B 100%);
      color: #fff; padding: 48px 24px 64px; text-align: center;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    }
    .entry-hero .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
      background: rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .entry-hero h2 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
    .entry-hero p { margin: 0; opacity: 0.9; font-size: 13px; }

    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; margin-top: -32px; }
    .role-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px 16px;
      border: 0.5px solid var(--border-soft); text-align: center; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .role-card:active { transform: scale(0.97); }
    .role-card .icon { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; }
    .role-card.mom .icon { background: var(--purple-50); color: var(--purple-600); }
    .role-card.kid .icon { background: var(--pink-50); color: var(--pink-600); }
    .role-card h4 { margin: 0 0 2px; font-size: 15px; }
    .role-card p { margin: 0; font-size: 12px; color: var(--gray-600); }
    .role-card svg { width: 28px; height: 28px; }

    /* ===== 密码 / PIN 输入 ===== */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 0 auto; }
    .pin-key {
      aspect-ratio: 1.6/1; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border);
      font-size: 22px; font-weight: 500;
    }
    .pin-key:active { background: var(--gray-100); }
    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 24px 0 32px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gray-200); }
    .pin-dot.filled { background: var(--pink-400); }
    .pin-title { text-align: center; margin: 32px 0 4px; font-size: 18px; font-weight: 600; }
    .pin-sub { text-align: center; margin: 0 0 24px; color: var(--gray-600); font-size: 13px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px; margin-bottom: 24px; }
    .avatar-cell {
      aspect-ratio: 1/1; border-radius: var(--radius-md);
      background: var(--gray-100); display:flex; align-items:center; justify-content:center;
      font-size: 28px; cursor: pointer; border: 2px solid transparent;
    }
    .avatar-cell.active { border-color: var(--pink-400); background: var(--pink-50); }

    /* ===== 单词打卡 ===== */
    .wq-bar { height: 8px; border-radius: 4px; background: var(--gray-100); overflow: hidden; }
    .wq-bar-in { height: 100%; background: linear-gradient(90deg, var(--pink-400), var(--pink-600)); border-radius: 4px; transition: width .3s; }
    .wq-done { background: var(--green-50); color: var(--green-600); border-radius: var(--radius-md); padding: 12px; text-align: center; font-weight: 500; }
    .wq-word-card { background: linear-gradient(135deg, var(--pink-400), #C2185B); color: #fff; border-radius: var(--radius-lg); padding: 28px 16px; text-align: center; margin-bottom: 12px; }
    .wq-word-card .w { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .wq-word-card .cn { font-size: 15px; opacity: .92; margin-top: 4px; }
    .wq-word-card .pos { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .5px; padding: 2px 10px; border-radius: 10px; background: rgba(255,255,255,.22); margin-top: 6px; }
    .ws-pos { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: #FFF3E0; color: #E65100; }
    .wq-sound-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.25); color: #fff; display: flex; align-items: center; justify-content: center; margin: 14px auto 0; font-size: 28px; }
    .wq-sound-btn:active { transform: scale(.92); }
    .wq-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .wq-choice { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 8px; font-size: 15px; text-align: center; }
    .wq-choice:active { transform: scale(.97); }
    .wq-choice.ok { border-color: var(--green-400); background: var(--green-50); color: var(--green-600); }
    .wq-choice.bad { border-color: #ef5350; background: #FFEBEE; color: #C62828; animation: wqshake .3s; }
    @keyframes wqshake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .wq-step-tag { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 600; margin-bottom: 8px; }
    .wq-spell { width: 100%; text-align: center; font-size: 22px; letter-spacing: 3px; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); text-transform: lowercase; }
    .wq-spell.bad { border-color: #ef5350; animation: wqshake .3s; }
    .wq-hint { text-align: center; color: var(--gray-600); font-size: 12px; margin-top: 8px; }
    /* ---- 单词三段式闯关 ---- */
    .wq-stages { display:flex; gap:6px; margin-bottom:12px; }
    .wq-stage { flex:1; text-align:center; font-size:12px; font-weight:600; padding:7px 2px; border-radius:9px; background:var(--gray-100); color:var(--gray-600); }
    .wq-stage.done { background:var(--green-50); color:var(--green-600); }
    .wq-stage.on { background:var(--pink-50); color:var(--pink-600); box-shadow:inset 0 0 0 1.5px var(--pink-200); }
    .wq-round-tip { text-align:center; font-size:12px; color:var(--gray-600); margin-bottom:10px; }
    .good { border-color:var(--green-400) !important; background:var(--green-50) !important; color:var(--green-600) !important; }
    .btn-text { background:none; border:none; color:var(--gray-600); font-size:13px; cursor:pointer; padding:6px; text-decoration:underline; }
    /* ---- 任务类型 ---- */
    .kind-row { display:flex; gap:6px; }
    .kind-pill { flex:1; padding:9px 4px; border-radius:10px; background:var(--gray-100); color:var(--gray-600); font-size:13px; font-weight:600; text-align:center; cursor:pointer; border:1.5px solid transparent; }
    .kind-pill span { display:block; font-size:11px; font-weight:400; margin-top:3px; opacity:.85; }
    .kind-pill.on { background:var(--pink-50); color:var(--pink-600); border-color:var(--pink-200); }
    .kind-tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px; margin-right:5px; font-weight:600; vertical-align:middle; }
    .kt-read { background:var(--cyan-50); color:var(--cyan-600); }
    .kt-video { background:var(--indigo-50); color:var(--indigo-600); }
    .btn-sm { width:auto; padding:7px 14px; font-size:13px; margin-top:8px; }
    /* ---- 看视频任务播放器（严格模式）---- */
    .sv-stage { position:relative; width:100%; border-radius:12px; overflow:hidden; background:#000; }
    .sv-stage video { display:block; width:100%; max-height:52vh; background:#000; }
    .sv-cover { position:absolute; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.35); color:#fff; border:none; font-size:40px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .sv-cover span { font-size:13px; margin-top:6px; }
    .sv-ctrls { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; gap:8px; padding:8px 10px; background:linear-gradient(transparent, rgba(0,0,0,.55)); z-index:3; }
    .sv-ctrls button { flex:none; width:40px; height:40px; border-radius:50%; border:none; background:#fff; color:#111; font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .sv-ctrls button:active { transform:scale(.93); }
    .sv-ctrls .sv-fs { margin-left:auto; background:var(--indigo-600); color:#fff; }
    /* CSS 全屏：移动端/APK WebView 原生 requestFullscreen 会静默失败，改用铺满视口的 CSS 全屏 */
    .modal.lv-fs .sv-stage { flex:1 1 auto; height:100%; border-radius:0; }
    .modal.lv-fs .sv-stage video { max-height:none; height:100%; width:100%; object-fit:contain; }
    .modal.lv-fs .sv-subrow { display:none; }
    /* ---- 勋章墙 ---- */
    .medal-wall { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .medal { text-align:center; padding:18px 10px; border-radius:16px; border:2px solid transparent; }
    .medal.got { background:linear-gradient(135deg,var(--amber-50),#FFE0B2); border-color:var(--amber-600); box-shadow:0 6px 16px rgba(255,152,0,.28); }
    .medal.locked { background:var(--gray-50); border-color:var(--gray-200); opacity:.55; filter:grayscale(.4); }
    .medal-emoji { font-size:36px; line-height:1; }
    .medal.got .medal-emoji { transform:scale(1.06); }
    .medal-name { font-weight:600; margin-top:7px; color:var(--gray-800); font-size:14px; }
    .medal-count { font-size:12px; margin-top:3px; color:var(--gray-600); }
    .medal.got .medal-count { color:var(--green-600); font-weight:700; }
    .medal-rule { margin-top:12px; font-size:12px; text-align:center; line-height:1.6; }
    .sv-bar { height:8px; border-radius:4px; background:var(--gray-200); overflow:hidden; margin-top:10px; }
    .sv-bar-in { height:100%; width:0; background:linear-gradient(90deg,var(--indigo-400),var(--indigo-600)); border-radius:4px; }
    .sv-time { display:flex; justify-content:space-between; font-size:12px; color:var(--gray-600); margin-top:5px; }
    .sv-tip { text-align:center; font-size:12px; color:var(--gray-600); margin-top:10px; }
    .sv-subrow { display:none; margin-top:9px; text-align:center; }
    .sv-subrow .btn-sm { min-width:96px; }
    .sv-subrow.on .btn-sm { background:var(--indigo-50); border-color:var(--indigo-400); color:var(--indigo-600); }
    .sv-subinfo { display:block; font-size:12px; color:var(--gray-600); margin-top:6px; line-height:1.5; }
    .sv-stage video::cue { font-size:19px; color:#fff; background:rgba(0,0,0,.62); line-height:1.55; }
    .res-sub-tag { display:inline-block; margin-left:5px; padding:0 5px; border-radius:5px; background:var(--indigo-50); color:var(--indigo-600); font-size:11px; vertical-align:middle; }
    /* 网盘链接标记：这类资源平台内打不开，只能跳出去看，得让妈妈一眼看出来 */
    .res-nd-tag { display:inline-block; margin-left:5px; padding:0 5px; border-radius:5px; background:var(--orange-50); color:var(--orange-600); font-size:11px; vertical-align:middle; }
    .nd-note { text-align:left; background:var(--gray-50); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.75; color:#555; margin-top:10px; }
    .nd-note b { color:#333; }
    /* ---- 作业栏 ---- */
    .hw-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
    .hw-head { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    .hw-who { font-size:12px; font-weight:600; color:var(--gray-600); }
    .hw-text { font-size:14px; line-height:1.65; white-space:normal; word-break:break-word; }
    .hw-imgs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .hw-img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; }

    /* ===== 星星乐园 ===== */
    .fun-hero { background: linear-gradient(135deg, #7C4DFF, #448AFF); color:#fff; border-radius: var(--radius-lg); padding:18px 16px; margin-bottom:12px; text-align:center; }
    .fun-hero .big { font-size:26px; font-weight:700; }
    .fun-hero .gate { font-size:12px; opacity:.92; margin-top:4px; }
    .game-card { display:flex; align-items:center; gap:12px; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-lg); padding:14px; margin-bottom:10px; cursor:pointer; }
    .game-card:active { transform: scale(.98); }
    .game-card .gicon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--purple-50); }
    .game-card .ginfo { flex:1; }
    .game-card .ginfo h4 { margin:0; font-size:15px; }
    .game-card .ginfo p { margin:2px 0 0; font-size:12px; color:var(--gray-600); }
    .game-card .cost { font-size:12px; font-weight:600; color:var(--amber-600); background:var(--amber-50); border-radius:8px; padding:4px 8px; white-space:nowrap; }

    /* ===== 算 24 点 ===== */
    .m24-nums { display:flex; gap:12px; justify-content:center; margin:14px 0 8px; }
    .m24-num { width:62px; height:62px; border-radius:16px; background:linear-gradient(135deg,#FFF3E0,#FFE0B2); color:#E65100; font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(230,81,0,.18); }
    .m24-timer-wrap { text-align:center; font-size:16px; font-weight:700; color:var(--gray-600); margin-bottom:4px; }
    .m24-timer-wrap span { color:var(--red-600); font-size:22px; }
    .m24-status { text-align:center; font-size:14px; color:var(--gray-600); min-height:20px; margin-bottom:10px; }
    .m24-status b { color:var(--purple-600); }
    .m24-score { display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:700; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-lg); padding:10px 16px; margin-bottom:8px; }
    .m24-score b { color:var(--purple-600); font-size:20px; }
    .m24-vs { color:var(--gray-400); font-size:13px; font-weight:500; }
    .m24-buzz { display:flex; gap:10px; margin-bottom:10px; }
    .m24-side { flex:1; border-radius:16px; padding:22px 8px; text-align:center; cursor:pointer; user-select:none; transition:transform .08s; }
    .m24-side:active { transform:scale(.97); }
    .m24-side.left { background:linear-gradient(135deg,#E3F2FD,#90CAF9); color:#0D47A1; }
    .m24-side.right { background:linear-gradient(135deg,#FCE4EC,#F48FB1); color:#880E4F; }
    .m24-side.disabled { opacity:.4; pointer-events:none; }
    .m24-side-name { font-size:13px; font-weight:700; margin-bottom:10px; opacity:.85; }
    .m24-buzz-btn { font-size:20px; font-weight:800; }
    .m24-judge { display:flex; flex-direction:column; gap:10px; }
    .m24-judge-who { text-align:center; font-size:15px; font-weight:700; }
    .wheel-wrap { position:relative; width:250px; height:250px; margin:16px auto 6px; }
    .wheel { width:100%; height:100%; border-radius:50%; border:8px solid #fff; box-shadow:0 4px 16px rgba(0,0,0,.18); transition: transform 3.2s cubic-bezier(.15,.85,.25,1); }
    .wheel-pointer { position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:26px; z-index:2; }
    .wheel-label { position:absolute; left:50%; top:50%; font-size:12px; font-weight:600; color:#fff; transform-origin:0 0; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .wheel-hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:2; }
    .wheel-seg-list { display:flex; flex-direction:column; gap:8px; margin:10px 0; max-height:52vh; overflow:auto; }
    .wheel-seg-edit { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#f5f6f8; padding:8px; border-radius:10px; }
    .wheel-seg-edit label { font-size:12px; color:#666; display:flex; align-items:center; gap:3px; }
    .wheel-seg-edit .wl-pct { font-weight:700; color:#ec407a; min-width:34px; text-align:right; }
    /* 列数由 JS 按难度内联设置（原来写死 8 列，10×10/12×12 全被挤成长方形）
       格子高度用 padding-top:100% 撑正方形，不用 aspect-ratio —— 学习机的老内核不支持 */
    .mine-grid { display:grid; gap:3px; margin:12px auto; width:100%; }
    .mine-cell { position:relative; width:100%; padding-top:100%; border-radius:6px; background:linear-gradient(135deg,#B0BEC5,#78909C); font-size:inherit; font-weight:700; cursor:pointer; overflow:hidden; }
    .mine-cell .mct { position:absolute; left:0; top:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; }
    .mine-cell:active { transform: scale(.92); }
    .mine-cell.open { background:var(--bg-card); border:0.5px solid var(--border-soft); cursor:default; }
    .mine-cell.boom { background:var(--red-50); }
    .mine-cell.mn-1 { color:#1976D2; } .mine-cell.mn-2 { color:#388E3C; } .mine-cell.mn-3 { color:#D32F2F; } .mine-cell.mn-4 { color:#6A1B9A; }
    .mine-cell.mn-5 { color:#E65100; } .mine-cell.mn-6 { color:#00838F; } .mine-cell.mn-7 { color:#37474F; } .mine-cell.mn-8 { color:#7B1FA2; }
    .diff-row { display:flex; gap:8px; margin-bottom:10px; }
    .diff-pill { flex:1; text-align:center; padding:9px 0; border-radius:14px; background:var(--bg-card); border:1.5px solid var(--border-soft); font-size:13px; font-weight:600; cursor:pointer; }
    .diff-pill.on { background:var(--purple-50); border-color:var(--purple-400); color:var(--purple-600); }
    .mem-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:330px; margin:12px auto; }
    .mem-card { aspect-ratio:3/4; border-radius:10px; background:linear-gradient(135deg,var(--purple-200),var(--purple-400)); display:flex; align-items:center; justify-content:center; font-size:26px; color:transparent; cursor:pointer; transition: transform .15s; }
    .mem-card:active { transform: scale(.95); }
    .mem-card.open { background:var(--bg-card); border:1.5px solid var(--purple-200); color:inherit; }
    .mem-card.done { background:var(--green-50); border:1.5px solid var(--green-400); color:inherit; }
    .game-status { text-align:center; font-size:14px; font-weight:600; margin:8px 0; }
    .proof-badge { display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--amber-50); color:var(--amber-600); font-weight:600; }
    .proof-shot { width:100%; max-height:280px; object-fit:contain; border-radius:12px; background:var(--gray-100); }
    .rec-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#E53935; animation:blink 1s infinite; margin-right:6px; }
    @keyframes blink { 50% { opacity:.15; } }
    .game-score-bar { display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:10px; font-size:13px; }

    /* ===== 任务卡片 ===== */
    .task { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--gray-50); margin-bottom: 8px; cursor: pointer; }
    .task:last-child { margin-bottom: 0; }
    .task .checkbox {
      width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--gray-400);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .task.done .checkbox { background: var(--green-400); border-color: var(--green-400); }
    .task.done .checkbox svg { color: #fff; }
    .task .title { flex:1; }
    .task .title .name { font-size: 14px; font-weight: 500; }
    .task .title .meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .task.done .name { text-decoration: line-through; color: var(--gray-600); }
    .task .pts { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--amber-50); color: var(--amber-600); font-weight: 500; }
    .task.done .pts { background: var(--green-50); color: var(--green-600); }
    /* 妈妈端任务操作按钮（孩子端不给，孩子不能自己删任务） */
    .task-ops { display: flex; gap: 6px; flex: none; }
    .task-ops .icon-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--gray-100); }
    .task-ops .icon-btn svg { width: 15px; height: 15px; }
    .task-ops .icon-btn.danger { background: #FFEBEE; color: #C62828; }
    .fut-day { font-size: 12px; font-weight: 600; color: var(--gray-600); margin: 12px 0 2px; }
    .del-warn { font-size: 13px; color: var(--gray-700); line-height: 1.7; }

    /* ===== 学科色块 ===== */
    .subject-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .subject-card {
      border-radius: var(--radius-md); padding: 14px; color: #fff; cursor: pointer;
      position: relative; overflow: hidden; min-height: 84px;
    }
    .subject-card .emoji { font-size: 24px; }
    .subject-card .name { font-weight: 600; margin-top: 4px; font-size: 14px; }
    .subject-card .count { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .subject-card.s-pink { background: linear-gradient(135deg, #FF6B9D, #D6336C); }
    .subject-card.s-orange { background: linear-gradient(135deg, #FF9800, #E65100); }
    .subject-card.s-cyan { background: linear-gradient(135deg, #00BCD4, #00838F); }
    .subject-card.s-purple { background: linear-gradient(135deg, #9C27B0, #6A1B9A); }
    .subject-card.s-green { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
    .subject-card.s-amber { background: linear-gradient(135deg, #FFC107, #FF8F00); }
    .subject-card.s-red { background: linear-gradient(135deg, #EF5350, #C62828); }
    .subject-card.s-indigo { background: linear-gradient(135deg, #5C6BC0, #3949AB); }
    .subject-card.s-teal { background: linear-gradient(135deg, #26A69A, #00695C); }
    /* 旧配色类保留（勋章等处仍在用） */
    .subject-card.s-chinese { background: linear-gradient(135deg, #FF6B9D, #D6336C); }
    .subject-card.s-math { background: linear-gradient(135deg, #FF9800, #E65100); }
    .subject-card.s-english { background: linear-gradient(135deg, #00BCD4, #00838F); }
    .subject-card.s-science { background: linear-gradient(135deg, #9C27B0, #6A1B9A); }
    /* 我的合集：炫酷深紫蓝渐变 + 发光 */
    .subject-card.s-collection { background: linear-gradient(135deg, #8B5CF6, #2563EB); box-shadow: 0 4px 14px rgba(99,102,241,.35); }
    .subject-card.s-collection .emoji svg { display: block; }
    .subject-card.s-fun { background: linear-gradient(135deg, #FF6B9D, #FF8A3D); box-shadow: 0 4px 14px rgba(255,107,157,.3); }
    .subject-card.s-fun .emoji svg { display: block; }
    .subject-card.s-music { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
    .subject-card.s-art { background: linear-gradient(135deg, #FFC107, #FF8F00); }

    /* ===== 资源项 ===== */
    .resource {
      display: flex; gap: 12px; padding: 10px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border-soft); margin-bottom: 8px;
      align-items: center;
    }
    .resource .thumb {
      width: 56px; height: 56px; border-radius: var(--radius-sm); background: var(--gray-100);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray-600);
    }
    .resource .thumb svg { width: 24px; height: 24px; }
    .resource .info { flex: 1; min-width: 0; }
    .resource .info .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resource .info .meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .resource .badge-subj { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }

    /* ===== 妈妈后台 —— 孩子打卡卡片 ===== */
    .kid-row {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md);
      background: var(--gray-50); margin-bottom: 8px;
    }
    .kid-row .avatar { width: 40px; height: 40px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 20px; background: var(--pink-50); }
    .kid-row .info { flex: 1; }
    .kid-row .info .name { font-weight: 600; font-size: 14px; }
    .kid-row .info .progress { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .kid-row .progress-bar { width: 80px; height: 4px; background: var(--gray-200); border-radius: 2px; overflow: hidden; margin-top: 4px; }
    .kid-row .progress-bar div { height: 100%; background: var(--pink-400); }
    .kid-row .pts { font-size: 14px; font-weight: 600; color: var(--pink-600); }

    /* ===== 课表 ===== */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kid-col { background: var(--gray-50); border-radius: var(--radius-md); padding: 12px; }
    .kc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .kc-head .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 18px; }
    .kc-name { flex: 1; font-weight: 600; font-size: 14px; }
    .kc-name .kc-streak { font-weight: 400; font-size: 11px; color: var(--gray-600); margin-left: 6px; }
    .kc-pts { font-weight: 600; color: var(--pink-600); font-size: 14px; }
    .kc-sub { font-size: 12px; font-weight: 600; color: var(--gray-600); margin: 10px 0 6px; }
    .kc-empty { font-size: 12px; color: var(--gray-600); padding: 6px 0; }
    .course { background: var(--bg-card); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 6px; position: relative; }
    .course .c-time { font-size: 11px; color: var(--gray-600); }
    .course .c-title { font-size: 13px; font-weight: 500; }
    .course .c-meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .course .c-ops { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
    .today-courses { background: var(--amber-50); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; border: 1px solid var(--amber-600); }
    .today-courses .tc-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--amber-600); }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { padding: 6px 12px; border-radius: 999px; background: var(--gray-100); font-size: 13px; color: var(--gray-600); cursor: pointer; }
    .chip.on { background: var(--pink-400); color: #fff; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .wk-day { background: var(--gray-50); border-radius: var(--radius-sm); padding: 6px; min-height: 64px; }
    .wk-day.today { background: var(--amber-50); border: 1px solid var(--amber-600); }
    .wk-h { font-size: 11px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
    .wk-h .wk-d { font-weight: 400; color: var(--gray-600); }
    .wk-empty { font-size: 11px; color: var(--gray-600); text-align: center; padding-top: 8px; }
    .month-list { display: flex; flex-direction: column; gap: 8px; }
    .mo-day { background: var(--gray-50); border-radius: var(--radius-sm); padding: 8px 10px; }
    .mo-h { font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }


    /* ===== 奖励视频 ===== */
    .reward {
      display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border-soft); margin-bottom: 8px;
      align-items: center; position: relative;
    }
    .reward.locked { opacity: 0.6; }
    .reward.locked::after {
      content: '🔒'; position: absolute; top: 50%; right: 16px; transform: translateY(-50%); font-size: 20px;
    }
    .reward .thumb {
      width: 64px; height: 64px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--purple-50), var(--pink-50));
      display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
    }
    .reward .info { flex: 1; min-width: 0; }
    .reward .info .name { font-size: 14px; font-weight: 500; }
    .reward .info .threshold { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    /* 奖励行内按钮：覆盖全局 .btn-primary{width:100%}，改为自适应宽、不换行，避免文字被挤竖排 */
    .reward .btn-primary {
      width: auto; flex: 0 0 auto; white-space: nowrap;
      padding: 6px 14px; font-size: 12px; margin-left: 8px;
    }

    /* ===== 顶部数据卡 ===== */
    .stat-card {
      background: linear-gradient(135deg, var(--pink-400), var(--purple-400));
      color: #fff; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 12px;
    }
    .stat-card .label { font-size: 12px; opacity: 0.9; }
    .stat-card .big { font-size: 32px; font-weight: 600; margin: 4px 0 8px; }
    .stat-card .meta { font-size: 12px; opacity: 0.9; display:flex; gap: 16px; }
    .stat-card .meta div span { font-weight: 600; }

    /* ===== FAB ===== */
    .fab {
      position: fixed; bottom: 90px; right: 16px; width: 52px; height: 52px;
      border-radius: 50%; background: var(--pink-400); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(255,107,157,0.4); z-index: 40;
    }
    .fab svg { width: 24px; height: 24px; }

    /* ===== 表单 ===== */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--gray-600); margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border); background: var(--bg-card); font-size: 14px;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--pink-400); }
    .btn-primary {
      width: 100%; padding: 12px; border-radius: var(--radius-md);
      background: var(--pink-400); color: #fff; font-size: 14px; font-weight: 500;
    }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-secondary {
      width: 100%; padding: 12px; border-radius: var(--radius-md);
      background: var(--gray-100); color: var(--gray-900); font-size: 14px; font-weight: 500;
    }
    .btn-row { display:flex; gap: 8px; margin-top: 16px; }
    .btn-row button { flex: 1; }

    /* ===== Modal ===== */
    .modal-mask { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: var(--bg-card); width: 100%; max-width: 480px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; text-align: center; }
    .modal .close { float: right; margin-top: -8px; }

    /* ===== 视频播放器 ===== */
    .video-mask { align-items: center; padding: 16px; }
    .video-modal { border-radius: var(--radius-lg); padding: 16px; max-height: 90vh; }
    .video-modal h3 { margin-bottom: 12px; padding-right: 24px; text-align: left; }
    .video-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrap iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; }
    /* 宽松模式（B站等外站）的网页全屏：纯 CSS 铺满，不依赖系统播放器。
       有些设备（华为自带浏览器、老 WebView）点了播放器自己的全屏没反应，
       这个兜底在那些环境下也能把视频放大到整屏。 */
    .modal.lv-fs { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 120; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 0; border-radius: 0; overflow: hidden; background: #000; display: flex; flex-direction: column; }
    .modal.lv-fs h3, .modal.lv-fs .wq-hint, .modal.lv-fs .lv-normal-bar { display: none; }
    .modal.lv-fs .close { position: absolute; top: 10px; right: 12px; z-index: 6; float: none; margin: 0; background: rgba(0,0,0,0.45); }
    .modal.lv-fs .video-wrap { flex: 1 1 auto; padding-top: 0 !important; height: 100%; border-radius: 0; }
    .modal.lv-fs .video-wrap iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; }
    .lv-fs-bar { display: none; }
    .modal.lv-fs .lv-fs-bar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #111; }
    .modal.lv-fs .lv-fs-bar button { flex: 1; }
    .video-modal .video-meta { font-size: 12px; color: var(--gray-600); margin-top: 10px; text-align: center; }

    /* ---- 影院模式（B站弹窗也用同一套）----
       B站播放器在跨域 iframe 里点全屏，走的是它自己的「网页全屏」，
       只会在 iframe 自己的视口里铺满，永远不会变大。
       所以由外层把容器直接拉到整屏，它跟着变大，这才是真能变大的办法。 */
    .bili-fs-bar { display: none; }
    .modal.lv-fs .bili-fs-bar { display: flex; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #111; }
    .modal.lv-fs .bili-fs-bar button { flex: 1; }
    .modal.lv-fs .bili-more { position: absolute; top: 10px; right: 56px; z-index: 6; float: none; margin: 0; background: rgba(0,0,0,0.45); }
    /* 全屏时备用播放方式改成浮层，不占高度、不挤压视频 */
    .modal.lv-fs .bili-fallback { position: absolute; top: 58px; left: 12px; right: 12px; z-index: 7; max-height: 68vh; overflow-y: auto; margin-top: 0; }

    /* ===== PDF 阅读器（PDF.js 画到 canvas）=====
       Android WebView 没有 Chrome 那套 PDF 插件，<iframe src="xx.pdf"> 在 APP 壳
       和学习机里永远是空白、或者直接变成下载。所以统一用 PDF.js 逐页画到 canvas，
       壳 / 学习机 / 手机浏览器表现一致，也不跳出平台（家长控制不会漏）。
       前提：PDF 所在服务器必须开 CORS，否则 pdf.js 的 fetch 连数据都拿不到。 */
    .pdf-stage { position: relative; width: 100%; height: 58vh; min-height: 300px; background: #525659; border-radius: 10px; overflow: auto; -webkit-overflow-scrolling: touch; }
    .pdf-stage-inner { display: flex; justify-content: center; padding: 10px; min-width: 100%; min-height: 100%; }
    .pdf-canvas { display: block; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.28); max-width: none; }
    .pdf-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pdf-bar .pdf-btn { min-width: 46px; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border-soft); background: #fff; color: var(--gray-800); font-size: 14px; font-weight: 600; cursor: pointer; }
    .pdf-bar .pdf-btn:active { background: var(--gray-100); }
    .pdf-page { font-size: 13px; color: var(--gray-600); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pdf-page input { width: 56px; text-align: center; padding: 6px 4px; border: 1px solid var(--border-soft); border-radius: 8px; font-size: 13px; }
    .pdf-tip { font-size: 12px; color: var(--gray-600); margin-top: 8px; text-align: center; line-height: 1.7; }
    .pdf-warnlink { color: #b45309; cursor: pointer; text-decoration: underline; }
    .pdf-fixbox-scroll { max-height: 42vh; overflow: auto; }
    .pdf-err { margin: 10px 0 0; padding: 12px 14px; background: #fff4e6; border: 1px solid #ffd9a8; border-radius: 10px; font-size: 12.5px; color: #8a5a00; line-height: 1.9; text-align: left; }
    .pdf-err b { color: #7a4a00; }
    .pdf-err code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
    .pdf-err ol { margin: 6px 0 0; padding-left: 18px; }
    .pdf-err li { margin: 2px 0; }
    .pdf-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 260px; padding: 28px 16px; color: #e8e8e8; font-size: 13px; text-align: center; }
    .pdf-spin { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.25); border-top-color: var(--pink-400); border-radius: 50%; animation: pdfspin .8s linear infinite; }
    @keyframes pdfspin { to { transform: rotate(360deg); } }
    .pdf-prog { width: 190px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
    .pdf-prog > i { display: block; height: 100%; width: 0; background: var(--pink-400); transition: width .2s; }
    /* PDF 全屏：只铺满，不通知 APP 壳 —— 壳会强制横屏，而课本竖着看才舒服 */
    .modal.lv-fs .pdf-stage { flex: 1 1 auto; height: auto; border-radius: 0; }

    /* ===== EPUB 电子书阅读器（epub.js）=====
       EPUB 是一个 zip 包，里面是 XHTML 章节 + 图片 + 目录。
       和 PDF 一样必须先开 CORS，否则 epub.js 连包都取不回来。
       排版重排（reflow）是 EPUB 相对 PDF 最大的好处：手机上字会自动跟着屏幕走，不用放大缩小。 */
    .epub-stage { position: relative; width: 100%; height: 58vh; min-height: 300px; background: #f6f4ef; border-radius: 10px; overflow: hidden; }
    .epub-view { position: absolute; inset: 0; }
    /* epub.js 把章节渲染进 iframe，滚动和点击翻页都由它自己接管 */
    .epub-view iframe { width: 100% !important; height: 100% !important; border: 0; background: transparent; }
    /* 复用 PDF 的加载动画，但底色是浅的，文字要换成深色才看得见 */
    .epub-stage .pdf-loading { position: absolute; inset: 0; z-index: 8; background: #f6f4ef; color: var(--gray-600); }
    .epub-stage .pdf-spin { border-color: rgba(0,0,0,.12); border-top-color: var(--pink-400); }
    .epub-stage .pdf-prog { background: rgba(0,0,0,.1); }
    .epub-toc { display: none; position: absolute; inset: 0; z-index: 9; background: #fff; overflow: auto; -webkit-overflow-scrolling: touch; }
    .epub-toc.on { display: block; }
    .epub-toc-hd { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #fff; border-bottom: 1px solid var(--border-soft); font-weight: 700; font-size: 14px; }
    .epub-toc-list { padding: 6px 0 16px; }

    .epub-toc-item:active { background: var(--gray-100); }
    .epub-toc-item.sub { padding-left: 30px; font-size: 13px; color: var(--gray-600); }
    .epub-tip { font-size: 12px; color: var(--gray-600); margin-top: 8px; text-align: center; line-height: 1.7; }
    .modal.lv-fs .epub-stage { flex: 1 1 auto; height: auto; border-radius: 0; }
    .modal.lv-fs .epub-tip { display: none; }

  // 每周固定课：按 星期+时间 排，学期内每天自动提醒；妈妈学期初一次性录入
  function weekday(dateStr) {
    const js = new Date(dateStr + 'T00:00:00').getDay();
    return js === 0 ? 7 : js; // 1=周一 … 7=周日
  }
  function mondayOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const off = d.getDay() === 0 ? -6 : 1 - d.getDay();
    d.setDate(d.getDate() + off);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function monthFirst(dateStr) { return dateStr.slice(0, 7) + '-01'; }
  function addMonths(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(1); d.setMonth(d.getMonth() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  }
  function schedOn(sc, dateStr) {
    return (!sc.from || sc.from <= dateStr) && (!sc.to || dateStr <= sc.to);
  }
  function todayCourses(c) {
    if (!c) return [];
    const wd = weekday(TODAY);
    return (DATA.schedules || []).filter(sc => sc.childId === c.id && sc.day === wd && schedOn(sc, TODAY))
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  }
  function todayCoursesOn(c, dateStr) {
    if (!c) return [];
    const wd = weekday(dateStr);
    return (DATA.schedules || []).filter(sc => sc.childId === c.id && sc.day === wd && schedOn(sc, dateStr))
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  }

  let schedTab = 'week';   // week | month | next
  let schedChild = 'all';  // all | c1 | c2
  function schedSetTab(v) { schedTab = v; render(); }
  function schedSetChild(v) { schedChild = v; render(); }
  const SCHED_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>';
  function schedWeekGrid(childList, editable) {
    const mon = mondayOf(TODAY);
    return [0,1,2,3,4,5,6].map(i => {
      const day = addDays(mon, i);
      const cs = childList.flatMap(c => todayCoursesOn(c, day));
      return `
        <div class="wk-day${day === TODAY ? ' today' : ''}">
          <div class="wk-h">周${'一二三四五六日'[i]}${day === TODAY ? ' · 今天' : ''}<br><span class="wk-d">${day.slice(5)}</span></div>

        </div>`;
    }).join('');
  }
  function schedMonthList(childList, editable) {
    const base = schedTab === 'next' ? addMonths(TODAY, 1) : TODAY;
    const first = monthFirst(base);
    const y = +first.slice(0, 4), m = +first.slice(5, 7);
    const dim = new Date(y, m, 0).getDate();
    let out = '';
    for (let i = 0; i < dim; i++) {
      const day = first.slice(0, 8) + String(i + 1).padStart(2, '0');
      const cs = childList.flatMap(c => todayCoursesOn(c, day));
      if (!cs.length) continue;
      out += `
        <div class="mo-day">
          <div class="mo-h">${day.slice(5)} 周${'日一二三四五六'[new Date(day + 'T00:00:00').getDay()]}</div>
          ${cs.map(sc => courseCard(sc, editable)).join('')}
        </div>`;
    }
    return out || '<div class="empty">这个月没有排课</div>';
  }
  function schedBody(childList, editable) {

  }

  // ========== 妈妈后台 - 学习记录（近 7 天）==========
  let fpKid = 'all';
  function fpSetKid(v) { fpKid = v; render(); }
  function fpClock(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function fpMin(sec) {
    const m = Math.round((Number(sec) || 0) / 60);
    if (m <= 0) return '不到 1 分钟';
    if (m < 60) return m + ' 分钟';
    const h = Math.floor(m / 60), r = m % 60;
    return h + ' 小时' + (r ? ' ' + r + ' 分' : '');
  }
  function fpDayLabel(date) {
    if (date === TODAY) return '今天';
    if (date === addDays(TODAY, -1)) return '昨天';
    const w = '日一二三四五六'[new Date(date + 'T00:00:00').getDay()];
    return date.slice(5).replace('-', '/') + ' 周' + w;
  }
  function viewMomFootprints() {
    if (!sessionStorage.getItem('mom-auth')) { location.hash = 'mom-pin'; return ''; }
    fpGc(DATA);
    const list = (DATA.footprints || []).filter(f => fpKid === 'all' || f.childId === fpKid);
    const days = [];
    for (let i = FP_KEEP - 1; i >= 0; i--) days.push(addDays(TODAY, -i));
    const dayStat = days.map(d => {
      const rs = list.filter(f => f.date === d);
      let sec = 0;
      for (let i = 0; i < rs.length; i++) sec += rs[i].sec || 0;
      return { date: d, sec: sec, n: rs.length };
    });
    let peak = 600;   // 柱子最低刻度 10 分钟，免得看一眼只有几秒也顶到天
    for (let i = 0; i < dayStat.length; i++) if (dayStat[i].sec > peak) peak = dayStat[i].sec;
    const todayRecs = list.filter(f => f.date === TODAY);
    let todaySec = 0;
    for (let i = 0; i < todayRecs.length; i++) todaySec += todayRecs[i].sec || 0;
    const logins = todayRecs.filter(f => f.kind === 'login').length;
    const kids = DATA.children;
    const body = days.map(d => {
      const rs = list.filter(f => f.date === d).sort((a, b) => b.at - a.at);
      if (!rs.length) return '';
      let sec = 0;
      for (let i = 0; i < rs.length; i++) sec += rs[i].sec || 0;
      return `<div class="section">
          <h3>${fpDayLabel(d)}<span class="badge">${sec > 0 ? fpMin(sec) + ' · ' : ''}${rs.length} 项</span></h3>
          <div class="fp-list">
            ${rs.map(f => {
              const kd = FP_KINDS[f.kind] || { icon: '📌', name: '活动' };
              const who = fpKid === 'all'
                ? ((kids.find(x => x.id === f.childId) || {}).avatar || '') + ' '
                : '';
              return `<div class="fp-item">
                  <div class="fp-ic">${kd.icon}</div>
                  <div class="fp-tx">
                    <div class="fp-t"><span class="fp-who">${esc(who)}</span>${esc(f.title)}</div>
                    <div class="fp-s">${fpClock(f.at)} · ${kd.name}${f.sec ? ' · ' + fpMin(f.sec) : ''}${f.pts ? ' · ' + (f.pts > 0 ? '+' : '') + f.pts + ' 分' : ''}</div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="topbar">
        <h1>👀 学习记录</h1>
        <div class="actions"><span class="fp-note">只保留 ${FP_KEEP} 天</span></div>
      </div>
      <div class="page">
        <div class="fp-chips">
          <button class="fp-chip${fpKid === 'all' ? ' on' : ''}" onclick="fpSetKid('all')">全部</button>
          ${kids.map(k => `<button class="fp-chip${fpKid === k.id ? ' on' : ''}" onclick="fpSetKid('${k.id}')">${k.avatar} ${esc(k.name)}</button>`).join('')}
        </div>

        <div class="stat-card">
          <div class="label">${TODAY} · 今天</div>
          <div class="big">${fpMin(todaySec)}</div>
          <div class="meta">
            <div>活动 <span>${todayRecs.length}</span> 项</div>
            <div>进入 <span>${logins}</span> 次</div>
          </div>
        </div>

        <div class="section">
          <h3>近 ${FP_KEEP} 天时长<span class="badge">看视频 + 读书</span></h3>
          <div class="fp-chart">
            ${dayStat.map(d => `
              <div class="fp-col${d.date === TODAY ? ' today' : ''}">
                <div class="fp-val">${d.sec ? Math.round(d.sec / 60) + '′' : ''}</div>
                <div class="fp-bar" style="height:${Math.max(3, Math.round(d.sec / peak * 82))}px"></div>
                <div class="fp-lab">${d.date === TODAY ? '今天' : d.date.slice(5).replace('-', '/')}</div>
              </div>`).join('')}
          </div>
        </div>

        ${body || `<div class="section"><div class="empty" style="padding:26px 8px">
            <div class="emoji">👀</div>近 ${FP_KEEP} 天还没有记录<br>
            <span style="font-size:12px">孩子看视频、读书、打卡都会自动记在这里</span>
          </div></div>`}

        <p class="text-mute" style="font-size:12px;text-align:center;margin:14px 0 4px">
          B站和外链视频拿不到精确进度，按「打开到关闭」计时；<br>切到后台的时间不算在内。记录满 7 天自动清除。
        </p>
      </div>
      ${momTabBar('log')}
    `;
  }

  // 清理本设备缓存：只清 Cache Storage（页面/图标/图片/视频缓存），
  // 绝不碰 localStorage 里的业务数据（任务、打卡、积分、凭证、词库都在那儿）。
  async function clearDeviceCache() {
    if (!window.caches) { toast('这个浏览器不支持缓存管理'); return; }
    let keys = [];
    try { keys = await caches.keys(); } catch (e) { keys = []; }
    if (!keys.length) { toast('本机没有离线缓存'); return; }
    let usage = 0;
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        if (est && est.usage) usage = est.usage;
      }
    } catch (e) { usage = 0; }
    const size = usage ? (usage / 1048576).toFixed(1) + ' MB' : '未知大小';
    if (!confirm('确定清理本设备的离线缓存吗？\n\n当前占用约 ' + size +
      '\n\n只删临时文件（页面、图标、图片、视频缓存），\n任务、打卡、积分、凭证、词库都不会丢。\n\n清理后页面会自动刷新。')) return;
    await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
    toast('缓存已清理，释放约 ' + size);
    setTimeout(() => { try { location.reload(); } catch (e) {} }, 900);
  }

  // ========== 孩子端 - 选娃 ==========

  // ========== 孩子端 - 任务 ==========
  // ========== 学习足迹（近 7 天，超期自动清）==========
  // 记孩子在平台上做了什么：什么时候来过、看了哪个视频多久、读了什么书、完成了哪些任务。
  // 只留 7 天：再久就成了监控，也白白占云端同步的空间。
  // 注意：这里一律用 todayStr() 而不是 TODAY 常量 —— normalizeData 在 TODAY 初始化之前
  // 就会被调用（loadData → normalizeData），那时读 const TODAY 会踩暂时性死区直接报错。
  const FP_KEEP = 7;
  const FP_MAX = 600;          // 条数上限，防止有人把页面开一整天攒出几万条
  const FP_KINDS = {
    login:     { icon: '🔑', name: '进入平台' },
    video:     { icon: '🎬', name: '看视频' },
    audio:     { icon: '🎵', name: '听音频' },
    read:      { icon: '📖', name: '阅读' },
    task:      { icon: '✅', name: '完成任务' },
    word:      { icon: '🔤', name: '单词练习' },
    dictation: { icon: '✍️', name: '听写' },   // 听写功能已下线，此项仅用于显示历史积分记录，勿删
    habit:     { icon: '⭐', name: '习惯打卡' },
    game:      { icon: '🎮', name: '小游戏' },
  };
  function fpCutoff() { return addDays(todayStr(), -(FP_KEEP - 1)); }
  function fpGc(d) {
    const arr = (d && Array.isArray(d.footprints)) ? d.footprints : [];
    const cut = fpCutoff();
    let out = arr.filter(x => x && typeof x.date === 'string' && x.date >= cut);
    if (out.length > FP_MAX) out = out.slice(out.length - FP_MAX);   // 超了就丢最旧的
    if (d) d.footprints = out;
    return out.length !== arr.length || out !== arr;
  }
  function fpWho() {
    try { const k = kidCheck(); return k ? k.id : ''; } catch (e) { return ''; }
  }
  /** 记一条。opt: { childId, sec, pts, meta } */
  function fpAdd(kind, title, opt) {
    opt = opt || {};
    const cid = opt.childId || fpWho();
    if (!cid) return null;                       // 没登录的孩子（妈妈自己在浏览）不记
    if (!Array.isArray(DATA.footprints)) DATA.footprints = [];
    const now = Date.now();
    const rec = {
      id: 'f' + now.toString(36) + Math.random().toString(36).slice(2, 6),
      childId: cid, at: now, date: todayStr(),
      kind: FP_KINDS[kind] ? kind : 'task',
      title: String(title || '').slice(0, 80) || (FP_KINDS[kind] ? FP_KINDS[kind].name : '活动'),
    };
    if (opt.sec > 0) rec.sec = Math.round(opt.sec);
    if (opt.pts) rec.pts = Number(opt.pts) || 0;
    if (opt.meta) rec.meta = opt.meta;
    DATA.footprints.push(rec);
    fpGc(DATA);
    return rec;
  }
  /** DATA 被整包换掉时，把本机已有的足迹按 id 补回去（合并规则只认 id）*/
  function fpAdopt(d, oldArr) {
    if (!d) return;
    if (!Array.isArray(d.footprints)) d.footprints = [];
    const have = {};
    for (let i = 0; i < d.footprints.length; i++) if (d.footprints[i] && d.footprints[i].id) have[d.footprints[i].id] = 1;
    for (let i = 0; i < (oldArr || []).length; i++) {
      const f = oldArr[i];
      if (f && f.id && !have[f.id]) d.footprints.push(f);
    }
    fpGc(d);
  }
  /** 撤销时把今天这条抹掉（取消打卡、退星等）*/
  function fpDrop(childId, kind, title, date) {
    if (!Array.isArray(DATA.footprints)) return;
    const d = date || TODAY;
    for (let i = DATA.footprints.length - 1; i >= 0; i--) {
      const f = DATA.footprints[i];
      if (f && f.childId === childId && f.kind === kind && f.title === title && f.date === d) {
        DATA.footprints.splice(i, 1);
        return;
      }
    }
  }
  // ---- 计时：看视频 / 读书这类有持续时长的 ----
  // 同一时刻只记一件事；精确时长由播放器自己累加（fpAcc），
  // 管不了播放器的（B站 iframe、阅读器）退化为「打开到关闭」的墙钟时间，并扣掉切后台的时间。
  let FP = null;
  function fpOpen(kind, title, opt) {
    fpClose();                                   // 上一件没收尾就先收掉，别串味
    opt = opt || {};
    const cid = opt.childId || fpWho();
    if (!cid) { FP = null; return; }
    FP = { kind: kind, title: title, childId: cid, t0: Date.now(), acc: 0,
           hiddenAt: 0, hidden: 0, meta: opt.meta || null };
  }
  /** 播放器精确累加（只收正向推进，倒退 / 拖回不算）*/
  function fpAcc(sec) { if (FP && sec > 0 && sec < 30) FP.acc += sec; }
  function fpPause() { if (FP && !FP.hiddenAt) FP.hiddenAt = Date.now(); }
  function fpResume() { if (FP && FP.hiddenAt) { FP.hidden += Date.now() - FP.hiddenAt; FP.hiddenAt = 0; } }
  function fpClose() {
    const cur = FP;
    FP = null;
    if (!cur) return null;
    if (cur.hiddenAt) { cur.hidden += Date.now() - cur.hiddenAt; cur.hiddenAt = 0; }
    let sec;
    if (cur.acc > 0) sec = cur.acc;                                    // 播放器给了精确值
    else sec = Math.min((Date.now() - cur.t0 - cur.hidden) / 1000, 3 * 3600);  // 忘了关最多算 3 小时
    if (sec < 5) return null;                                          // 误点一下不算
    const rec = fpAdd(cur.kind, cur.title, { childId: cur.childId, sec: sec, meta: cur.meta });
    // 弹窗关掉之后不会再有别的保存动作，这里必须自己落盘，否则刷新就没了
    try { if (rec) saveData(DATA); } catch (e) {}
    return rec;
  }
  /** 弹窗被关掉 = 这件事结束了。用 MutationObserver 一次覆盖所有弹窗，
   *  不用在每个播放器的关闭按钮上分别挂一遍（迟早会漏）。 */
  function fpWatchModals() {
    try {
      if (typeof MutationObserver === 'undefined') return;
      const root = document.getElementById('modal-root');
      if (!root) return;
      new MutationObserver(function (muts) {
        for (let i = 0; i < muts.length; i++) {
          const rm = muts[i].removedNodes || [];
          for (let j = 0; j < rm.length; j++) {
            if (rm[j] && rm[j].classList && rm[j].classList.contains('modal-mask')) fpClose();
          }
        }
      }).observe(root, { childList: true });
    } catch (e) {}
  }
  function kidCheck() {
    const id = sessionStorage.getItem('kid-auth');
    return id && DATA.children.find(c => c.id === id);
  }
  // 孩子在「姐姐/弟弟」侧的归属：名字含姐→sis，含弟→bro，其余按出生序首=姐、后=弟
  function kidSide(c) {
    if (!c) return '';
    const nm = c.name || '';
    if (/姐/.test(nm)) return 'sis';
    if (/弟/.test(nm)) return 'bro';
    const idx = (DATA.children || []).indexOf(c);
    return idx === 0 ? 'sis' : 'bro';
  }
  // 资源是否对某个孩子可见：who=both 或 =该孩子所在侧
  function resForKid(r, c) {
    if (!r || !r.who || r.who === 'both') return true;
    return r.who === kidSide(c);
  }
  // 给谁看的标签（妈妈端资源列表用）
  function whoTag(r) {
    const w = (r && r.who) || 'both';
    if (w === 'sis') return `<span class="badge-subj" style="background:var(--pink-50);color:var(--pink-600)">👧 只给姐姐</span>`;
    if (w === 'bro') return `<span class="badge-subj" style="background:var(--purple-50);color:var(--purple-600)">👦 只给弟弟</span>`;
    return `<span class="badge-subj" style="background:var(--gray-100);color:var(--gray-600)">👧👦 姐弟俩</span>`;
  }

  // ========== 好习惯清单（奖惩） ==========
  // 和「任务」的分工：任务是一天一条的实例（带 date，妈妈逐天布置、做完就消失）；
  // 习惯是长期约定，每天自动出现，只记「哪天谁做到了哪条」(habitLogs)，不再生成实例。
  const HABIT_FREQ = { daily: '每天', weekday: '周一至周五', weekend: '周末' };
  // 常用习惯模板：只有妈妈点「从常用习惯里挑」时才写进数据，绝不能进 DEFAULT_DATA ——
  // 否则任何一台新设备首次打开都自带一份，全家人删掉的又被带回来（和出厂示例资源同一个坑）
  const HABIT_PRESETS = [
    { emoji: '😴', title: '午觉 13:05 前上床',      kind: 'reward',  points: 2, time: '13:05', freq: 'daily' },
    { emoji: '🌙', title: '晚上 22:30 前上床睡觉',   kind: 'reward',  points: 2, time: '22:30', freq: 'daily' },
    { emoji: '🎒', title: '自己整理书包',            kind: 'reward',  points: 2, time: '',      freq: 'weekday' },
    { emoji: '✍️', title: '先写作业再玩',            kind: 'reward',  points: 3, time: '',      freq: 'weekday' },
    { emoji: '🦷', title: '早晚刷牙',                kind: 'reward',  points: 1, time: '',      freq: 'daily' },
    { emoji: '🍚', title: '专心吃饭不拖拉',          kind: 'reward',  points: 2, time: '',      freq: 'daily' },
    { emoji: '🧹', title: '玩具用完自己收好',        kind: 'reward',  points: 2, time: '',      freq: 'daily' },
    { emoji: '📖', title: '每天阅读 20 分钟',        kind: 'reward',  points: 3, time: '',      freq: 'daily' },
    { emoji: '🏃', title: '户外运动 30 分钟',        kind: 'reward',  points: 3, time: '',      freq: 'weekend' },
    { emoji: '🙏', title: '主动打招呼问好',          kind: 'reward',  points: 1, time: '',      freq: 'daily' },
    { emoji: '🌛', title: '22:30 后还没睡',          kind: 'penalty', points: 2, time: '22:30', freq: 'daily' },
    { emoji: '📱', title: '偷偷玩手机 / 平板',       kind: 'penalty', points: 3, time: '',      freq: 'daily' },
    { emoji: '😤', title: '乱发脾气、顶嘴',          kind: 'penalty', points: 2, time: '',      freq: 'daily' },
    { emoji: '🧸', title: '玩具乱扔不收拾',          kind: 'penalty', points: 1, time: '',      freq: 'daily' },
    { emoji: '🍬', title: '饭前偷吃零食',            kind: 'penalty', points: 1, time: '',      freq: 'daily' },
  ];
  // 习惯是否适用这个孩子（姐姐 / 弟弟 / 姐弟俩），规则与资源完全一致
  function habitForKid(h, c) {
    if (!h || !h.who || h.who === 'both') return true;
    return h.who === kidSide(c);
  }
  // 今天这条习惯是否要出现：每天 / 只上学日 / 只周末
  function habitToday(h, date) {
    const f = (h && h.freq) || 'daily';
    if (f === 'daily') return true;
    const wd = new Date((date || TODAY) + 'T00:00:00').getDay(); // 0=周日
    const weekend = (wd === 0 || wd === 6);
    return f === 'weekend' ? weekend : !weekend;
  }
  // 某个孩子今天要打卡的习惯，按时间点从早到晚排（没填时间的排最后）
  function habitList(c) {
    return (DATA.habits || []).filter(h => habitForKid(h, c) && habitToday(h, TODAY))
      .sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')));
  }
  function habitLogOn(habitId, childId, date) {
    const d = date || TODAY;
    return (DATA.habitLogs || []).find(l => l.habitId === habitId && l.childId === childId && l.date === d) || null;
  }
  // 本周（周一起算）做到过几次
  function habitWeekCount(habitId, childId) {
    const wd = (new Date(TODAY + 'T00:00:00').getDay() + 6) % 7; // 周一=0
    const monday = addDays(TODAY, -wd);
    return (DATA.habitLogs || []).filter(l => l.habitId === habitId && l.childId === childId && l.date >= monday).length;
  }
  // 打卡 / 撤销。on=true 记一笔并发分，on=false 把这一笔连同积分一起退回去。
  // 坑：撤销必须同时删 habitLogs 并进墓碑，只删数组会被另一台设备的旧缓存推回来，
  // 界面显示「做到了」但积分已经退回，两边对不上。
  function applyHabit(h, c, on, by) {
    const n = Math.max(0, parseInt(h.points) || 0);
    const title = '习惯：' + h.title;
    if (on) {
      if (!DATA.habitLogs) DATA.habitLogs = [];
      DATA.habitLogs.push({
        id: 'hl' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        habitId: h.id, childId: c.id, date: TODAY, by: by || 'mom', at: Date.now(),
      });
      if (h.kind === 'penalty') {
        // 扣分只动余额，不动「累计获得 earned」——和兑换扣分保持一致：
        // 孩子挣过的星不该被抹掉，否则勋章/等级会莫名其妙往回退
        c.points = Math.max(0, c.points - n);
        DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: c.id, date: TODAY, title: title, points: -n, at: Date.now() });
      } else {
        awardStars(c, n, title);
      }
      fpAdd('habit', h.title, { childId: c.id, pts: h.kind === 'penalty' ? -n : n });
    } else {
      fpDrop(c.id, 'habit', h.title, TODAY);
      const log = habitLogOn(h.id, c.id, TODAY);
      if (log) {
        tombAdd('habitLogs', log.id);
        DATA.habitLogs = DATA.habitLogs.filter(x => x.id !== log.id);
      }
      if (h.kind === 'penalty') c.points += n;                                  // 扣错的分还回去
      else { c.points = Math.max(0, c.points - n); c.earned = Math.max(0, (c.earned || 0) - n); }
      const i = DATA.pointsHistory.findIndex(x => x.childId === c.id && x.date === TODAY && x.title === title);
      if (i >= 0) DATA.pointsHistory.splice(i, 1);
    }
    saveData(DATA);
  }
  // 孩子端打卡：只能勾奖励项。扣分项让孩子自己按不现实，一律交给妈妈。
  function kidToggleHabit(hid) {
    const c = kidCheck();
    if (!c) return;
    const h = (DATA.habits || []).find(x => x.id === hid);
    if (!h || !habitForKid(h, c)) return;
    if (h.kind === 'penalty') { toast('这条由妈妈来记哦'); return; }
    const on = !habitLogOn(h.id, c.id, TODAY);
    applyHabit(h, c, on, 'kid');
    toast(on ? `+${h.points} 星 · ${h.title}` : '已取消，星星退回啦');
    render();
  }
  // 妈妈端代勾：奖励和扣分都能记，也都能撤销（记错了点一下就退回）
  function momToggleHabit(hid, cid) {
    const h = (DATA.habits || []).find(x => x.id === hid);
    const c = DATA.children.find(x => x.id === cid);
    if (!h || !c) return;
    const on = !habitLogOn(h.id, c.id, TODAY);
    applyHabit(h, c, on, 'mom');
    toast(on ? `${h.kind === 'penalty' ? '-' : '+'}${h.points} 星 · ${c.name}：${h.title}` : `已撤销 · ${c.name}：${h.title}`);
    render();
  }

  function saveHabit() {
    const title = (document.getElementById('h-title').value || '').trim();
    if (!title) { toast('写一下习惯内容'); return; }
    const pts = Math.max(1, Math.min(50, parseInt(document.getElementById('h-points').value) || 2));
    const one = {
      emoji: (document.getElementById('h-emoji').value || '').trim() || '⭐',
      title: title,
      kind: document.getElementById('h-kind').value === 'penalty' ? 'penalty' : 'reward',
      points: pts,
      who: document.getElementById('h-who').value,
      freq: document.getElementById('h-freq').value,
      time: document.getElementById('h-time').value || '',
    };
    const eid = window.__editHabitId;
    if (eid) {
      const h = (DATA.habits || []).find(x => x.id === eid);
      if (h) Object.assign(h, one); // 保留原 id：打卡记录靠 habitId 关联，换 id 就全断链了
      toast('已修改');
    } else {
      if (!DATA.habits) DATA.habits = [];
      DATA.habits.push(Object.assign({ id: 'hb' + Date.now().toString(36) }, one));
      toast('已加入清单');
    }
    window.__editHabitId = null;
    saveData(DATA);
    const m = document.querySelector('.habit-mask'); if (m) m.remove();
    openHabitModal();
    render();
  }
  function delHabit(id) {
    const h = (DATA.habits || []).find(x => x.id === id);
    if (!h) return;
    if (!confirm('删除这条习惯？\n\n' + h.title + '\n\n已经打过的卡和发过的星星不会退回来。')) return;
    tombAdd('habits', id);
    DATA.habits = DATA.habits.filter(x => x.id !== id);
    // 连它的打卡记录一起埋掉，否则删了习惯、记录还在，界面上会冒出没有主人的条目
    (DATA.habitLogs || []).filter(l => l.habitId === id).forEach(l => tombAdd('habitLogs', l.id));
    DATA.habitLogs = (DATA.habitLogs || []).filter(l => l.habitId !== id);
    saveData(DATA);
    const m = document.querySelector('.habit-mask'); if (m) m.remove();
    openHabitModal();
    render();
  }

      <div class="modal">

        <h3>常用习惯</h3>

      </div>`;

  }
  function toggleHabitPreset(i) {
    if (!window.__habitPresetSel) window.__habitPresetSel = new Set();
    const el = document.querySelectorAll('.habit-preset')[i];
    const has = (DATA.habits || []).some(h => h.title === HABIT_PRESETS[i].title);
    if (has) { toast('这条已经在清单里了'); return; }
    if (window.__habitPresetSel.has(i)) window.__habitPresetSel.delete(i);
    else window.__habitPresetSel.add(i);
    if (el) el.classList.toggle('on');
  }
  function addHabitPresets() {
    const selSet = window.__habitPresetSel || new Set();
    if (!selSet.size) { toast('先点几条选中'); return; }
    let n = 0;
    HABIT_PRESETS.forEach((p, i) => {
      if (!selSet.has(i)) return;
      if ((DATA.habits || []).some(h => h.title === p.title)) return; // 同名不重复加
      DATA.habits.push({
        id: 'hb' + Date.now().toString(36) + n,
        emoji: p.emoji, title: p.title, kind: p.kind, points: p.points,
        time: p.time || '', freq: p.freq || 'daily', who: 'both',
      });
      n++;
    });
    saveData(DATA);
    const pm = document.querySelector('.habit-preset-mask'); if (pm) pm.remove();
    const hm = document.querySelector('.habit-mask'); if (hm) hm.remove();
    toast(n ? `已加入 ${n} 条习惯` : '这几条已经在清单里了');
    openHabitModal();
    render();
  }

  // ========== 交互：任务打卡 ==========
  function toggleTask(id) {
    const t = DATA.tasks.find(x => x.id === id);
    if (!t) return;
    const kid = kidCheck();
    const isKid = kid && t.childId === kid.id;
    // 看视频任务：孩子点卡片 = 打开播放器，不能直接勾完（看完才自动打卡）
    if (isKid && !t.done && (t.kind || 'normal') === 'video') { openTaskVideo(id); return; }
    if (isKid && !t.done && (t.kind || 'normal') === 'follow') { openFollow(id); return; }
    if (t.proof) {
      if (isKid) {
        if (t.done) { if (t.proofData) openProofView(t); return; } // 已打卡只能回看凭证，不能取消
        openProofModal(id);
        return;
      }
      // 妈妈端：点击看凭证；没凭证时可直接代勾
      if (t.proofData) { openProofView(t); return; }
    }
    t.done = !t.done;
    if (t.done) {
      t.doneAt = Date.now();
      const k = DATA.children.find(c => c.id === t.childId);
      k.earned = (k.earned || 0) + t.points; k.points += t.points;
      DATA.pointsHistory.unshift({ id: 'h'+Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
      fpAdd('task', t.title, { childId: k.id, pts: t.points });
      toast(`+${t.points} 分 · 已记录给 ${k.name}`);
    } else {
      t.doneAt = null;
      const k = DATA.children.find(c => c.id === t.childId);
      k.points = Math.max(0, k.points - t.points);
      DATA.pointsHistory = DATA.pointsHistory.filter(h => !(h.childId===k.id && h.title===t.title && h.date===(t.date||TODAY)));
      fpDrop(k.id, 'task', t.title, t.date || TODAY);
    }
    saveData(DATA); render();
  }

  // ========== 闹钟提醒引擎 ==========
  function fmtClock(ts) { return ts ? new Date(ts).toTimeString().slice(0, 5) : ''; }
  const REMIND_KEY = 'notified-' + TODAY;
  const notifiedTasks = new Set(JSON.parse(localStorage.getItem(REMIND_KEY) || '[]'));
  function remindTick() {
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const due = DATA.tasks.filter(t => t.date === TODAY && t.remindAt && !t.done && t.remindAt <= hhmm && !notifiedTasks.has(t.id));
    if (!due.length) return;
    due.forEach(t => notifiedTasks.add(t.id));
    try { localStorage.setItem(REMIND_KEY, JSON.stringify([...notifiedTasks])); } catch (e) {}
    const isKid = !!kidCheck();
    const list = due.map(t => ({ t, k: DATA.children.find(c => c.id === t.childId) }));
    showRemindModal(list, isKid);
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('⏰ 打卡时间到！', { body: due.map(t => t.title).join('、') });
      }
    } catch (e) {}
  }
  function showRemindModal(list, isKid) {
    if (document.querySelector('.remind-mask')) return;

  // ========== 凭证打卡：拍照 / 朗读录音 ==========
  let PROOF_STASH = null; // { type:'photo'|'audio', data:dataURL }

  function proofClose() {
    if (REC && REC.state === 'recording') { try { REC.stop(); } catch(e){} }

  function proofPick(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => { img.src = rd.result; };
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.6);
      PROOF_STASH = { type: 'photo', data };
      const pv = document.getElementById('proof-preview');
      if (pv) pv.innerHTML = `<img class="proof-shot" src="${data}" alt="打卡照片">`;
      const ok = document.getElementById('proof-ok');

    rd.readAsDataURL(f);

  async function proofRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      REC = new MediaRecorder(stream);
      const chunks = [];
      REC.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      REC.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        const blob = new Blob(chunks, { type: REC.mimeType || 'audio/webm' });
        const fr = new FileReader();
        fr.onload = () => {
          PROOF_STASH = { type: 'audio', data: fr.result };
          const pv = document.getElementById('proof-preview');
          if (pv) pv.innerHTML = `<audio controls style="width:100%" src="${fr.result}"></audio>`;
          const ok = document.getElementById('proof-ok');
          if (ok) ok.disabled = false;
        };
        fr.readAsDataURL(blob);
      };
      REC.start();
      if (btn) { btn.textContent = '⏹ 录音中…点这里结束'; btn.style.background = 'var(--red-50)'; btn.style.color = 'var(--red-600)'; }
      if (st) st.innerHTML = '<span class="rec-dot"></span>正在录音，大声朗读吧！';
      // 5 分钟自动停
      REC._timer = setTimeout(() => { if (REC && REC.state === 'recording') proofRecStop(); }, 5 * 60 * 1000);
      btn.onclick = proofRecStop;
    } catch (e) {
      if (st) st.textContent = '打不开麦克风，检查权限后重试';
      const fb = document.getElementById('proof-fallback');
      if (fb) fb.style.display = 'block';
    }
  }
  function proofRecStop() {
    if (!REC) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    if (REC._timer) clearTimeout(REC._timer);
    if (REC.state === 'recording') REC.stop();
    if (btn) { btn.textContent = '🔄 重新录一遍'; btn.style.background = ''; btn.style.color = ''; }
    if (st) st.textContent = '录好了！听一听，不满意可以重录';
  }
  function proofManual() { PROOF_STASH = { type: 'audio', data: null }; const ok = document.getElementById('proof-ok'); if (ok) ok.disabled = false; }
  function confirmProof(id) {

  // ========== 单词打卡 ==========
  // ========== 朗读（三级降级：有道真人发音 → 系统语音引擎 → 提示）==========
  // 为什么不用单纯的 speechSynthesis：安卓手机 / 学习机常常没装英文语音包，
  // 调用时不报错但一点声音都没有（用户反馈的"喇叭点了没声音"就是这个）。
  // 所以优先走有道发音接口（标准 mp3、真人发音、任何设备都能响），拿不到再降级系统语音。
  let SPK = { audio: null, lastText: '' };
  function isCn(t) { return /[\u4e00-\u9fa5]/.test(String(t == null ? '' : t)); }
  function speakUrl(text) {
    const q = encodeURIComponent(String(text == null ? '' : text).trim());
    if (!q) return '';
    // type=2 美音；le=zh 中文。中文也能读，语文听写就用它
    return isCn(text)
      ? 'https://dict.youdao.com/dictvoice?audio=' + q + '&le=zh'
      : 'https://dict.youdao.com/dictvoice?audio=' + q + '&type=2';
  }
  function speakStop() {
    try { if (SPK.audio) { SPK.audio.pause(); SPK.audio.currentTime = 0; } } catch (e) {}
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }
  // 系统语音兜底。注意：Chrome 有个已知 bug —— cancel() 之后立刻 speak() 会静默失败，必须延迟一拍
  function speakByTts(text, rate) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    try {
      window.speechSynthesis.cancel();
      setTimeout(function () {
        try {
          const cn = isCn(text);
          const u = new SpeechSynthesisUtterance(text);
          u.lang = cn ? 'zh-CN' : 'en-US';
          u.rate = rate || (cn ? 0.9 : 0.75);
          u.pitch = 1.05; u.volume = 1;
          try {
            const vs = window.speechSynthesis.getVoices() || [];
            const want = vs.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().indexOf(cn ? 'zh' : 'en') === 0);
            if (want.length) u.voice = want[0];
          } catch (e) {}
          u.onerror = function () {};
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }, 120);
    } catch (e) {}
  }
  // opt: { rate, onEnd }  onEnd 在播放结束时回调（听写要用来控制"读几遍、间隔几秒"）
  function speak(text, opt) {
    opt = opt || {};
    const t = String(text == null ? '' : text).trim();
    if (!t) { if (opt.onEnd) opt.onEnd(); return; }
    speakStop();
    SPK.lastText = t;
    let settled = false;
    const giveUp = () => { if (settled) return; settled = true; try { if (SPK.audio) SPK.audio.pause(); } catch (e) {} speakByTts(t, opt.rate); };
    let a = SPK.audio;
    try {
      if (!a) { a = new Audio(); a.preload = 'auto'; SPK.audio = a; }
      a.onplay = () => { settled = true; };
      a.onplaying = () => { settled = true; };
      a.onerror = giveUp;
      a.onended = () => { if (opt.onEnd) opt.onEnd(); };
      a.src = speakUrl(t);
      a.load();
      const p = a.play();
      if (p && p.catch) p.catch(giveUp);
      // 2.5 秒还没出声（网络慢 / 接口挂了）就降级，别让孩子干等
      setTimeout(giveUp, 2500);
    } catch (e) { giveUp(); }
  }
  // 预加载语音列表（安卓首次 getVoices() 常返回空数组，提前取一次兜底时才有得选）
  try {
    if (window.speechSynthesis) {
      const _lv = () => { try { window.speechSynthesis.getVoices(); } catch (e) {} };
      _lv();
      window.speechSynthesis.onvoiceschanged = _lv;
    }
  } catch (e) {}
  function wtSet(wt) { return DATA.wordSets.find(s => s.id === wt.setId) || { title: '词库已删除', words: [] }; }
  // 这一批真正有几个词：轮转后从 wt.offset 开始取，末尾不够时按剩下的算
  function wtBatchSize(wt) {
    const total = (wtSet(wt).words || []).length;
    return Math.max(0, Math.min(wt.count || 0, total - (wt.offset || 0)));
  }
  function wtProgress(wt) {
    const start = wt.offset || 0, n = wtBatchSize(wt), st = wt.wordState || {};
    let c = 0;
    for (let i = start; i < start + n; i++) if (st[i] >= 3) c++;
    return c;
  }
  function wtFirstIncomplete(wt) {
    const start = wt.offset || 0, n = wtBatchSize(wt), st = wt.wordState || {};
    for (let i = start; i < start + n; i++) { if (st[i] < 3) return i; }
    return -1;
  }
  function wqFinish(wt) {
    if (wt.done) return;
    wt.done = true;
    const k = DATA.children.find(c => c.id === wt.childId);
    if (!k) return;
    k.points += wt.points;
    const s = wtSet(wt);
    const n = wtBatchSize(wt);
    DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: k.id, date: TODAY, title: `单词打卡：${s.title} ×${n}`, points: wt.points });
    fpAdd('word', s.title + ' ×' + n, { childId: k.id, pts: wt.points });
    // 轮转：这一批全部掌握 → 计划前进一批；整本走完 → 标记待妈妈处理
    if (wt.planId) wpOnTaskDone(wt);
    saveData(DATA);
    const p = wt.planId ? wpFind(wt.planId) : null;
    toast(p && wpDone(p)
      ? `《${s.title}》整本都学完啦！+${wt.points} 分 🎉 已通知妈妈`
      : `单词任务全部完成！+${wt.points} 分 🎉`);
  }

  // ---- 孩子端：单词任务列表 ----
  function viewKidWords() {
    const c = kidCheck();
    if (!c) { location.hash = 'kid-select'; return ''; }
    const wts = DATA.wordTasks.filter(t => t.childId === c.id && t.date === TODAY);
    return `
      <div class="topbar">
