  <title>乐宝麦宝学习平台</title>
  <style>
    /* ===== 设计令牌 ===== */
    :root {
      --pink-50:#FFF0F5; --pink-100:#FFE0EC; --pink-200:#FFC1D9; --pink-400:#FF6B9D; --pink-600:#D6336C; --pink-800:#A61E4D;
      --orange-50:#FFF4E6; --orange-200:#FFD9A8; --orange-400:#FF9800; --orange-600:#E65100;
      --cyan-50:#E0F7FA; --cyan-200:#80DEEA; --cyan-400:#00BCD4; --cyan-600:#00838F;
      --purple-50:#F3E5F5; --purple-200:#CE93D8; --purple-400:#9C27B0; --purple-600:#6A1B9A;
      --green-50:#E8F5E9; --green-400:#4CAF50; --green-600:#2E7D32;
      --amber-50:#FFF8E1; --amber-400:#FFC107; --amber-600:#FF8F00;
      --red-50:#FFEBEE; --red-400:#EF5350; --red-600:#C62828;
      --indigo-50:#E8EAF6; --indigo-400:#5C6BC0; --indigo-600:#3949AB;
      --teal-50:#E0F2F1; --teal-400:#26A69A; --teal-600:#00695C;
      --gray-50:#FAFAFA; --gray-100:#F5F5F5; --gray-200:#EEEEEE; --gray-400:#BDBDBD; --gray-600:#757575; --gray-800:#424242; --gray-900:#212121;
      --bg-page:#FAFAFA; --bg-card:#FFFFFF; --border:#E5E5E5; --border-soft:#F0F0F0;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
      --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; color:var(--gray-900); background:var(--bg-page); font-size:14px; line-height:1.5; }
    button { font-family: inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }
    input { font-family: inherit; font-size:14px; }

    /* ===== 应用容器（手机框 / 学习机大屏自适应） ===== */
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg-page); position: relative; padding-bottom: 76px; }

    /* ===== 顶部导航 ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--bg-card);
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar h1 { margin:0; font-size: 17px; font-weight: 600; }
    .topbar .actions { display:flex; gap:8px; }
    .icon-btn { width:36px; height:36px; border-radius: 10px; display:flex; align-items:center; justify-content:center; background: var(--gray-100); }
    .icon-btn svg { width:18px; height:18px; }

    /* ===== 底部 Tab Bar ===== */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      max-width: 480px; width: 100%;
      background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border-soft);
      display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding: 6px 0; color: var(--gray-600); }
    .tab.active { color: var(--pink-600); }
    .tab svg { width:22px; height:22px; }
    .tab span { font-size: 11px; }

    /* ===== 通用卡片 / 容器 ===== */
    .page { padding: 12px 16px 16px; }
    .section { background: var(--bg-card); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px; border: 0.5px solid var(--border-soft); }
    .section h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display:flex; align-items:center; justify-content: space-between; }
    .section h3 .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 500; }

    /* ===== 入口页 ===== */
    .entry-hero {
      background: linear-gradient(135deg, var(--pink-400) 0%, #C2185B 100%);
      color: #fff; padding: 48px 24px 64px; text-align: center;
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
    }
    .entry-hero .logo {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
      background: rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .entry-hero h2 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
    .entry-hero p { margin: 0; opacity: 0.9; font-size: 13px; }

    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; margin-top: -32px; }
    .role-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px 16px;
      border: 0.5px solid var(--border-soft); text-align: center; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .role-card:active { transform: scale(0.97); }
    .role-card .icon { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; }
    .role-card.mom .icon { background: var(--purple-50); color: var(--purple-600); }
    .role-card.kid .icon { background: var(--pink-50); color: var(--pink-600); }
    .role-card h4 { margin: 0 0 2px; font-size: 15px; }
    .role-card p { margin: 0; font-size: 12px; color: var(--gray-600); }
    .role-card svg { width: 28px; height: 28px; }

    /* ===== 密码 / PIN 输入 ===== */
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 0 auto; }
    .pin-key {
      aspect-ratio: 1.6/1; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border);
      font-size: 22px; font-weight: 500;
    }
    .pin-key:active { background: var(--gray-100); }
    .pin-display { display: flex; justify-content: center; gap: 12px; margin: 24px 0 32px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gray-200); }
    .pin-dot.filled { background: var(--pink-400); }
    .pin-title { text-align: center; margin: 32px 0 4px; font-size: 18px; font-weight: 600; }
    .pin-sub { text-align: center; margin: 0 0 24px; color: var(--gray-600); font-size: 13px; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px; margin-bottom: 24px; }
    .avatar-cell {
      aspect-ratio: 1/1; border-radius: var(--radius-md);
      background: var(--gray-100); display:flex; align-items:center; justify-content:center;
      font-size: 28px; cursor: pointer; border: 2px solid transparent;
    }
    .avatar-cell.active { border-color: var(--pink-400); background: var(--pink-50); }

    /* ===== 单词打卡 ===== */
    .wq-bar { height: 8px; border-radius: 4px; background: var(--gray-100); overflow: hidden; }
    .wq-bar-in { height: 100%; background: linear-gradient(90deg, var(--pink-400), var(--pink-600)); border-radius: 4px; transition: width .3s; }
    .wq-done { background: var(--green-50); color: var(--green-600); border-radius: var(--radius-md); padding: 12px; text-align: center; font-weight: 500; }
    .wq-word-card { background: linear-gradient(135deg, var(--pink-400), #C2185B); color: #fff; border-radius: var(--radius-lg); padding: 28px 16px; text-align: center; margin-bottom: 12px; }
    .wq-word-card .w { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .wq-word-card .cn { font-size: 15px; opacity: .92; margin-top: 4px; }
    .wq-sound-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.25); color: #fff; display: flex; align-items: center; justify-content: center; margin: 14px auto 0; font-size: 28px; }
    .wq-sound-btn:active { transform: scale(.92); }
    .wq-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .wq-choice { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 8px; font-size: 15px; text-align: center; }
    .wq-choice:active { transform: scale(.97); }
    .wq-choice.ok { border-color: var(--green-400); background: var(--green-50); color: var(--green-600); }
    .wq-choice.bad { border-color: #ef5350; background: #FFEBEE; color: #C62828; animation: wqshake .3s; }
    @keyframes wqshake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .wq-step-tag { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 8px; background: var(--pink-50); color: var(--pink-600); font-weight: 600; margin-bottom: 8px; }
    .wq-spell { width: 100%; text-align: center; font-size: 22px; letter-spacing: 3px; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); text-transform: lowercase; }
    .wq-spell.bad { border-color: #ef5350; animation: wqshake .3s; }
    .wq-hint { text-align: center; color: var(--gray-600); font-size: 12px; margin-top: 8px; }

    /* ===== 星星乐园 ===== */
    .fun-hero { background: linear-gradient(135deg, #7C4DFF, #448AFF); color:#fff; border-radius: var(--radius-lg); padding:18px 16px; margin-bottom:12px; text-align:center; }
    .fun-hero .big { font-size:26px; font-weight:700; }
    .fun-hero .gate { font-size:12px; opacity:.92; margin-top:4px; }
    .game-card { display:flex; align-items:center; gap:12px; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-lg); padding:14px; margin-bottom:10px; cursor:pointer; }
    .game-card:active { transform: scale(.98); }
    .game-card .gicon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--purple-50); }
    .game-card .ginfo { flex:1; }
    .game-card .ginfo h4 { margin:0; font-size:15px; }
    .game-card .ginfo p { margin:2px 0 0; font-size:12px; color:var(--gray-600); }
    .game-card .cost { font-size:12px; font-weight:600; color:var(--amber-600); background:var(--amber-50); border-radius:8px; padding:4px 8px; white-space:nowrap; }
    .wheel-wrap { position:relative; width:250px; height:250px; margin:16px auto 6px; }
    .wheel { width:100%; height:100%; border-radius:50%; border:8px solid #fff; box-shadow:0 4px 16px rgba(0,0,0,.18); transition: transform 3.2s cubic-bezier(.15,.85,.25,1); }
    .wheel-pointer { position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:26px; z-index:2; }
    .wheel-label { position:absolute; left:50%; top:50%; font-size:12px; font-weight:600; color:#fff; transform-origin:0 0; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .wheel-hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:2; }
    .mine-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:3px; max-width:340px; margin:12px auto; }
    .mine-cell { aspect-ratio:1/1; border-radius:6px; background:linear-gradient(135deg,#B0BEC5,#78909C); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; cursor:pointer; transition: transform .1s; }
    .mine-cell:active { transform: scale(.92); }
    .mine-cell.open { background:var(--bg-card); border:0.5px solid var(--border-soft); cursor:default; }
    .mine-cell.boom { background:var(--red-50); }
    .mine-cell.mn-1 { color:#1976D2; } .mine-cell.mn-2 { color:#388E3C; } .mine-cell.mn-3 { color:#D32F2F; } .mine-cell.mn-4 { color:#6A1B9A; }
    .mine-cell.mn-5 { color:#E65100; } .mine-cell.mn-6 { color:#00838F; } .mine-cell.mn-7 { color:#37474F; } .mine-cell.mn-8 { color:#7B1FA2; }
    .diff-row { display:flex; gap:8px; margin-bottom:10px; }
    .diff-pill { flex:1; text-align:center; padding:9px 0; border-radius:14px; background:var(--bg-card); border:1.5px solid var(--border-soft); font-size:13px; font-weight:600; cursor:pointer; }
    .diff-pill.on { background:var(--purple-50); border-color:var(--purple-400); color:var(--purple-600); }
    .mem-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:330px; margin:12px auto; }
    .mem-card { aspect-ratio:3/4; border-radius:10px; background:linear-gradient(135deg,var(--purple-200),var(--purple-400)); display:flex; align-items:center; justify-content:center; font-size:26px; color:transparent; cursor:pointer; transition: transform .15s; }
    .mem-card:active { transform: scale(.95); }
    .mem-card.open { background:var(--bg-card); border:1.5px solid var(--purple-200); color:inherit; }
    .mem-card.done { background:var(--green-50); border:1.5px solid var(--green-400); color:inherit; }
    .game-status { text-align:center; font-size:14px; font-weight:600; margin:8px 0; }
    .proof-badge { display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--amber-50); color:var(--amber-600); font-weight:600; }
    .proof-shot { width:100%; max-height:280px; object-fit:contain; border-radius:12px; background:var(--gray-100); }
    .rec-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#E53935; animation:blink 1s infinite; margin-right:6px; }
    @keyframes blink { 50% { opacity:.15; } }
    .game-score-bar { display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:0.5px solid var(--border-soft); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:10px; font-size:13px; }

    /* ===== 任务卡片 ===== */
    .task { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); background: var(--gray-50); margin-bottom: 8px; cursor: pointer; }
    .task:last-child { margin-bottom: 0; }
    .task .checkbox {
      width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--gray-400);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .task.done .checkbox { background: var(--green-400); border-color: var(--green-400); }
    .task.done .checkbox svg { color: #fff; }
    .task .title { flex:1; }
    .task .title .name { font-size: 14px; font-weight: 500; }
    .task .title .meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .task.done .name { text-decoration: line-through; color: var(--gray-600); }
    .task .pts { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--amber-50); color: var(--amber-600); font-weight: 500; }
    .task.done .pts { background: var(--green-50); color: var(--green-600); }

    /* ===== 学科色块 ===== */
    .subject-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .subject-card {
      border-radius: var(--radius-md); padding: 14px; color: #fff; cursor: pointer;
      position: relative; overflow: hidden; min-height: 84px;
    }
    .subject-card .emoji { font-size: 24px; }
    .subject-card .name { font-weight: 600; margin-top: 4px; font-size: 14px; }
    .subject-card .count { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .subject-card.s-pink { background: linear-gradient(135deg, #FF6B9D, #D6336C); }
    .subject-card.s-orange { background: linear-gradient(135deg, #FF9800, #E65100); }
    .subject-card.s-cyan { background: linear-gradient(135deg, #00BCD4, #00838F); }
    .subject-card.s-purple { background: linear-gradient(135deg, #9C27B0, #6A1B9A); }
    .subject-card.s-green { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
    .subject-card.s-amber { background: linear-gradient(135deg, #FFC107, #FF8F00); }
    .subject-card.s-red { background: linear-gradient(135deg, #EF5350, #C62828); }
    .subject-card.s-indigo { background: linear-gradient(135deg, #5C6BC0, #3949AB); }
    .subject-card.s-teal { background: linear-gradient(135deg, #26A69A, #00695C); }
    /* 旧配色类保留（勋章等处仍在用） */
    .subject-card.s-chinese { background: linear-gradient(135deg, #FF6B9D, #D6336C); }
    .subject-card.s-math { background: linear-gradient(135deg, #FF9800, #E65100); }
    .subject-card.s-english { background: linear-gradient(135deg, #00BCD4, #00838F); }
    .subject-card.s-science { background: linear-gradient(135deg, #9C27B0, #6A1B9A); }
    .subject-card.s-music { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
    .subject-card.s-art { background: linear-gradient(135deg, #FFC107, #FF8F00); }

    /* ===== 资源项 ===== */
    .resource {
      display: flex; gap: 12px; padding: 10px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border-soft); margin-bottom: 8px;
      align-items: center;
    }
    .resource .thumb {
      width: 56px; height: 56px; border-radius: var(--radius-sm); background: var(--gray-100);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray-600);
    }
    .resource .thumb svg { width: 24px; height: 24px; }
    .resource .info { flex: 1; min-width: 0; }
    .resource .info .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resource .info .meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .resource .badge-subj { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }

    /* ===== 妈妈后台 —— 孩子打卡卡片 ===== */
    .kid-row {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md);
      background: var(--gray-50); margin-bottom: 8px;
    }
    .kid-row .avatar { width: 40px; height: 40px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 20px; background: var(--pink-50); }
    .kid-row .info { flex: 1; }
    .kid-row .info .name { font-weight: 600; font-size: 14px; }
    .kid-row .info .progress { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
    .kid-row .progress-bar { width: 80px; height: 4px; background: var(--gray-200); border-radius: 2px; overflow: hidden; margin-top: 4px; }
    .kid-row .progress-bar div { height: 100%; background: var(--pink-400); }
    .kid-row .pts { font-size: 14px; font-weight: 600; color: var(--pink-600); }

    /* ===== 奖励视频 ===== */
    .reward {
      display: flex; gap: 12px; padding: 12px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 0.5px solid var(--border-soft); margin-bottom: 8px;
      align-items: center; position: relative;
    }
    .reward.locked { opacity: 0.6; }
    .reward.locked::after {
      content: '🔒'; position: absolute; top: 50%; right: 16px; transform: translateY(-50%); font-size: 20px;
    }
    .reward .thumb {
      width: 64px; height: 64px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--purple-50), var(--pink-50));
      display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
    }
    .reward .info { flex: 1; min-width: 0; }
    .reward .info .name { font-size: 14px; font-weight: 500; }
    .reward .info .threshold { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

    /* ===== 顶部数据卡 ===== */
    .stat-card {
      background: linear-gradient(135deg, var(--pink-400), var(--purple-400));
      color: #fff; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 12px;
    }
    .stat-card .label { font-size: 12px; opacity: 0.9; }
    .stat-card .big { font-size: 32px; font-weight: 600; margin: 4px 0 8px; }
    .stat-card .meta { font-size: 12px; opacity: 0.9; display:flex; gap: 16px; }
    .stat-card .meta div span { font-weight: 600; }

    /* ===== FAB ===== */
    .fab {
      position: fixed; bottom: 90px; right: 16px; width: 52px; height: 52px;
      border-radius: 50%; background: var(--pink-400); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(255,107,157,0.4); z-index: 40;
    }
    .fab svg { width: 24px; height: 24px; }

    /* ===== 表单 ===== */
    .field { margin-bottom: 12px; }

  function migrateOld(d) {

    (d.resources || []).forEach(r => { if (map[r.subject]) r.subject = map[r.subject]; });

  function loadData() {
    try {
      const raw = localStorage.getItem(LS_KEY);

    saveData(DEFAULT_DATA);

  }
  function saveData(d) { localStorage.setItem(LS_KEY, JSON.stringify(d)); scheduleSyncPush(); }

  const SYNC = {

  function normalizeData(d) {
    if (!d) return d;

    (d.resources || []).forEach(r => {

    SYNC.busy = false;
    if (SYNC.pending) doSyncPush();

  // ========== 视图渲染 ==========
  function render() {
    const app = document.getElementById('app');
    const route = location.hash.slice(1).split('?')[0] || 'entry';
    const [, q] = location.hash.split('?');
    const params = Object.fromEntries(new URLSearchParams(q || ''));

    const routes = {
      entry:         viewEntry,
      'mom-pin':     viewMomPin,
      'mom-today':   viewMomToday,
      'mom-resources':viewMomResources,
      'mom-rewards': viewMomRewards,
      'mom-words':   viewMomWords,
      'mom-settings':viewMomSettings,
      'kid-select':  viewKidSelect,
      'kid-pin':     viewKidPin,
      'kid-tasks':   viewKidTasks,
      'kid-resources':viewKidResources,
      'kid-rewards': viewKidRewards,
      'kid-words':   viewKidWords,
      'kid-word-quiz': viewWordQuiz,
      'kid-fun':     viewKidFun,
      'kid-mine':    viewKidMine,
      'kid-memory':  viewKidMemory,
      'subject':     viewSubject,
    };

    const fn = routes[route] || viewEntry;
    app.innerHTML = fn(params);
    bindGlobal();
  }

  function bindGlobal() {
    document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
      if (b.dataset.to) location.hash = b.dataset.to;   // 显式指定返回目标（不依赖浏览器历史）
      else history.back();
    });
    if (typeof window.__afterRender === 'function') window.__afterRender();
  }

  function getDailyQuote() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    return DAILY_QUOTES[(dayOfYear - 1) % DAILY_QUOTES.length];
  }

            const k = DATA.children.find(c => c.id === t.childId);
            const res = taskRes(t);
            return `
              <div class="task ${t.done?'done':''}" onclick="toggleTask('${t.id}')">
                <div class="checkbox">${t.done?ICN.check:''}</div>
                <div class="title">
                  <div class="name">${esc(t.title)}</div>
                  <div class="meta">${k.avatar} ${esc(k.name)}${t.groupId&&DATA.tasks.filter(x=>x.groupId===t.groupId).length>1?` · 📅 连排${DATA.tasks.filter(x=>x.groupId===t.groupId).length}天`:''}${t.remindAt?` · ⏰ ${t.remindAt}`:''}${t.done&&t.doneAt?` · ✅ ${fmtClock(t.doneAt)} 完成`:''}${t.proof?` · <span class="proof-badge" onclick="viewTaskProof(event,'${t.id}')">${t.proof==='photo'?'📷':'🎙'}${t.proofData?' 凭证✓':' 待交'}</span>`:''}${res?` · 📎 <span style="color:var(--pink-600)" onclick="openTaskRes(event,'${t.id}')">${esc(res.title)}</span>`:''}</div>

          <h3>积分记录 <span class="badge">今日</span></h3>

  // ========== 交互：任务打卡 ==========
  function toggleTask(id) {
    const t = DATA.tasks.find(x => x.id === id);
    if (!t) return;
    const kid = kidCheck();
    const isKid = kid && t.childId === kid.id;
    if (t.proof) {
      if (isKid) {
        if (t.done) { if (t.proofData) openProofView(t); return; } // 已打卡只能回看凭证，不能取消
        openProofModal(id);
        return;
      }
      // 妈妈端：点击看凭证；没凭证时可直接代勾
      if (t.proofData) { openProofView(t); return; }
    }
    t.done = !t.done;
    if (t.done) {
      t.doneAt = Date.now();
      const k = DATA.children.find(c => c.id === t.childId);
      k.points += t.points;
      DATA.pointsHistory.unshift({ id: 'h'+Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
      toast(`+${t.points} 分 · 已记录给 ${k.name}`);
    } else {
      t.doneAt = null;
      const k = DATA.children.find(c => c.id === t.childId);
      k.points = Math.max(0, k.points - t.points);
      DATA.pointsHistory = DATA.pointsHistory.filter(h => !(h.childId===k.id && h.title===t.title && h.date===(t.date||TODAY)));
    }
    saveData(DATA); render();
  }

  // ========== 闹钟提醒引擎 ==========
  function fmtClock(ts) { return ts ? new Date(ts).toTimeString().slice(0, 5) : ''; }
  const REMIND_KEY = 'notified-' + TODAY;
  const notifiedTasks = new Set(JSON.parse(localStorage.getItem(REMIND_KEY) || '[]'));
  function remindTick() {
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const due = DATA.tasks.filter(t => t.date === TODAY && t.remindAt && !t.done && t.remindAt <= hhmm && !notifiedTasks.has(t.id));
    if (!due.length) return;
    due.forEach(t => notifiedTasks.add(t.id));
    try { localStorage.setItem(REMIND_KEY, JSON.stringify([...notifiedTasks])); } catch (e) {}
    const isKid = !!kidCheck();
    const list = due.map(t => ({ t, k: DATA.children.find(c => c.id === t.childId) }));
    showRemindModal(list, isKid);
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('⏰ 打卡时间到！', { body: due.map(t => t.title).join('、') });
      }
    } catch (e) {}
  }
  function showRemindModal(list, isKid) {
    if (document.querySelector('.remind-mask')) return;
    const modal = document.createElement('div');
    modal.className = 'modal-mask remind-mask';
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <div style="font-size:40px;text-align:center">⏰</div>
        <h3 style="text-align:center">打卡时间到！</h3>
        ${list.map(({ t, k }) => `
          <div class="task" style="margin-bottom:8px">
            <div class="title"><div class="name">${esc(t.title)}</div><div class="meta">${k ? k.avatar + ' ' + esc(k.name) : ''} · ${t.remindAt} 提醒</div></div>
            ${isKid ? `<button class="btn-primary" style="padding:6px 14px;white-space:nowrap" onclick="document.querySelector('.remind-mask').remove();location.hash='kid-tasks'">去打卡 ▶</button>` : ''}
          </div>`).join('')}
        <div class="btn-row" style="margin-top:10px"><button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">知道了</button></div>
      </div>`;
    document.getElementById('modal-root').appendChild(modal);
  }
  if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (e) {} }
  setInterval(remindTick, 30 * 1000);
  setTimeout(remindTick, 2500);

  // ========== 凭证打卡：拍照 / 朗读录音 ==========
  let PROOF_STASH = null; // { type:'photo'|'audio', data:dataURL }
  let REC = null;
  function openProofModal(id) {
    const t = DATA.tasks.find(x => x.id === id);
    if (!t || t.done) return;
    const needPhoto = t.proof === 'photo';
    PROOF_STASH = null;
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="proofClose()">✕</button>
        <h3>${needPhoto ? '📷 拍照打卡' : '🎙 朗读打卡'}</h3>
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">${esc(t.title)}</p>
        ${needPhoto ? `
          <label class="btn-secondary" style="display:block;text-align:center;width:100%;cursor:pointer;padding:12px 0">
            📷 现在拍一张 / 从相册选
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="proofPick(this)">
          </label>
          <div id="proof-preview" style="margin-top:10px"></div>
        ` : `
          <button id="rec-btn" class="btn-secondary" style="width:100%;padding:12px 0" onclick="proofRec()">🎙 点我开始朗读录音</button>
          <div id="rec-status" style="text-align:center;font-size:13px;color:var(--gray-600);margin-top:8px"></div>
          <div id="proof-preview" style="margin-top:10px"></div>

  function proofClose() {
    if (REC && REC.state === 'recording') { try { REC.stop(); } catch(e){} }

    document.querySelectorAll('.modal-mask').forEach(m => m.remove());
  }
  function proofPick(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const img = new Image();
    const rd = new FileReader();
    rd.onload = () => { img.src = rd.result; };
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL('image/jpeg', 0.6);
      PROOF_STASH = { type: 'photo', data };
      const pv = document.getElementById('proof-preview');
      if (pv) pv.innerHTML = `<img class="proof-shot" src="${data}" alt="打卡照片">`;
      const ok = document.getElementById('proof-ok');
      if (ok) ok.disabled = false;
    };
    rd.readAsDataURL(f);
  }
  async function proofRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      REC = new MediaRecorder(stream);
      const chunks = [];
      REC.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      REC.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        const blob = new Blob(chunks, { type: REC.mimeType || 'audio/webm' });
        const fr = new FileReader();
        fr.onload = () => {
          PROOF_STASH = { type: 'audio', data: fr.result };
          const pv = document.getElementById('proof-preview');
          if (pv) pv.innerHTML = `<audio controls style="width:100%" src="${fr.result}"></audio>`;
          const ok = document.getElementById('proof-ok');
          if (ok) ok.disabled = false;
        };
        fr.readAsDataURL(blob);
      };
      REC.start();
      if (btn) { btn.textContent = '⏹ 录音中…点这里结束'; btn.style.background = 'var(--red-50)'; btn.style.color = 'var(--red-600)'; }
      if (st) st.innerHTML = '<span class="rec-dot"></span>正在录音，大声朗读吧！';
      // 5 分钟自动停
      REC._timer = setTimeout(() => { if (REC && REC.state === 'recording') proofRecStop(); }, 5 * 60 * 1000);
      btn.onclick = proofRecStop;
    } catch (e) {
      if (st) st.textContent = '打不开麦克风，检查权限后重试';
      const fb = document.getElementById('proof-fallback');
      if (fb) fb.style.display = 'block';
    }
  }
  function proofRecStop() {
    if (!REC) return;
    const btn = document.getElementById('rec-btn');
    const st = document.getElementById('rec-status');
    if (REC._timer) clearTimeout(REC._timer);
    if (REC.state === 'recording') REC.stop();
    if (btn) { btn.textContent = '🔄 重新录一遍'; btn.style.background = ''; btn.style.color = ''; }
    if (st) st.textContent = '录好了！听一听，不满意可以重录';

  function buildTransOptions(s, wi) {
    const pool = s.words.filter((_, i) => i !== wi).map(x => x.cn);
    const opts = [s.words[wi]];
    while (opts.length < 4 && pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      opts.push({ cn: pool.splice(idx, 1)[0] });
    }
    // 洗牌
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    return opts;
  }

    { label: '再来一次', pts: 0, again: true, w: 10 }, { label: '+20★', pts: 20, w: 5 },
    { label: '+3★',  pts: 3,  w: 18 }, { label: '+8★',  pts: 8,  w: 10 },
  ];
  const WHEEL_COLORS = ['#F06292','#BA68C8','#4DD0E1','#FFB74D','#81C784','#9575CD','#FF8A65','#4FC3F7'];
  let wheelRot = 0, wheelBusy = false;
  function wheelGradient() {
    return 'conic-gradient(' + WHEEL_COLORS.map((c, i) => `${c} ${i*45}deg ${(i+1)*45}deg`).join(',') + ')';
  }
  function spinWheel() {
    if (wheelBusy) return;
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (c.points < 10) { toast('星星不够啦，先去打卡赚星星吧 ⭐'); return; }
    c.points -= 10; saveData(DATA);
    wheelBusy = true; render();
    const total = WHEEL_SEGS.reduce((a, s) => a + s.w, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < WHEEL_SEGS.length; i++) { r -= WHEEL_SEGS[i].w; if (r <= 0) { idx = i; break; } }
    const desired = 360 - (idx * 45 + 22.5);
    const delta = ((desired - wheelRot) % 360 + 360) % 360 + 1800;
    wheelRot += delta;
    const el = document.getElementById('wheel');
    if (el) el.style.transform = `rotate(${wheelRot}deg)`;
    setTimeout(() => {
      wheelBusy = false;
      const seg = WHEEL_SEGS[idx];
      if (seg.again) { c.points += 10; saveData(DATA); toast('🎡 再来一次！星星已退回'); }
      else if (seg.pts > 0) { awardStars(c, seg.pts, `幸运转盘中奖 ${seg.pts} 星`); toast(`🎉 恭喜抽中 ${seg.pts} 颗星星！`); }
      else toast('😅 谢谢参与，明天再来');
      render();
    }, 3350);
  }

  // ---- 扫雷 ----
  let MINE = null;
  let MINE_DIFF = 'easy';
  const MINE_CFG = {
    easy:   { label: '🙂 小雷区', size: 8,  mines: 8,  reward: 5 },
    normal: { label: ' 普通',   size: 10, mines: 15, reward: 8 },
    hard:   { label: '😤 大雷区', size: 12, mines: 24, reward: 12 },
  };
  function viewKidMine() {
    const c = kidCheck();
    if (!c) { location.hash = 'kid-select'; return ''; }
    const ok = kidTasksDone(c);
    const cfg = MINE_CFG[MINE_DIFF];
    MINE = null;
    return `
      <div class="topbar">
        <button class="icon-btn" onclick="location.hash='kid-fun'">${ICN.back}</button>
        <h1>💣 扫雷小勇士</h1>
        <div class="actions"><div class="icon-btn" style="background:var(--amber-50);color:var(--amber-600);font-size:13px;font-weight:600">★ ${c.points}</div></div>
      </div>
      <div class="page">
        <div class="diff-row">
          ${Object.entries(MINE_CFG).map(([k, v]) => `
            <div class="diff-pill ${k === MINE_DIFF ? 'on' : ''}" onclick="MINE_DIFF='${k}';MINE=null;render()">${v.label}<br><span style="font-size:11px;font-weight:500">${v.size}×${v.size} · ${v.mines}雷 · ${v.reward}★</span></div>
          `).join('')}
        </div>
        <div class="game-score-bar"><span>💣 地雷 <b id="mine-left">${cfg.mines}</b> 颗</span><span>已翻开 <b id="mine-open">0</b> 格</span></div>
        <div class="mine-grid" id="mine-grid" style="max-width:${cfg.size >= 12 ? 360 : cfg.size >= 10 ? 350 : 340}px">
          ${Array.from({length: cfg.size * cfg.size}, (_, i) => `<div class="mine-cell" id="mc${i}" onclick="tapMine(${i})"></div>`).join('')}
        </div>
        <div class="game-status" id="mine-status">${ok ? `翻开所有安全的格子就赢！小心 ${cfg.mines} 颗雷 💣` : FUN_GATE}</div>
        ${ok ? `<button id="mine-flagbtn" class="btn-secondary" style="width:100%;margin-bottom:8px" onclick="toggleFlagMode()">🚩 插旗模式：关</button>
               <button class="btn-primary" style="width:100%" onclick="startMine()">▶ 开始（消耗 5★）</button>
               <p class="wq-hint">先点「开始」，再翻开格子。数字 = 周围有几颗雷；觉得是雷就开插旗模式做标记</p>`
            : '<button class="btn-secondary" style="width:100%" onclick="location.hash=\'kid-tasks\'">先去打卡 ▶</button>'}
      </div>
      ${kidTabBar('fun')}
    `;
  }
  function startMine() {
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (MINE) return;
    if (c.points < 5) { toast('星星不够啦（需要 5★）⭐'); return; }
    c.points -= 5; saveData(DATA);
    const cfg = MINE_CFG[MINE_DIFF];
    const total = cfg.size * cfg.size;
    const cells = Array.from({length: total}, (_, i) => i);
    const mines = new Set();
    while (mines.size < cfg.mines) mines.add(cells[Math.floor(Math.random() * total)]);
    MINE = { size: cfg.size, mines: new Set(mines), open: new Set(), flags: new Set(), over: false, flagMode: false, first: true, reward: cfg.reward };
    const st = document.getElementById('mine-status');
    if (st) st.textContent = '翻开一个格子开始吧！数字表示周围有几颗雷';
    const fb = document.getElementById('mine-flagbtn');
    if (fb) fb.style.display = 'block';
  }
  function toggleFlagMode() {
    if (!MINE || MINE.over) return;
    MINE.flagMode = !MINE.flagMode;
    const fb = document.getElementById('mine-flagbtn');
    if (fb) { fb.textContent = `🚩 插旗模式：${MINE.flagMode ? '开' : '关'}`; fb.style.background = MINE.flagMode ? 'var(--amber-50)' : ''; fb.style.color = MINE.flagMode ? 'var(--amber-600)' : ''; }
  }
  function mineAround(i) {
    const S = MINE.size;
    const r = Math.floor(i / S), col = i % S;
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = col + dc;
      if (nr >= 0 && nr < S && nc >= 0 && nc < S && MINE.mines.has(nr * S + nc)) n++;
    }
    return n;
  }
  function revealMine(i) {
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    MINE.open.add(i);
    const n = mineAround(i);
    el.classList.add('open');
    if (n > 0) { el.textContent = n; el.classList.add('mn-' + n); }
    else {
      const S = MINE.size;
      const r = Math.floor(i / S), col = i % S;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = col + dc;
        if (nr >= 0 && nr < S && nc >= 0 && nc < S) revealMine(nr * S + nc);
      }
    }
  }
  function tapMine(i) {
    if (!MINE || MINE.over) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    if (MINE.flagMode) {
      if (MINE.open.has(i)) return;
      if (MINE.flags.has(i)) { MINE.flags.delete(i); el.classList.remove('open'); el.textContent = ''; }
      else { MINE.flags.add(i); el.classList.add('open'); el.textContent = '🚩'; }
      return;
    }
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const total = MINE.size * MINE.size;
    const mineCount = MINE.mines.size;
    if (MINE.first && MINE.mines.has(i)) {
      MINE.mines.delete(i);
      for (let j = 0; j < total; j++) { if (!MINE.mines.has(j) && j !== i) { MINE.mines.add(j); break; } }
    }
    MINE.first = false;
    if (MINE.mines.has(i)) {
      MINE.over = true;
      el.classList.add('open', 'boom'); el.textContent = '💣';
      MINE.mines.forEach(m => { const me = document.getElementById('mc' + m); if (me) { me.classList.add('open'); if (m !== i) me.textContent = '💣'; } });
      const st = document.getElementById('mine-status');
      if (st) st.textContent = '💥 踩到雷啦！别灰心，再开一局～';
      MINE = null;
      return;
    }
    revealMine(i);
    const oc = document.getElementById('mine-open');
    if (oc) oc.textContent = MINE.open.size;
    if (MINE.open.size === total - mineCount) {
      MINE.over = true;
      const st = document.getElementById('mine-status');
      if (st) st.textContent = `🎉 太厉害了！所有安全格子都翻开了，奖励 ${MINE.reward}★`;
      const reward = MINE.reward; MINE = null;
      const c = kidCheck();
      if (c) { awardStars(c, reward, '扫雷通关奖励'); toast(`扫雷通关 +${reward}★ 🎉`); render(); }
    }
  }

  // ---- 记忆翻翻乐（三档难度 + 步数限制） ----
  let MEM = null;
  let MEM_DIFF = 'normal';
  const MEM_EMOJIS = ['🐷', '🐶', '🌟', '🌈', '🍎', '🚀', '🦋', '🍦', '🎈', '🐟', '🐼', '🌸', '⚽', '🍉', '🐝', '🎨', '🌻', '🐧', '🍩', '🦊'];
  const MEM_CFG = {
    easy:   { label: '🙂 简单', pairs: 10, limit: 25, reward: 5 },

  function viewKidMemory() {

    return `

          `).join('')}
        </div>
        <div class="game-score-bar"><span>翻牌 <b id="mem-moves">0</b>/${cfg.limit} 次</span><span>配对 <b id="mem-pairs">0</b>/${cfg.pairs}</span></div>
        <div class="mem-grid" id="mem-grid"></div>
        <div class="game-status" id="mem-status">${ok ? `选好难度，${cfg.pairs} 对图案 ${cfg.limit} 步内配完就赢！` : FUN_GATE}</div>
        ${ok ? `<button class="btn-primary" style="width:100%" onclick="startMem()">▶ 开始（消耗 5★）</button>
               <p class="wq-hint">步数用完就失败哦，记住每张牌的位置～</p>`
            : '<button class="btn-secondary" style="width:100%" onclick="location.hash=\'kid-tasks\'">先去打卡 ▶</button>'}
      </div>
      ${kidTabBar('fun')}
    `;
  }
  function startMem() {
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (c.points < 5) { toast('星星不够啦（需要 5★）⭐'); return; }
    c.points -= 5; saveData(DATA);
    const cfg = MEM_CFG[MEM_DIFF];
    const picked = [...MEM_EMOJIS].sort(() => Math.random() - 0.5).slice(0, cfg.pairs);
    const deck = [...picked, ...picked].sort(() => Math.random() - 0.5);
    MEM = { cards: deck.map(e => ({ e, open: false, done: false })), first: null, lock: false, moves: 0, pairs: 0, limit: cfg.limit, reward: cfg.reward };
    const grid = document.getElementById('mem-grid');
    if (grid) { grid.style.gridTemplateColumns = `repeat(${cfg.pairs >= 20 ? 5 : 4},1fr)`; grid.style.fontSize = cfg.pairs >= 20 ? '20px' : ''; }
    renderMem();
    const st = document.getElementById('mem-status');
    if (st) st.textContent = `翻出两张一样的图案配对！${cfg.limit} 步内完成`;
  }
  function renderMem() {
    const grid = document.getElementById('mem-grid');
    if (!grid || !MEM) return;
    grid.innerHTML = MEM.cards.map((cd, i) =>
      `<div class="mem-card ${cd.done ? 'done' : cd.open ? 'open' : ''}" onclick="clickMem(${i})">${cd.e}</div>`
    ).join('');
    const m = document.getElementById('mem-moves'), p = document.getElementById('mem-pairs');
    if (m) m.textContent = MEM.moves;
    if (p) p.textContent = MEM.pairs;
  }
  function clickMem(i) {
    if (!MEM || MEM.lock) return;
    const cd = MEM.cards[i];
    if (cd.done || cd.open) return;
    cd.open = true;
    if (MEM.first === null) { MEM.first = i; renderMem(); return; }
    const fi = MEM.first;
    MEM.moves++; MEM.first = null;
    if (MEM.cards[fi].e === cd.e) {
      MEM.cards[fi].done = true; cd.done = true;
      MEM.cards[fi].open = false; cd.open = false;
      MEM.pairs++;
      renderMem();
      if (MEM.pairs === MEM.cards.length / 2) {
        const c = kidCheck();
        const st = document.getElementById('mem-status');
        if (st) st.textContent = `🎉 全部配对完成！用了 ${MEM.moves} 步，奖励 ${MEM.reward}★`;
        const reward = MEM.reward; MEM = null;
        if (c) { awardStars(c, reward, '翻翻乐通关奖励'); toast(`翻翻乐 +${reward}★ 🎉`); render(); }
      }
    } else {
      MEM.lock = true;
      renderMem();
      setTimeout(() => {
        if (MEM) { MEM.cards[fi].open = false; cd.open = false; MEM.lock = false; renderMem();
          if (MEM.moves >= MEM.limit && MEM.pairs < MEM.cards.length / 2) {
            const st = document.getElementById('mem-status');
            if (st) st.textContent = `😵 ${MEM.limit} 步用完啦！差 ${MEM.cards.length / 2 - MEM.pairs} 对，记住位置再来一局～`;
            MEM = null;
          }
        }
      }, 700);
    }
  }

  // ========== 批量导入（AI 识别好的导入码） ==========
  // 格式：WBEPS1: + base64url(UTF-8 JSON)，JSON 为资源数组 [{title,type,subject,category,url,eps:[{title,url}]}]
  // 格式：WBEPS2: 紧凑版 [{title,type,subject,category,base,eps:[标题字符串|null]}]，url 由 base+?p=N 生成
  function decodeImportCode(code) {
    code = (code || '').trim();
    if (/^WBEPS2:/i.test(code)) {
      const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const items = JSON.parse(new TextDecoder().decode(bytes));
        if (!Array.isArray(items)) return null;
        const hasBili = u => !!parseBilibili(u);
        return items.filter(x => x && (x.base || x.url)).map(x => {
          let type = ['video', 'pdf', 'audio'].includes(x.type) ? x.type : 'video';
          if (hasBili(x.base) || hasBili(x.url)) type = 'video';
          const base = String(x.base || x.url || '');
          const eps = Array.isArray(x.eps) ? x.eps.map((e, i) => {
            const t = (typeof e === 'string' ? e : '').trim();
            return {
              title: t ? t.slice(0, 60) : '第' + (i + 1) + '集',
              url: base + (i > 0 ? '?p=' + (i + 1) : '')
            };
          }) : [];
          return {
            title: String(x.title || '').slice(0, 80),
            type,
            subject: SUBJECTS[x.subject] ? x.subject : 'suyang',
            category: x.category === 'fun' ? 'fun' : 'learn',
            url: eps.length ? eps[0].url : base,
            eps
          };
        });
      } catch (e) { return null; }
    }
    if (!/^WBEPS1:/i.test(code)) return null;
    const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const items = JSON.parse(new TextDecoder().decode(bytes));
      if (!Array.isArray(items)) return null;
      const hasBili = u => !!parseBilibili(u);
      return items.filter(x => x && (x.url || (x.eps && x.eps.length))).map(x => {
        let type = ['video', 'pdf', 'audio'].includes(x.type) ? x.type : 'video';
        if (hasBili(x.url) || (x.eps || []).some(e => hasBili(e.url))) type = 'video';
        return {
          title: String(x.title || '').slice(0, 80),
          type,
          subject: SUBJECTS[x.subject] ? x.subject : 'suyang',
          category: x.category === 'fun' ? 'fun' : 'learn',
          url: String(x.url || ''),
          eps: Array.isArray(x.eps) ? x.eps.filter(e => e && e.url).map(e => ({ title: String(e.title || '').slice(0, 60), url: String(e.url) })) : []
        };
      });
    } catch (e) { return null; }
  }

  // 通过公共 CORS 代理链拉取 B站分P列表（api 直调会被浏览器 CORS 拦截）
  function fetchBiliEpisodes(url) {
    const b = parseBilibili(url);
    if (!b || b.kind === 'ep') return Promise.resolve(null);
    const idParam = b.kind === 'bvid' ? 'bvid=' + b.id : 'aid=' + b.id;
    const api = 'https://api.bilibili.com/x/player/pagelist?' + idParam;
    const proxies = [
      u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
      u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://yacdn.org/proxy/' + u,
      u => 'https://cors.bridged.cc/' + u,
    ];
    const tryOne = (mk) => new Promise(resolve => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const timer = setTimeout(() => finish(null), 8000);
      fetch(mk(api)).then(r => r.text()).then(txt => {
        clearTimeout(timer);
        try {
          const obj = JSON.parse(txt);
          let arr = obj && Array.isArray(obj.data) ? obj.data : null;
          if (!arr && obj && obj.contents) {
            const inner = JSON.parse(obj.contents);
            if (inner && Array.isArray(inner.data)) arr = inner.data;
          }
          finish(arr);
        } catch (e) { finish(null); }
      }).catch(() => { clearTimeout(timer); finish(null); });
    });
    return (async () => {
      for (const p of proxies) {
        const arr = await tryOne(p);
        if (arr) return arr;
      }
      return null;
    })();
  }

  // 统一打开单个资源链接（视频/音频尽量内嵌，不跳转）
  function openResourceLink(title, type, url) {

    const bili = parseBilibili(url);
    if (bili) { openBiliPlayer(title, bili); return; }
    // 直接视频文件链接：video 标签内嵌
    if (isDirectVideo(url)) { openHtmlVideo(title, url); return; }
    // 直接音频文件链接：audio 标签内嵌
    if (isDirectAudio(url)) { openHtmlAudio(title, url); return; }
    // 直接 PDF 文件链接（阿里云 OSS 直链）：内嵌预览，不跳转
    if (isDirectPdf(url)) { openPdfViewer(title, url); return; }
    // 其他网页（微云分享页、官网课程等）：走安全审核跳转页（白名单拦截）
    openExternal(url, title);
  }

  // ========== 安全跳转页 + 上网白名单 ==========
  function escA(s) { return esc(String(s == null ? '' : s)).replace(/'/g, '&#39;'); }
  function hostOf(url) {
    try { return new URL(url).hostname.toLowerCase(); } catch (e) { return ''; }
  }
  function isDomainAllowed(url) {
    const host = hostOf(url);
    if (!host) return false;
    return (DATA.safeDomains || []).some(d => {
      let dm = String(d || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '');
      return dm && (host === dm || host.endsWith('.' + dm));
    });
  }
  function openExternal(url, title) {
    const host = hostOf(url);
    const allowed = isDomainAllowed(url);

        <p class="text-mute" style="font-size:13px;margin:0 0 2px">${esc(title || '')}</p>

    ` : `
      <div style="text-align:center;padding:10px 4px">
        <div style="font-size:44px">⛔</div>
        <h3 style="margin:10px 0 4px;color:var(--red-600)">此网站未授权</h3>
        <p class="text-mute" style="font-size:13px;margin:0 0 2px">${esc(title || '')}</p>
        <p class="text-mute" style="font-size:12px">${esc(host)}</p>
        <p class="text-mute" style="font-size:12px;margin-top:8px">这个网站不在妈妈的名单里，<br>需要妈妈输入密码才能打开哦</p>
        <div class="btn-row" style="margin-top:16px">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">返回</button>

  // 孩子端：弹妈妈密码框，验证通过解锁一次
  function unlockExternal(url, title) {
    const pm = document.createElement('div');
    pm.className = 'modal-mask';
    pm.dataset.url = url;
    pm.onclick = (e) => { if (e.target === pm) pm.remove(); };
    pm.innerHTML = `
      <div class="modal">

        <div class="btn-row" style="margin-top:14px">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>

  }
  function doUnlock(mask) {
    const v = (mask.querySelector('#unlock-pwd') || {}).value || '';
    if (v.trim() === String(DATA.momPassword)) {
      const u = mask.dataset.url;
      if (u) window.open(u, '_blank');

      toast('❌ 密码不对，无法解锁');

  // 妈妈端：把域名加入/移出白名单
  function addSafeDomain(host) {
    if (!host) return;
    const dm = host.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '');
    if (!dm) { toast('❌ 网址格式不对'); return; }
    const list = DATA.safeDomains || (DATA.safeDomains = []);
    if (!list.includes(dm)) { list.push(dm); saveData(DATA); toast('✅ 已加入白名单: ' + dm); }
    else toast('ℹ️ 已在白名单中');
  }
  function removeSafeDomain(dm) {
    DATA.safeDomains = (DATA.safeDomains || []).filter(x => x !== dm);

  // 播放某一集
  function playEpisode(id, i) {
    const r = DATA.resources.find(x => x.id === id);
    if (!r || !r.episodes || !r.episodes[i]) return;
    const ep = r.episodes[i];

  // 从链接中提取 B 站 BV 号 / av 号 / 番剧 ep 号 / 分P
  function parseBilibili(url) {
    if (!url) return null;
    const p = url.match(/[?&]p=(\d+)/);
    const pn = p ? p[1] : null;
    const bv = url.match(/BV[0-9A-Za-z]{10}/);
    if (bv) return { kind: 'bvid', id: bv[0], p: pn };
    const av = url.match(/[?&/]av(\d+)/);
    if (av) return { kind: 'aid', id: av[1], p: pn };
    // 番剧单集：bangumi/play/ep123456
    const ep = url.match(/bangumi\/play\/ep(\d+)/);
    if (ep) return { kind: 'ep', id: ep[1], p: pn };
    // 纯 BV 号输入（如直接粘贴 BV1xx411c7mD）
    const bare = url.match(/^BV[0-9A-Za-z]{10}$/);
    if (bare) return { kind: 'bvid', id: bare[0], p: pn };
    return null;
  }

  // 是否直接视频文件链接
  function isDirectVideo(url) {
    if (!url) return false;
    return /\.(mp4|webm|ogv|ogg|m4v|mov|m3u8|mkv|flv|ts)([?#].*)?$/i.test(url);
  }
  // 是否直接音频文件链接
  function isDirectAudio(url) {
    if (!url) return false;
    return /\.(mp3|wav|m4a|aac|ogg|flac|opus)([?#].*)?$/i.test(url);
  }
  // 是否直接 PDF 文件链接（阿里云 OSS 等直链）
  function isDirectPdf(url) {
    if (!url) return false;
    return /\.(pdf)([?#].*)?$/i.test(url);
  }

  // ===== B站播放：内嵌 / 外跳 双通道 =====
  // 坑（重要）：B站 player.html 内部会读 UA，只要含 "Mobile" 就执行
  // location.href 跳到 www.bilibili.com/blackboard/webplayer/mbplayer.html；
  // 而 mbplayer.html 不允许被第三方站点用 iframe 嵌入（跨主域被浏览器拦下），
  // 结果就是安卓平板 / 学习机永远停在开始画面转圈 —— 移动端内嵌基本无解。
  // 对策：平板 / 手机 / 学习机默认走「外跳播放卡」（一定能播），电脑才用 iframe 内嵌。
  function biliUrls(b) {
    const p = b.p ? ('&p=' + b.p) : '';
    const idq = (b.kind === 'bvid' ? 'bvid=' + b.id
               : b.kind === 'aid' ? 'aid=' + b.id
               : 'ep_id=' + b.id);
    const q = idq + p + '&autoplay=0&danmaku=0';
    let pageUrl = 'https://www.bilibili.com/';
    if (b.kind === 'bvid') pageUrl = 'https://www.bilibili.com/video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') pageUrl = 'https://www.bilibili.com/video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else pageUrl = 'https://www.bilibili.com/bangumi/play/ep' + b.id;
    let appUrl = '';
    if (b.kind === 'bvid') appUrl = 'bilibili://video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') appUrl = 'bilibili://video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else appUrl = 'bilibili://bangumi/season/ep' + b.id;
    return {
      desktop: 'https://player.bilibili.com/player.html?' + q + '&as_wide=1',
      mobile: 'https://www.bilibili.com/blackboard/webplayer/mbplayer.html?' + q,
      page: pageUrl,
      app: appUrl
    };
  }
  function biliIsTouch() {
    const ua = navigator.userAgent || '';
    if (/Android|iPhone|iPod|iPad|Windows Phone|Mobile|Tablet/i.test(ua)) return true;
    if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return true;
    return false;
  }
  function biliPref() { try { return localStorage.getItem('flp_bili_mode') || ''; } catch (e) { return ''; } }
  function biliSetPref(v) { try { localStorage.setItem('flp_bili_mode', v); } catch (e) {} }

  // 内嵌 B 站播放器（电脑端）

    if (biliPref() === 'outside') return openBiliCard(title, b);

    // 所以这里不再按 UA 分流，一律交给 B站自己的 player.html 判断。
    const src = u.desktop;

    modal.innerHTML = `

        <h3>${esc(title)}</h3>
        <div class="video-wrap"><iframe class="bili-frame" src="${escA(src)}" scrolling="no" frameborder="no" allowfullscreen="true" referrerpolicy="unsafe-url" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe></div>
        <div class="bili-fallback" style="display:none;margin-top:10px;padding:12px;background:#fff4e6;border:1px solid #ffd9a8;border-radius:10px;font-size:13px;line-height:1.9">
          <div style="color:#8a5a00;margin-bottom:6px">一直转圈时，任选一种方式：</div>
          <a href="${escA(u.page)}" target="_blank" rel="noopener" style="display:inline-block;padding:9px 15px;background:#ff6b9d;color:#fff;border-radius:9px;text-decoration:none;font-weight:600">① 用浏览器打开 B站（一定能播）</a>

          <div style="color:#8a5a00">⑤ 换个播放器版本：
            <button type="button" class="bili-swap" data-src="${escA(u.desktop)}" style="padding:5px 10px;margin-right:6px;border:1px solid #ffb37a;background:#fff;border-radius:8px;cursor:pointer;color:#8a5a00">官方版</button>

        <h3>${esc(title)}</h3>
        <div style="background:var(--gray-100);border-radius:10px;padding:28px 16px;text-align:center">
          <div style="font-size:40px;margin-bottom:14px">🎵</div>
          <audio controls playsinline preload="metadata" style="width:100%">
            <source src="${esc(url)}" />
            你的浏览器不支持播放这个音频
          </audio>
        </div>
        <div class="video-meta">音频 · 在平台内播放</div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }

  // 内嵌 PDF 预览（阿里云 OSS 等直链；部分安卓内核不支持内嵌渲染，提供浏览器打开兜底）
  function openPdfViewer(title, url) {
    const modal = document.createElement('div');
    modal.className = 'modal-mask video-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal video-modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>${esc(title)}</h3>
        <div class="video-wrap" style="padding-top:125%;background:#f5f5f5">
          <iframe src="${esc(url)}" style="background:#fff"></iframe>
        </div>
        <div class="video-meta">PDF · 若上方显示空白，点下方按钮用浏览器打开阅读</div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">关闭</button>
          <button class="btn-primary" onclick="window.open('${escA(url)}','_blank')">📖 用浏览器打开</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }

  // ========== 模态：添加奖励 ==========
  function openRewardModal() {
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>添加奖励视频</h3>
        <div class="field">
          <label>Emoji 头像</label>
          <input id="rw-emoji" value="🎁" maxlength="2" />
        </div>
        <div class="field">
          <label>标题</label>
          <input id="rw-title" placeholder="例：奖励：冰雪奇缘片段" />
        </div>
        <div class="field">
          <label>分类</label>
          <select id="rw-cat">${Object.entries(REWARD_CATS).map(([k,v]) => `<option value="${k}">${v.emoji} ${v.name}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>微云链接</label>
          <input id="rw-url" placeholder="https://share.weiyun.com/xxx" />
        </div>
        <div class="field">
          <label>积分门槛</label>
          <input id="rw-threshold" type="number" value="100" min="10" max="9999" />
        </div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn-primary" onclick="addReward()">添加</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }
  function addReward() {
    const emoji = document.getElementById('rw-emoji').value || '🎁';
    const title = document.getElementById('rw-title').value.trim();
    const url = document.getElementById('rw-url').value.trim();
    const threshold = parseInt(document.getElementById('rw-threshold').value) || 100;
    const cat = document.getElementById('rw-cat') ? document.getElementById('rw-cat').value : 'cartoon';
    if (!title || !url) { toast('标题和链接都要填'); return; }
    DATA.rewards.push({ id: 'rw'+Date.now(), title, emoji, threshold, url, cat });
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已添加');
  }
  function delReward(id) {
    if (!confirm('确认删除？')) return;
    DATA.rewards = DATA.rewards.filter(r => r.id !== id);
    saveData(DATA); render();
  }
  function openReward(id) {
    const r = DATA.rewards.find(x => x.id === id);
    if (!r) return;
    openResourceLink(r.title, 'video', r.url);
  }

  // ========== 模态：编辑孩子 ==========
  function editChild(id) {
    const c = DATA.children.find(x => x.id === id);
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>编辑 ${esc(c.name)}</h3>
        <div class="field"><label>头像 Emoji</label><input id="c-emoji" value="${c.avatar}" maxlength="2" /></div>
        <div class="field"><label>姓名</label><input id="c-name" value="${esc(c.name)}" /></div>
        <div class="field"><label>PIN（4 位数字）</label><input id="c-pin" value="${c.pin}" maxlength="4" pattern="\\d{4}" /></div>
        <div class="field"><label>当前积分</label><input id="c-points" type="number" value="${c.points}" /></div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="delChild('${c.id}')">删除</button>
          <button class="btn-primary" onclick="saveChild('${c.id}')">保存</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }
  function openChildModal() {
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>添加孩子</h3>
        <div class="field"><label>头像 Emoji</label><input id="nc-emoji" value="👶" maxlength="2" /></div>
        <div class="field"><label>姓名</label><input id="nc-name" placeholder="例：小宝" /></div>
        <div class="field"><label>PIN（4 位数字）</label><input id="nc-pin" value="0000" maxlength="4" /></div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn-primary" onclick="addChild()">添加</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }
  function saveChild(id) {
    const c = DATA.children.find(x => x.id === id);
    c.avatar = document.getElementById('c-emoji').value || c.avatar;
    c.name = document.getElementById('c-name').value || c.name;
    const pin = document.getElementById('c-pin').value;
    if (/^\d{4}$/.test(pin)) c.pin = pin; else { toast('PIN 必须是 4 位数字'); return; }
    c.points = parseInt(document.getElementById('c-points').value) || 0;
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已保存');
  }
  function addChild() {
    const emoji = document.getElementById('nc-emoji').value || '👶';
    const name = document.getElementById('nc-name').value.trim();
    const pin = document.getElementById('nc-pin').value;
    if (!name) { toast('写个名字'); return; }
    if (!/^\d{4}$/.test(pin)) { toast('PIN 必须是 4 位数字'); return; }
    DATA.children.push({ id: 'c'+Date.now(), name, avatar: emoji, pin, points: 0, streak: 0 });
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已添加');
  }
  function delChild(id) {
    if (!confirm('确认删除这个孩子？')) return;
    DATA.children = DATA.children.filter(c => c.id !== id);
    DATA.tasks = DATA.tasks.filter(t => t.childId !== id);
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已删除');
  }

  function changePassword() {
    const np = prompt('新密码（4 位数字）');
    if (!np || !/^\d{4}$/.test(np)) { toast('必须是 4 位数字'); return; }
    DATA.momPassword = np; toast('已修改'); saveData(DATA);
  }
  function exportData() {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lebao-data-${TODAY}.json`;
    a.click();
  }
  function resetData() {
    if (!confirm('确认重置？所有数据会回到初始演示状态')) return;
    localStorage.removeItem(LS_KEY);
    DATA = loadData();
    render(); toast('已重置');
  }
  function logout() {
    sessionStorage.removeItem('mom-auth');
    location.hash = 'entry';
  }

  // ========== 启动 ==========
  window.addEventListener('hashchange', render);
  render();

  // 注册 service worker（PWA 离线）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  </script>
</body>
</html>
