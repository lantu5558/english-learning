  }
  function doDelTask(ids) {
    let back = 0;
    (ids || []).forEach(id => { back += delTaskById(id); });
    saveData(DATA); closeAllModals(); render();
    toast(back > 0 ? ('已取消，收回 ' + back + ' ★') : '已取消任务');
  }
  // 妈妈端任务卡片右侧的编辑 / 删除（孩子端不渲染，孩子不能自己删任务）
  function momTaskOps(t) {
    return `<div class="task-ops">
      <button class="icon-btn" title="编辑" onclick="event.stopPropagation();openTaskModal('${t.id}')">${ICN.edit}</button>
      <button class="icon-btn danger" title="取消任务" onclick="event.stopPropagation();askDelTask('${t.id}')">${ICN.trash}</button>
    </div>`;
  }
  let MOM_FUT_ALL = false;
  function momFutToggle() { MOM_FUT_ALL = !MOM_FUT_ALL; render(); }
  function futDayLabel(d) {
    const a = new Date(d + 'T00:00:00'), b = new Date(TODAY + 'T00:00:00');
    const diff = Math.round((a - b) / 86400000);
    const wd = '日一二三四五六'[a.getDay()];
    if (diff === 1) return '明天 · 周' + wd;
    if (diff === 2) return '后天 · 周' + wd;
    return d.slice(5) + ' · 周' + wd + '（' + diff + ' 天后）';
  }
  // 之后几天的任务也要能改 —— 布置错了常常是明天那几条错了
  function momFutureTasks() {
    const fut = (DATA.tasks || []).filter(t => t.date > TODAY).sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    if (!fut.length) return '';
    const shown = MOM_FUT_ALL ? fut : fut.slice(0, 6);
    const byDay = {};
    shown.forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
    const days = Object.keys(byDay).sort();
    return `
      <div class="section">
        <h3>📅 之后的安排 <span class="badge">${fut.length} 条</span>
          ${fut.length > 6 ? `<button class="text-pink" style="font-size:12px" onclick="momFutToggle()">${MOM_FUT_ALL ? '收起' : '展开全部'}</button>` : ''}
        </h3>
        ${days.map(d => `
          <div class="fut-day">${futDayLabel(d)}</div>
          ${byDay[d].map(t => {
            const k = DATA.children.find(c => c.id === t.childId);
            const res = taskRes(t);
            return `<div class="task ${t.done ? 'done' : ''}">
              <div class="checkbox" onclick="toggleTask('${t.id}')">${t.done ? ICN.check : ''}</div>
              <div class="title">
                <div class="name">${esc(t.title)}</div>
                <div class="meta">${k ? k.avatar + ' ' + esc(k.name) : ''}${res ? ' · 📎 ' + esc(res.title) : ''}</div>
              </div>
              <div class="pts">+${t.points}</div>
              ${momTaskOps(t)}
            </div>`;
          }).join('')}
        `).join('')}
        ${(fut.length > 6 && !MOM_FUT_ALL) ? '<p class="wq-hint" style="margin-top:8px">只显示最近 6 条，点上面「展开全部」看剩下的</p>' : ''}
      </div>`;
  }
  // 取任务挂的资料（资源库引用 或 自定义链接）
  function taskRes(t) {
    if (!t) return null;
    if (t.resId) {
      const r = DATA.resources.find(x => x.id === t.resId);
      if (r) {
        const epIndex = (typeof t.epIndex === 'number' && t.epIndex >= 0) ? t.epIndex : -1;
        const epNum = (typeof t.epNum === 'number') ? t.epNum : 0;
        let label = r.title;
        if (r.episodes && r.episodes.length >= 2 && epIndex >= 0 && r.episodes[epIndex]) label = r.title + ' · 第' + (epIndex + 1) + '集';
        else if (epNum > 0) label = r.title + ' · 第' + epNum + '集';
        return { title: label, url: r.url, type: r.type, episodes: r.episodes, epIndex: epIndex, epNum: epNum };
      }
    }
    if (t.resUrl) return { title: '学习资料', url: t.resUrl, type: 'link' };
    return null;
  }
  // ========== 看视频任务：播放器 ==========
  // OSS 直链 → 严格模式（禁拖进度条 / 最高 1.5 倍速 / 看到最后才算完成）
  // B站等外站 → 宽松模式（管不了别人的播放器，孩子自己点「我看完了」）
  function taskVideoUrl(t) {
    const res = taskRes(t);
    if (!res || !res.url) return null;
    if (res.episodes && res.episodes.length >= 2 && res.epIndex >= 0 && res.episodes[res.epIndex]) {
      const ep = res.episodes[res.epIndex];
      const t2 = res.title + ' · 第' + (res.epIndex + 1) + '集';
      return { url: ep.url, title: t2, res, sub: resSubUrl(res, res.epIndex) };
    }
    return { url: res.url, title: res.title, res, sub: resSubUrl(res, -1) };
  }
  function openTaskVideo(taskId) {
    const t = DATA.tasks.find(x => x.id === taskId);
    if (!t) return;
    const v = taskVideoUrl(t);
    if (!v) { toast('这个任务还没挂视频，让妈妈去编辑一下'); return; }
    if (isDirectVideo(v.url)) { openStrictVideo(t, v.title, v.url, v.sub); return; }
    const b = parseBilibili(v.url);
    if (b) { openLooseVideo(t, v.title, b, null, v.sub); return; }
    // 其他网页：外站一律宽松模式
    openLooseVideo(t, v.title, null, v.url, v.sub);
  }

  // ---- 严格模式（平台自己的播放器，完全可控）----
  let SV = null;   // { task, video, maxSeen, finished, rate }
  const SV_RATES = [1, 1.25, 1.5];   // 最高 1.5 倍速
  function openStrictVideo(task, title, url, subUrl) {
    closeSv();
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.id = 'sv-mask';
    mask.innerHTML = `
      <div class="modal">
        <h3 style="padding-right:34px">${esc(title)}</h3>
        <div class="sv-stage" id="sv-stage">
          <video id="sv-video" playsinline preload="auto" src="${escA(url)}" disablepictureinpicture controlslist="nodownload"></video>
          <button class="sv-cover" id="sv-cover" onclick="svToggle()">▶<span>点击开始播放</span></button>
          <div class="sv-ctrls">
            <button type="button" id="sv-playbtn" onclick="svToggle()">▶</button>
            <button type="button" onclick="svSeek(-10)" title="后退 10 秒">⏪</button>
            <button type="button" id="sv-fs-btn" class="sv-fs" onclick="svToggleFs()" title="全屏">⛶</button>
          </div>
        </div>
        <div class="sv-bar"><div class="sv-bar-in" id="sv-bar-in"></div></div>
        <div class="sv-time"><span id="sv-cur">00:00</span><span id="sv-pct">0%</span><span id="sv-dur">--:--</span></div>
        <div class="sv-subrow" id="sv-subrow">
          <button type="button" class="btn-sm" id="sv-sub" onclick="svToggleSub()">字幕：开</button>
          <span class="sv-subinfo" id="sv-subinfo"></span>
        </div>
        <div class="sv-tip">🔒 不能拖进度条、最高 1.5 倍速，看到最后自动打卡 +${task.points} 分</div>
      </div>`;
    document.getElementById('modal-root').appendChild(mask);
    SV = { task, video: document.getElementById('sv-video'), maxSeen: 0, finished: false, rate: 0,
           subUrl: '', subOn: false, subBlob: '', lastT: null };
    fpOpen('video', title, { childId: task && task.childId });
    const v = SV.video;
    if (!v) { closeSv(); return; }
    if (subUrl) svLoadSub(v, subUrl);
    v.playbackRate = SV_RATES[0];
    v.addEventListener('loadedmetadata', svResume);
    v.addEventListener('timeupdate', svTick);
    v.addEventListener('ended', svFinish);
    v.addEventListener('play', () => { svBtn('⏸ 暂停'); const c = document.getElementById('sv-cover'); if (c) c.style.display = 'none'; });
    v.addEventListener('pause', () => svBtn('▶ 继续'));
    v.addEventListener('contextmenu', e => e.preventDefault());
    v.addEventListener('keydown', e => {   // 拦掉键盘快进（方向键 / J / L）
      const k = (e.key || '').toLowerCase();
      if (['arrowright', 'arrowleft', 'arrowup', 'arrowdown', 'j', 'l', ' ', 'k'].indexOf(k) >= 0) e.preventDefault();
    });
    // 失败兜底：APP / 部分手机浏览器对「直链 MP4」会因 Content-Type 不对或编码不支持而静默播不了。
    // 第一层降级：把视频 fetch 成 blob 再喂（绕过 Content-Type 限制）；仍失败就给明确提示。
    v.addEventListener('error', () => {
      if (v.dataset.blobTried !== '1') {
        v.dataset.blobTried = '1';
        fetch(url).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
          .then(b => { try { v.src = URL.createObjectURL(b); const p2 = v.play(); if (p2 && p2.catch) p2.catch(() => svShowVideoError()); } catch (e) { svShowVideoError(); } })
          .catch(() => svShowVideoError());
        return;
      }
      svShowVideoError();
    });
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }
  function svBtn(txt) { const b = document.getElementById('sv-playbtn'); if (b) b.innerHTML = (txt && txt.indexOf('暂停') >= 0) ? '⏸' : '▶'; }
  // ---- 字幕 ----
  // srt → vtt：浏览器只认 WebVTT。差别就是把时间轴的逗号换成点，再加个 WEBVTT 头。
  function srtToVtt(txt) {
    let s = String(txt == null ? '' : txt).replace(/^\uFEFF/, '');
    if (!s.trim()) return '';
    if (/^\s*WEBVTT/.test(s)) return s;                 // 已经是 vtt，原样返回
    s = s.replace(/\r\n?/g, '\n');
    s = s.replace(/\{\\[^}]*\}/g, '');                  // 去掉 {\an8} 这类 vtt 不认的定位标记
    s = s.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    s = s.replace(/(\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    return 'WEBVTT\n\n' + s.replace(/\n{3,}/g, '\n\n');
  }
  function svSubInfo(html) { const e = document.getElementById('sv-subinfo'); if (e) e.innerHTML = html; }
  function svSubBtn() {
    const b = document.getElementById('sv-sub');
    const row = document.getElementById('sv-subrow');
    if (!b || !SV) return;
    b.textContent = '字幕：' + (SV.subOn ? '开' : '关');
    if (row) row.classList.toggle('on', !!SV.subOn);
  }
  // 字幕是跨域文件，浏览器默认不让读 → 先 fetch 成文本转 blob 再挂 track（最稳）。
  // fetch 不通（网盘没开 CORS）就退一步直接挂 track，同时也把原因告诉妈妈。
  function svLoadSub(v, url) {
    if (!v || !url) return;
    const row = document.getElementById('sv-subrow');
    if (row) row.style.display = 'block';
    svSubInfo('字幕加载中…');
    fetch(url).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(txt => {
        const vtt = srtToVtt(txt);
        if (!vtt) throw new Error('empty');
        let bu = '';
        try { bu = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' })); } catch (e) { throw e; }
        if (!SV) return;
        SV.subBlob = bu; SV.subUrl = url;
        svAddTrack(v, bu, true);
        svSubInfo('字幕已就绪，点上面的按钮可以开关');
      })
      .catch(() => {
        // 退一步：直接挂 track（同源或已开 CORS 时能用）
        const tr = svAddTrack(v, url, true);
        if (tr) tr.addEventListener('error', () => svSubCorsHint());
        svSubInfo('字幕加载中…');
      });
  }
  function svAddTrack(v, src, show) {
    if (!v || !src || !SV) return null;
    try {
      const tr = document.createElement('track');
      tr.kind = 'subtitles'; tr.label = '字幕'; tr.srclang = 'zh'; tr.src = src;
      tr.default = !!show;
      v.appendChild(tr);
      if (v.textTracks && v.textTracks.length) {
        try { v.textTracks[v.textTracks.length - 1].mode = show ? 'showing' : 'hidden'; } catch (e) {}
      }
      SV.subOn = !!show;
      svSubBtn();
      return tr;
    } catch (e) { return null; }
  }
  function svSubCorsHint() {
    if (!SV) return;
    svSubInfo('<span style="color:var(--orange-600)">字幕没读出来 —— 存字幕的网盘/OSS 需要开一次「跨域 CORS」，' +
      '允许来源填 <b>https://lantu5558.github.io</b>。开完一次就一直有效，视频本身不受影响。</span>');
  }
  function svToggleSub() {
    const v = SV && SV.video;
    if (!v) return;
    if (!v.textTracks || !v.textTracks.length) { toast('这个视频还没挂字幕'); return; }
    SV.subOn = !SV.subOn;
    for (let i = 0; i < v.textTracks.length; i++) {
      try { v.textTracks[i].mode = SV.subOn ? 'showing' : 'hidden'; } catch (e) {}
    }
    svSubBtn();
    toast(SV.subOn ? '字幕已开' : '字幕已关');
  }
  function fmtDur(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), ss = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function svMeta() {
    const v = SV && SV.video;
    if (!v) return;
    const d = document.getElementById('sv-dur');
    if (d) d.textContent = fmtDur(v.duration);
  }
  // 续播：上次没看完退出了，这次从记住的地方接着看。
  // 坑（重要）：光设置 currentTime 不够 —— 必须同时把 maxSeen 抬上去，
  // 否则 svTick 会把这个跳跃当成「拖进度条」，一把拽回 0 秒，死循环。
  function svResume() {
    const v = SV && SV.video;
    if (!v) return;
    svMeta();
    const p = SV.task ? (SV.task.videoProgress || 0) : 0;
    if (!isFinite(v.duration) || v.duration <= 0) return;
    if (p > 3 && p < 98) {
      const at = v.duration * p / 100;
      SV.maxSeen = at;            // 先抬 maxSeen，再跳，否则会被判定成快进
      try { v.currentTime = at; } catch (e) {}
      const bar = document.getElementById('sv-bar-in');
      if (bar) bar.style.width = p + '%';
      const pc = document.getElementById('sv-pct');
      if (pc) pc.textContent = Math.round(p) + '%';
      toast('接着上次的 ' + Math.round(p) + '% 往下看');
    }
  }
  function svTick() {
    const v = SV && SV.video;
    if (!v || !v.duration || SV.finished) return;
    // 检测到跳跃 → 有人在拖进度条，拽回最远看到的位置
    if (v.currentTime > SV.maxSeen + 3) {
      v.currentTime = SV.maxSeen;
      toast('不能快进哦，认真看完 🎬');
      return;
    }
    if (v.currentTime > SV.maxSeen) SV.maxSeen = v.currentTime;
    // 学习足迹：只累加「正常往前播」的那部分，拖回 / 跳段都不算看过
    if (SV.lastT != null && v.currentTime > SV.lastT) fpAcc(v.currentTime - SV.lastT);
    SV.lastT = v.currentTime;
    if (v.playbackRate > 1.5) v.playbackRate = 1.5;   // 倍速封顶
    const pct = Math.max(0, Math.min(100, v.currentTime / v.duration * 100));
    const bar = document.getElementById('sv-bar-in');
    if (bar) bar.style.width = pct + '%';
    const cur = document.getElementById('sv-cur'); if (cur) cur.textContent = fmtDur(v.currentTime);
    const pc = document.getElementById('sv-pct'); if (pc) pc.textContent = Math.round(pct) + '%';
    SV.task.videoProgress = pct;
    if (pct >= 98) svFinish();
  }
  function svToggle() {
    const v = SV && SV.video;
    if (!v) return;
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    else v.pause();
  }
  function svSeek(delta) {
    const v = SV && SV.video;
    if (!v || !v.duration) return;
    // 只允许后退（回看没听清的地方），前进一律拒绝
    const target = Math.max(0, Math.min(SV.maxSeen, v.currentTime + delta));
    if (target > v.currentTime + 0.1 && target > SV.maxSeen) { toast('不能快进哦'); return; }
    v.currentTime = target;
  }
  function svRate() {
    const v = SV && SV.video;
    if (!v) return;
    SV.rate = (SV.rate + 1) % SV_RATES.length;
    v.playbackRate = SV_RATES[SV.rate];
    const b = document.getElementById('sv-rate');
    if (b) b.textContent = SV_RATES[SV.rate].toFixed(2).replace(/0$/, '') + '×';
    if (SV_RATES[SV.rate] === 1.5) toast('最快就是 1.5 倍速啦');
  }
  function svToggleFs() {
    const mask = document.getElementById('sv-mask');
    const modal = mask && mask.querySelector('.modal');
    if (!modal) return;
    const on = modal.classList.toggle('lv-fs');
    const fsBtn = document.getElementById('sv-fs-btn');
    if (fsBtn) fsBtn.textContent = on ? '⤢' : '⛶';
    // 原生全屏仅作桌面增强；移动端/APK 用上面的 CSS 全屏，必然生效
    if (on) {
      const v = SV && SV.video;
      if (v && v.requestFullscreen && document.fullscreenEnabled) { try { v.requestFullscreen(); } catch (e) {} }
    } else if (document.fullscreenElement) {
      try { document.exitFullscreen(); } catch (e) {}
    }
  }
  function svFinish() {
    if (!SV || SV.finished) return;
    SV.finished = true;
    const t = SV.task;
    t.videoProgress = 100;
    if (!t.done) {
      t.done = true; t.doneAt = Date.now();
      t.proofData = { type: 'video', data: null, at: Date.now() };
      const k = DATA.children.find(c => c.id === t.childId);
      if (k) {
        k.earned = (k.earned || 0) + t.points; k.points += t.points;
        DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
      }
      saveData(DATA);
      toast(`看完啦！+${t.points} 分 🎉`);
    }
    const tip = document.querySelector('#sv-mask .sv-tip');
    if (tip) { tip.textContent = '✅ 已看完，自动打卡完成！'; tip.style.color = 'var(--green-600)'; }
    setTimeout(closeSv, 1500);
  }
  function svShowVideoError() {
    if (!SV) return;
    const tip = document.querySelector('#sv-mask .sv-tip');
    if (tip) {
      tip.innerHTML = '⚠️ 这个视频当前设备（APP / 手机浏览器）无法播放，多半是编码格式不支持。'
        + '请在<b>电脑</b>或<b>网页版</b>观看；或把视频转成普通 MP4（H.264 + AAC）后重新上传到 OSS。';
      tip.style.color = 'var(--orange-600)';
    }
    const cover = document.getElementById('sv-cover');
    if (cover) { const sp = cover.querySelector('span'); if (sp) sp.textContent = '设备不支持该格式'; }
  }
  function closeSv() {
    fpClose();
    if (SV && SV.video) {
      try { SV.video.pause(); } catch (e) {}
      const pct = SV.task.videoProgress || 0;

  /**
   * 影院模式开关 —— B站弹窗和任务宽松播放器共用同一套。
   *
   * 为什么不能指望 B站播放器自己的全屏按钮：
   * 它跑在跨域 iframe 里，一旦发现自己是被嵌着的，全屏按钮就走它内部的
   * 「网页全屏」，只会在 iframe 那块视口里铺满 —— 外层弹窗多大，它最大就多大。
   * 所以必须由外层把容器拉到整屏，iframe 跟着变大，这才真的会变大。
   *
   * 三档降级，能拿到哪档用哪档：
   *   ① APP 壳的 LebaoApp.setFullscreen() → 真横屏 + 隐藏状态栏 + 常亮（最好）
   *   ② 系统 requestFullscreen()          → 浏览器里的原生全屏
   *   ③ 纯 CSS 铺满                       → 任何环境都生效，至少是整屏
   * 每档失败都静默往下走，绝不影响播放。
   */
  function videoFsSet(mask, on) {
    if (!mask) return;
    const m = mask.querySelector('.modal');
    if (!m) return;
    m.classList.toggle('lv-fs', !!on);

    // ① 通知 APP 壳：真横屏 + 沉浸式 + 常亮
    try {
      if (window.LebaoApp && typeof window.LebaoApp.setFullscreen === 'function') {
        window.LebaoApp.setFullscreen(!!on);
      }
    } catch (e) { /* 浏览器里没有这个对象，正常 */ }

    // ② 系统全屏
    const de = document.documentElement;
    try {
      if (on) {
        if (de.requestFullscreen) { const p = de.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      } else if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { /* 系统全屏用不了就纯 CSS，不打断播放 */ }

    // ③ 尽量跟着转成横屏（失败无所谓）
    try {
      if (on) { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }
      else if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
    if (!on) { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
  }

  function saveResSub(id) {

  function addResource() {
    let type = document.getElementById('r-type').value;
    const cat = document.getElementById('r-cat') ? document.getElementById('r-cat').value : 'learn';
    const subject = document.getElementById('r-subject').value;
    let title = document.getElementById('r-title').value.trim();
    let url = document.getElementById('r-url').value.trim();
    const epsText = document.getElementById('r-eps') ? document.getElementById('r-eps').value.trim() : '';
    const subText = document.getElementById('r-sub') ? document.getElementById('r-sub').value.trim() : '';
    const subs = subText ? subText.split('\n').map(x => x.trim()) : [];

    // 解析分集：每行「标题 | 链接」或纯链接
    let eps = [];
    if (epsText) {
      eps = epsText.split('\n').map(line => {
        line = line.trim();
        if (!line) return null;
        const m = line.match(/^(.*?)\s*[|｜]\s*(\S+)\s*$/);
        if (m && m[1] && m[2]) return { title: m[1].trim(), url: m[2].trim() };
        return { title: '', url: line };
      }).filter(Boolean);
    }

    if (!title) { toast('请填标题'); return; }
    if (!url && eps.length === 0) { toast('标题和链接都要填'); return; }

    // 兜底：B站链接自动识别为视频
    const checkBili = (u) => parseBilibili(u) ? true : false;
    if ((checkBili(url) || eps.some(e => checkBili(e.url))) && type !== 'video') type = 'video';

    const who = document.getElementById('r-who') ? document.getElementById('r-who').value : 'both';
    const col = document.getElementById('r-col') ? document.getElementById('r-col').value : inferResCol({ type, subject });
    const res = { type, col, subject, title, url, category: cat, who };
    // B站自动识别的分集（妈妈贴一条链接时已异步拉取）
    if (window.__biliEps && window.__biliEps.length >= 2 && window.__biliEpsUrl === url && eps.length === 0) {
      const base = url.replace(/[?&]p=\d+/, '').replace(/#.*$/, '');
      res.episodes = window.__biliEps.map(pg => ({
        title: pg.part ? ('第' + pg.page + '集 · ' + pg.part) : ('第' + pg.page + '集'),
        url: base + (pg.page > 1 ? (base.indexOf('?') >= 0 ? '&' : '?') + 'p=' + pg.page : '')
      }));
      res.url = res.episodes[0].url;
    }
    if (eps.length >= 2) {
      // 合集：存分集列表（字幕按行对应，某一行留空就跳过那一集）
      res.episodes = eps.map((ep, i) => {
        const o = { title: ep.title || ('第' + (i + 1) + '集'), url: ep.url };
        if (subs[i]) o.sub = subs[i];
        return o;
      });
      res.url = eps[0].url;
    } else if (eps.length === 1) {
      // 只填了一集：当单集处理
      res.url = eps[0].url;
      if (subs[0]) res.sub = subs[0];
    } else if (subs[0]) {
      res.sub = subs[0];
    }
    const editId = window.__editResId;
    if (editId) {
      const ex = DATA.resources.find(x => x.id === editId);
      if (ex) {
        const keepId = ex.id;
        Object.assign(ex, res);
        ex.id = keepId; // 保留原 id，避免孩子端已打开的链接失效
        window.__editResId = null;
        saveData(DATA); document.querySelector('.modal-mask').remove(); render();
        toast('已保存');
        return;
      }
      window.__editResId = null;
    }
    res.id = 'r' + Date.now();
    DATA.resources.push(res);
    saveData(DATA); document.querySelector('.modal-mask').remove(); render();
    toast(eps.length >= 2 ? '已添加合集（' + eps.length + '集）' : '已添加');
  }
  // ========== 批量导入（AI 识别好的导入码） ==========
  // 格式：WBEPS1: + base64url(UTF-8 JSON)，JSON 为资源数组 [{title,type,subject,category,url,eps:[{title,url}]}]
  // 格式：WBEPS2: 紧凑版 [{title,type,subject,category,base,eps:[标题字符串|null]}]，url 由 base+?p=N 生成
  function decodeImportCode(code) {
    code = (code || '').trim();
    if (/^WBEPS2:/i.test(code)) {
      const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const items = JSON.parse(new TextDecoder().decode(bytes));
        if (!Array.isArray(items)) return null;
        const hasBili = u => !!parseBilibili(u);
        return items.filter(x => x && (x.base || x.url)).map(x => {
          let type = ['video', 'pdf', 'epub', 'audio'].includes(x.type) ? x.type : 'video';
          if (hasBili(x.base) || hasBili(x.url)) type = 'video';
          const base = String(x.base || x.url || '');
          const eps = Array.isArray(x.eps) ? x.eps.map((e, i) => {
            const t = (typeof e === 'string' ? e : '').trim();
            return {
              title: t ? t.slice(0, 60) : '第' + (i + 1) + '集',
              url: base + (i > 0 ? '?p=' + (i + 1) : '')
            };
          }) : [];
          return {
            title: String(x.title || '').slice(0, 80),
            type,
            subject: SUBJECTS[x.subject] ? x.subject : 'science',
            category: x.category === 'fun' ? 'fun' : 'learn',
            who: 'both',
            url: eps.length ? eps[0].url : base,
            eps
          };
        });
      } catch (e) { return null; }
    }
    if (!/^WBEPS1:/i.test(code)) return null;
    const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const items = JSON.parse(new TextDecoder().decode(bytes));
      if (!Array.isArray(items)) return null;
      const hasBili = u => !!parseBilibili(u);
      return items.filter(x => x && (x.url || (x.eps && x.eps.length))).map(x => {
        let type = ['video', 'pdf', 'epub', 'audio'].includes(x.type) ? x.type : 'video';
        if (hasBili(x.url) || (x.eps || []).some(e => hasBili(e.url))) type = 'video';
        return {
          title: String(x.title || '').slice(0, 80),
          type,
          subject: SUBJECTS[x.subject] ? x.subject : 'science',
          category: x.category === 'fun' ? 'fun' : 'learn',
          who: 'both',
          url: String(x.url || ''),
          eps: Array.isArray(x.eps) ? x.eps.filter(e => e && e.url).map(e => ({ title: String(e.title || '').slice(0, 60), url: String(e.url) })) : []
        };
      });
    } catch (e) { return null; }
  }

  // 通过公共 CORS 代理链拉取 B站分P列表（api 直调会被浏览器 CORS 拦截）
  function fetchBiliEpisodes(url) {
    const b = parseBilibili(url);
    if (!b || b.kind === 'ep') return Promise.resolve(null);
    const idParam = b.kind === 'bvid' ? 'bvid=' + b.id : 'aid=' + b.id;
    const api = 'https://api.bilibili.com/x/player/pagelist?' + idParam;
    const proxies = [
      u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
      u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://yacdn.org/proxy/' + u,
      u => 'https://cors.bridged.cc/' + u,
    ];
    const tryOne = (mk) => new Promise(resolve => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const timer = setTimeout(() => finish(null), 8000);
      fetch(mk(api)).then(r => r.text()).then(txt => {
        clearTimeout(timer);
        try {
          const obj = JSON.parse(txt);
          let arr = obj && Array.isArray(obj.data) ? obj.data : null;
          if (!arr && obj && obj.contents) {
            const inner = JSON.parse(obj.contents);
            if (inner && Array.isArray(inner.data)) arr = inner.data;
          }
          finish(arr);
        } catch (e) { finish(null); }
      }).catch(() => { clearTimeout(timer); finish(null); });
    });
    return (async () => {
      for (const p of proxies) {
        const arr = await tryOne(p);
        if (arr) return arr;
      }
      return null;
    })();
  }

  // 从链接中提取 B 站 BV 号 / av 号 / 番剧 ep 号 / 分P
  function parseBilibili(url) {
    if (!url) return null;
    const p = url.match(/[?&]p=(\d+)/);
    const pn = p ? p[1] : null;
    const bv = url.match(/BV[0-9A-Za-z]{10}/);
    if (bv) return { kind: 'bvid', id: bv[0], p: pn };
    const av = url.match(/[?&/]av(\d+)/);
    if (av) return { kind: 'aid', id: av[1], p: pn };
    // 番剧单集：bangumi/play/ep123456
    const ep = url.match(/bangumi\/play\/ep(\d+)/);
    if (ep) return { kind: 'ep', id: ep[1], p: pn };
    // 纯 BV 号输入（如直接粘贴 BV1xx411c7mD）
    const bare = url.match(/^BV[0-9A-Za-z]{10}$/);
    if (bare) return { kind: 'bvid', id: bare[0], p: pn };
    return null;
  }

  // 是否直接视频文件链接
  function isDirectVideo(url) {
    if (!url) return false;
    return /\.(mp4|webm|ogv|ogg|m4v|mov|m3u8|mkv|flv|ts)([?#].*)?$/i.test(url);
  }
  // 是否直接音频文件链接
  function isDirectAudio(url) {
    if (!url) return false;
    return /\.(mp3|wav|m4a|aac|ogg|flac|opus)([?#].*)?$/i.test(url);
  }
  // 是否直接 EPUB 文件链接（阿里云 OSS / GitHub Pages 等同域直链）
  // 和 PDF 一样，网盘分享页不是文件本身，所以只认真以 .epub 结尾的直链。
  function isDirectEpub(url) {
    if (!url) return false;
    if (/\.(epub)([?#].*)?$/i.test(url)) return true;
    try {
      // 中文书名常被编码成 %E6%9A%97.epub，解码后再认一次
      if (/\.epub$/i.test(decodeURIComponent(new URL(url).pathname || ''))) return true;
    } catch (e) {}
    return false;
  }

  // 是否直接 PDF 文件链接（阿里云 OSS / 腾讯云 COS 等直链）
  function isDirectPdf(url) {
    if (!url) return false;
    if (/\.(pdf)([?#].*)?$/i.test(url)) return true;
    // 带签名或强制类型参数时，.pdf 就不在末尾了（OSS 的 response-content-type）
    if (/[?&]response-content-type=application(%2F|\/)pdf/i.test(url)) return true;
    try {
      // 中文文件名常被编码成 %E4%B8%AD.pdf，解码后再认一次
      if (/\.pdf$/i.test(decodeURIComponent(new URL(url).pathname || ''))) return true;
    } catch (e) {}
    return false;
  }

  // ===== 网盘链接识别 =====
  // 坑（重要）：网盘分享链接（百度/微云/夸克/阿里盘…）**不是文件本身，是一个 HTML 页面**。
  // 两条死结，都绕不过去：
  //   ① 网盘的下载服务器一律不给 CORS 头，浏览器里 fetch 不到文件字节流 ——
  //      pdf.js、<video>、<audio> 全读不了，只能整块下载；
  //   ② 就算想办法拿到临时直链，也带时效 + 登录态，存进平台过几小时就失效。
  // 所以这类链接只能「跳出去在网盘里看」，不可能内嵌阅读。
  // 必须显式提示：否则点下去就是浏览器默默开始下载一个 PDF（孩子端连下载了什么都看不到），
  // 谁也不知道发生了什么、还以为平台坏了。
  const NETDISK_HOSTS = [
    [/pan\.baidu\.com$/, '百度网盘'],
    [/yun\.baidu\.com$/, '百度网盘'],
    [/share\.weiyun\.com$/, '腾讯微云'],
    [/(^|\.)weiyun\.com$/, '腾讯微云'],
    [/pan\.quark\.cn$/, '夸克网盘'],
    [/(^|\.)quark\.cn$/, '夸克网盘'],
    [/(^|\.)aliyundrive\.com$/, '阿里云盘'],
    [/(^|\.)alipan\.com$/, '阿里云盘'],
    [/lanzou[a-z]*\.com$/, '蓝奏云'],
    [/(^|\.)115\.com$/, '115网盘'],
    [/(^|\.)123pan\.(com|cn)$/, '123云盘'],
    [/pan\.xunlei\.com$/, '迅雷网盘'],
    [/(^|\.)cowtransfer\.com$/, '奶牛快传'],
    [/(^|\.)wenshushu\.cn$/, '文叔叔'],
    [/(^|\.)mypikpak\.com$/, 'PikPak'],
    [/(^|\.)terabox\.com$/, 'Terabox']
  ];
  function netdiskInfo(url) {
    const h = hostOf(url);
    if (!h) return null;
    for (let i = 0; i < NETDISK_HOSTS.length; i++) {
      if (NETDISK_HOSTS[i][0].test(h)) return { name: NETDISK_HOSTS[i][1], host: h };
    }
    return null;
  }
  // 整条资源（可能多集）是否挂在网盘上 —— 列表页用它打标记
  function resIsNetdisk(r) {
    if (!r) return false;
    if (netdiskInfo(r.url)) return true;
    return (r.episodes || []).some(function (ep) { return netdiskInfo(ep.url); });
  }
  // 网盘链接专用说明卡：讲清楚「为什么不能直接读」+ 给退路，别默默下载
  function openNetdiskCard(title, type, url, nd) {

          <div class="nd-note">

            <b>想让孩子在平台里直接翻，把文件存到阿里云 OSS 就行</b>，一次上传永久有效。
          </div>

  // ===== B站播放：内嵌 / 外跳 双通道 =====
  // 坑（重要）：B站 player.html 内部会读 UA，只要含 "Mobile" 就执行
  // location.href 跳到 www.bilibili.com/blackboard/webplayer/mbplayer.html；
  // 而 mbplayer.html 不允许被第三方站点用 iframe 嵌入（跨主域被浏览器拦下），
  // 结果就是安卓平板 / 学习机永远停在开始画面转圈 —— 移动端内嵌基本无解。
  // 对策：平板 / 手机 / 学习机默认走「外跳播放卡」（一定能播），电脑才用 iframe 内嵌。
  function biliUrls(b) {
    const p = b.p ? ('&p=' + b.p) : '';
    const idq = (b.kind === 'bvid' ? 'bvid=' + b.id
               : b.kind === 'aid' ? 'aid=' + b.id
               : 'ep_id=' + b.id);
    const q = idq + p + '&autoplay=0&danmaku=0';
    let pageUrl = 'https://www.bilibili.com/';
    if (b.kind === 'bvid') pageUrl = 'https://www.bilibili.com/video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') pageUrl = 'https://www.bilibili.com/video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else pageUrl = 'https://www.bilibili.com/bangumi/play/ep' + b.id;
    let appUrl = '';
    if (b.kind === 'bvid') appUrl = 'bilibili://video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') appUrl = 'bilibili://video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else appUrl = 'bilibili://bangumi/season/ep' + b.id;
    return {
      desktop: 'https://player.bilibili.com/player.html?' + q + '&as_wide=1',
      mobile: 'https://www.bilibili.com/blackboard/webplayer/mbplayer.html?' + q,
      page: pageUrl,
      app: appUrl
    };
  }
  function biliIsTouch() {
    const ua = navigator.userAgent || '';
    if (/Android|iPhone|iPod|iPad|Windows Phone|Mobile|Tablet/i.test(ua)) return true;
    if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return true;
    return false;
  }
  function biliPref() { try { return localStorage.getItem('flp_bili_mode') || ''; } catch (e) { return ''; } }
  function biliSetPref(v) { try { localStorage.setItem('flp_bili_mode', v); } catch (e) {} }

  /**
   * ===== PDF 阅读器（PDF.js 逐页画到 canvas）=====
   *
   * 为什么不用 iframe：<iframe src="xx.pdf"> 靠的是 Chrome 自带的 PDF 插件，
   * 而 Android WebView 里根本没有这个插件 —— 在咱们的 APP 壳、学而思学习机上
   * 表现就是一片空白，或者干脆变成「开始下载」。
   * 所以改成 PDF.js 把每一页渲染到 canvas：壳、学习机、手机浏览器全都一样，
   * 而且不跳出平台，家长控制不会漏。
   *
   * 唯一的硬前提：PDF 服务器必须开 CORS（跨域）。
   * 阿里云 OSS 默认不开，pdf.js 的 fetch 会直接被浏览器拦掉，
   * 这时下面会弹出一段说人话的排查指引，而不是让人对着转圈发呆。
   */
  var PDFJS_VERSION = '3.11.174';
  // pdf.js 加载源，按顺序自动降级，哪个能用用哪个：
  //   ① 自家 OSS（深圳节点，家里网访问最快）—— 把 pdfjs/ 两个文件传上去就生效，不用改代码
  //   ② 本站同域 pdfjs/ 目录 —— 随网页一起部署，最稳
  //   ③ 公共 CDN —— 最后兜底
  var PDFJS_BASES = [
    'https://lantu5558.oss-cn-shenzhen.aliyuncs.com/pdfjs/',
    'pdfjs/',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/build/',
    'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/build/'
  ];
  var PDFJS_ACTIVE_BASE = '';
  var _pdfjsPromise = null;

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script-load-failed')); };
      document.head.appendChild(s);
    });
  }
  // 懒加载：只有真要看 PDF 的时候才去下 pdf.js（主程序 + worker 约 1.4MB），
  // 平时不打搅页面打开速度。加载一次就缓存在内存里。
  function loadPdfjs() {
    if (_pdfjsPromise) return _pdfjsPromise;
    _pdfjsPromise = (function tryBase(i) {
      if (i >= PDFJS_BASES.length) return Promise.reject(new Error('pdfjs-all-sources-failed'));
      var base = PDFJS_BASES[i];
      return loadScript(base + 'pdf.min.js').then(function () {
        var lib = window.pdfjsLib;
        if (!lib || !lib.getDocument) throw new Error('pdfjs-invalid');
        lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
        PDFJS_ACTIVE_BASE = base;

     epub.js 把每一章塞进 iframe 里「重排」显示 —— 这是 EPUB 相对 PDF 最大的好处：
     字会自动跟着屏幕宽度走，手机上不用放大缩小，还能调字号。

     硬前提（和 PDF 一样）：文件服务器必须开 CORS，否则连包都取不回来。
     第二个前提：书不能带 DRM 加密（Kindle 正版书大多是加密的）。
     加密的书 epub.js 解得开目录、解不开正文，只能换无加密的 epub 文件。
     ================================================================== */
  var EPUBJS_VERSION = '0.3.93';
  var JSZIP_VERSION = '3.10.1';
  // epub.js 和它依赖的 JSZip 的加载源，按顺序自动降级，哪个能用用哪个：
  //   ① 自家 OSS（深圳节点，家里网访问最快）—— 把 jszip.min.js、epub.min.js
  //      两个文件传到 Bucket 的 epubjs/ 目录下就生效，不用改代码
  //   ② 本站同域 epubjs/ 目录 —— 随网页一起部署，最稳
  //   ③ 公共 CDN —— 最后兜底
  var EPUBJS_BASES = [
    'https://lantu5558.oss-cn-shenzhen.aliyuncs.com/epubjs/',
    'epubjs/',
    'https://cdn.jsdelivr.net/npm/epubjs@' + EPUBJS_VERSION + '/dist/',
    'https://unpkg.com/epubjs@' + EPUBJS_VERSION + '/dist/'
  ];
  var JSZIP_BASES = [
    'https://lantu5558.oss-cn-shenzhen.aliyuncs.com/epubjs/',
    'epubjs/',
    'https://cdn.jsdelivr.net/npm/jszip@' + JSZIP_VERSION + '/dist/',
    'https://unpkg.com/jszip@' + JSZIP_VERSION + '/dist/'
  ];
  var EPUBJS_ACTIVE_BASE = '';
  var _epubjsPromise = null;

  /** 按顺序试各个源，加载成功后用 check() 校验全局变量真的挂上了 ——
   *  返回 200 不代表能用（CDN 挂了时常返回一张错误页），所以每次都得验一下。 */
  function loadOneOf(bases, file, check) {
    return (function tryBase(i) {
      if (i >= bases.length) return Promise.reject(new Error(file + '-all-sources-failed'));
      return loadScript(bases[i] + file).then(function () {
        if (!check()) throw new Error(file + '-invalid');
        return bases[i];
      }).catch(function () { return tryBase(i + 1); });
    })(0);
  }

  /** 懒加载：只有真要看 EPUB 时才去下（JSZip 约 100KB + epub.js 约 220KB），
   *  平时不影响开页速度。加载一次就缓存在内存里。
   *
   *  坑（2026-09-01 实测）：epub.js 0.3.x 的 dist/epub.min.js **不是自包含的**。
   *  它的 UMD 头是 t.ePub = e(t.JSZip) —— 加载的那一刻就去读 window.JSZip。
   *  所以必须先加载 JSZip 再加载 epub.js；顺序反了，epub.js 会静默装上一个
   *  没有解压能力的空壳，表现是「目录能出来、正文一片空白」，极难排查。 */
  function loadEpubjs() {
    if (_epubjsPromise) return _epubjsPromise;
    _epubjsPromise = loadOneOf(JSZIP_BASES, 'jszip.min.js', function () { return !!window.JSZip; })
      .then(function () {
        return loadOneOf(EPUBJS_BASES, 'epub.min.js', function () { return !!window.ePub; });
      })
      .then(function (base) {
        EPUBJS_ACTIVE_BASE = base;
        return window.ePub;
      });
    _epubjsPromise.catch(function () { _epubjsPromise = null; }); // 失败后允许下次重试
    return _epubjsPromise;
  }

  var EPUB = null;      // 当前这本：{ book, rendition, url, toc, fontSize }
  var EPUB_TOKEN = 0;   // 每次打开 +1，异步回调靠它判断「这还是不是同一次打开」

  /** 阅读进度存本机，不往云端同步。
   *  存的是 CFI —— 书内部的定位坐标（形如 epubcfi(/6/4[...]），几十个字符）。
   *  它只对「这一本文件」有意义，换设备没书也用不上；
   *  更重要的是同步包体积敏感（整包覆盖有丢数据的风险），没必要为它加字段。 */
  function epubPosKey(url) { return 'lebao:epubpos:' + url; }
  function epubGetPos(url) {
    try { return localStorage.getItem(epubPosKey(url)) || ''; } catch (e) { return ''; }
  }
  function epubSetPos(url, cfi) {
    try { if (cfi) localStorage.setItem(epubPosKey(url), cfi); } catch (e) {}
  }

  function epubSetLoadText(t) {
    var el = document.getElementById('epub-loadtext');

  function epubStart(title, url) {
    epubDestroy();              // 开新一本之前，先把上一本占的内存还回去
    var token = EPUB_TOKEN;     // 记住这次的编号
    var stale = function () { return EPUB_TOKEN !== token; };
    if (!document.getElementById('epub-stage')) return;
    epubSetLoadText('正在加载阅读器…');
    loadEpubjs().then(function (ePub) {
      if (stale()) return null;
      epubSetLoadText('正在打开电子书…');
      var book = ePub(url, { openAs: 'epub' });
      var rendition = book.renderTo('epub-view', {
        width: '100%', height: '100%',
        // 手机上永远单页：双页并排会把字挤得没法看
        spread: 'none',
        flow: 'paginated'
      });
      EPUB = { book: book, rendition: rendition, url: url, toc: [], fontSize: 100, title: title };
      // 每翻一次页就记一次位置，下次打开直接回到这里
      rendition.on('relocated', function (loc) {
        if (stale() || !loc || !loc.start) return;
        epubSetPos(url, loc.start.cfi);
        epubTip(loc);
      });
      // book.ready = 元数据已经读完（此时才能安全地去翻页）
      return book.ready.then(function () {
        if (stale()) return null;
        // 有上次的进度就接着看，没有就从第一页开始
        return rendition.display(epubGetPos(url) || undefined);
      }).then(function () {
        if (stale()) return null;
        var ld = document.getElementById('epub-loading');
        if (ld && ld.remove) ld.remove();
        return book.loaded.navigation;
      }).then(function (nav) {
        if (stale()) return null;
        EPUB.toc = (nav && nav.toc) || [];
        epubRenderToc();
        epubTip();
      });
    }).catch(function (e) {
      if (stale()) return;
      epubFail(url, (e && e.message) || String(e));
    });
  }

  function epubGo(d) {
    if (!EPUB) return;
    try { if (d < 0) EPUB.rendition.prev(); else EPUB.rendition.next(); } catch (e) {}
  }
  function epubFont(d) {
    if (!EPUB) return;
    var s = EPUB.fontSize + d;
    if (s < 70) s = 70;
    if (s > 200) s = 200;
    EPUB.fontSize = s;
    try { EPUB.rendition.themes.fontSize(s + '%'); } catch (e) {}

  }
  function epubTocToggle() {
    var box = document.getElementById('epub-toc');

  function epubRenderToc() {
    var list = document.getElementById('epub-toc-list');

      list.innerHTML = '<div style="padding:18px 16px;color:var(--gray-600);font-size:13px;text-align:center">这本书没有目录</div>';
      return;
    }
    list.innerHTML = EPUB.toc.map(function (t, i) {
      var label = String((t && (t.label || t.title)) || '').trim();
      // 子章节缩进一点，深浅一眼能分出来
      var sub = t && (t.level > 0 || (t.subitems && t.subitems.length)) ? ' sub' : '';
      return `<button class="epub-toc-item${sub}" onclick="epubGoto(${i})">${esc(label || ('第' + (i + 1) + '章'))}</button>`;
    }).join('');
  }
  function epubGoto(i) {
    if (!EPUB || !EPUB.toc[i]) return;
    try { EPUB.rendition.display(EPUB.toc[i].href); } catch (e) {}
    epubTocToggle();
  }
  /** 底部那行提示：现在在第几章、字号多大 */
  function epubTip(loc) {
    var el = document.getElementById('epub-tip');
    if (!el || !EPUB) return;
    var chap = '';
    var href = loc && loc.start && loc.start.href;
    if (href) {
      var h = String(href).split('#')[0];
      for (var i = 0; i < EPUB.toc.length; i++) {
        var t = EPUB.toc[i];
        if (t && t.href && String(t.href).split('#')[0] === h) {
          chap = String(t.label || t.title || '').trim();
          break;
        }

    }
    el.textContent = (chap ? chap + ' · ' : '') + '字号 ' + EPUB.fontSize + '%';
  }
  function epubFsToggle(el) {
    var mask = el && el.closest ? el.closest('.modal-mask') : null;
    if (!mask) return;
    var m = mask.querySelector('.modal');
    if (!m) return;
    var on = !m.classList.contains('lv-fs');
    m.classList.toggle('lv-fs', on);
    try {
      var de = document.documentElement;
      if (on) {
        if (de.requestFullscreen) { var p = de.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      } else if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) { var q = document.exitFullscreen(); if (q && q.catch) q.catch(function () {}); }
        else if (de.webkitExitFullscreen) de.webkitExitFullscreen();
      }
    } catch (e) { /* 拿不到系统全屏就纯 CSS 铺满，照样能看 */ }

    setTimeout(function () {

   *  关掉弹窗只是摘掉 DOM，book 还被 EPUB 这个变量拽着 —— 来回开几本就崩了。 */
  function epubDestroy() {
    EPUB_TOKEN++;
    if (EPUB && EPUB.book) { try { EPUB.book.destroy(); } catch (e) {} }
    EPUB = null;
  }

  /** 打不开的时候，讲清楚是哪一种原因 —— EPUB 打不开基本就三种情况。 */
  function epubFail(url, detail) {

    if (!stage) return;
    var host = '';
    try { host = new URL(url).hostname; } catch (e) { host = ''; }
    // 网络层拿不到数据，99% 是跨域没开 —— 给能照着做的排查步骤
    var isNet = /failed to fetch|networkerror|cors|network|fetch|load failed/i.test(detail);

    if (isNet) {

        '除非对方明确同意。阿里云 OSS 默认不开，手动开一次就行（开完所有资料都能看，一劳永逸）：' +
        '<ol>' +
        '<li>打开 <b>阿里云 OSS 控制台</b>，进 Bucket <code>' + esc(host.split('.')[0] || host) + '</code></li>' +
        '<li>左侧 <b>数据安全 → 跨域设置</b> → 创建规则</li>' +
        '<li>来源填 <code>https://lantu5558.github.io</code></li>' +

        '<li>暴露 Headers 填 <code>*</code>；缓存时间 <code>3600</code></li>' +
        '</ol>';
    }

      '<br>· 链接不是文件本身而是 <b>网盘分享页</b> —— 网盘不给跨域，只能下载后用其他应用看。' +
      '</div>' +
      '<div style="margin-top:8px;font-size:11.5px;opacity:.8">错误信息：<code>' + esc(detail) + '</code></div>' +

  // 解析多行分集文本：一行一集。支持「标题 | 链接」「标题 链接」「只有链接」三种写法
  function parseEpsText(txt) {
    const out = [];
    String(txt || '').split('\n').forEach(function (line) {
      const s = String(line || '').trim();
      if (!s) return;
      let title = '', url = '';
      const m = s.split(/\s*[|\uFF5C]\s*/);
      if (m.length >= 2 && /^https?:\/\//i.test(m[1].trim())) {
        title = m[0].trim(); url = m.slice(1).join('|').trim();
      } else {
        const w = s.split(/\s+/);
        let hit = -1;
        for (let i = 0; i < w.length; i++) { if (/^https?:\/\//i.test(w[i])) { hit = i; break; } }
        if (hit >= 0) { title = w.slice(0, hit).join(' ').trim(); url = w.slice(hit).join(' ').trim(); }
        else if (/^https?:\/\//i.test(s)) { url = s; }
      }
      if (url) out.push({ title: title, url: url });
    });
    return out;
  }
  // 奖励的分集列表：没配 eps 的老奖励退化成「单集」，行为跟以前一样
  function rwEpsOf(r) {
    if (!r) return [];
    if (r.eps && r.eps.length) return r.eps;
    return r.url ? [{ title: r.title, url: r.url }] : [];
  }
  function addReward() {

    const url = cat === 'promise' ? '' : document.getElementById('rw-url').value.trim();

    if (!title) { toast('标题要填'); return; }
    if (cat !== 'promise' && !url && !eps.length) { toast('视频类奖励要填微云链接或分集'); return; }
    if (eps.length === 1 && !url) { toast('只有 1 集就直接填上面的链接'); return; }
    const rw = { id: 'rw'+Date.now(), title, emoji, cost, url, cat };
    if (eps.length >= 2) { rw.eps = eps; if (!url) rw.url = eps[0].url; }
    DATA.rewards.push(rw);

  // 视频/音频类奖励：限看 MAX_REWARD_VIEWS 次，每次播放记一次数，不重复扣积分
  const MAX_REWARD_VIEWS = 5;
  function playRedemption(rdId) {
    const c = kidCheck(); if (!c) return;
    const rd = (DATA.redemptions || []).find(x => x.id === rdId); if (!rd) return;
    if (rd.childId !== c.id) return; // 只能重看自己的兑换

    if ((rd.views || 0) >= MAX_REWARD_VIEWS) { toast('已达观看上限（' + MAX_REWARD_VIEWS + '次）'); return; }

  // 多集奖励：一次兑换，全部集数都能看；每集各算 MAX_REWARD_VIEWS 次，互不影响
  // 老兑换记录没有 epViews：单集沿用原来的 views，不会把已看次数清零
  function rwEpViewed(rd, i) {
    if (!rd) return 0;
    if (rd.epViews && typeof rd.epViews[i] === 'number') return rd.epViews[i];
    return i === 0 ? (rd.views || 0) : 0;
  }
  function rwEpLeft(rd, i) { return Math.max(0, MAX_REWARD_VIEWS - rwEpViewed(rd, i)); }
  function openRedeemEps(rdId) {
    const c = kidCheck(); if (!c) return;
    const rd = (DATA.redemptions || []).find(x => x.id === rdId); if (!rd) return;
    const r = DATA.rewards.find(x => x.id === rd.rewardId); if (!r) return;
    const eps = rwEpsOf(r);
    if (!eps.length) { toast('这条奖励没有可播放的资源'); return; }
    const modal = document.createElement('div');
    modal.className = 'modal-mask video-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal video-modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>${esc(r.title)} <span class="text-mute" style="font-size:12px">\u00B7 \u5171 ${eps.length} \u96C6</span></h3>
        <div class="episode-list">
          ${eps.map((ep, i) => {
            const left = rwEpLeft(rd, i);
            return `<div class="episode-item" onclick="playRedemptionEp('${rd.id}',${i})">
              <span class="ep-num">${i + 1}</span>
              <span class="ep-title">${esc(ep.title || ('\u7B2C' + (i + 1) + '\u96C6'))}</span>
              <span class="ep-play" id="rwep-left-${i}">${left > 0 ? (ICN.play + ' \u5269' + left) : '\u5DF2\u770B\u5B8C'}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    document.getElementById('modal-root').appendChild(modal);
  }
  function playRedemptionEp(rdId, i) {
    const c = kidCheck(); if (!c) return;
    const rd = (DATA.redemptions || []).find(x => x.id === rdId); if (!rd) return;
    if (rd.childId !== c.id) return;   // 只能看自己兑换的
    const r = DATA.rewards.find(x => x.id === rd.rewardId); if (!r) return;
    const eps = rwEpsOf(r);
    const ep = eps[i];
    if (!ep || !ep.url) { toast('这一集没有可播放的链接'); return; }
    if (rwEpLeft(rd, i) <= 0) { toast('这一集已看满 ' + MAX_REWARD_VIEWS + ' 次'); return; }
    if (!rd.epViews) rd.epViews = {};
    rd.epViews[i] = rwEpViewed(rd, i) + 1;
    rd.views = (rd.views || 0) + 1;
    saveData(DATA);
    // 就地刷新这一集的剩余次数，孩子不用关掉面板才知道还剩几次
    const el = document.getElementById('rwep-left-' + i);
    if (el) { const l = rwEpLeft(rd, i); el.textContent = l > 0 ? (ICN.play + ' \u5269' + l) : '\u5DF2\u770B\u5B8C'; }
    openResourceLink(ep.title || (r.title + ' \u7B2C' + (i + 1) + '\u96C6'), 'video', ep.url);
  }

  // 孩子用积分兑换奖励：扣积分 + 记录；视频类直接打开(记第1次观看)，妈妈许诺类进入待兑现
  function redeemReward(id) {
    const c = kidCheck(); if (!c) return;
    const r = DATA.rewards.find(x => x.id === id); if (!r) return;
    if (c.points < r.cost) { toast('积分不够，还差 ' + (r.cost - c.points) + ' 分'); return; }
    c.points -= r.cost;
    const isPromise = r.cat === 'promise';
    const rd = { id: 'rd'+Date.now(), childId: c.id, rewardId: id, rewardTitle: r.title, emoji: r.emoji, cost: r.cost, cat: r.cat, at: Date.now(), status: isPromise ? 'pending' : 'done', views: 0 };
    DATA.redemptions.unshift(rd);
    DATA.pointsHistory.unshift({ id: 'h'+Date.now(), childId: c.id, date: TODAY, title: '兑换：'+r.title, points: -r.cost, at: Date.now() });
    saveData(DATA); render();
    if (isPromise) toast('已申请！等妈妈带你去 ' + r.emoji);
    else if (rwEpsOf(r).length >= 2) { saveData(DATA); render(); openRedeemEps(rd.id); }
    else playRedemption(rd.id);
  }
  // 妈妈后台：标记许诺类奖励已兑现
  function markRedemptionDone(id) {
    const r = (DATA.redemptions||[]).find(x => x.id === id); if (!r) return;
    r.status = 'done'; r.doneAt = Date.now();
    saveData(DATA); render(); toast('已标记兑现 ✅');
  }
  // 妈妈后台：转盘盘面设置（扇区内容 + 概率权重 + 关联许诺奖励）
  function openWheelModal() {
    const segs = DATA.wheel || (DATA.wheel = []);
    const totalW = segs.reduce((a, s) => a + (s.w || 0), 0) || 1;
    const rows = segs.map((s, i) => {
      const pct = ((s.w || 0) / totalW * 100).toFixed(0);
      return `<div class="wheel-seg-edit">
        <input class="wl-label" value="${esc(s.label || '')}" placeholder="扇区文字(如：一次购物)" style="width:120px" oninput="wheelSegEdit(${i},'label',this.value)">
        <label>★<input type="number" min="0" value="${s.pts || 0}" style="width:50px" oninput="wheelSegEdit(${i},'pts',this.value)" ${s.again ? 'disabled' : ''}></label>
        <label>权重<input type="number" min="1" max="999" value="${s.w || 1}" style="width:50px" oninput="wheelSegEdit(${i},'w',this.value)"></label>
        <label><input type="checkbox" ${s.again ? 'checked' : ''} onchange="wheelSegAgain(${i},this.checked)">再来一次</label>
        <span class="wl-pct">${pct}%</span>
        <button class="icon-btn" onclick="wheelSegDel(${i})" title="删除扇区">${ICN.trash}</button>
      </div>`;
    }).join('');
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>🎡 转盘盘面设置</h3>
        <p class="text-mute">概率 = 该扇区「权重」占全部权重的比例，权重越大越容易转到。扇区文字可写「一次购物」「去公园」等<b>口头允诺</b>奖励，由妈妈和孩子商量兑现，不需系统确认。</p>
        <div class="wheel-seg-list">${rows || '<p>还没有扇区，点下面添加</p>'}</div>
        <button class="btn-secondary" style="width:100%;margin-top:8px" onclick="wheelSegAdd()">+ 添加一个扇区</button>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn-primary" onclick="saveWheel()">保存盘面</button>
        </div>
      </div>
    `;
    const root = document.getElementById('modal-root');
    if (root) { const old = root.querySelector('.modal-mask'); if (old) old.remove(); root.appendChild(modal); }
  }
  function wheelSegEdit(i, field, val) {
    const segs = DATA.wheel || []; if (!segs[i]) return;
    segs[i][field] = (field === 'pts' || field === 'w') ? (parseInt(val) || 0) : val;
    updateWheelPctLabels();
  }
  function wheelSegAgain(i, chk) {
    const segs = DATA.wheel || []; if (!segs[i]) return;
    segs[i].again = chk; if (chk) segs[i].pts = 0;
    openWheelModal();
  }
  function wheelSegAdd() {
    if (!DATA.wheel) DATA.wheel = [];
    DATA.wheel.push({ id: 'ws' + Date.now(), label: '新扇区', pts: 0, w: 10 });
    openWheelModal();
  }
  function wheelSegDel(i) {
    if (!DATA.wheel) return;
    DATA.wheel.splice(i, 1);
    openWheelModal();
  }
  function updateWheelPctLabels() {
    const segs = DATA.wheel || [];
    const total = segs.reduce((a, s) => a + (s.w || 0), 0) || 1;
    document.querySelectorAll('.wheel-seg-edit').forEach((row, idx) => {
      const p = row.querySelector('.wl-pct');
      if (p) p.textContent = (((segs[idx] && segs[idx].w) || 0) / total * 100).toFixed(0) + '%';
    });
  }
  function saveWheel() {
    DATA.wheel = (DATA.wheel || []).filter(s => s && (s.label || '').trim()).map(s => ({
      id: s.id || ('ws' + Date.now() + Math.random().toString(36).slice(2, 6)),
      label: (s.label || '').trim(),
      pts: s.again ? 0 : (parseInt(s.pts) || 0),
      w: Math.max(1, parseInt(s.w) || 1),
      again: !!s.again
    }));
    saveData(DATA);
    const m = document.querySelector('.modal-mask'); if (m) m.remove();
    render(); toast('转盘盘面已保存 🎡');
  }

  // ========== 模态：编辑孩子 ==========
  function editChild(id) {
    const c = DATA.children.find(x => x.id === id);
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>编辑 ${esc(c.name)}</h3>
        <div class="field"><label>头像 Emoji</label><input id="c-emoji" value="${c.avatar}" maxlength="2" /></div>
        <div class="field"><label>姓名</label><input id="c-name" value="${esc(c.name)}" /></div>
        <div class="field"><label>PIN（4 位数字）</label><input id="c-pin" value="${c.pin}" maxlength="4" pattern="\\d{4}" /></div>
        <div class="field"><label>当前积分</label><input id="c-points" type="number" value="${c.points}" /></div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="delChild('${c.id}')">删除</button>
          <button class="btn-primary" onclick="saveChild('${c.id}')">保存</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }
  function openChildModal() {
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>添加孩子</h3>
        <div class="field"><label>头像 Emoji</label><input id="nc-emoji" value="👶" maxlength="2" /></div>
        <div class="field"><label>姓名</label><input id="nc-name" placeholder="例：小宝" /></div>
        <div class="field"><label>PIN（4 位数字）</label><input id="nc-pin" value="0000" maxlength="4" /></div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn-primary" onclick="addChild()">添加</button>
        </div>
      </div>
    `;
    document.getElementById('modal-root').appendChild(modal);
  }
  function saveChild(id) {
    const c = DATA.children.find(x => x.id === id);
    c.avatar = document.getElementById('c-emoji').value || c.avatar;
    c.name = document.getElementById('c-name').value || c.name;
    const pin = document.getElementById('c-pin').value;
    if (/^\d{4}$/.test(pin)) c.pin = pin; else { toast('PIN 必须是 4 位数字'); return; }
    const np = parseInt(document.getElementById('c-points').value) || 0;
    c.earned = Math.max(c.earned || 0, np); // 妈妈手动改积分：累计获得不低于当前余额
    c.points = np;
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已保存');
  }
  function addChild() {
    const emoji = document.getElementById('nc-emoji').value || '👶';
    const name = document.getElementById('nc-name').value.trim();
    const pin = document.getElementById('nc-pin').value;
    if (!name) { toast('写个名字'); return; }
    if (!/^\d{4}$/.test(pin)) { toast('PIN 必须是 4 位数字'); return; }
    DATA.children.push({ id: 'c'+Date.now(), name, avatar: emoji, pin, points: 0, streak: 0 });
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已添加');
  }
  function delChild(id) {
    if (!confirm('确认删除这个孩子？')) return;
    tombAdd('children', id);
    // 顺带删掉这个孩子的任务 —— 不一起记墓碑的话，孩子的档案没了、任务还会飘回来
    (DATA.tasks || []).forEach(t => { if (t.childId === id) tombAdd('tasks', t.id); });
    DATA.children = DATA.children.filter(c => c.id !== id);
    DATA.tasks = DATA.tasks.filter(t => t.childId !== id);
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已删除');
  }

  function changePassword() {
    // 先验旧密码：孩子万一摸到妈妈端设置，不能让他直接把妈妈锁在外面
    const old = prompt('请输入当前的妈妈密码');
    if (old === null) return;
    if (String(old).trim() !== String(DATA.momPassword || '8888')) { toast('当前密码不对'); return; }
    const np = prompt('新密码（4 位数字）');
    if (np === null) return;
    if (!/^\d{4}$/.test(String(np).trim())) { toast('必须是 4 位数字'); return; }
    const np2 = prompt('请再输入一次新密码，确认没打错');
    if (np2 === null) return;
    if (String(np2).trim() !== String(np).trim()) { toast('两次输入不一致，已取消'); return; }
    // momPwdTs 是同步合并的判定依据，缺了它改完会被远端旧值冲掉（见 mergeData）
    DATA.momPassword = String(np).trim();
    DATA.momPwdTs = Date.now();
    saveData(DATA);
    const syncing = SYNC && SYNC.code && SYNC.status === 'on';
    toast(syncing ? '密码已改为 ' + DATA.momPassword + '，其他设备稍后自动同步'
                  : '密码已改为 ' + DATA.momPassword + '（本机未开同步，其他设备不会变）');
  }
  function exportData() {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lebao-data-${TODAY}.json`;
    a.click();
  }
  function resetData() {
    if (!confirm('确认重置？所有数据会回到初始演示状态')) return;
    localStorage.removeItem(LS_KEY);
    DATA = loadData();
    render();
    // 开着同步时，「重置」只是把本机清回出厂状态，下一秒云端的真实数据就会拉回来，
    // 不会把示例推上去覆盖全家的数据（出厂数据带 __seed 标记，合并时一律以云端为准）
    if (SYNC && SYNC.code) {
      toast('已重置本机，正在从云端取回家里的数据…');
      syncPull(true).catch(() => {});
    } else toast('已重置');
  }
  function logout() {
    sessionStorage.removeItem('mom-auth');
    location.hash = 'entry';
  }

  // ========== 启动 ==========
  // 坑（重要）：normalizeData 以前只在「收到远端数据」时跑，本地老数据永远补不上 kind，
  // 结果妈妈在网页上布置的看视频任务，孩子端 t.kind 是 undefined，退化成普通任务、
  // 点了就直接勾完，根本不放视频。这里启动时对本地数据也补一遍。
  try { DATA = normalizeData(DATA); } catch (e) {}
  // 补种出来的新书要落库并推一次云端：只留在本机内存里的话，妈妈换台设备又看不见了。
  if (BUILTIN_SEEDED > 0) { try { saveData(DATA); } catch (e) {} }
  try { wpRoll(true); } catch (e) {}   // 跨天了先把今天那批补出来（silent：启动阶段不触发推送）
  // 学习足迹的收尾钩子。整段包一层：记不上足迹是小事，
  // 万一哪个环境的浏览器 API 缺一块，把启动打断成白屏、全家打不开平台才是大事。
  try {
    fpWatchModals();                     // 弹窗关掉 = 这次观看 / 阅读结束
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) fpPause(); else fpResume(); // 切后台不计时
    });
  } catch (e) {}
  window.addEventListener('hashchange', render);
  render();

  // 注册 service worker（PWA 离线）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  </script>
</body>
</html>
