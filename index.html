    openLooseVideo(t, v.title, null, v.url, v.sub);
  }

  // ---- 严格模式（平台自己的播放器，完全可控）----
  let SV = null;   // { task, video, maxSeen, finished, rate }
  const SV_RATES = [1, 1.25, 1.5];   // 最高 1.5 倍速
  function openStrictVideo(task, title, url, subUrl) {
    closeSv();
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.id = 'sv-mask';
    mask.innerHTML = `
      <div class="modal">
        <h3 style="padding-right:34px">${esc(title)}</h3>
        <div class="sv-stage" id="sv-stage">
          <video id="sv-video" playsinline preload="auto" src="${escA(url)}" disablepictureinpicture controlslist="nodownload"></video>
          <button class="sv-cover" id="sv-cover" onclick="svToggle()">▶<span>点击开始播放</span></button>
        </div>
        <div class="sv-bar"><div class="sv-bar-in" id="sv-bar-in"></div></div>
        <div class="sv-time"><span id="sv-cur">00:00</span><span id="sv-pct">0%</span><span id="sv-dur">--:--</span></div>
        <div class="sv-ctrl">
          <button type="button" onclick="svSeek(-10)">⏪ 10秒</button>
          <button type="button" id="sv-playbtn" onclick="svToggle()">⏸ 暂停</button>
          <button type="button" id="sv-rate" onclick="svRate()">1.0×</button>
          <button type="button" onclick="svFull()">⛶ 全屏</button>
        </div>
        <div class="sv-subrow" id="sv-subrow">
          <button type="button" class="btn-sm" id="sv-sub" onclick="svToggleSub()">字幕：开</button>
          <span class="sv-subinfo" id="sv-subinfo"></span>
        </div>
        <div class="sv-tip">🔒 不能拖进度条、最高 1.5 倍速，看到最后自动打卡 +${task.points} 分</div>
      </div>`;
    document.getElementById('modal-root').appendChild(mask);
    SV = { task, video: document.getElementById('sv-video'), maxSeen: 0, finished: false, rate: 0,
           subUrl: '', subOn: false, subBlob: '' };
    const v = SV.video;
    if (!v) { closeSv(); return; }
    if (subUrl) svLoadSub(v, subUrl);
    v.playbackRate = SV_RATES[0];
    v.addEventListener('loadedmetadata', svResume);
    v.addEventListener('timeupdate', svTick);
    v.addEventListener('ended', svFinish);
    v.addEventListener('play', () => { svBtn('⏸ 暂停'); const c = document.getElementById('sv-cover'); if (c) c.style.display = 'none'; });
    v.addEventListener('pause', () => svBtn('▶ 继续'));
    v.addEventListener('contextmenu', e => e.preventDefault());
    v.addEventListener('keydown', e => {   // 拦掉键盘快进（方向键 / J / L）
      const k = (e.key || '').toLowerCase();
      if (['arrowright', 'arrowleft', 'arrowup', 'arrowdown', 'j', 'l', ' ', 'k'].indexOf(k) >= 0) e.preventDefault();
    });
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }
  function svBtn(txt) { const b = document.getElementById('sv-playbtn'); if (b) b.textContent = txt; }
  // ---- 字幕 ----
  // srt → vtt：浏览器只认 WebVTT。差别就是把时间轴的逗号换成点，再加个 WEBVTT 头。
  function srtToVtt(txt) {
    let s = String(txt == null ? '' : txt).replace(/^\uFEFF/, '');
    if (!s.trim()) return '';
    if (/^\s*WEBVTT/.test(s)) return s;                 // 已经是 vtt，原样返回
    s = s.replace(/\r\n?/g, '\n');
    s = s.replace(/\{\\[^}]*\}/g, '');                  // 去掉 {\an8} 这类 vtt 不认的定位标记
    s = s.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    s = s.replace(/(\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    return 'WEBVTT\n\n' + s.replace(/\n{3,}/g, '\n\n');
  }
  function svSubInfo(html) { const e = document.getElementById('sv-subinfo'); if (e) e.innerHTML = html; }
  function svSubBtn() {
    const b = document.getElementById('sv-sub');
    const row = document.getElementById('sv-subrow');
    if (!b || !SV) return;
    b.textContent = '字幕：' + (SV.subOn ? '开' : '关');
    if (row) row.classList.toggle('on', !!SV.subOn);
  }
  // 字幕是跨域文件，浏览器默认不让读 → 先 fetch 成文本转 blob 再挂 track（最稳）。
  // fetch 不通（网盘没开 CORS）就退一步直接挂 track，同时也把原因告诉妈妈。
  function svLoadSub(v, url) {
    if (!v || !url) return;
    const row = document.getElementById('sv-subrow');
    if (row) row.style.display = 'block';
    svSubInfo('字幕加载中…');
    fetch(url).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(txt => {
        const vtt = srtToVtt(txt);
        if (!vtt) throw new Error('empty');
        let bu = '';
        try { bu = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' })); } catch (e) { throw e; }
        if (!SV) return;
        SV.subBlob = bu; SV.subUrl = url;
        svAddTrack(v, bu, true);
        svSubInfo('字幕已就绪，点上面的按钮可以开关');
      })
      .catch(() => {
        // 退一步：直接挂 track（同源或已开 CORS 时能用）
        const tr = svAddTrack(v, url, true);
        if (tr) tr.addEventListener('error', () => svSubCorsHint());
        svSubInfo('字幕加载中…');
      });
  }
  function svAddTrack(v, src, show) {
    if (!v || !src || !SV) return null;
    try {
      const tr = document.createElement('track');
      tr.kind = 'subtitles'; tr.label = '字幕'; tr.srclang = 'zh'; tr.src = src;
      tr.default = !!show;
      v.appendChild(tr);
      if (v.textTracks && v.textTracks.length) {
        try { v.textTracks[v.textTracks.length - 1].mode = show ? 'showing' : 'hidden'; } catch (e) {}
      }
      SV.subOn = !!show;
      svSubBtn();
      return tr;
    } catch (e) { return null; }
  }
  function svSubCorsHint() {
    if (!SV) return;
    svSubInfo('<span style="color:var(--orange-600)">字幕没读出来 —— 存字幕的网盘/OSS 需要开一次「跨域 CORS」，' +
      '允许来源填 <b>https://lantu5558.github.io</b>。开完一次就一直有效，视频本身不受影响。</span>');
  }
  function svToggleSub() {
    const v = SV && SV.video;
    if (!v) return;
    if (!v.textTracks || !v.textTracks.length) { toast('这个视频还没挂字幕'); return; }
    SV.subOn = !SV.subOn;
    for (let i = 0; i < v.textTracks.length; i++) {
      try { v.textTracks[i].mode = SV.subOn ? 'showing' : 'hidden'; } catch (e) {}
    }
    svSubBtn();
    toast(SV.subOn ? '字幕已开' : '字幕已关');
  }
  function fmtDur(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), ss = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function svMeta() {
    const v = SV && SV.video;
    if (!v) return;
    const d = document.getElementById('sv-dur');
    if (d) d.textContent = fmtDur(v.duration);
  }
  // 续播：上次没看完退出了，这次从记住的地方接着看。
  // 坑（重要）：光设置 currentTime 不够 —— 必须同时把 maxSeen 抬上去，
  // 否则 svTick 会把这个跳跃当成「拖进度条」，一把拽回 0 秒，死循环。
  function svResume() {
    const v = SV && SV.video;
    if (!v) return;
    svMeta();
    const p = SV.task ? (SV.task.videoProgress || 0) : 0;
    if (!isFinite(v.duration) || v.duration <= 0) return;
    if (p > 3 && p < 98) {
      const at = v.duration * p / 100;
      SV.maxSeen = at;            // 先抬 maxSeen，再跳，否则会被判定成快进
      try { v.currentTime = at; } catch (e) {}
      const bar = document.getElementById('sv-bar-in');
      if (bar) bar.style.width = p + '%';
      const pc = document.getElementById('sv-pct');
      if (pc) pc.textContent = Math.round(p) + '%';
      toast('接着上次的 ' + Math.round(p) + '% 往下看');
    }
  }
  function svTick() {
    const v = SV && SV.video;
    if (!v || !v.duration || SV.finished) return;
    // 检测到跳跃 → 有人在拖进度条，拽回最远看到的位置
    if (v.currentTime > SV.maxSeen + 3) {
      v.currentTime = SV.maxSeen;
      toast('不能快进哦，认真看完 🎬');
      return;
    }
    if (v.currentTime > SV.maxSeen) SV.maxSeen = v.currentTime;
    if (v.playbackRate > 1.5) v.playbackRate = 1.5;   // 倍速封顶
    const pct = Math.max(0, Math.min(100, v.currentTime / v.duration * 100));
    const bar = document.getElementById('sv-bar-in');
    if (bar) bar.style.width = pct + '%';
    const cur = document.getElementById('sv-cur'); if (cur) cur.textContent = fmtDur(v.currentTime);
    const pc = document.getElementById('sv-pct'); if (pc) pc.textContent = Math.round(pct) + '%';
    SV.task.videoProgress = pct;
    if (pct >= 98) svFinish();
  }
  function svToggle() {
    const v = SV && SV.video;
    if (!v) return;
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    else v.pause();
  }
  function svSeek(delta) {
    const v = SV && SV.video;
    if (!v || !v.duration) return;
    // 只允许后退（回看没听清的地方），前进一律拒绝
    const target = Math.max(0, Math.min(SV.maxSeen, v.currentTime + delta));
    if (target > v.currentTime + 0.1 && target > SV.maxSeen) { toast('不能快进哦'); return; }
    v.currentTime = target;
  }
  function svRate() {
    const v = SV && SV.video;
    if (!v) return;
    SV.rate = (SV.rate + 1) % SV_RATES.length;
    v.playbackRate = SV_RATES[SV.rate];
    const b = document.getElementById('sv-rate');
    if (b) b.textContent = SV_RATES[SV.rate].toFixed(2).replace(/0$/, '') + '×';
    if (SV_RATES[SV.rate] === 1.5) toast('最快就是 1.5 倍速啦');
  }
  function svFull() {
    const v = SV && SV.video;
    if (!v) return;
    try {
      if (v.requestFullscreen) v.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
      else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
    } catch (e) {}
  }
  function svFinish() {
    if (!SV || SV.finished) return;
    SV.finished = true;
    const t = SV.task;
    t.videoProgress = 100;
    if (!t.done) {
      t.done = true; t.doneAt = Date.now();
      t.proofData = { type: 'video', data: null, at: Date.now() };
      const k = DATA.children.find(c => c.id === t.childId);
      if (k) {
        k.points += t.points;
        DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
      }
      saveData(DATA);
      toast(`看完啦！+${t.points} 分 🎉`);
    }
    const tip = document.querySelector('#sv-mask .sv-tip');
    if (tip) { tip.textContent = '✅ 已看完，自动打卡完成！'; tip.style.color = 'var(--green-600)'; }
    setTimeout(closeSv, 1500);
  }
  function closeSv() {
    if (SV && SV.video) {
      try { SV.video.pause(); } catch (e) {}
      const pct = SV.task.videoProgress || 0;
      if (!SV.finished && pct > 3 && pct < 98) {
        SV.task.videoProgress = pct;
        try { saveLocalOnly(DATA); } catch (e) {}
        toast('没看完不算打卡哦，下次接着看（已记到 ' + Math.round(pct) + '%）');
      }
    }
    if (SV && SV.subBlob) { try { URL.revokeObjectURL(SV.subBlob); } catch (e) {} }
    SV = null;
    const m = document.getElementById('sv-mask');
    if (m) m.remove();
    try { render(); } catch (e) {}
  }

  // ---- 宽松模式（B站等外站，管不了播放器，孩子自己确认）----
  function openLooseVideo(task, title, bili, rawUrl, subUrl) {
    let iframe = '';
    if (bili) {
      const u = biliUrls(bili);
      iframe = `<div class="video-wrap"><iframe src="${escA(u.desktop)}" scrolling="no" frameborder="no" allowfullscreen="true" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe></div>`;
    } else {
      iframe = `<div class="video-wrap"><iframe src="${escA(rawUrl)}" frameborder="no" allowfullscreen="true"></iframe></div>`;
    }
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.id = 'lv-mask';
    mask.innerHTML = `
      <div class="modal">
        <button class="icon-btn close" onclick="closeVideoModal(this)">✕</button>
        <h3 style="padding-right:34px">${esc(title)}</h3>
        ${iframe}
        <p class="wq-hint" style="margin-top:10px">这个视频在别的网站上，我们管不了它的播放器，所以没法自动判断有没有看完${subUrl ? '，也没法把字幕挂上去（视频存到自己的空间才能带字幕）' : ''}</p>
        <div class="lv-normal-bar">
          <button class="btn-secondary" style="width:100%;margin-top:10px" onclick="lvToggleFs()">⛶ 全屏观看</button>

        </div>
      </div>`;
    document.getElementById('modal-root').appendChild(mask);
    videoFsSet(mask, true);
  }

  /**
   * 影院模式开关 —— B站弹窗和任务宽松播放器共用同一套。
   *
   * 为什么不能指望 B站播放器自己的全屏按钮：
   * 它跑在跨域 iframe 里，一旦发现自己是被嵌着的，全屏按钮就走它内部的
   * 「网页全屏」，只会在 iframe 那块视口里铺满 —— 外层弹窗多大，它最大就多大。
   * 所以必须由外层把容器拉到整屏，iframe 跟着变大，这才真的会变大。
   *
   * 三档降级，能拿到哪档用哪档：
   *   ① APP 壳的 LebaoApp.setFullscreen() → 真横屏 + 隐藏状态栏 + 常亮（最好）
   *   ② 系统 requestFullscreen()          → 浏览器里的原生全屏
   *   ③ 纯 CSS 铺满                       → 任何环境都生效，至少是整屏
   * 每档失败都静默往下走，绝不影响播放。
   */
  function videoFsSet(mask, on) {
    if (!mask) return;
    const m = mask.querySelector('.modal');
    if (!m) return;
    m.classList.toggle('lv-fs', !!on);

    // ① 通知 APP 壳：真横屏 + 沉浸式 + 常亮
    try {
      if (window.LebaoApp && typeof window.LebaoApp.setFullscreen === 'function') {
        window.LebaoApp.setFullscreen(!!on);
      }
    } catch (e) { /* 浏览器里没有这个对象，正常 */ }

    // ② 系统全屏
    const de = document.documentElement;
    try {
      if (on) {
        if (de.requestFullscreen) { const p = de.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      } else if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) { /* 系统全屏用不了就纯 CSS，不打断播放 */ }

    // ③ 尽量跟着转成横屏（失败无所谓）
    try {
      if (on) { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }
      else if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
    if (!on) { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
  }
  function lvToggleFs() {
    const mask = document.getElementById('lv-mask');
    if (!mask) return;
    const m = mask.querySelector('.modal');
    videoFsSet(mask, !(m && m.classList.contains('lv-fs')));
  }
  function biliToggleFs() {
    const mask = document.querySelector('.modal-mask.video-mask');
    if (!mask) return;
    const m = mask.querySelector('.modal');
    videoFsSet(mask, !(m && m.classList.contains('lv-fs')));
  }
  /** 关任何视频弹窗都走这里：先退出全屏（不然壳会一直横屏 + 常亮），再移除。 */
  function closeVideoModal(el) {
    const mask = el && el.closest ? el.closest('.modal-mask') : null;

    else if (el && el.remove) el.remove();

  function lvDone(taskId) {

    }

  function openTaskRes(e, taskId) {

    // 合集资料：妈妈指定了某集则直接播该集，否则弹分集选择

  }

  // ========== 批量导入（AI 识别好的导入码） ==========
  // 格式：WBEPS1: + base64url(UTF-8 JSON)，JSON 为资源数组 [{title,type,subject,category,url,eps:[{title,url}]}]
  // 格式：WBEPS2: 紧凑版 [{title,type,subject,category,base,eps:[标题字符串|null]}]，url 由 base+?p=N 生成
  function decodeImportCode(code) {
    code = (code || '').trim();
    if (/^WBEPS2:/i.test(code)) {
      const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const items = JSON.parse(new TextDecoder().decode(bytes));
        if (!Array.isArray(items)) return null;
        const hasBili = u => !!parseBilibili(u);
        return items.filter(x => x && (x.base || x.url)).map(x => {
          let type = ['video', 'pdf', 'audio'].includes(x.type) ? x.type : 'video';
          if (hasBili(x.base) || hasBili(x.url)) type = 'video';
          const base = String(x.base || x.url || '');
          const eps = Array.isArray(x.eps) ? x.eps.map((e, i) => {
            const t = (typeof e === 'string' ? e : '').trim();
            return {
              title: t ? t.slice(0, 60) : '第' + (i + 1) + '集',
              url: base + (i > 0 ? '?p=' + (i + 1) : '')
            };
          }) : [];
          return {
            title: String(x.title || '').slice(0, 80),
            type,
            subject: SUBJECTS[x.subject] ? x.subject : 'suyang',
            category: x.category === 'fun' ? 'fun' : 'learn',
            url: eps.length ? eps[0].url : base,
            eps
          };
        });
      } catch (e) { return null; }
    }
    if (!/^WBEPS1:/i.test(code)) return null;
    const b64 = code.slice(7).replace(/-/g, '+').replace(/_/g, '/');
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const items = JSON.parse(new TextDecoder().decode(bytes));
      if (!Array.isArray(items)) return null;
      const hasBili = u => !!parseBilibili(u);
      return items.filter(x => x && (x.url || (x.eps && x.eps.length))).map(x => {
        let type = ['video', 'pdf', 'audio'].includes(x.type) ? x.type : 'video';
        if (hasBili(x.url) || (x.eps || []).some(e => hasBili(e.url))) type = 'video';
        return {
          title: String(x.title || '').slice(0, 80),
          type,
          subject: SUBJECTS[x.subject] ? x.subject : 'suyang',
          category: x.category === 'fun' ? 'fun' : 'learn',
          url: String(x.url || ''),
          eps: Array.isArray(x.eps) ? x.eps.filter(e => e && e.url).map(e => ({ title: String(e.title || '').slice(0, 60), url: String(e.url) })) : []
        };
      });
    } catch (e) { return null; }
  }

  // 通过公共 CORS 代理链拉取 B站分P列表（api 直调会被浏览器 CORS 拦截）
  function fetchBiliEpisodes(url) {
    const b = parseBilibili(url);
    if (!b || b.kind === 'ep') return Promise.resolve(null);
    const idParam = b.kind === 'bvid' ? 'bvid=' + b.id : 'aid=' + b.id;
    const api = 'https://api.bilibili.com/x/player/pagelist?' + idParam;
    const proxies = [
      u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
      u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://yacdn.org/proxy/' + u,
      u => 'https://cors.bridged.cc/' + u,
    ];
    const tryOne = (mk) => new Promise(resolve => {
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const timer = setTimeout(() => finish(null), 8000);
      fetch(mk(api)).then(r => r.text()).then(txt => {
        clearTimeout(timer);
        try {
          const obj = JSON.parse(txt);
          let arr = obj && Array.isArray(obj.data) ? obj.data : null;
          if (!arr && obj && obj.contents) {
            const inner = JSON.parse(obj.contents);
            if (inner && Array.isArray(inner.data)) arr = inner.data;
          }
          finish(arr);
        } catch (e) { finish(null); }
      }).catch(() => { clearTimeout(timer); finish(null); });
    });
    return (async () => {
      for (const p of proxies) {
        const arr = await tryOne(p);
        if (arr) return arr;
      }
      return null;
    })();
  }

  // 从链接中提取 B 站 BV 号 / av 号 / 番剧 ep 号 / 分P
  function parseBilibili(url) {
    if (!url) return null;
    const p = url.match(/[?&]p=(\d+)/);
    const pn = p ? p[1] : null;
    const bv = url.match(/BV[0-9A-Za-z]{10}/);
    if (bv) return { kind: 'bvid', id: bv[0], p: pn };
    const av = url.match(/[?&/]av(\d+)/);
    if (av) return { kind: 'aid', id: av[1], p: pn };
    // 番剧单集：bangumi/play/ep123456
    const ep = url.match(/bangumi\/play\/ep(\d+)/);
    if (ep) return { kind: 'ep', id: ep[1], p: pn };
    // 纯 BV 号输入（如直接粘贴 BV1xx411c7mD）
    const bare = url.match(/^BV[0-9A-Za-z]{10}$/);
    if (bare) return { kind: 'bvid', id: bare[0], p: pn };
    return null;
  }

  // 是否直接视频文件链接
  function isDirectVideo(url) {
    if (!url) return false;
    return /\.(mp4|webm|ogv|ogg|m4v|mov|m3u8|mkv|flv|ts)([?#].*)?$/i.test(url);
  }
  // 是否直接音频文件链接
  function isDirectAudio(url) {
    if (!url) return false;
    return /\.(mp3|wav|m4a|aac|ogg|flac|opus)([?#].*)?$/i.test(url);
  }
  // 是否直接 PDF 文件链接（阿里云 OSS / 腾讯云 COS 等直链）
  function isDirectPdf(url) {
    if (!url) return false;
    if (/\.(pdf)([?#].*)?$/i.test(url)) return true;
    // 带签名或强制类型参数时，.pdf 就不在末尾了（OSS 的 response-content-type）
    if (/[?&]response-content-type=application(%2F|\/)pdf/i.test(url)) return true;
    try {
      // 中文文件名常被编码成 %E4%B8%AD.pdf，解码后再认一次
      if (/\.pdf$/i.test(decodeURIComponent(new URL(url).pathname || ''))) return true;
    } catch (e) {}
    return false;
  }

  // ===== B站播放：内嵌 / 外跳 双通道 =====
  // 坑（重要）：B站 player.html 内部会读 UA，只要含 "Mobile" 就执行
  // location.href 跳到 www.bilibili.com/blackboard/webplayer/mbplayer.html；
  // 而 mbplayer.html 不允许被第三方站点用 iframe 嵌入（跨主域被浏览器拦下），
  // 结果就是安卓平板 / 学习机永远停在开始画面转圈 —— 移动端内嵌基本无解。
  // 对策：平板 / 手机 / 学习机默认走「外跳播放卡」（一定能播），电脑才用 iframe 内嵌。
  function biliUrls(b) {
    const p = b.p ? ('&p=' + b.p) : '';
    const idq = (b.kind === 'bvid' ? 'bvid=' + b.id
               : b.kind === 'aid' ? 'aid=' + b.id
               : 'ep_id=' + b.id);
    const q = idq + p + '&autoplay=0&danmaku=0';
    let pageUrl = 'https://www.bilibili.com/';
    if (b.kind === 'bvid') pageUrl = 'https://www.bilibili.com/video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') pageUrl = 'https://www.bilibili.com/video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else pageUrl = 'https://www.bilibili.com/bangumi/play/ep' + b.id;
    let appUrl = '';
    if (b.kind === 'bvid') appUrl = 'bilibili://video/' + b.id + (b.p ? ('?p=' + b.p) : '');
    else if (b.kind === 'aid') appUrl = 'bilibili://video/av' + b.id + (b.p ? ('?p=' + b.p) : '');
    else appUrl = 'bilibili://bangumi/season/ep' + b.id;
    return {
      desktop: 'https://player.bilibili.com/player.html?' + q + '&as_wide=1',
      mobile: 'https://www.bilibili.com/blackboard/webplayer/mbplayer.html?' + q,
      page: pageUrl,
      app: appUrl
    };
  }
  function biliIsTouch() {
    const ua = navigator.userAgent || '';
    if (/Android|iPhone|iPod|iPad|Windows Phone|Mobile|Tablet/i.test(ua)) return true;
    if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return true;
    return false;
  }

  /**
   * ===== PDF 阅读器（PDF.js 逐页画到 canvas）=====
   *
   * 为什么不用 iframe：<iframe src="xx.pdf"> 靠的是 Chrome 自带的 PDF 插件，
   * 而 Android WebView 里根本没有这个插件 —— 在咱们的 APP 壳、学而思学习机上
   * 表现就是一片空白，或者干脆变成「开始下载」。
   * 所以改成 PDF.js 把每一页渲染到 canvas：壳、学习机、手机浏览器全都一样，
   * 而且不跳出平台，家长控制不会漏。
   *
   * 唯一的硬前提：PDF 服务器必须开 CORS（跨域）。
   * 阿里云 OSS 默认不开，pdf.js 的 fetch 会直接被浏览器拦掉，
   * 这时下面会弹出一段说人话的排查指引，而不是让人对着转圈发呆。
   */
  var PDFJS_VERSION = '3.11.174';
  // pdf.js 加载源，按顺序自动降级，哪个能用用哪个：
  //   ① 自家 OSS（深圳节点，家里网访问最快）—— 把 pdfjs/ 两个文件传上去就生效，不用改代码
  //   ② 本站同域 pdfjs/ 目录 —— 随网页一起部署，最稳
  //   ③ 公共 CDN —— 最后兜底
  var PDFJS_BASES = [
    'https://lantu5558.oss-cn-shenzhen.aliyuncs.com/pdfjs/',
    'pdfjs/',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/build/',
    'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/build/'
  ];
  var PDFJS_ACTIVE_BASE = '';
  var _pdfjsPromise = null;

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script-load-failed')); };
      document.head.appendChild(s);
    });
  }
  // 懒加载：只有真要看 PDF 的时候才去下 pdf.js（主程序 + worker 约 1.4MB），
  // 平时不打搅页面打开速度。加载一次就缓存在内存里。
  function loadPdfjs() {
    if (_pdfjsPromise) return _pdfjsPromise;
    _pdfjsPromise = (function tryBase(i) {
      if (i >= PDFJS_BASES.length) return Promise.reject(new Error('pdfjs-all-sources-failed'));
      var base = PDFJS_BASES[i];
      return loadScript(base + 'pdf.min.js').then(function () {
        var lib = window.pdfjsLib;
        if (!lib || !lib.getDocument) throw new Error('pdfjs-invalid');
        lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
        PDFJS_ACTIVE_BASE = base;
        return lib;
      }).catch(function () { return tryBase(i + 1); });
    })(0);
    _pdfjsPromise.catch(function () { _pdfjsPromise = null; }); // 失败后允许下次重试
    return _pdfjsPromise;
  }
  /** 读之前先探一次：跨域没开时 HEAD 会直接抛错，这正是 pdf.js 待会儿的遭遇。
   *  提前判出来，就能给出「去 OSS 控制台点哪里」这种能照着做的指引。 */
  function pdfPreflight(url) {
    if (typeof fetch !== 'function') return Promise.resolve({ ok: true, attachment: false });
    var out = { ok: true, attachment: false, status: 0, range: 'unknown', exposed: false };
    return fetch(url, { method: 'HEAD' }).then(function (r) {
      var h = r.headers || {};
      var cd = (h.get ? h.get('content-disposition') : '') || '';
      out.status = r.status;
      out.attachment = /attachment/i.test(cd);
      // Accept-Ranges 不在浏览器默认可读的那几个响应头里。读不到它，
      // pdf.js 就不知道服务器支持分段，只能老老实实整本下完 —— 所以这一项必须暴露。
      out.exposed = !!(h.get && h.get('accept-ranges'));
      // 关键一探：带 Range 的跨域 GET 会触发预检（OPTIONS）。
      // 阿里云 OSS 的 CORS 规则里没勾 OPTIONS 的话，预检直接 403，这个请求就废了。
      return fetch(url, { headers: { Range: 'bytes=0-0' } });
    }).then(function (r) {
      out.range = (r.status === 206) ? 'ok' : 'full';
      if (r && r.body && r.body.cancel) { try { r.body.cancel(); } catch (e) {} }
      return out;
    }).catch(function (e) {
      if (!out.status) { // HEAD 就没过去 —— 跨域压根没开
        out.ok = false; out.detail = String((e && e.message) || e); return out;
      }
      // HEAD 过得去、带 Range 的过不去 —— 十有八九是预检被拦
      out.range = 'blocked';
      return out;
    });
  }

  var PDF = null; // { doc, num, total, scale, rendering, pending }

  function openPdfViewer(title, url) {
    var modal = document.createElement('div');
    modal.className = 'modal-mask video-mask pdf-mask';
    modal.onclick = function (e) { if (e.target === modal) closeVideoModal(modal); };
    modal.innerHTML = `
      <div class="modal video-modal">
        <button class="icon-btn close" onclick="closeVideoModal(this)">✕</button>
        <button class="icon-btn" style="float:right;margin-top:-8px;margin-right:6px;font-size:15px" title="全屏阅读" onclick="pdfFsToggle(this)">⛶</button>
        <h3>${esc(title)}</h3>
        <div class="pdf-stage" id="pdf-stage">
          <div class="pdf-loading">
            <div class="pdf-spin"></div>
            <div id="pdf-loadtext">正在准备阅读器…</div>
            <div class="pdf-prog"><i id="pdf-progbar"></i></div>
          </div>
        </div>
        <div class="pdf-bar">
          <button class="pdf-btn" onclick="pdfGo(-1)">‹ 上一页</button>
          <span class="pdf-page"><input id="pdf-num" type="number" min="1" value="1" onchange="pdfJump(this.value)" oninput="pdfJump(this.value)" /> / <span id="pdf-total">?</span></span>
          <button class="pdf-btn" onclick="pdfGo(1)">下一页 ›</button>
          <button class="pdf-btn" onclick="pdfZoom(-0.25)">－</button>
          <button class="pdf-btn" onclick="pdfZoom(0.25)">＋</button>
        </div>
        <div class="pdf-tip" id="pdf-tip"></div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn-secondary" onclick="closeVideoModal(this)">关闭</button>
          <button class="btn-primary" onclick="window.open('${escA(url)}','_blank')">⬇️ 下载 / 其他应用打开</button>
        </div>
      </div>`;
    document.getElementById('modal-root').appendChild(modal);
    pdfStart(url);
  }

  function pdfSetProgress(pct) {
    var bar = document.getElementById('pdf-progbar');
    if (bar) bar.style.width = Math.max(0, Math.min(100, Math.round(pct))) + '%';
  }
  function pdfLoadText(t) {
    var el = document.getElementById('pdf-loadtext');
    if (el) el.textContent = t;
  }
  function pdfStart(url) {
    PDF = null;
    var stage = document.getElementById('pdf-stage');
    if (!stage) return;
    pdfPreflight(url).then(function (pf) {
      var stage2 = document.getElementById('pdf-stage');
      if (!stage2) return; // 已经关掉了
      if (!pf.ok) { pdfFail('cors', url, pf.detail || '', !!pf.attachment); return; }
      if (pf.status && pf.status >= 400) { pdfFail('http', url, 'HTTP ' + pf.status, !!pf.attachment); return; }
      // 分段取不到，几十兆的课本就得整本下完才出第一页 —— 这体验等于不可用，
      // 所以这里直接拦下来给修复指引，而不是让人干等一分钟。
      if (pf.range === 'blocked') { pdfFail('preflight', url, '', !!pf.attachment); return; }
      if (pf.range === 'ok' && !pf.exposed) { pdfFail('expose', url, '', !!pf.attachment); return; }
      pdfLoadText('正在加载阅读器…');
      return loadPdfjs().then(function (lib) {
        pdfLoadText('正在打开文档…');
        // cMap 跟着当前真正用上的那个源走。写死 CDN 的话，国内网络一卡就把首屏拖住。
        // 注：只有用到旧式 CJK 预定义编码的 PDF 才会去取 cmap，取不到也只是一句警告。
        var cmapBase = (PDFJS_ACTIVE_BASE || PDFJS_BASES[0]).replace(/build\/\s*$/, 'cmaps/');
        var task = lib.getDocument({
          url: url,
          cMapUrl: cmapBase,
          cMapPacked: true,
          // 大文件（几十兆的课本）必须开按需加载：只取当前要看的那一页附近的数据。
          // 设成 false 的话 pdf.js 会在后台把整个文件默默拖完，流量和等待都翻倍。
          disableAutoFetch: true,
          // 默认 64KB 一段，对大文件太碎；放大到 256KB 少跑几趟。
          rangeChunkSize: 262144
        });
        task.onProgress = function (d) {
          if (d && d.total) {
            pdfSetProgress(d.loaded / d.total * 100);
            var mb = function (n) { return (n / 1048576).toFixed(1) + 'MB'; };
            pdfLoadText('边看边加载… ' + mb(d.loaded) + ' / ' + mb(d.total) + '（不用等全部下完）');
          }
        };
        return task.promise;
      }).then(function (doc) {
        var s = document.getElementById('pdf-stage');
        if (!s) return;
        PDF = { doc: doc, num: 1, total: doc.numPages, scale: 1, rendering: false, pending: null };
        var t = document.getElementById('pdf-total');
        if (t) t.textContent = doc.numPages;
        s.innerHTML = '<div class="pdf-stage-inner"><canvas id="pdf-canvas" class="pdf-canvas"></canvas></div>';
        pdfRender();
      }).catch(function (e) {
        pdfFail('load', url, (e && e.message) || String(e), !!pf.attachment);
      });
    });
  }
  /** 打不开时给一段能照着做的指引，而不是一句「加载失败」。 */
  function pdfFail(kind, url, detail, attachment) {
    var stage = document.getElementById('pdf-stage');
    if (!stage) return;
    var host = '';
    try { host = new URL(url).hostname; } catch (e) { host = ''; }
    var html = '';
    if (kind === 'cors') {
      html = `<div class="pdf-err">
        <b>读不到这份 PDF —— 服务器没开跨域（CORS）。</b><br>
        浏览器不许网页去别的域名取数据，除非对方明确同意。阿里云 OSS 默认是关的，
        需要你手动开一次（开完所有资料就都能看了，一劳永逸）：
        <ol>
          <li>打开 <b>阿里云 OSS 控制台</b>，进 Bucket <code>${esc(host.split('.')[0] || host)}</code></li>
          <li>左侧 <b>数据安全 → 跨域设置</b> → 创建规则</li>
          <li>来源填 <code>https://lantu5558.github.io</code></li>
          <li>允许 Methods 勾 <b>GET、HEAD、OPTIONS</b>；允许 Headers 填 <code>*</code></li>
          <li>暴露 Headers 填 <code>*</code>；缓存时间 <code>3600</code></li>
        </ol>
        保存后等 1 分钟，把 APP 完全关掉重开再试。
      </div>`;
    } else if (kind === 'preflight') {
      html = `<div class="pdf-err">
        <b>跨域开了，但缺少 <code>OPTIONS</code>，文件没法分段读取。</b><br>
        课本有几十兆，本来可以「翻到哪页下载哪页」，几秒就出第一页。
        现在只能等整本 70MB 全部下完，慢很多，中途断一下还得重来。
        <div style="margin:8px 0 4px"><b>改一下就好：</b></div>
        <ol>
          <li><b>阿里云 OSS 控制台</b> → Bucket <code>${esc(host.split('.')[0] || host)}</code></li>
          <li><b>数据安全 → 跨域设置</b> → 点开已有那条规则（不是新建）</li>
          <li>允许 Methods <b>再勾上 OPTIONS</b>（GET、HEAD 已有，别取消）</li>
          <li>允许 Headers 填 <code>*</code>，<b>暴露 Headers 也填 <code>*</code></b></li>
        </ol>
        <b>为什么：</b>浏览器在发带 Range 头的请求之前，会先发一个 OPTIONS 探路；
        OSS 规则里没允许 OPTIONS 就会直接回绝，分段读取整个失效。
      </div>`;
    } else if (kind === 'expose') {
      html = `<div class="pdf-err">
        <b>还差一步：没填「暴露 Headers」。</b><br>
        服务器虽然支持分段，但没把 <code>Accept-Ranges</code> 这个响应头列进白名单，
        浏览器就不许网页读它 —— 阅读器不知道能分段，还是会整本下完。
        <div style="margin:8px 0 4px"><b>改一下就好：</b></div>
        <ol>
          <li><b>阿里云 OSS 控制台</b> → Bucket <code>${esc(host.split('.')[0] || host)}</code></li>
          <li><b>数据安全 → 跨域设置</b> → 点开已有规则</li>
          <li>找到 <b>暴露 Headers</b>，填 <code>*</code></li>
          <li>顺便确认允许 Methods 里 <b>OPTIONS 是勾上的</b></li>
        </ol>
        保存后等 1 分钟，把 APP 完全关掉重开再试。
      </div>`;
    } else if (kind === 'http') {
      html = `<div class="pdf-err"><b>文件取不回来（${esc(detail)}）。</b><br>链接可能过期、被删了，或者权限不是公开读。</div>`;
    } else {
      html = `<div class="pdf-err"><b>文档打开失败。</b><br>
        ${esc(detail || '')}<br>
        常见原因：文件太大（几十兆的课本第一次打开要等一会儿）、文件本身损坏，
        或者上面那个跨域没配好。</div>`;
    }
    if (attachment) {
      html += `<div class="pdf-err">另外：这个文件被设成了<b>强制下载</b>，
        所以点「下载 / 其他应用打开」会直接存成一个文件，不会在浏览器里显示 —— 这是正常的，不影响在平台里阅读。</div>`;
    }
    stage.innerHTML = html;
    var tip = document.getElementById('pdf-tip');
    if (tip) tip.textContent = '';
  }
  function pdfRender() {
    if (!PDF) return;
    var stage = document.getElementById('pdf-stage');
    if (!stage) return;
    if (PDF.rendering) { PDF.pending = PDF.num; return; }
    PDF.rendering = true;
    PDF.doc.getPage(PDF.num).then(function (page) {
      var cv = document.getElementById('pdf-canvas');
      if (!cv) {
        stage.innerHTML = '<div class="pdf-stage-inner"><canvas id="pdf-canvas" class="pdf-canvas"></canvas></div>';
        cv = document.getElementById('pdf-canvas');
      }
      var cw = stage.clientWidth || 360;
      var v0 = page.getViewport({ scale: 1 });
      // 先按容器宽度算出「刚好铺满」的基准，再乘用户的缩放倍数
      var fit = (cw - 22) / v0.width;
      var vp = page.getViewport({ scale: fit * PDF.scale });
      var cap = Math.min(window.devicePixelRatio || 1, 2); // 再高也没意义，只会更卡
      cv.width = Math.floor(vp.width * cap);
      cv.height = Math.floor(vp.height * cap);
      cv.style.width = Math.floor(vp.width) + 'px';
      cv.style.height = Math.floor(vp.height) + 'px';
      var ctx = cv.getContext('2d');
      ctx.setTransform(cap, 0, 0, cap, 0, 0);
      return page.render({ canvasContext: ctx, viewport: vp }).promise;
    }).then(function () {
      if (!PDF) return;
      PDF.rendering = false;
      var n = document.getElementById('pdf-num');
      if (n && document.activeElement !== n) n.value = PDF.num;
      var tip = document.getElementById('pdf-tip');
      if (tip) tip.textContent = '第 ' + PDF.num + ' / ' + PDF.total + ' 页 · 缩放 ' + Math.round(PDF.scale * 100) + '% · 在页面上双指可以放大';
      if (PDF.pending != null && PDF.pending !== PDF.num) { PDF.num = PDF.pending; PDF.pending = null; pdfRender(); }
      else PDF.pending = null;
    }).catch(function (e) {
      PDF.rendering = false;
      var tip = document.getElementById('pdf-tip');
      if (tip) tip.textContent = '这一页渲染失败：' + ((e && e.message) || e);
    });
  }
  function pdfGo(d) {
    if (!PDF) return;
    var n = PDF.num + d;
    if (n < 1 || n > PDF.total) return;
    PDF.num = n;
    var s = document.getElementById('pdf-stage');
    if (s) s.scrollTop = 0;
    pdfRender();
  }
  function pdfJump(v) {
    if (!PDF) return;
    var n = parseInt(v, 10);
    if (!n || n < 1) return;               // 输入到一半（比如想跳 12 页，先输了个 1）别打断
    if (n > PDF.total) n = PDF.total;
    PDF.num = n;
    pdfRender();
  }
  function pdfZoom(d) {
    if (!PDF) return;
    var s = PDF.scale + d;
    if (s < 0.5) s = 0.5;
    if (s > 3) s = 3;
    PDF.scale = s;
    pdfRender();
  }
  /** PDF 全屏：只做 CSS 铺满 + 系统全屏，刻意不通知 APP 壳。
   *  壳那边 setFullscreen 会把屏幕锁成横屏，而课本竖着看才舒服。 */
  function pdfFsToggle(el) {
    var mask = el && el.closest ? el.closest('.modal-mask') : null;
    if (!mask) return;
    var m = mask.querySelector('.modal');
    if (!m) return;
    var on = !m.classList.contains('lv-fs');
    m.classList.toggle('lv-fs', on);
    try {
      var de = document.documentElement;
      if (on) {
        if (de.requestFullscreen) { var p = de.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
        else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      } else if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) { var q = document.exitFullscreen(); if (q && q.catch) q.catch(function () {}); }
        else if (document.webkitExitFullscreen) de.webkitExitFullscreen();
      }
    } catch (e) { /* 系统全屏拿不到就纯 CSS，照样铺满 */ }
    setTimeout(pdfRender, 150); // 尺寸变了要按新宽度重算
  }

  function saveChild(id) {
    const c = DATA.children.find(x => x.id === id);
    c.avatar = document.getElementById('c-emoji').value || c.avatar;
    c.name = document.getElementById('c-name').value || c.name;
    const pin = document.getElementById('c-pin').value;
    if (/^\d{4}$/.test(pin)) c.pin = pin; else { toast('PIN 必须是 4 位数字'); return; }
    c.points = parseInt(document.getElementById('c-points').value) || 0;
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已保存');
  }
  function addChild() {
    const emoji = document.getElementById('nc-emoji').value || '👶';
    const name = document.getElementById('nc-name').value.trim();
    const pin = document.getElementById('nc-pin').value;
    if (!name) { toast('写个名字'); return; }
    if (!/^\d{4}$/.test(pin)) { toast('PIN 必须是 4 位数字'); return; }
    DATA.children.push({ id: 'c'+Date.now(), name, avatar: emoji, pin, points: 0, streak: 0 });
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已添加');
  }
  function delChild(id) {
    if (!confirm('确认删除这个孩子？')) return;
    DATA.children = DATA.children.filter(c => c.id !== id);
    DATA.tasks = DATA.tasks.filter(t => t.childId !== id);
    saveData(DATA); document.querySelector('.modal-mask').remove(); render(); toast('已删除');
  }

  function changePassword() {
    const np = prompt('新密码（4 位数字）');
    if (!np || !/^\d{4}$/.test(np)) { toast('必须是 4 位数字'); return; }
    DATA.momPassword = np; toast('已修改'); saveData(DATA);
  }
  function exportData() {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lebao-data-${TODAY}.json`;
    a.click();
  }
  function resetData() {
    if (!confirm('确认重置？所有数据会回到初始演示状态')) return;
    localStorage.removeItem(LS_KEY);
    DATA = loadData();
    render(); toast('已重置');
  }
  function logout() {
    sessionStorage.removeItem('mom-auth');
    location.hash = 'entry';
  }

  // ========== 启动 ==========
  // 坑（重要）：normalizeData 以前只在「收到远端数据」时跑，本地老数据永远补不上 kind，
  // 结果妈妈在网页上布置的看视频任务，孩子端 t.kind 是 undefined，退化成普通任务、
  // 点了就直接勾完，根本不放视频。这里启动时对本地数据也补一遍。
  try { DATA = normalizeData(DATA); } catch (e) {}
  window.addEventListener('hashchange', render);
  render();

  // 注册 service worker（PWA 离线）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  </script>
</body>
</html>
