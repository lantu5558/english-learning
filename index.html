      </div>
      <div class="page">
        ${wts.length ? wts.map(wt => {
          const s = wtSet(wt);
          const q = wt.wq;
          const n = wtBatchSize(wt);
          const p = wt.planId ? wpFind(wt.planId) : null;
          let pct = 0, badge = `0/${n} 词`, btn = '开始挑战 ▶';
          if (wt.done) { pct = 100; badge = `${n}/${n} 词`; }
          else if (q && q.list.length) {
            pct = wqPercent(wt);
            const sl = WQ_STAGES[wqStageIdx(q.stage)].label;
            badge = (q.round > 1 ? `第${q.round}轮 · ` : '') + `${sl} ${q.idx + 1}/${q.list.length}`;
            if (q.round > 1 || q.idx > 0 || wqStageIdx(q.stage) > 0) btn = '继续挑战 ▶';
          }
          const planLine = p ? `<p class="text-mute" style="margin:8px 0 0;font-size:12px">🔁 轮转中：整本已掌握 ${Math.min(p.offset || 0, wpTotal(p))}/${wpTotal(p)} 词${wpDone(p) ? ' · 🎉 全部学完' : ''}</p>` : '';
          const canMore = wt.done && p && p.active && !wpDone(p);
          return `
          <div class="section">
            <h3>📚 ${esc(s.title)} <span class="badge">${badge}</span></h3>
            <div class="wq-bar"><div class="wq-bar-in" style="width:${pct}%"></div></div>
            <p class="text-mute" style="margin:10px 0">三步走：🔊 全部跟读 → 🌏 全部考意思 → ⌨️ 全部考拼写。<b>错的词会自动再来一轮</b>，全做对 +${wt.points} 分。</p>
            ${wt.done
              ? '<div class="wq-done">🎉 今日单词已完成，太棒了！</div>' + (canMore ? `<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="wpExtraBatch('${p.id}')">🔁 再来一批（+${wpBatch(p)} 词）</button>` : '')
              : `<button class="btn-primary" style="width:100%" onclick="location.hash='kid-word-quiz?wt=${wt.id}'">${btn}</button>`}
            ${planLine}
          </div>`;
        }).join('') : '<div class="empty"><div class="emoji">📚</div>今天没有单词任务，等妈妈布置</div>'}

      </div>
      ${kidTabBar('words')}
    `;
  }

  // ---- 孩子端：单词闯关（三段式）----
  // 流程：第 1 轮把布置的词全部跟读 → 全部考意思 → 全部考拼写；
  //      错的词自动挑出来，再来一轮（同样读→意思→拼写），直到全对。
  const WQ_STAGES = [
    { key: 'read',    icon: '🔊', label: '跟读' },
    { key: 'meaning', icon: '🌏', label: '意思' },
    { key: 'spell',   icon: '⌨️', label: '拼写' },
  ];
  // 进度存在 wt.wq 上（跟着云同步走，换设备或中途退出都能接着练）
  function wqInit(wt) {
    const start = wt.offset || 0;
    const n = wtBatchSize(wt);
    const q = wt.wq;
    if (!q || !q.list || !q.list.length || !q.stage) {
      // list 存的是「词库里的绝对下标」，轮转靠 offset 整体平移
      wt.wq = { round: 1, stage: 'read', idx: 0, list: Array.from({ length: n }, (_, i) => start + i), wrong: [] };
    } else if (q.list.some(i => i < start || i >= start + n)) {
      q.list = q.list.filter(i => i >= start && i < start + n);
      if (q.idx >= q.list.length) { q.stage = 'read'; q.idx = 0; }
    }
    return wt.wq;
  }
  function wqStageIdx(stage) { for (let i = 0; i < WQ_STAGES.length; i++) if (WQ_STAGES[i].key === stage) return i; return 0; }
  function wqPercent(wt) {
    const q = wt.wq;
    if (!q || !q.list.length) return 0;
    const per = q.list.length * WQ_STAGES.length;
    return Math.min(100, Math.round((wqStageIdx(q.stage) * q.list.length + q.idx) / per * 100));
  }
  function wqMarkWrong(wt, wi) { const q = wt.wq; if (q && q.wrong.indexOf(wi) === -1) q.wrong.push(wi); }
  function wqTask(id) { return DATA.wordTasks.find(t => t.id === id); }

  // ========== 单词轮转计划 ==========
  // 计划(wordPlans) 是长期约定，每天的实例仍是 wordTasks 里带 planId 的普通条目 ——
  // 这样孩子端/妈妈端按 date 过滤的现有逻辑一行都不用改，同步合并也直接复用现成通道。
  // 规则（用户确认）：每天自动出一批；上一批没掌握就继续同一批，学会了才前进；
  //                 当天做完后可以主动「再来一批」加练，加练同样算进轮转进度。
  function wpList() { return DATA.wordPlans || []; }
  function wpFind(id) { const a = wpList(); for (let i = 0; i < a.length; i++) if (a[i] && a[i].id === id) return a[i]; return null; }
  function wpSetOf(p) { return DATA.wordSets.find(s => s.id === p.setId) || { title: '词库已删除', words: [] }; }
  function wpTotal(p) { return (wpSetOf(p).words || []).length; }
  function wpBatch(p) { return Math.max(0, Math.min(p.count || 5, wpTotal(p) - (p.offset || 0))); }
  function wpDone(p) { const t = wpTotal(p); return t > 0 && (p.offset || 0) >= t; }
  function wpSkipped(p, date) { return (p.skips || []).indexOf(date) >= 0; }
  function wpTaskFor(p, date) {
    let r = null;
    for (let i = 0; i < DATA.wordTasks.length; i++) { const t = DATA.wordTasks[i]; if (t && t.planId === p.id && t.date === date) r = t; }
    return r; // 取最后一条：同一天加练过多批时，以最新的那批为准
  }
  function wpMakeTask(p, date) {
    const t = { id: 'wt' + Date.now() + '' + Math.floor(Math.random() * 1000), planId: p.id, childId: p.childId,
                date: date, setId: p.setId, count: p.count || 5, points: p.points || 5,
                offset: p.offset || 0, done: false, wordState: {} };
    DATA.wordTasks.push(t);
    return t;
  }
  // 每天自动填充：缺今天这条就补。offset 只在「上一批做完了」时才前进（见 wpOnTaskDone），
  // 所以昨天没学会的话，今天拿到的还是同一批 —— 不前进，不夹生。
  function wpRoll(silent) {
    if (!Array.isArray(DATA.wordPlans)) DATA.wordPlans = [];
    let changed = false;
    for (let i = 0; i < DATA.wordPlans.length; i++) {
      const p = DATA.wordPlans[i];
      if (!p || !p.setId) continue;
      if (wpDone(p)) {
        if (!p.finished) { p.finished = true; p.finishedAt = TODAY; p.active = false; p.momAck = false; changed = true; }
        continue;
      }
      if (p.finished) { p.finished = false; p.finishedAt = ''; changed = true; } // 词库被加词/改回来 → 自愈
      if (!p.active || wpSkipped(p, TODAY)) continue;
      // 换过词库或换过孩子时，今天那条旧实例已经对不上了（哪怕它已完成），必须按新配置再发一条，
      // 否则孩子端看到的还是旧词库、当天也练不了新词。
      const cur = wpTaskFor(p, TODAY);
      if ((!cur || cur.setId !== p.setId || cur.childId !== p.childId) && wpBatch(p) > 0) { wpMakeTask(p, TODAY); changed = true; }
    }
    if (changed && !silent) saveData(DATA);
    return changed;
  }
  // 加练：当天这批做完后主动再来一批（算进轮转进度）
  function wpExtraBatch(planId) {
    const p = wpFind(planId);
    if (!p) return;
    if (!p.active || wpDone(p)) { toast('这个词库已经全部学完啦 🎉'); render(); return; }
    const t = wpMakeTask(p, TODAY);
    p.skips = (p.skips || []).filter(d => d !== TODAY);
    saveData(DATA);
    location.hash = 'kid-word-quiz?wt=' + t.id;
  }
  // 一批做完 → 计划前进；整本走完 → 挂起等妈妈处理（妈妈端顶部横幅 + 底部 tab 红点）
  function wpOnTaskDone(wt) {
    const p = wt && wt.planId ? wpFind(wt.planId) : null;
    if (!p) return;
    p.offset = (p.offset || 0) + wtBatchSize(wt);
    if (wpDone(p)) { p.finished = true; p.finishedAt = TODAY; p.active = false; p.momAck = false; }
  }
  function wpPendingMom() {
    const a = wpList(), r = [];
    for (let i = 0; i < a.length; i++) if (a[i] && a[i].finished && !a[i].momAck) r.push(a[i]);
    return r;
  }
  function wpToggle(id) {
    const p = wpFind(id); if (!p) return;
    if (p.finished) { wpRestart(id); return; }
    p.active = !p.active;
    if (p.active) p.skips = (p.skips || []).filter(d => d !== TODAY);
    saveData(DATA); wpRoll(); render();
    toast(p.active ? '已继续，明天自动出下一批' : '已停止，不再自动出新的一批（已布置的还在）');
  }
  function wpRestart(id) {
    const p = wpFind(id); if (!p) return;
    const s = wpSetOf(p);
    if (!confirm('《' + s.title + '》从头再学一遍？\n已掌握的进度会清零，重新从第 1 个词开始。')) return;
    p.offset = 0; p.finished = false; p.finishedAt = ''; p.active = true; p.momAck = true;
    p.skips = (p.skips || []).filter(d => d !== TODAY);
    saveData(DATA); wpRoll(); render(); toast('已重新开始');
  }
  function wpAck(id) {
    const p = wpFind(id); if (!p) return;
    p.momAck = true; saveData(DATA); render();
  }
  function delWordPlan(id) {
    const p = wpFind(id); if (!p) return;
    const s = wpSetOf(p);
    if (!confirm('删除「' + s.title + '」的轮转计划？\n已掌握的进度会一起清掉，今天没做完的那批也会撤掉。')) return;
    (DATA.wordTasks || []).filter(t => t.planId === id && !t.done).forEach(t => tombAdd('wordTasks', t.id));
    DATA.wordTasks = (DATA.wordTasks || []).filter(t => t.planId !== id || t.done);
    tombAdd('wordPlans', id);
    DATA.wordPlans = wpList().filter(x => x.id !== id);
    saveData(DATA); render(); toast('已删除轮转计划');
  }
  function openWordPlanModal(id) {
    const p = wpFind(id); if (!p) return;
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = function (e) { if (e.target === modal) modal.remove(); };
    modal.innerHTML =
      '<div class="modal">' +
        '<button class="icon-btn close" onclick="this.closest(\'.modal-mask\').remove()">✕</button>' +
        '<h3>编辑轮转计划</h3>' +
        '<div class="field"><label>给谁</label>' +
          '<select id="wp-child">' + DATA.children.map(function (c) {
            return '<option value="' + c.id + '"' + (c.id === p.childId ? ' selected' : '') + '>' + c.avatar + ' ' + esc(c.name) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label>词库（换词库会从头开始）</label>' +
          '<select id="wp-set">' + DATA.wordSets.map(function (x) {
            return '<option value="' + x.id + '"' + (x.id === p.setId ? ' selected' : '') + '>📚 ' + esc(x.title) + '（' + x.words.length + ' 词）</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label>每天学几个</label>' +
          '<input id="wp-count" type="number" value="' + p.count + '" min="1" max="20" /></div>' +
        '<div class="field"><label>每批完成积分</label>' +
          '<input id="wp-points" type="number" value="' + p.points + '" min="1" max="20" /></div>' +
        '<p class="text-mute" style="font-size:12px">已掌握 ' + Math.min(p.offset || 0, wpTotal(p)) + '/' + wpTotal(p) + ' 词' + (p.finished ? ' · 🎉 已全部学完' : '') + '，换词库会清零重来</p>' +
        '<div class="btn-row">' +
          '<button class="btn-secondary" onclick="this.closest(\'.modal-mask\').remove()">取消</button>' +
          '<button class="btn-primary" onclick="saveWordPlan(\'' + p.id + '\')">保存</button>' +
        '</div>' +
      '</div>';
    document.getElementById('modal-root').appendChild(modal);
  }
  function saveWordPlan(id) {
    const p = wpFind(id); if (!p) return;
    const setEl = document.getElementById('wp-set');
    const childEl = document.getElementById('wp-child');
    const cntEl = document.getElementById('wp-count');
    const ptsEl = document.getElementById('wp-points');
    const newSet = setEl ? setEl.value : p.setId;
    const newChild = childEl ? childEl.value : p.childId;
    const count = Math.max(1, Math.min(20, parseInt(cntEl && cntEl.value) || p.count));
    const points = Math.max(1, Math.min(20, parseInt(ptsEl && ptsEl.value) || p.points));
    const changedSet = newSet !== p.setId;
    if (changedSet || newChild !== p.childId) {
      // 换词库/换人 = 换一套进度，旧的掌握记录没意义了，撤掉今天没做完的那批重新发
      (DATA.wordTasks || []).filter(t => t.planId === p.id && !t.done).forEach(t => tombAdd('wordTasks', t.id));
      DATA.wordTasks = (DATA.wordTasks || []).filter(t => t.planId !== p.id || t.done);
      if (changedSet) { p.offset = 0; p.finished = false; p.finishedAt = ''; p.momAck = true; }
    }
    // 已经发出去的批次也跟着改每日词数，不然孩子在练的那批还是老数字
    (DATA.wordTasks || []).forEach(function (t) {
      if (t.planId !== p.id || t.done) return;
      t.count = count; t.points = points; t.setId = newSet; t.childId = newChild;
    });
    p.setId = newSet; p.childId = newChild; p.count = count; p.points = points;
    p.active = true;
    p.skips = (p.skips || []).filter(d => d !== TODAY);
    saveData(DATA); wpRoll();
    const m = document.querySelector('.modal-mask'); if (m) m.remove();
    render();
    toast(changedSet ? '已换词库，从第一个词重新开始' : '已保存');
  }


  // 推进到下一题 / 下一阶段 / 下一轮 / 完成
  function wqAdvance(wtId) {
    const wt = wqTask(wtId);
    if (!wt || wt.done) return;
    const q = wt.wq;
    if (!q) { render(); return; }
    q.idx++;
    if (q.idx < q.list.length) { saveData(DATA); render(); return; }
    const si = wqStageIdx(q.stage);
    if (si < WQ_STAGES.length - 1) {          // 进下一阶段
      q.stage = WQ_STAGES[si + 1].key; q.idx = 0; q.opts = null;
      saveData(DATA); render();
      if (q.stage === 'meaning') toast('读完啦！现在考考意思 🌏');
      else if (q.stage === 'spell') toast('意思都懂了！最后来拼写 ⌨️');
      return;
    }
    if (q.wrong.length) {                      // 三轮走完，还有错的 → 再来一轮，只练错词
      const n = q.wrong.length;
      wt.wq = { round: q.round + 1, stage: 'read', idx: 0, list: q.wrong.slice(), wrong: [] };
      saveData(DATA); render();
      toast(`错了 ${n} 个，再来一轮把它们拿下 💪`);
      return;
    }
    const start = wt.offset || 0, n = wtBatchSize(wt);      // 全对 → 完成
    for (let i = start; i < start + n; i++) wt.wordState[i] = 3;
    wt.wq = null;
    saveData(DATA);
    wqFinish(wt);
    render();
  }

  function viewWordQuiz(params) {
    const c = kidCheck();
    if (!c) { location.hash = 'kid-select'; return ''; }
    const wt = DATA.wordTasks.find(t => t.id === params.wt);
    if (!wt) { location.hash = 'kid-words'; return ''; }
    const s = wtSet(wt);
    if (wt.done) return viewWordQuizDone(wt, s);
    if (!s.words.length || (wt.offset || 0) >= s.words.length) return '<div class="page"><div class="empty">这一批没有可学的词了</div></div>';

    const q = wqInit(wt);
    const wi = q.list[q.idx];
    const word = s.words[wi];
    if (!word) { wt.done = true; saveData(DATA); return viewWordQuizDone(wt, s); }

    const si = wqStageIdx(q.stage);
    const total = q.list.length;
    const isLast = q.idx === total - 1;
    // 考意思的选项要固定住，不然每次 render 都会重新洗牌
    if (q.stage === 'meaning' && (!q.opts || q.optsFor !== wi)) {
      q.opts = buildTransOptions(s, wi).map(o => o.cn);
      q.optsFor = wi;
    }
    // 跟读和考意思自动念一遍；考拼写不能自动念（那就等于报答案了），让孩子自己点喇叭
    window.__wq_autospeak = (q.stage === 'read' || q.stage === 'meaning') ? word.w : null;

    const stagesBar = `<div class="wq-stages">${WQ_STAGES.map((x, i) =>
      `<span class="wq-stage ${i === si ? 'on' : (i < si ? 'done' : '')}">${x.icon} ${x.label}</span>`).join('')}</div>`;
    const roundTip = q.round > 1
      ? `<div class="wq-round-tip">🔁 第 ${q.round} 轮 · 只练上一轮出错的 ${total} 个词</div>`
      : `<div class="wq-round-tip">第 ${q.idx + 1} / ${total} 个词</div>`;

    let body = '';
    if (q.stage === 'read') {
      body = `
        ${roundTip}
        <div class="wq-word-card">
          <div class="w">${esc(word.w)}</div>
          ${word.pos ? '<div class="pos">' + esc(word.pos) + '</div>' : ''}
          <div class="cn">${esc(word.cn)}</div>
          <button class="wq-sound-btn" data-w="${escA(word.w)}" onclick="speak(this.getAttribute('data-w'))">🔊</button>
        </div>
        <p class="wq-hint">点喇叭听发音，大声跟读几遍</p>
        <button class="btn-primary" style="width:100%;margin-top:12px" onclick="wqAdvance('${wt.id}')">${isLast ? '全部读完，去考意思 ▶' : '下一个 ▶'}</button>`;
    } else if (q.stage === 'meaning') {
      body = `
        ${roundTip}
        <div class="wq-word-card">
          <div class="w">${esc(word.w)}</div>
          <button class="wq-sound-btn" data-w="${escA(word.w)}" onclick="speak(this.getAttribute('data-w'))">🔊</button>
        </div>
        <p class="wq-hint">它的意思是？</p>
        <div class="wq-choices">
          ${(q.opts || []).map((o, i) => `<button class="wq-choice" id="wqc${i}" onclick="wqMeaningPick('${wt.id}', ${i})">${esc(o)}</button>`).join('')}
        </div>`;
    } else {
      body = `
        ${roundTip}
        <div class="wq-word-card">
          <div class="w" style="font-size:26px">${esc(word.cn)}</div>
          ${word.pos ? '<div class="pos">' + esc(word.pos) + '</div>' : ''}
          <div class="cn">英文怎么写？</div>
          <button class="wq-sound-btn" data-w="${escA(word.w)}" onclick="speak(this.getAttribute('data-w'))">🔊 听发音</button>
        </div>
        <input class="wq-spell" id="wq-spell" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="拼出来…"
               onkeydown="if(event.key==='Enter')wqSpellCheck('${wt.id}')" />
        <button class="btn-primary" style="width:100%;margin-top:12px" onclick="wqSpellCheck('${wt.id}')">检查</button>
        <button class="btn-text" style="width:100%;margin-top:10px" onclick="wqSpellGiveUp('${wt.id}')">不会，看答案</button>`;
    }

    return `
      <div class="topbar">
        <button class="icon-btn" onclick="location.hash='kid-words'">${ICN.back}</button>
        <h1 style="font-size:14px">${esc(s.title)}</h1>
        <div class="actions"><div class="icon-btn" style="background:var(--amber-50);color:var(--amber-600);font-size:13px;font-weight:600">★ ${c.points}</div></div>
      </div>
      <div class="page">
        <div class="wq-bar" style="margin-bottom:10px"><div class="wq-bar-in" style="width:${wqPercent(wt)}%"></div></div>
        ${stagesBar}
        ${body}
      </div>
      ${kidTabBar('words')}
    `;
  }

  function wqMeaningPick(wtId, i) {
    const wt = wqTask(wtId); if (!wt || !wt.wq) return;
    const q = wt.wq, wi = q.list[q.idx];
    const word = wtSet(wt).words[wi];
    const btn = document.getElementById('wqc' + i);
    if ((q.opts || [])[i] === word.cn) {
      if (btn) btn.classList.add('good');
      toast('答对啦 ✓');
      setTimeout(() => wqAdvance(wtId), 520);
    } else {
      if (btn) btn.classList.add('bad');
      const ci = (q.opts || []).indexOf(word.cn);
      const cbtn = ci >= 0 ? document.getElementById('wqc' + ci) : null;
      if (cbtn) cbtn.classList.add('good');
      wqMarkWrong(wt, wi); saveData(DATA);
      toast('正确答案是：' + word.cn);
      setTimeout(() => wqAdvance(wtId), 1500);
    }
  }

  function wqSpellCheck(wtId) {
    const wt = wqTask(wtId); if (!wt || !wt.wq) return;
    const q = wt.wq, wi = q.list[q.idx];
    const word = wtSet(wt).words[wi];
    const input = document.getElementById('wq-spell');
    if (!input) return;
    if (input.value.trim().toLowerCase() === String(word.w).trim().toLowerCase()) {
      input.classList.add('good');
      toast('拼对了 ✓');
      setTimeout(() => wqAdvance(wtId), 520);
    } else {
      input.classList.add('bad');
      wqMarkWrong(wt, wi); saveData(DATA);
      toast('差一点，再听一遍 🔊');
      setTimeout(() => { input.classList.remove('bad'); input.select(); }, 500);
    }
  }
  function wqSpellGiveUp(wtId) {
    const wt = wqTask(wtId); if (!wt || !wt.wq) return;
    const wi = wt.wq.list[wt.wq.idx];
    const word = wtSet(wt).words[wi];
    wqMarkWrong(wt, wi); saveData(DATA);
    toast('正确答案是：' + word.w);
    setTimeout(() => wqAdvance(wtId), 1700);
  }

  function viewWordQuizDone(wt, s) {
    const c = DATA.children.find(x => x.id === wt.childId);
    return `
      <div class="topbar">
        <button class="icon-btn" onclick="location.hash='kid-words'">${ICN.back}</button>
        <h1>单词打卡</h1>
        <div class="actions"><div class="icon-btn" style="background:var(--amber-50);color:var(--amber-600);font-size:13px;font-weight:600">★ ${c.points}</div></div>
      </div>
      <div class="page">
        <div class="wq-word-card">
          <div style="font-size:52px">🎉</div>
          <div class="w" style="font-size:20px;margin-top:8px">这一批全部完成！</div>
          <div class="cn">${esc(s.title)} × ${wtBatchSize(wt)} 个 · +${wt.points} 分</div>
        </div>
        ${(() => {
          const p = wt.planId ? wpFind(wt.planId) : null;
          if (!p) return '<p class="wq-hint">坚持每天打卡，词汇量蹭蹭涨 📈</p>';
          if (wpDone(p)) return '<p class="wq-hint">🎉 整本词库都学完了，妈妈会给你安排新的</p>';
          if (!p.active) return '<p class="wq-hint">这批学完啦，妈妈已暂停自动出下一批</p>';
          return '<button class="btn-secondary" style="width:100%;margin-top:12px" onclick="wpExtraBatch(\'' + p.id + '\')">🔁 再来一批（+' + wpBatch(p) + ' 词）</button>';
        })()}
      </div>
      ${kidTabBar('words')}
    `;
  }
  function buildTransOptions(s, wi) {
    const pool = s.words.filter((_, i) => i !== wi).map(x => x.cn);
    const opts = [s.words[wi]];
    while (opts.length < 4 && pool.length) {
      const idx = Math.floor(Math.random() * pool.length);
      opts.push({ cn: pool.splice(idx, 1)[0] });
    }
    // 洗牌
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    return opts;
  }
  window.__afterRender = function () {
    if (window.__wq_autospeak) { const t = window.__wq_autospeak; window.__wq_autospeak = null; setTimeout(() => speak(t), 350); }
    if (typeof window.__dicAuto === 'function') { const f = window.__dicAuto; window.__dicAuto = null; f(); }
  };

  // ========== 作业栏（妈妈记录用，孩子能看到，但不打卡计分）==========
  // scope: 'today' 今日校内作业 / 'week' 本周校外作业
  const HW_SCOPE = { today: { label: '今日作业', icon: '📝', hint: '当天校内作业' },
                     week:  { label: '本周作业', icon: '🗓', hint: '当周校外机构作业' } };
  function hwList(scope, childId) {
    return (DATA.homeworks || []).filter(h =>
      (!scope || h.scope === scope) &&
      (!childId || h.childId === childId) &&
      (h.scope === 'week' || !h.date || h.date === TODAY)   // 今日作业只显示当天的
    ).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  // 作业卡片：妈妈端带删除，孩子端只读
  function hwCard(h, isMom) {
    const k = DATA.children.find(c => c.id === h.childId);
    const imgs = h.imgs || [];
    return `<div class="hw-card">
      <div class="hw-head">
        <span class="hw-who">${k ? k.avatar + ' ' + esc(k.name) : ''}</span>
        ${h.subject && SUBJECTS[h.subject] ? `<span class="badge-subj" style="background:var(--gray-100);color:var(--gray-600)">${SUBJECTS[h.subject].emoji} ${SUBJECTS[h.subject].name}</span>` : ''}
        ${isMom ? `<button class="icon-btn" style="margin-left:auto;background:#FFEBEE;color:#C62828;width:28px;height:28px;font-size:12px" onclick="delHomework('${h.id}')">${ICN.trash}</button>` : ''}
      </div>
      ${h.text ? `<div class="hw-text">${esc(h.text).replace(/\n/g, '<br/>')}</div>` : ''}
      ${imgs.length ? `<div class="hw-imgs">${imgs.map((src, i) =>
        `<img class="hw-img" src="${src}" alt="作业图${i + 1}" onclick="viewHwImg('${h.id}', ${i})" />`).join('')}</div>` : ''}
    </div>`;
  }
  function hwSection(isMom) {
    const parts = [];
    ['today', 'week'].forEach(scope => {
      let list;
      if (isMom) list = hwList(scope, null);
      else { const c = kidCheck(); list = c ? hwList(scope, c.id) : []; }
      if (!list.length) return;
      const cfg = HW_SCOPE[scope];
      parts.push(`<div class="section">
        <h3>${cfg.icon} ${cfg.label} <span class="badge">${list.length}</span></h3>
        ${list.map(h => hwCard(h, isMom)).join('')}
      </div>`);
    });
    if (!parts.length) {
      return `<div class="section">
        <h3>📝 作业 ${isMom ? '<button class="text-pink" style="font-size:12px" onclick="openHomeworkModal()">' + ICN.add + ' 添加</button>' : ''}</h3>
        <div class="empty" style="padding:16px">还没有作业记录</div>
      </div>`;
    }
    const addBtn = isMom ? `<div class="section">
      <button class="btn-secondary" style="width:100%" onclick="openHomeworkModal()">${ICN.add} 添加作业</button>
      <p class="text-mute" style="text-align:center;font-size:12px;margin-top:8px">作业只做记录、不打卡计分</p>
    </div>` : `<p class="text-mute" style="text-align:center;font-size:12px;margin:10px 0">作业不用打卡，做完就行</p>`;
    return parts.join('') + addBtn;
  }
  let HW_STASH = null;   // 正在编辑的作业图片
  function openHomeworkModal() {
    HW_STASH = [];

  // 压缩到宽 720、JPEG 0.6，单张通常 40~90KB，避免撑爆同步数据
  function compressImg(file, maxW, quality, cb) {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / (img.width || maxW));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => cb(null);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  // ========== 词条解析 ==========
  // 老规则 /^(\S+)\s+(.+)$/ 会把短语切断：'a banana 一根香蕉' → w='a', cn='banana 一根香蕉'。
  // 新规则按优先级切：Tab/CSV（表格复制） > 显式分隔符 > 英文库按中英边界、语文库按空白 > 整行。
  var WS_CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;

  // 末尾的点会被吃掉，所以 'n' 'n.' 都认；斜杠 / & / 顿号组合（n./v.、n&v）也认。
  var WS_POS = { n:1, v:1, vt:1, vi:1, adj:1, adv:1, prep:1, conj:1, pron:1, num:1, art:1, int:1,

  var WS_POS_CN = { '名词':1, '动词':1, '形容词':1, '副词':1, '介词':1, '连词':1, '代词':1, '数词':1,
                    '冠词':1, '感叹词':1, '助动词':1, '情态动词':1, '及物动词':1, '不及物动词':1,
                    '专有名词':1, '可数名词':1, '不可数名词':1, '短语动词':1, '量词':1, '拟声词':1,

  function setLang(ws) { return (ws && ws.lang === 'zh') ? 'zh' : 'en'; }

  function wsIsPos(x) {
    let t = String(x == null ? '' : x).trim().toLowerCase().replace(/\.+$/, '');
    if (!t) return false;
    const segs = t.split(/[\/&+、,;|\s]+/).filter(Boolean);
    if (!segs.length) return false;
    for (let i = 0; i < segs.length; i++) {
      if (!WS_POS[String(segs[i]).replace(/\.+$/, '')]) return false;
    }

  }
  // 从「英文部分 + 中文部分」里把词性剥出来。两条路：
  //   英文末段命中词性表（apple n）／中文开头是多字中文词性（apple 名词 苹果）
  // 都要求至少剩两段，所以单个词永远不会被当成词性切走
  function wsSplitPos(w, cn) {
    const segs = String(w == null ? '' : w).split(/\s+/).filter(Boolean);
    if (segs.length >= 2 && wsIsPos(segs[segs.length - 1])) {
      const p = segs.pop();
      return { w: segs.join(' '), pos: String(p).trim(), cn: cn };
    }
    const csegs = String(cn == null ? '' : cn).split(/\s+/).filter(Boolean);
    if (csegs.length >= 2 && WS_POS_CN[csegs[0]]) {

  function wsStripBullet(l) {
    return l.replace(/^\s*[0-9]+\s*[.、)．]\s*/, '').replace(/^\s*[-*•]\s+/, '');
  }
  function wsUnq(x) {
    x = String(x == null ? '' : x).trim();

    return x.trim();
  }
  function wsSplitCsv(l) {
    // 只处理最常见的带引号 CSV："a banana","一根香蕉"。不带引号的行返回 null 交给后面的规则
    if (l.indexOf('"') < 0) return null;
    const out = []; let cur = ''; let inq = false;
    for (let i = 0; i < l.length; i++) {
      const c = l.charAt(i);
      if (c === '"') { inq = !inq; continue; }
      if (c === ',' && !inq) { out.push(wsUnq(cur)); cur = ''; continue; }

  function wsParseLine(raw, lang) {
    let l = String(raw == null ? '' : raw).replace(/\r/g, '').trim();
    if (!l) return null;
    l = wsStripBullet(l);
    if (!l) return null;
    let parts = null;
    if (l.indexOf('\t') >= 0) {
      parts = l.split('\t');
    } else {
      parts = wsSplitCsv(l);
    }
    if (!parts) {
      const mm = l.match(/^([^,，;；|]*)[,，;；|]\s*(.+)$/);
      if (mm) parts = [mm[1], mm[2]];
    }
    if (parts) {
      const w0 = String(parts[0] || '').trim();
      if (w0) {
        // Tab / CSV 分出三段时，中间那段就是词性（从表格复制过来的常见格式）
        if (parts.length >= 3) {
          return { w: w0, pos: String(parts[1] || '').trim(), cn: parts.slice(2).join(' ').trim() };
        }
        return wsSplitPos(w0, String(parts[1] || '').trim());
      }
    }
    if (lang === 'zh') {
      // 语文：词语本身不含空格，直接按空白切最稳（「苹果 píng guǒ」「苹果 一种水果」都对）
      // 语文库不分词性，pos 恒为空
      const mz = l.match(/^(\S+)\s+(.+)$/);
      if (mz) return { w: mz[1], pos: '', cn: mz[2] };
      return { w: l, pos: '', cn: '' };
    }
    // 英语：第一个汉字（或全角符号）出现的位置就是分界线，前面整段是英文短语
    const mc = l.match(WS_CJK);
    if (mc && mc.index > 0) {
      const sp = wsSplitPos(l.slice(0, mc.index).trim(), l.slice(mc.index).trim());
      if (sp.w) return sp;
    }
    // 整行都是英文（没写中文，比如 'apple n'）：末尾那段也可能就是词性
    if (lang !== 'zh') {
      const sp2 = wsSplitPos(l, '');
      if (sp2.pos) return sp2;
    }
    return { w: l, pos: '', cn: '' };
  }
  function wsParseWords(raw, lang) {
    const out = [];
    String(raw == null ? '' : raw).split('\n').forEach(function (l) {
      const o = wsParseLine(l, lang);

  function saveWordSetEdit(id) {
    const ws = DATA.wordSets.find(s => s.id === id);
    if (!ws) return;
    const tEl = document.getElementById('ws-title');
    const ta = document.getElementById('ws-words');
    const langEl = document.getElementById('ws-lang');
    const title = ((tEl ? tEl.value : '') || '').trim();
    if (!title) { toast('给词库起个名'); return; }
    const words = wsParseWords(ta ? ta.value : '', langEl ? langEl.value : setLang(ws));
    if (!words.length) { toast('至少写一行词条'); return; }
    // id 必须原样保留：已经布置出去的单词计划靠 setId 找词库，换 id 会全部变成「词库已删除」
    ws.title = title;
    ws.lang = langEl ? langEl.value : ws.lang;
    ws.words = words;
    saveData(DATA);
    const m = document.querySelector('.modal-mask');
    if (m) m.remove();

  function delWordSet(id) {
    if (!confirm('删除词库？已布置的任务会显示"词库已删除"')) return;
    tombAdd('wordSets', id);
    DATA.wordSets = DATA.wordSets.filter(s => s.id !== id);
    saveData(DATA); render();
  }
  function assignWordTask() {
    const childId = document.getElementById('wt-child').value;
    const setId = document.getElementById('wt-set').value;
    const count = Math.max(1, Math.min(20, parseInt(document.getElementById('wt-count').value) || 5));
    const points = Math.max(1, Math.min(20, parseInt(document.getElementById('wt-points').value) || 5));
    if (!setId) { toast('先在下面建一个词库'); return; }
    if (!Array.isArray(DATA.wordPlans)) DATA.wordPlans = [];
    // 同一个娃 + 同一个词库只保留一份计划，改配置即可；叠两条会互相打架（每天出两批）
    let p = null;
    for (let i = 0; i < DATA.wordPlans.length; i++) {
      const x = DATA.wordPlans[i];
      if (x && x.childId === childId && x.setId === setId) { p = x; break; }
    }
    if (p) {
      p.count = count; p.points = points; p.active = true;
      if (p.finished) { p.finished = false; p.finishedAt = ''; p.momAck = true; p.offset = 0; }
      p.skips = (p.skips || []).filter(d => d !== TODAY);
      saveData(DATA); wpRoll(); render();
      toast('已更新这个词的轮转设置');
      return;
    }
    p = { id: 'wp' + Date.now(), childId: childId, setId: setId, count: count, points: points,
          offset: 0, active: true, finished: false, finishedAt: '', momAck: false, skips: [], createdAt: TODAY };
    DATA.wordPlans.push(p);
    saveData(DATA);
    wpRoll();
    render();
    const s = wpSetOf(p);
    toast('已开启轮转：' + s.title + '，每天 ' + count + ' 词，学完自动提醒你');
  }
  function delWordTask(id) {
    const wt = (DATA.wordTasks || []).find(t => t.id === id);
    if (!wt) return;
    const p = wt.planId ? wpFind(wt.planId) : null;
    if (p) {
      if (!confirm('删除今天的这一批？\n轮转计划还在，明天会自动出下一批。\n要彻底停掉，请在上面「🔁 自动轮转」里点停止或删除。')) return;
    } else if (!confirm('删除这个单词任务？')) return;
    tombAdd('wordTasks', id);
    DATA.wordTasks = DATA.wordTasks.filter(t => t.id !== id);
    // 记一笔：今天被删过了，别让 wpRoll 下一秒又补回来
    if (p) { p.skips = (p.skips || []).filter(d => d !== TODAY); p.skips.push(TODAY); }
    saveData(DATA); render();

  // ========== 星星乐园（转盘 + 小游戏） ==========
  // 奖励门禁统一入口：今天有打卡任务且全部完成才解锁；今天没布置任务 → 不卡孩子。
  // 只统计「打卡任务」DATA.tasks，不含「作业」DATA.homeworks（作业不打卡计分）。
  // 列表渲染与 openResource 必须共用这一个函数，别各写一份 filter，否则迟早漂移。
  function funGate(c) {
    const todays = (DATA.tasks || []).filter(t => t.childId === (c && c.id) && t.date === TODAY);
    const total = todays.length;
    const done = todays.filter(t => t.done).length;
    return { total: total, done: done, unlocked: total === 0 || done === total };
  }
  function kidTasksDone(c) {
    return funGate(c).unlocked;
  }
  // 锁定时点击的统一提示：带上打卡进度，家长一眼能看出是「没布置」还是「没做完」
  function funLockedToast() {
    const g = funGate(kidCheck());
    toast(g.total
      ? ('\ud83d\udd12 \u5148\u5b8c\u6210\u4eca\u5929\u7684\u6253\u5361\u4efb\u52a1\uff08' + g.done + '/' + g.total + '\uff09\uff0c\u518d\u6765\u89e3\u9501\u5427')
      : '\ud83d\udd12 \u4eca\u5929\u8fd8\u6ca1\u6709\u6253\u5361\u4efb\u52a1\uff0c\u5148\u8ba9\u5988\u5988\u5e03\u7f6e\u5427');
  }
  function awardStars(c, n, title) {
    c.earned = (c.earned || 0) + n;
    c.points += n;
    DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: c.id, date: TODAY, title, points: n });
    saveData(DATA);
  }
  const FUN_GATE = '🔒 完成今天的打卡任务才能玩哦';

  // ---- 幸运转盘 ----
  // 盘面由妈妈后台配置（DATA.wheel）：可增删扇区、改文字/星星/权重(概率)/关联许诺奖励。
  // 权重 w 即「被转到的概率权重」，越大越容易中。默认种子见 DEFAULT_DATA.wheel。
  function getWheel() { return (DATA.wheel && DATA.wheel.length) ? DATA.wheel : DEFAULT_DATA.wheel; }
  const WHEEL_COLORS = ['#F06292','#BA68C8','#4DD0E1','#FFB74D','#81C784','#9575CD','#FF8A65','#4FC3F7'];
  let wheelRot = 0, wheelBusy = false;
  function wheelGradient() {
    const N = getWheel().length || 8, COL = WHEEL_COLORS;
    return 'conic-gradient(' + Array.from({length: N}, (_, i) => `${COL[i % COL.length]} ${i*360/N}deg ${(i+1)*360/N}deg`).join(',') + ')';
  }
  function spinWheel() {
    if (wheelBusy) return;
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (c.points < 10) { toast('星星不够啦，先去打卡赚星星吧 ⭐'); return; }
    c.points -= 10; saveData(DATA);
    wheelBusy = true; render();
    const segs = getWheel();
    const total = segs.reduce((a, s) => a + (s.w||0), 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < segs.length; i++) { r -= (segs[i].w||0); if (r <= 0) { idx = i; break; } }
    const sa = 360 / segs.length;
    const desired = 360 - (idx * sa + sa / 2);
    const delta = ((desired - wheelRot) % 360 + 360) % 360 + 1800;
    wheelRot += delta;
    const el = document.getElementById('wheel');
    if (el) el.style.transform = `rotate(${wheelRot}deg)`;
    setTimeout(() => {
      wheelBusy = false;
      const seg = segs[idx];
      if (seg.again) { c.points += 10; saveData(DATA); toast('🎡 再来一次！星星已退回'); }
      else if (seg.pts > 0) { awardStars(c, seg.pts, `幸运转盘中奖 ${seg.pts} 星`); toast(`🎉 恭喜抽中 ${seg.pts} 颗星星！`); }
      else { toast('🎁 抽中：' + seg.label + '！和妈妈商量兑现哦～'); }
      if (!DATA.wheelLogs) DATA.wheelLogs = [];
      DATA.wheelLogs.unshift({ id: 'wl' + Date.now(), childId: c.id, label: seg.label, pts: seg.pts || 0, at: Date.now() });
      render();
    }, 3350);
  }

  // ---- 扫雷 ----
  let MINE = null;
  let MINE_DIFF = 'easy';
  const MINE_CFG = {
    easy:   { label: '🙂 小雷区', size: 8,  mines: 8,  reward: 5 },
    normal: { label: ' 普通',   size: 10, mines: 15, reward: 8 },
    hard:   { label: '😤 大雷区', size: 12, mines: 24, reward: 12 },
  };
  function viewKidMine() {
    const c = kidCheck();
    if (!c) { location.hash = 'kid-select'; return ''; }
    const ok = kidTasksDone(c);
    const cfg = MINE_CFG[MINE_DIFF];
    MINE = null;
    return `
      <div class="topbar">
        <button class="icon-btn" onclick="location.hash='kid-fun'">${ICN.back}</button>
        <h1>💣 扫雷小勇士</h1>
        <div class="actions"><div class="icon-btn" style="background:var(--amber-50);color:var(--amber-600);font-size:13px;font-weight:600">★ ${c.points}</div></div>
      </div>
      <div class="page">
        <div class="diff-row">
          ${Object.entries(MINE_CFG).map(([k, v]) => `
            <div class="diff-pill ${k === MINE_DIFF ? 'on' : ''}" onclick="MINE_DIFF='${k}';MINE=null;render()">${v.label}<br><span style="font-size:11px;font-weight:500">${v.size}×${v.size} · ${v.mines}雷 · ${v.reward}★</span></div>
          `).join('')}
        </div>
        <div class="game-score-bar"><span>💣 地雷 <b id="mine-left">${cfg.mines}</b> 颗</span><span>已翻开 <b id="mine-open">0</b> 格</span></div>
        <div class="mine-grid" id="mine-grid" style="grid-template-columns:repeat(${cfg.size},1fr);max-width:${cfg.size >= 12 ? 400 : cfg.size >= 10 ? 360 : 320}px;font-size:${cfg.size >= 12 ? 12 : cfg.size >= 10 ? 14 : 16}px">
          ${Array.from({length: cfg.size * cfg.size}, (_, i) => `<div class="mine-cell" id="mc${i}" onclick="tapMine(${i})"><span class="mct"></span></div>`).join('')}
        </div>
        <div class="game-status" id="mine-status">${ok ? `翻开所有安全的格子就赢！小心 ${cfg.mines} 颗雷 💣` : FUN_GATE}</div>
        ${ok ? `<button id="mine-flagbtn" class="btn-secondary" style="width:100%;margin-bottom:8px;display:none" onclick="toggleFlagMode()">🚩 插旗模式：关</button>
               <button class="btn-primary" style="width:100%" onclick="startMine()">▶ 开始（消耗 5★）</button>
               <p class="wq-hint">先点「开始」，再翻开格子。数字 = 周围有几颗雷；觉得是雷就开插旗模式做标记</p>`
            : '<button class="btn-secondary" style="width:100%" onclick="location.hash=\'kid-tasks\'">先去打卡 ▶</button>'}
      </div>
      ${kidTabBar('fun')}
    `;
  }
  function startMine() {
    const c = kidCheck();
    if (!c) return;
    if (!kidTasksDone(c)) { toast(FUN_GATE); return; }
    if (MINE) return;
    if (c.points < 5) { toast('星星不够啦（需要 5★）⭐'); return; }
    c.points -= 5; saveData(DATA);
    const cfg = MINE_CFG[MINE_DIFF];
    const total = cfg.size * cfg.size;
    const cells = Array.from({length: total}, (_, i) => i);
    const mines = new Set();
    while (mines.size < cfg.mines) mines.add(cells[Math.floor(Math.random() * total)]);
    MINE = { size: cfg.size, mines: new Set(mines), open: new Set(), flags: new Set(), over: false, flagMode: false, first: true, reward: cfg.reward };
    const st = document.getElementById('mine-status');
    if (st) st.textContent = '翻开一个格子开始吧！数字表示周围有几颗雷';
    const fb = document.getElementById('mine-flagbtn');
    if (fb) fb.style.display = 'block';
  }
  function toggleFlagMode() {
    if (!MINE || MINE.over) return;
    MINE.flagMode = !MINE.flagMode;
    const fb = document.getElementById('mine-flagbtn');
    if (fb) { fb.textContent = `🚩 插旗模式：${MINE.flagMode ? '开' : '关'}`; fb.style.background = MINE.flagMode ? 'var(--amber-50)' : ''; fb.style.color = MINE.flagMode ? 'var(--amber-600)' : ''; }
    mineUpdateLeft();
  }
  // 剩余雷数 = 总雷数 - 已插旗数（原来这数字一直不变，插了旗也不减，孩子没法判断）
  function mineUpdateLeft() {
    if (!MINE) return;
    const el = document.getElementById('mine-left');
    if (el) el.textContent = MINE.mines.size - MINE.flags.size;
  }
  function mineAround(i) {
    const S = MINE.size;
    const r = Math.floor(i / S), col = i % S;
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = col + dc;
      if (nr >= 0 && nr < S && nc >= 0 && nc < S && MINE.mines.has(nr * S + nc)) n++;
    }
    return n;
  }
  // 格子内容写进内层 .mct（外层用 padding-top 撑正方形，直接写 textContent 会把高度撑破）
  function mcText(el, txt) {
    if (!el) return;
    const b = el.querySelector('.mct');
    if (b) b.textContent = txt; else el.textContent = txt;
  }
  function revealMine(i) {
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    MINE.open.add(i);
    const n = mineAround(i);
    el.classList.add('open');
    if (n > 0) { mcText(el, n); el.classList.add('mn-' + n); }
    else {
      const S = MINE.size;
      const r = Math.floor(i / S), col = i % S;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = col + dc;
        if (nr >= 0 && nr < S && nc >= 0 && nc < S) revealMine(nr * S + nc);
      }
    }
  }
  function tapMine(i) {
    if (!MINE || MINE.over) return;
    const el = document.getElementById('mc' + i);
    if (!el) return;
    if (MINE.flagMode) {
      if (MINE.open.has(i)) return;
      if (MINE.flags.has(i)) { MINE.flags.delete(i); el.classList.remove('open'); mcText(el, ''); }
      else { MINE.flags.add(i); el.classList.add('open'); mcText(el, '🚩'); }
      mineUpdateLeft();
      return;
    }
    if (MINE.open.has(i) || MINE.flags.has(i)) return;
    const total = MINE.size * MINE.size;
    const mineCount = MINE.mines.size;
    if (MINE.first && MINE.mines.has(i)) {
      // 第一次就点到雷 —— 把雷随机挪到别处，别让孩子开局就炸（原来固定挪到最靠前的空格，雷会挤在左上角）
      MINE.mines.delete(i);
      const cand = [];
      for (let j = 0; j < total; j++) if (j !== i && !MINE.mines.has(j)) cand.push(j);
      if (cand.length) MINE.mines.add(cand[Math.floor(Math.random() * cand.length)]);
    }
    MINE.first = false;
    if (MINE.mines.has(i)) {
      MINE.over = true;
      el.classList.add('open', 'boom'); mcText(el, '💣');
      MINE.mines.forEach(m => { const me = document.getElementById('mc' + m); if (me) { me.classList.add('open'); if (m !== i) mcText(me, '💣'); } });
      // 插错的旗标出来，让孩子知道错在哪
      MINE.flags.forEach(f => { if (!MINE.mines.has(f)) { const fe = document.getElementById('mc' + f); if (fe) { fe.classList.add('open'); mcText(fe, '❌'); } } });
      const st = document.getElementById('mine-status');
      if (st) st.textContent = '💥 踩到雷啦！别灰心，再开一局～';
      MINE = null;
      return;
    }
    revealMine(i);
    const oc = document.getElementById('mine-open');
    if (oc) oc.textContent = MINE.open.size;
    // 胜利有两种：① 所有安全格都翻开 ② 安全格全开 + 剩下的格子全插了旗，且旗全插对
    let win = MINE.open.size === total - mineCount;
    if (!win && MINE.open.size + MINE.flags.size === total) {
      let allRight = true;
      MINE.flags.forEach(f => { if (!MINE.mines.has(f)) allRight = false; });
      if (allRight) {
        MINE.flags.forEach(f => { const fe = document.getElementById('mc' + f); if (fe) { fe.classList.add('open'); mcText(fe, '🚩'); } });
        win = true;
      }
    }
    if (win) {
      MINE.over = true;
      MINE.mines.forEach(m => { const me = document.getElementById('mc' + m); if (me) { me.classList.add('open'); mcText(me, '🚩'); } });
      const st = document.getElementById('mine-status');

  // ---- 记忆翻翻乐（三档难度 + 步数限制） ----
  let MEM = null;
  let MEM_DIFF = 'normal';
  const MEM_EMOJIS = ['🐷', '🐶', '🌟', '🌈', '🍎', '🚀', '🦋', '🍦', '🎈', '🐟', '🐼', '🌸', '⚽', '🍉', '🐝', '🎨', '🌻', '🐧', '🍩', '🦊'];
  const MEM_CFG = {

  function viewKidMemory() {

  function startMem() {

    const cfg = MEM_CFG[MEM_DIFF];

  function clickMem(i) {
    if (!MEM || MEM.lock) return;
    const cd = MEM.cards[i];
    if (cd.done || cd.open) return;

    if (MEM.first === null) { MEM.first = i; renderMem(); return; }
    const fi = MEM.first;
    MEM.moves++; MEM.first = null;
    if (MEM.cards[fi].e === cd.e) {
      MEM.cards[fi].done = true; cd.done = true;

  // ========== 算 24 点（双人对战抢答 + 单人计时，妈妈口头判） ==========
  let M24 = null;
  let M24_DIFF = 'normal';          // normal=1-13, easy=1-9
  let m24Timer = null;

  // 求解器：返回等于 24 的算式字符串，无解返回 null
  function solve24(nums) {
    const OPS = [
      (a, b) => ({ s: '+', v: a + b }),
      (a, b) => ({ s: '-', v: a - b }),
      (a, b) => ({ s: '*', v: a * b }),
      (a, b) => (b === 0 ? null : { s: '/', v: a / b }),
    ];
    function rec(items) {
      if (items.length === 1) return Math.abs(items[0].v - 24) < 1e-6 ? items[0].e : null;
      for (let i = 0; i < items.length; i++) for (let j = 0; j < items.length; j++) {
        if (i === j) continue;
        const a = items[i], b = items[j];
        const rest = items.filter((_, k) => k !== i && k !== j);
        for (const op of OPS) {
          const r = op(a.v, b.v); if (!r) continue;
          const e = '(' + a.e + r.s + b.e + ')';
          const res = rec(rest.concat([{ v: r.v, e }]));
          if (res) return res;
        }
      }
      return null;
    }
    const sol = rec(nums.map(n => ({ v: n, e: String(n) })));
    return sol ? sol.replace(/^\(|\)$/g, '') : null;
  }
  function gen24() {
    const mx = M24_DIFF === 'easy' ? 9 : 13;
    for (let t = 0; t < 800; t++) {
      const ns = [1, 2, 3, 4].map(() => 1 + Math.floor(Math.random() * mx));
      const sol = solve24(ns);
      if (sol) return { nums: ns, solution: sol };
    }
    return { nums: [4, 6, 1, 1], solution: solve24([4, 6, 1, 1]) || '4*6' };
  }
  function startM24Timer() {
    if (m24Timer) clearInterval(m24Timer);
    m24Timer = setInterval(() => {
      const el = document.getElementById('m24-timer');
      if (!el) { clearInterval(m24Timer); m24Timer = null; return; }
      if (!M24 || M24.phase === 'buzzed' || M24.phase === 'reveal' || M24.phase === 'over') return;
      M24.timeLeft--;
      el.textContent = M24.timeLeft;
      if (M24.timeLeft <= 0) { clearInterval(m24Timer); m24Timer = null; m24Reveal(true); }
    }, 1000);
  }
  function m24SetDiff(d) {
    M24_DIFF = d;
    if (M24 && M24.phase !== 'over') {
      const g = gen24();
      M24.nums = g.nums; M24.solution = g.solution;
      M24.locked = null; M24.wrong = null; M24.phase = 'play';
      M24.roundStart = Date.now(); M24.timeLeft = 30;
      startM24Timer(); render();
    }
  }
  function startMath24(mode) {
    const g = gen24();
    M24 = {
      mode,
      nums: g.nums, solution: g.solution, round: 1,
      score: [0, 0], names: ['玩家1', '玩家2'],
      locked: null, wrong: null,
      solved: 0, fails: 0, bestMs: null,
      roundStart: Date.now(), timeLeft: 30, phase: 'play', timeup: false,
    };
    startM24Timer(); render();
  }
  function m24Buzz(p) {
    if (!M24 || M24.mode !== 'vs' || M24.phase !== 'play') return;
    if (M24.wrong === p || M24.locked !== null) return;
    M24.locked = p; M24.phase = 'buzzed'; render();
  }
  function m24SoloBuzz() {
    if (!M24 || M24.mode !== 'solo' || M24.phase !== 'play') return;
    M24.phase = 'buzzed'; render();
  }
  function m24Judge(correct) {
    if (!M24 || M24.phase !== 'buzzed') return;
    const p = M24.locked;
    if (correct) {
      if (M24.mode === 'vs') { M24.score[p]++; toast(M24.names[p] + ' 得分 +1 🎉'); }
      else { M24.solved++; const dt = Date.now() - M24.roundStart; if (M24.bestMs == null || dt < M24.bestMs) M24.bestMs = dt; toast('答对啦 +1 🎉'); }
      m24Next();
    } else {
      if (M24.mode === 'vs') { M24.wrong = p; M24.locked = null; M24.phase = 'play'; toast(M24.names[p] + ' 答错了，对方继续抢'); render(); }
      else { M24.fails++; toast('答错了，换一题'); m24Next(); }
    }
  }
  function m24Reveal(timeup) {
    if (!M24) return;
    M24.phase = 'reveal'; M24.timeup = !!timeup;
    if (m24Timer) { clearInterval(m24Timer); m24Timer = null; }
    render();
  }
  function m24Next() {
    if (!M24) { render(); return; }
    M24.round++;
    const g = gen24();
    M24.nums = g.nums; M24.solution = g.solution;
    M24.locked = null; M24.wrong = null; M24.phase = 'play'; M24.timeup = false;
    M24.roundStart = Date.now(); M24.timeLeft = 30;
    startM24Timer(); render();
  }
  function m24End() {
    if (!M24) { location.hash = 'kid-fun'; return; }
    M24.phase = 'over';
    if (m24Timer) { clearInterval(m24Timer); m24Timer = null; }
    render();
  }
  function m24Quit() {
    if (m24Timer) { clearInterval(m24Timer); m24Timer = null; }
    M24 = null; location.hash = 'kid-fun';
  }
  function m24Rename(p) {
    if (!M24) return;
    const modal = document.createElement('div');
    modal.className = 'modal-mask';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `

  function viewKidMath24() {

      <div class="page">
        ${M24.mode === 'vs' ? `
          <div class="stat-card" style="background:linear-gradient(135deg,#7C4DFF,#448AFF);color:#fff">
            <div class="big">${M24.score[0]} : ${M24.score[1]}</div>
            <div class="meta">${esc(M24.names[0])} vs ${esc(M24.names[1])}</div>
          </div>
          <p style="text-align:center;font-size:18px;font-weight:700;margin:6px 0 12px">${M24.score[0] === M24.score[1] ? '平局！🤝' : (M24.score[0] > M24.score[1] ? esc(M24.names[0]) + ' 获胜 🏆' : esc(M24.names[1]) + ' 获胜 🏆')}</p>
        ` : `
          <div class="stat-card" style="background:linear-gradient(135deg,#26A69A,#00897B);color:#fff">

        <button class="btn-secondary" style="width:100%" onclick="startMath24('${M24.mode}')">再来一局 ▶</button>

    const nums = M24.nums;
    if (M24.mode === 'vs') {
      return `

        <div class="m24-status" id="m24-status">${M24.phase === 'reveal' ? (M24.timeup ? '⏰ 时间到！' : '') + '正确答案：<b>' + M24.solution + ' = 24</b>' : (M24.phase === 'buzzed' ? esc(M24.names[M24.locked]) + ' 抢到了！等妈妈判～' : '看到数字就抢答，谁先点谁先答')}</div>
        ${M24.phase === 'reveal' ? `
          <button class="btn-primary" style="width:100%" onclick="m24Next()">下一题 ▶</button>
        ` : M24.phase === 'play' ? `

            <div class="m24-side left ${M24.wrong === 0 ? 'disabled' : ''}" onclick="m24Buzz(0)">
              <div class="m24-side-name" onclick="event.stopPropagation();m24Rename(0)">${esc(M24.names[0])} ✎</div>
              <div class="m24-buzz-btn">🙋 抢答</div>

            <div class="m24-side right ${M24.wrong === 1 ? 'disabled' : ''}" onclick="m24Buzz(1)">

        ` : `

        <div class="m24-nums">${nums.map(n => `<div class="m24-num">${n}</div>`).join('')}</div>
        <div class="m24-timer-wrap">⏱️ <span id="m24-timer">${M24.timeLeft}</span>s</div>
        <div class="m24-status" id="m24-status">${M24.phase === 'reveal' ? (M24.timeup ? '⏰ 时间到！' : '') + '正确答案：<b>' + M24.solution + ' = 24</b>' : (M24.phase === 'buzzed' ? '等妈妈判～' : '算出 24 就点「我算出来了」')}</div>
        ${M24.phase === 'reveal' ? `
          <button class="btn-primary" style="width:100%" onclick="m24Next()">下一题 ▶</button>
        ` : M24.phase === 'play' ? `
          <button class="btn-primary" style="width:100%;font-size:18px;padding:16px" onclick="m24SoloBuzz()">🙋 我算出来了</button>
          <button class="btn-secondary" style="width:100%" onclick="m24Reveal(false)">不会，换一题</button>
        ` : `
          <div class="m24-judge">
            <button class="btn-primary" style="width:100%" onclick="m24Judge(true)">✓ 对了</button>
            <button class="btn-secondary" style="width:100%" onclick="m24Judge(false)">✗ 错了（换一题）</button>
          </div>
        `}
      </div>
      ${kidTabBar('fun')}
      `;
  }

  // ---- 跟读排页：每天读哪几页 ----
  // 规则（2026-09-01 用户定）：每批 size 页，同一批连读 repeat 天巩固，第 repeat+1 天起进下一批。
  // 第 i 天（0 起）落在第 floor(i/repeat) 批，页范围 = [start + 批号*size, +size-1]。
  function pagePlan(dayIndex, start, size, repeat) {
    const s = Math.max(1, parseInt(start) || 1);
    const z = Math.max(1, parseInt(size) || 1);
    const r = Math.max(1, parseInt(repeat) || 1);
    const block = Math.floor(Math.max(0, parseInt(dayIndex) || 0) / r);
    const from = s + block * z;
    return { from: from, to: from + z - 1 };
  }
  function pageOn() {

  function pageAutoPreview() {
    const pv = document.getElementById('t-page-preview');
    if (!pv) return null;
    if (!pageOn()) { pv.textContent = ''; return null; }
    const start = parseInt((document.getElementById('t-page-start') || {}).value) || 1;
    const size = parseInt((document.getElementById('t-page-size') || {}).value) || 1;
    const rep = parseInt((document.getElementById('t-page-repeat') || {}).value) || 1;
    const days = parseInt((document.getElementById('t-repeat') || {}).value) || 1;
    if (days <= 1) { pv.textContent = '\uD83D\uDCD6 ' + start + '-' + (start + size - 1) + ' 页'; return null; }
    const blocks = Math.ceil(days / rep);
    const parts = [];
    for (let b = 0; b < blocks; b++) {
      const p = pagePlan(b * rep, start, size, rep);
      const cnt = Math.min(rep, days - b * rep);
      parts.push(p.from + '-' + p.to + '页' + (cnt > 1 ? '\u00D7' + cnt + '天' : ''));
    }
    pv.textContent = '\uD83D\uDCC5 连续 ' + days + ' 天：' + parts.join(' \u2192 ');
    return null;
  }

      return { from: Math.min(start, to), to: Math.max(start, to) };
    }
    const size = parseInt((document.getElementById('t-page-size') || {}).value) || 1;
    const p = pagePlan(0, start, size, 1);
    return { from: p.from, to: p.to, size: size, repeat: parseInt((document.getElementById('t-page-repeat') || {}).value) || 1 };
  }

  // 读弹窗表单（新增和编辑共用）

  // 讯飞密钥：只存本机 localStorage，不进 DATA（不参与家庭同步、不写进公开仓库）
  const XF_KEY = 'xf_ise_cfg';
  const XF = {
    get() { try { return JSON.parse(localStorage.getItem(XF_KEY) || '{}'); } catch (e) { return {}; } },
    save(o) { localStorage.setItem(XF_KEY, JSON.stringify(o || {})); },
    ok() { const c = XF.get(); return !!(c.appid && c.key && c.secret); },
    async url(host, path) {
      const c = XF.get();
      const date = new Date().toUTCString();
      const origin = 'host: ' + host + '\ndate: ' + date + '\nGET ' + path + ' HTTP/1.1';
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(c.secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const sg = new Uint8Array(await crypto.subtle.sign('HMAC', km, enc.encode(origin)));
      let bin = ''; for (let i = 0; i < sg.length; i++) bin += String.fromCharCode(sg[i]);
      const ao = 'api_key="' + c.key + '", algorithm="hmac-sha256", headers="host date request-line", signature="' + btoa(bin) + '"';
      const auth = btoa(unescape(encodeURIComponent(ao)));
      return 'wss://' + host + path + '?authorization=' + encodeURIComponent(auth) + '&date=' + encodeURIComponent(date) + '&host=' + encodeURIComponent(host);
    }
  };
  function b64bin(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64str(s) { try { return new TextDecoder('utf-8').decode(b64bin(s)); } catch (e) { return atob(s); } }
  function binB64(u) { let b = ''; for (let i = 0; i < u.length; i++) b += String.fromCharCode(u[i]); return btoa(b); }

  // 评测一次：refText 是要读的句子，pcm 是 Int16Array（16k/16bit/单声道）
  function iseEval(refText, pcm) {
    const c = XF.get();
    const biz = {
      sub: 'ise', ent: 'en_vip', category: 'read_sentence', cmd: 'ssb', ttp_skip: true,
      aue: 'raw', auf: 'audio/L16;rate=16000', tte: 'utf-8',
      text: '\uFEFF' + '[content]' + refText + '[/content]',
      rst: 'entirety', rstcd: 'utf8', ise_unite: '1',
      extra_ability: 'multi_dimension;syll_phone_err_msg', group: 'pupil'
    };
    return XF.url('ise-api.xfyun.cn', '/v2/open-ise').then(function (url) {
      return new Promise(function (res, rej) {
        let ws = null, buf = [], settled = false;
        const to = setTimeout(function () { fin(new Error('评分超时，再读一次')); }, 30000);
        function fin(err, val) { if (settled) return; settled = true; clearTimeout(to); try { if (ws) ws.close(); } catch (e) {} err ? rej(err) : res(val); }
        try { ws = new WebSocket(url); } catch (e) { return fin(e); }
        ws.onopen = function () {
          ws.send(JSON.stringify({ common: { app_id: c.appid }, business: biz, data: { status: 0 } }));
          const FR = 1280, n = Math.max(1, Math.ceil(pcm.byteLength / FR));
          let i = 0;
          const tm = setInterval(function () {
            if (i >= n) { clearInterval(tm); return; }
            const len = Math.min(FR, pcm.byteLength - i * FR);
            const part = new Uint8Array(pcm.buffer, pcm.byteOffset + i * FR, len);
            ws.send(JSON.stringify({
              business: { cmd: 'auw', aus: i === 0 ? 1 : (i === n - 1 ? 4 : 2) },
              data: { status: i === n - 1 ? 2 : 1, data: binB64(part) }
            }));
            i++;
          }, 40);
        };
        ws.onmessage = function (ev) {
          let r; try { r = JSON.parse(ev.data); } catch (e) { return fin(new Error('返回格式异常')); }
          if (r.code !== 0) return fin(new Error('评分失败 ' + r.code + '：' + (r.message || '')));
          const d = r.data || {};
          if (d.data) buf.push(b64str(d.data));
          if (d.status === 2) fin(null, buf.join(''));
        };
        ws.onerror = function () { fin(new Error('连不上评分服务，检查一下网络')); };
        ws.onclose = function () { if (!settled) fin(new Error('连接被关掉了')); };
      });
    });
  }

  function iseAttr(xml, tag, name) {
    const m = new RegExp('<' + tag + '\\b[^>]*\\b' + name + '="([^"]*)"').exec(xml);
    return m ? m[1] : null;
  }
  function iseParse(xml) {
    const f = function (v) { if (v == null) return null; const n = parseFloat(v); return isNaN(n) ? null : n; };
    let total = f(iseAttr(xml, 'read_chapter', 'total_score'));
    if (total == null) total = f(iseAttr(xml, 'read_sentence', 'total_score'));
    if (total == null) { const fm = /total_score="([\d.]+)"/.exec(xml); total = fm ? parseFloat(fm[1]) : 0; }
    const words = [];
    const re = /<word\b([^>]*?)\/?>/g; let m;
    while ((m = re.exec(xml))) {
      const c = /content="([^"]*)"/.exec(m[1]);
      const t = /total_score="([\d.]+)"/.exec(m[1]);
      const d = /dp_message="(\d+)"/.exec(m[1]);
      if (c) words.push({ w: c[1], score: t ? parseFloat(t[1]) : null, dp: d ? parseInt(d[1], 10) : 0 });
    }
    return {
      total: total || 0,
      accuracy: f(iseAttr(xml, 'sentence', 'accuracy_score')),
      fluency: f(iseAttr(xml, 'sentence', 'fluency_score')),
      standard: f(iseAttr(xml, 'sentence', 'standard_score')),
      integrity: f(iseAttr(xml, 'sentence', 'integrity_score')),
      words: words
    };
  }

  // 手机录的是 webm/opus，讯飞要 16k/16bit/单声道 PCM，这里做解码 + 重采样
  // 把 Blob / ArrayBuffer / TypedArray 统一成 ArrayBuffer。
  // 两个坑：① 测试连接走 fetch，拿到的是 ArrayBuffer 不是 Blob；
  // ② 老 Android WebView 没有 Blob.prototype.arrayBuffer —— 必须留 FileReader 兜底。
  function flToAb(x) {
    if (!x) return Promise.reject(new Error('没有音频数据'));
    if (Object.prototype.toString.call(x) === '[object ArrayBuffer]') return Promise.resolve(x);
    if (x.buffer && Object.prototype.toString.call(x.buffer) === '[object ArrayBuffer]') {
      var off = x.byteOffset || 0;
      return Promise.resolve((off === 0 && x.buffer.byteLength === x.byteLength)
        ? x.buffer : x.buffer.slice(off, off + x.byteLength));
    }
    if (typeof x.arrayBuffer === 'function') {
      try {
        var p = x.arrayBuffer();
        if (p && p.then) return p;
      } catch (e) {}
    }
    if (window.FileReader) {
      return new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () { res(fr.result); };
        fr.onerror = function () { rej(new Error('读不出这段录音')); };
        try { fr.readAsArrayBuffer(x); }
        catch (e) { rej(new Error('读不出这段录音')); }
      });
    }
    return Promise.reject(new Error('这个浏览器版本太老，读不了录音'));
  }

  function recToPcm16k(blob) {
    const AC = window.AudioContext || window.webkitAudioContext;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !OAC) return Promise.reject(new Error('这个设备不支持录音处理'));
    return flToAb(blob).then(function (ab) {
      const ac = new AC();
      return new Promise(function (res, rej) {
        const p = ac.decodeAudioData(ab, res, rej);
        if (p && p.then) p.then(res, rej);
      }).then(function (buf) {
        const rate = 16000;
        const len = Math.max(1, Math.ceil(buf.duration * rate));
        const off = new OAC(1, len, rate);
        const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
        return off.startRendering().then(function (rb) {
          try { ac.close(); } catch (e) {}
          const ch = rb.getChannelData(0);
          const out = new Int16Array(ch.length);
          for (let i = 0; i < ch.length; i++) { const s = Math.max(-1, Math.min(1, ch[i])); out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
          return out;
        });
      }).catch(function (e) { try { ac.close(); } catch (_) {} throw new Error('这段录音没听清，再读一次'); });
    });
  }

  // ---------------- 孩子端：跟读界面 ----------------
  let FOLLOW = null, FL_REC = null, FL_DEMO = null, FL_TIMER = null;
  function flStopDemo() { if (FL_DEMO) { try { FL_DEMO.pause(); } catch (e) {} FL_DEMO = null; } }
  function flDemoUrl(f) { const L = TB_LIB; return (L && L.base ? L.base : '') + f; }

  function openFollow(taskId) {
    const t = DATA.tasks.find(function (x) { return x.id === taskId; });
    if (!t || !t.follow) return;
    if (!XF.ok()) { toast('妈妈还没配置跟读评分，请到妈妈端「设置」里填讯飞密钥'); return; }
    const fo = t.follow;
    const sents = fo.sents || [];
    if (!sents.length) { toast('这个跟读任务没有内容'); return; }
    FOLLOW = {
      id: taskId, sents: sents, idx: 0, pass: fo.pass || 75, retry: fo.retry || 3,
      scores: (fo.scores || []).slice(), tries: 0, state: 'idle', result: null, err: ''
    };
    while (FOLLOW.idx < sents.length && FOLLOW.scores[FOLLOW.idx] != null) FOLLOW.idx++;
    const old = document.getElementById('fl-modal'); if (old) old.remove();
    const modal = document.createElement('div');
    modal.className = 'modal-mask'; modal.id = 'fl-modal';
    modal.onclick = function (e) { if (e.target === modal) flClose(); };
    document.getElementById('modal-root').appendChild(modal);
    flRender();
  }
  function flClose() {
    flStopDemo();
    if (FL_REC && FL_REC.mr && FL_REC.mr.state === 'recording') { try { FL_REC.mr.stop(); } catch (e) {} }
    if (FL_REC && FL_REC.stream) { try { FL_REC.stream.getTracks().forEach(function (x) { x.stop(); }); } catch (e) {} }
    if (FL_TIMER) { clearTimeout(FL_TIMER); FL_TIMER = null; }
    FL_REC = null; FOLLOW = null;
    const m = document.getElementById('fl-modal'); if (m) m.remove();
    render();
  }

  function flScoreColor(v, pass) { return v >= pass ? 'var(--green-600)' : (v >= pass - 15 ? 'var(--amber-600)' : 'var(--pink-600)'); }

  function flRender() {
    const m = document.getElementById('fl-modal');
    if (!m || !FOLLOW) return;
    const F = FOLLOW, n = F.sents.length;
    const doneN = F.scores.filter(function (x) { return x != null; }).length;
    const pct = n ? Math.round(doneN / n * 100) : 0;
    if (F.idx >= n) return flRenderDone(m, pct);
    const s = F.sents[F.idx];
    const R = F.result;
    const rec = F.state === 'recording';
    let wordsHtml = '';
    if (R && R.words && R.words.length) {
      wordsHtml = '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">' + R.words.map(function (w) {
        const bad = (w.score != null && w.score < 70) || w.dp !== 0;
        return '<span style="padding:3px 9px;border-radius:10px;font-size:13px;background:' + (bad ? 'var(--pink-50)' : 'var(--green-50)') + ';color:' + (bad ? 'var(--pink-600)' : 'var(--gray-700))') + '">' + esc(w.w) + (w.score != null ? ' ' + Math.round(w.score) : '') + '</span>';
      }).join('') + '</div>';
    }
    let actHtml = '';
    if (F.state === 'scoring') {
      actHtml = '<div style="text-align:center;padding:14px 0;color:var(--gray-600)">⏳ 正在评分…</div>';
    } else if (R) {
      const ok = R.total >= F.pass;
      const left = F.retry - F.tries;
      actHtml =
        '<div style="text-align:center;padding:10px 0">' +
          '<div style="font-size:40px;font-weight:700;color:' + flScoreColor(R.total, F.pass) + ';line-height:1.1">' + R.total.toFixed(1) + '</div>' +
          '<div style="font-size:13px;color:' + flScoreColor(R.total, F.pass) + ';margin-top:2px">' + (ok ? '✅ 达标啦' : '💪 再试一次会更好') + '</div>' +
          '<div style="display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--gray-600);margin-top:8px">' +
            (R.accuracy != null ? '<span>准确度 ' + R.accuracy.toFixed(0) + '</span>' : '') +
            (R.fluency != null ? '<span>流利度 ' + R.fluency.toFixed(0) + '</span>' : '') +
            (R.standard != null ? '<span>标准度 ' + R.standard.toFixed(0) + '</span>' : '') +
          '</div>' + wordsHtml +
          '<div style="display:flex;gap:8px;margin-top:12px">' +
            (ok ? '' : '<button class="btn-secondary" style="flex:1" onclick="flRetry()">🔁 再读一次' + (left > 0 ? '（还能 ' + left + ' 次）' : '') + '</button>') +
            '<button class="btn-primary" style="flex:1" onclick="flNext()">' + (F.idx >= n - 1 ? '完成 🎉' : '下一句 →') + '</button>' +
          '</div>' +
        '</div>';
    }
    if (F.err) {
      actHtml = '<div style="text-align:center;padding:10px 0;color:var(--pink-600);font-size:13px">' + esc(F.err) +
        '<div style="margin-top:8px"><button class="btn-secondary" onclick="flRetry()">🔁 重新录</button></div></div>';
    }
    m.innerHTML =
      '<div class="modal" style="max-height:92vh;overflow:auto">' +
        '<button class="icon-btn close" onclick="flClose()">✕</button>' +
        '<h3>🎤 逐句跟读</h3>' +
        '<div style="display:flex;align-items:center;gap:8px;margin:6px 0 10px">' +
          '<div style="flex:1;height:7px;border-radius:4px;background:var(--gray-100);overflow:hidden"><div style="height:100%;width:' + pct + '%;background:var(--green-600);border-radius:4px"></div></div>' +
          '<span style="font-size:12px;color:var(--gray-600);white-space:nowrap">' + doneN + '/' + n + ' 句</span>' +
        '</div>' +
        '<div style="background:var(--gray-50);border-radius:14px;padding:16px 14px;text-align:center">' +
          '<div style="font-size:12px;color:var(--gray-600);margin-bottom:6px">第 ' + (F.idx + 1) + ' 句</div>' +
          '<div style="font-size:19px;line-height:1.45;font-weight:600">' + esc(s.t) + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:12px">' +
          '<button class="btn-secondary" style="flex:1;padding:12px 0" onclick="flPlayDemo()">🔊 听示范</button>' +
          '<button class="' + (rec ? 'btn-secondary' : 'btn-primary') + '" style="flex:1;padding:12px 0" onclick="flRecToggle()">' + (rec ? '⏹ 我读完了' : '🎙 开始录音') + '</button>' +
        '</div>' +
        '<div id="fl-status" style="text-align:center;font-size:13px;color:var(--gray-600);margin-top:8px;min-height:18px">' +
          (rec ? '🔴 正在听你读…（再点一下结束）' : (R || F.err ? '' : '先听一遍示范，再点录音跟读')) +
        '</div>' +
        actHtml +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--gray-600)">' +
          '<span>达标线 ' + F.pass + ' 分</span>' +
          '<span style="text-decoration:underline" onclick="flNext()">跳过这句 →</span>' +
        '</div>' +
      '</div>';
  }

  function flRenderDone(m, pct) {
    const F = FOLLOW, n = F.sents.length;
    const got = F.scores.map(function (x) { return x == null ? 0 : x; });
    const avg = got.length ? got.reduce(function (a, b) { return a + b; }, 0) / got.length : 0;
    const passed = got.filter(function (x) { return x >= F.pass; }).length;
    const t = DATA.tasks.find(function (x) { return x.id === F.id; });
    const stars = avg >= 90 ? 3 : (avg >= 80 ? 2 : (avg >= F.pass ? 1 : 0));
    m.innerHTML =
      '<div class="modal" style="text-align:center">' +
        '<h3>🎉 这一轮读完啦</h3>' +
        '<div style="font-size:44px;font-weight:700;color:var(--green-600);margin:10px 0">' + avg.toFixed(1) + '</div>' +
        '<p style="font-size:14px;color:var(--gray-700);margin-bottom:4px">平均分 · ' + passed + '/' + n + ' 句达标</p>' +
        (stars ? '<p style="font-size:14px;color:var(--amber-600)">获得 ' + '⭐'.repeat(stars) + '</p>' : '') +
        '<div style="display:flex;gap:8px;margin-top:16px">' +
          '<button class="btn-secondary" style="flex:1" onclick="flRedo()">🔁 再练一轮</button>' +
          '<button class="btn-primary" style="flex:1" onclick="flFinish()">' + (t && t.done ? '完成' : '完成打卡 +' + (t ? t.points : 0) + ' 分') + '</button>' +
        '</div>' +
      '</div>';
  }

  function flPlayDemo() {
    if (!FOLLOW) return;
    const s = FOLLOW.sents[FOLLOW.idx]; if (!s) return;
    flStopDemo();
    const a = new Audio(flDemoUrl(s.f));
    a.preload = 'auto';
    FL_DEMO = a;
    a.play().catch(function () { toast('示范音加载失败，检查网络'); });
  }

  function flRecToggle() {
    if (!FOLLOW) return;
    if (FOLLOW.state === 'recording') return flRecStop();
    if (FOLLOW.state === 'scoring') return;
    FOLLOW.err = ''; FOLLOW.result = null; FOLLOW.tries++;
    if (!navigator.mediaDevices || !window.MediaRecorder) { FOLLOW.err = '这个设备不支持录音'; return flRender(); }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      let mr;
      try { mr = new MediaRecorder(stream); } catch (e) {
        try { mr = new MediaRecorder(stream, { mimeType: 'audio/webm' }); } catch (e2) { throw e2; }
      }
      const chunks = [];
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.start();
      FL_REC = { mr: mr, stream: stream, chunks: chunks };
      FOLLOW.state = 'recording';
      flRender();
      FL_TIMER = setTimeout(function () { if (FOLLOW && FOLLOW.state === 'recording') flRecStop(); }, 20000);
    }).catch(function () {
      FOLLOW.state = 'idle';
      FOLLOW.err = '没拿到麦克风权限，去系统设置里允许一下';
      flRender();
    });
  }

  function flRecStop() {
    if (!FL_REC || !FL_REC.mr) return;
    if (FL_TIMER) { clearTimeout(FL_TIMER); FL_TIMER = null; }
    const mr = FL_REC.mr, chunks = FL_REC.chunks, stream = FL_REC.stream;
    mr.onstop = function () {
      try { stream.getTracks().forEach(function (x) { x.stop(); }); } catch (e) {}
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      FL_REC = null;
      if (!blob.size) { FOLLOW.state = 'idle'; FOLLOW.err = '没录到声音，离话筒近一点再试'; return flRender(); }
      FOLLOW.state = 'scoring'; flRender();
      recToPcm16k(blob).then(function (pcm) {
        if (!FOLLOW) return;
        return iseEval(FOLLOW.sents[FOLLOW.idx].t, pcm);
      }).then(function (xml) {
        if (!FOLLOW) return;
        const r = iseParse(xml);
        const i = FOLLOW.idx;
        const old = FOLLOW.scores[i];
        FOLLOW.scores[i] = (old == null) ? r.total : Math.max(old, r.total);
        FOLLOW.result = r; FOLLOW.state = 'idle'; FOLLOW.err = '';
        flSaveProgress();
        flRender();
      }).catch(function (e) {
        if (!FOLLOW) return;
        FOLLOW.state = 'idle'; FOLLOW.err = (e && e.message) ? e.message : '评分失败，再试一次';
        flRender();
      });
    };
    try { mr.stop(); } catch (e) {}
  }

  function flSaveProgress() {
    const t = DATA.tasks.find(function (x) { return x.id === FOLLOW.id; });
    if (!t || !t.follow) return;
    t.follow.scores = FOLLOW.scores.slice();
    saveData(DATA);
  }

  function flRetry() {
    if (!FOLLOW) return;
    FOLLOW.result = null; FOLLOW.err = ''; FOLLOW.state = 'idle';
    flRender();
  }
  function flNext() {
    if (!FOLLOW) return;
    flStopDemo();
    FOLLOW.result = null; FOLLOW.err = ''; FOLLOW.state = 'idle'; FOLLOW.tries = 0;
    const i = FOLLOW.idx;
    if (FOLLOW.scores[i] == null) { FOLLOW.scores[i] = 0; flSaveProgress(); }
    FOLLOW.idx++;
    flRender();
  }
  function flRedo() {
    if (!FOLLOW) return;
    FOLLOW.scores = []; FOLLOW.idx = 0; FOLLOW.result = null; FOLLOW.err = ''; FOLLOW.state = 'idle'; FOLLOW.tries = 0;
    flSaveProgress();
    const old = document.getElementById('fl-modal');
    if (old) { old.className = 'modal-mask'; old.id = 'fl-modal'; old.onclick = function (e) { if (e.target === old) flClose(); }; }
    flRender();
  }
  function flFinish() {
    if (!FOLLOW) return;
    const t = DATA.tasks.find(function (x) { return x.id === FOLLOW.id; });
    const got = FOLLOW.scores.map(function (x) { return x == null ? 0 : x; });
    const avg = got.length ? got.reduce(function (a, b) { return a + b; }, 0) / got.length : 0;
    const stars = avg >= 90 ? 3 : (avg >= 80 ? 2 : (avg >= FOLLOW.pass ? 1 : 0));
    const id = FOLLOW.id;
    if (t && !t.done) {
      t.done = true; t.doneAt = Date.now();
      const k = DATA.children.find(function (c) { return c.id === t.childId; });
      if (k) {
        k.earned = (k.earned || 0) + t.points; k.points += t.points;
        DATA.pointsHistory.unshift({ id: 'h' + Date.now(), childId: k.id, date: t.date || TODAY, title: t.title, points: t.points, at: Date.now() });
        if (stars) awardStars(k, stars, '跟读：' + t.title);
        try { fpAdd('task', t.title, { childId: k.id, pts: t.points }); } catch (e) {}
      }
      saveData(DATA);
    }
    flClose();
    toast(stars ? '打卡完成，获得 ' + stars + ' 颗星 ⭐' : '打卡完成');
  }

  // ---------------- 妈妈端：讯飞密钥设置 ----------------

  function saveXfSettings() {
    const appid = (document.getElementById('xf-appid') || {}).value || '';
    const key = (document.getElementById('xf-key') || {}).value || '';
    const secret = (document.getElementById('xf-secret') || {}).value || '';
    XF.save({ appid: appid.trim(), key: key.trim(), secret: secret.trim() });

  function xfTest() {
    const appid = (document.getElementById('xf-appid') || {}).value || '';
    const key = (document.getElementById('xf-key') || {}).value || '';
    const secret = (document.getElementById('xf-secret') || {}).value || '';
    const out = document.getElementById('xf-test-out');
    if (!appid.trim() || !key.trim() || !secret.trim()) { if (out) { out.style.display = 'block'; out.style.color = 'var(--pink-600)'; out.textContent = '三个值都要填'; } return; }
    if (out) { out.style.display = 'block'; out.style.color = 'var(--gray-600)'; out.textContent = '⏳ 正在测试…'; }
    XF.save({ appid: appid.trim(), key: key.trim(), secret: secret.trim() });
    // 用一句最短的课文做一次真评测：拉示范音 → 转码 → 送去打分（等于把整条链路都跑一遍）
    const s = (TB_LIB.units && TB_LIB.units[0] && TB_LIB.units[0].sents[0]) ? TB_LIB.units[0].sents[0] : null;
    if (!s) { if (out) { out.textContent = '素材库没加载'; } return; }
    // stage 用来区分「密钥/网络问题」和「这台设备解码录音有问题」，报错才好定位
    let stage = 'download';
    fetch(flDemoUrl(s.f)).then(function (r) {
        if (!r.ok && r.status) throw new Error('示范音下载失败 HTTP ' + r.status);
        return r.arrayBuffer();
      })
      .then(function (ab) { stage = 'decode'; return recToPcm16k(ab); })
      .then(function (pcm) { stage = 'ise'; return iseEval(s.t, pcm); })
      .then(function (xml) {
        const p = iseParse(xml);
        if (out) {
          out.style.color = 'var(--green-600)';
          out.textContent = '✅ 通了！密钥可用、转码也正常。测试句「' + s.t + '」得分 ' +
            (p.total || 0).toFixed(1) + '（合成音接近满分属正常）';
        }
      })
      .catch(function (e) {
        const m = (e && e.message) ? e.message : '未知错误';
        if (!out) return;
        out.style.color = 'var(--pink-600)';
        if (stage === 'ise') {
          out.textContent = '❌ 密钥或网络有问题：' + m + '（检查三个值有没有填错，以及这台设备能不能上网）';

  }

  function closeAllModals() {

  }
  // 取消任务：布置错了可以只删今天、也可以把整批连排一起撤掉
  function askDelTask(id) {
    const t = DATA.tasks.find(x => x.id === id);
    if (!t) return;
    const sibs = t.groupId ? DATA.tasks.filter(x => x.groupId === t.groupId) : [];
    const after = sibs.filter(x => x.date >= t.date).sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    const q = (arr) => arr.map(x => "'" + x + "'").join(',');

      <div class="modal">
        <button class="icon-btn close" onclick="this.closest('.modal-mask').remove()">✕</button>
        <h3>取消任务</h3>
        <p class="del-warn">「${esc(t.title)}」${t.done ? '<br><span style="color:#C62828">孩子已经打卡拿到 ' + (t.points || 0) + ' ★，取消后这颗星会收回来</span>' : ''}</p>
        <div class="btn-row" style="flex-direction:column">
          <button class="btn-secondary" onclick="doDelTask([${q([t.id])}])">只取消这一条</button>

          ${sibs.length > after.length ? `<button class="btn-secondary" onclick="doDelTask([${q(sibs.map(x => x.id))}])">把这批全部删掉（${sibs.length} 条）</button>` : ''}
          <button class="btn-primary" onclick="this.closest('.modal-mask').remove()">不删了</button>
