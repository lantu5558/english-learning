// ============================================================
//  打卡系统(不用动下面)
// ============================================================
const $ = s => document.querySelector(s);

// 取本地日期字符串 YYYY-MM-DD
function localDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + dd;
}

function todayStr() { return localDateStr(new Date()); }

// 读取打卡记录
function getLogs(grade) {
  try { return JSON.parse(localStorage.getItem('ci_' + grade) || '[]'); }
  catch { return []; }
}

// 保存打卡记录
function saveLogs(grade, logs) {
  localStorage.setItem('ci_' + grade, JSON.stringify(logs));
}

// 计算连续打卡天数
function calcStreak(logs) {
  if (!logs.length) return 0;
  const today = todayStr();
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  const sorted = [...new Set(logs)].sort().reverse();
  if (sorted[0] !== today && sorted[0] !== yesterday) return 0;
  let streak = 0, cur = sorted[0] === today ? todayStr() : localDateStr(new Date(Date.now() - 86400000));
  const seen = new Set(sorted);
  while (seen.has(cur)) { streak++; cur = localDateStr(new Date(new Date(cur).getTime() - 86400000)); }
  return streak;
}

// 获取打卡总天数
function totalDays(logs) {
  return new Set(logs).size;
}

// 今天是否已打卡
function isCheckedToday(logs) {
  return logs.includes(todayStr());
}

// 渲染打卡区
function renderCheckin(grade) {
  const logs = getLogs(grade);
  const streak = calcStreak(logs);
  const total = totalDays(logs);
  const checked = isCheckedToday(logs);
  const gradeDef = GRADES.find(g => g.key === grade);
  const ciSection = $("#checkinSection");

  let btnHTML, btnClass, btnText;
  if (checked) {
    btnClass = 'ci-btn ci-btn-done';
    btnText = '✅ 已打卡';
  } else if (streak > 0 && !logs.includes(localDateStr(new Date(Date.now() - 86400000)))) {
    btnClass = 'ci-btn ci-btn-today';
    btnText = '🎯 今日打卡';
  } else {
    btnClass = 'ci-btn ci-btn-miss';
    btnText = '📝 补打卡';
  }

  const streakIcon = streak >= 7 ? '🔥' : streak >= 3 ? '💪' : '⭐';

  ciSection.innerHTML = `
    <div class="checkin-card">
      <div class="ci-icon-wrap">
        <span class="ci-icon">${gradeDef.name.split(' ')[0]}</span>
        ${checked ? '<span class="ci-badge">✓</span>' : ''}
      </div>
      <div class="ci-info">
        <div class="ci-grade-name">${gradeDef.name.split(' ').slice(1).join(' ')}</div>
        <div class="ci-status">${checked ? '今日已完成!' : '今天还没打卡哦~'}</div>
        <div class="ci-streak-row">
          <span class="ci-fire">${streakIcon}</span>
          <span class="ci-streak-num">${streak}</span>
          <span class="ci-streak-label">天连续</span>
          <span style="color:#ccc;font-size:13px;margin-left:8px">共${total}天</span>
        </div>
      </div>
      <button class="${btnClass}" id="ciBtn">${btnText}</button>
    </div>
  `;

  // 绑定打卡按钮
  $("#ciBtn").onclick = () => {
    const l = getLogs(grade);
    if (!l.includes(todayStr())) {
      l.push(todayStr());
      saveLogs(grade, l);
    }
    renderCheckin(grade);
    renderHistory(grade);
  };

  // 渲染历史
  renderHistory(grade);
}

function renderHistory(grade) {
  const logs = getLogs(grade);
  const today = todayStr();
  const logSet = new Set(logs);

  // 最近28天
  const days = [];
  for (let i = 27; i >= 0; i--) {
    days.push(localDateStr(new Date(Date.now() - i * 86400000)));
  }

  let html = '<div class="ci-history"><div class="ci-history-title">打卡记录 (近28天)</div><div class="ci-dots">';
  days.forEach(d => {
    const dayNum = d.slice(8,10);
    if (d === today && logSet.has(d)) {
      html += '<div class="ci-dot ci-dot-today" title="'+d+'">✓</div>';
    } else if (logSet.has(d)) {
      html += '<div class="ci-dot ci-dot-checked" title="'+d+'">'+dayNum+'</div>';
    } else {
      html += '<div class="ci-dot ci-dot-empty" title="'+d+'">'+dayNum+'</div>';
    }
  });
  html += '</div></div>';

  // 复用/创建 history 容器
  let histEl = $("#checkinHistory");
  if (!histEl) {
    histEl = document.createElement("div");
    histEl.id = "checkinHistory";
    $("#checkinSection").after(histEl);
  }
  histEl.outerHTML = html;
  // 重新获取引用(插入后 outerHTML 会移除旧元素,已用 innerHTML 代替)
  const newHist = document.createElement("div");
  newHist.id = "checkinHistory";
  newHist.innerHTML = html.slice(html.indexOf('>')+1, html.lastIndexOf('</div>'));
  const old = document.getElementById("checkinHistory");
  if (old) old.replaceWith(newHist);
  else $("#checkinSection").after(newHist);
}

// ============================================================
//  年级 + 视频列表(不用动下面)
// ============================================================
let currentGrade = "小学";
let currentCat = "全部";

function buildGradeTabs() {
  const wrap = $("#gradeTabs");
  GRADES.forEach((g, i) => {
    const btn = document.createElement("button");
    btn.className = "grade-tab" + (i === 0 ? " active" : "");
    btn.innerHTML = g.name + '<span class="sub">' + g.sub + '</span>';
    btn.onclick = () => {
      document.querySelectorAll(".grade-tab").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
      currentGrade = g.key;
      buildCats(g);
      renderGrid();
      renderCheckin(g.key);
      $("#playlistOverlay").classList.remove("show");
    };
    wrap.appendChild(btn);
  });
}

function buildCats(gradeObj) {
  const wrap = $("#cats");
  wrap.innerHTML = "";
  gradeObj.cats.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (i === 0 ? " active" : "");
    b.textContent = c.emoji + " " + c.name;
    b.onclick = () => {
      document.querySelectorAll(".cat-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentCat = c.name;
      renderGrid();
      $("#playlistOverlay").classList.remove("show");
    };
    wrap.appendChild(b);
  });
}

function renderGrid() {
  const grid = $("#grid");
  grid.innerHTML = "";
  let list = VIDEOS.filter(v => v.grade === currentGrade);
  if (currentCat !== "全部") list = list.filter(v => v.cat === currentCat);
  if (!list.length) {
    grid.innerHTML = '<div class="empty">这个分类还没有视频哦～<br>把视频链接发给我，我帮你加进去!</div>';
    return;
  }
  list.forEach(v => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<div class="thumb">' + v.emoji + '</div><div class="name">' + v.title + '</div>';
    d.onclick = () => {
      if (v.type === "playlist") {
        showPlaylist(v);
      } else {
        play(v);
      }
    };
    grid.appendChild(d);
  });
}

// 展示专辑集列表
function showPlaylist(v) {
  $("#playlistTitle").textContent = v.emoji + " " + v.title;
  const grid = $("#playlistGrid");
  grid.innerHTML = "";
  v.episodes.forEach(ep => {
    const d = document.createElement("div");
    d.className = "ep-card";
    d.textContent = ep.title;
    d.onclick = () => {
      $("#playlistOverlay").classList.remove("show");
      play({
        emoji: v.emoji,
        title: ep.title,
        type: "bili",
        url: v.bv,
        page: ep.page
      });
    };
    grid.appendChild(d);
  });
  $("#playlistOverlay").classList.add("show");
}

$("#playlistClose").onclick = () => $("#playlistOverlay").classList.remove("show");
$("#playlistOverlay").onclick = e => { if (e.target === $("#playlistOverlay")) $("#playlistOverlay").classList.remove("show"); };

function play(v) {
  $("#ptitle").textContent = v.emoji + " " + v.title;
  const page = v.page || 1;
  $("#playerWrap").innerHTML = v.type === "bili"
    ? '<iframe src="https://player.bilibili.com/player.html?bvid=' + v.url + '&page=' + page + '&high_quality=1&danmaku=0&autoplay=1" allowfullscreen="true" scrolling="no"></iframe>'
    : '<video src="' + v.url + '" controls autoplay playsinline webkit-playsinline></video>';
  $("#playerMask").classList.add("show");
}

$("#backBtn").onclick = () => {
  $("#playerMask").classList.remove("show");
  $("#playerWrap").innerHTML = "";
};

// 初始化
buildGradeTabs();
buildCats(GRADES[0]);
renderGrid();
renderCheckin(currentGrade);
</script>
