<script>
/* 存档桥接：把 localStorage 换成「跟着家里账号走」的共享抽屉，换设备进度不丢。
   单独打开这个文件时（地址栏没有 #gid=&kid=）行为跟以前一样，照旧存本机。 */
(function () {
  var MIRROR = 'lebao-gamesaves-v1';
  var GID = '2048', KID = '';
  function parse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  try {
    var h = String(location.hash || '').replace(/^#/, '');
    var a = h.match(/(?:^|&)gid=([^&]*)/); if (a) GID = decodeURIComponent(a[1]) || GID;
    var b = h.match(/(?:^|&)kid=([^&]*)/); if (b) KID = decodeURIComponent(b[1]) || '';
  } catch (e) {}
  function readAll() {
    var o = null;
    try { var p = window.parent; if (p && p.localStorage) { var r = p.localStorage.getItem(MIRROR); if (r) o = parse(r); } } catch (e) {}
    if (!o) { try { var r2 = localStorage.getItem(MIRROR); if (r2) o = parse(r2); } catch (e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function writeAll(o, k, v) {
    var s = null;
    try { s = JSON.stringify(o); } catch (e) { return; }
    try { localStorage.setItem(MIRROR, s); } catch (e) {}
    try { window.parent.localStorage.setItem(MIRROR, s); } catch (e) {}
    // 通知平台把这条存进 DATA —— 只有这样它才会跟着账号同步到别的设备
    try { window.parent.postMessage({ __flp: 'gsave', gid: GID, kid: KID || 'mom', k: k, v: String(v) }, '*'); } catch (e) {}
  }
  window.gsGet = function (k) {
    if (!KID) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    var s = readAll()[GID + '@' + KID];
    if (!s || !s.d || typeof s.d !== 'object') return null;
    var v = s.d[k];
    return (v === undefined || v === null) ? null : v;
  };
  window.gsSet = function (k, v) {
    if (!KID) { try { localStorage.setItem(k, String(v)); } catch (e) {} return; }
    var o = readAll(), sk = GID + '@' + KID;
    if (!o[sk] || typeof o[sk] !== 'object') o[sk] = {};
    if (!o[sk].d || typeof o[sk].d !== 'object') o[sk].d = {};
    o[sk].d[k] = String(v);
    o[sk].__t = Date.now();
    writeAll(o, k, v);
  };
})();
</script>
<script>
(function () {
  'use strict';
  var N = 4, GAP = 8, BEST_KEY = 'lgame_2048_best';
  var board = document.getElementById('board');
  var layer = document.getElementById('tiles');
  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elOver = document.getElementById('over');
  var elOverT = document.getElementById('overT');
  var elOverP = document.getElementById('overP');

  var cells, tiles, score, best, uid, over, reached;

  // localStorage 在部分 WebView / 无痕模式下会直接抛异常，一律包起来
  function loadBest() { try { return parseInt(window.gsGet ? window.gsGet(BEST_KEY) : null, 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { if (window.gsSet) window.gsSet(BEST_KEY, String(v)); } catch (e) {} }

  function mkTile(r, c, v, isNew) {
    return { id: ++uid, r: r, c: c, v: v, isNew: !!isNew, merged: false, pr: null, pc: null, from: null };
  }
  function at(r, c) { return cells[r * N + c]; }
  function setAt(r, c, t) { cells[r * N + c] = t; }

  function emptyCells() {
    var out = [];
    for (var i = 0; i < cells.length; i++) if (!cells[i]) out.push(i);
    return out;
  }
  function spawn() {
    var e = emptyCells();
    if (!e.length) return null;
    var i = e[Math.floor(Math.random() * e.length)];
    var t = mkTile(Math.floor(i / N), i % N, Math.random() < 0.9 ? 2 : 4, true);
    setAt(t.r, t.c, t);
    tiles.push(t);
    return t;
  }

  // 一维向左压：先挤到一起，再两两合并（每轮每个块只能合并一次）
  function pack(line) {
    var arr = [], i;
    for (i = 0; i < line.length; i++) if (line[i]) arr.push(line[i]);
    var out = [], gained = 0;
    for (i = 0; i < arr.length; i++) {
      var t = arr[i], nx = arr[i + 1];
      if (nx && nx.v === t.v) {
        var nt = mkTile(0, 0, t.v * 2, false);
        nt.merged = true;
        nt.from = [t, nx];
        out.push(nt);
        gained += nt.v;
        i++;
      } else {
        out.push(t);
      }
    }
    for (i = out.length; i < N; i++) out.push(null);
    return { out: out, gained: gained };
  }

  function move(dir) {
    if (over) return;
    var i, r, c, line, res, moved = false, gained = 0;
    var fresh = [];

    function take(rs, cs) {
      var l = [];
      for (var k = 0; k < N; k++) l.push(at(rs(k), cs(k)));
      return l;
    }
    function put(l, rs, cs) {
      for (var k = 0; k < N; k++) setAt(rs(k), cs(k), l[k]);
    }

    for (i = 0; i < N; i++) {
      if (dir === 'left' || dir === 'right') {
        (function (row) {
          line = take(function () { return row; }, function (k) { return k; });
          if (dir === 'right') line.reverse();
          res = pack(line);
          if (dir === 'right') res.out.reverse();
          put(res.out, function () { return row; }, function (k) { return k; });
        })(i);
      } else {
        (function (col) {
          line = take(function (k) { return k; }, function () { return col; });
          if (dir === 'down') line.reverse();
          res = pack(line);
          if (dir === 'down') res.out.reverse();
          put(res.out, function (k) { return k; }, function () { return col; });
        })(i);
      }
      gained += res.gained;
    }

    // 逐个 tile 核对新位置，记录旧坐标用于滑动动画
    var live = [];
    for (i = 0; i < cells.length; i++) {
      var t = cells[i];
      if (!t) continue;
      var nr = Math.floor(i / N), nc = i % N;
      if (t.r !== nr || t.c !== nc) { t.pr = t.r; t.pc = t.c; t.r = nr; t.c = nc; moved = true; }
      t.isNew = false;
      live.push(t);
      if (t.from) {
        t.from[0].pr = t.from[0].r; t.from[0].pc = t.from[0].c;
        t.from[1].pr = t.from[1].r; t.from[1].pc = t.from[1].c;
        t.from[0].r = t.from[1].r = nr;
        t.from[0].c = t.from[1].c = nc;
        t.from[0].isNew = t.from[1].isNew = false;
        moved = true;
        live.push(t.from[0], t.from[1]);
        t.from = null;
      }
    }
    // 只要发生过合并，也算「这一步有效」
    if (!moved && gained > 0) moved = true;
    if (!moved && gained === 0) {
      // 合并过但位置没变（例如整行已经贴左），仍然算有效
      for (i = 0; i < live.length; i++) if (live[i].merged) { moved = true; break; }
    }
    if (!moved) return;

    tiles = live;
    score += gained;
    if (score > best) { best = score; saveBest(best); }
    var nt = spawn();
    if (nt) tiles.push(nt);
    render();
    checkEnd();
  }

  function canMove() {
    var r, c;
    for (r = 0; r < N; r++) {
      for (c = 0; c < N; c++) {
        var t = at(r, c);
        if (!t) return true;
        if (c + 1 < N) { var rt = at(r, c + 1); if (rt && rt.v === t.v) return true; }
        if (r + 1 < N) { var dt = at(r + 1, c); if (dt && dt.v === t.v) return true; }
      }
    }
    return false;
  }

  function checkEnd() {
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].v >= 2048 && !reached) { reached = true; showOver('凑出 2048 啦！', '真厉害，还能继续往上合'); return; }
    }
    if (!canMove()) { over = true; showOver('没地方走了', '本局得分 ' + score + ' 分'); }
  }

  function showOver(t, p) {
    elOverT.textContent = t;
    elOverP.textContent = p;
    elOver.classList.remove('hide');
  }

  function render() {
    layer.innerHTML = '';
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var d = document.createElement('div');
      var cls = 'tile ' + (t.v > 2048 ? 'vbig' : 'v' + t.v);
      if (t.isNew) cls += ' n';
      if (t.merged) cls += ' m';
      d.className = cls;
      d.style.setProperty('--c', t.pc === null ? t.c : t.pc);
      d.style.setProperty('--r', t.pr === null ? t.r : t.pr);
      d.style.setProperty('--fs', t.v < 100 ? 34 : (t.v < 1000 ? 28 : 22));
      d.textContent = t.v;
      if (t.merged) d.style.zIndex = '4';
      layer.appendChild(d);
      if (t.pr !== null) {
        (function (el, tt) {
          requestAnimationFrame(function () {
            el.style.setProperty('--c', tt.c);
            el.style.setProperty('--r', tt.r);
          });
        })(d, t);
      }
      t.pr = t.pc = null;
      t.merged = false;
    }
    elScore.textContent = score;
    elBest.textContent = best;
    // 合并时被盖住的旧块，动画结束就撤掉，别越堆越多
    setTimeout(function () {
      var keep = [], m;
      for (m = 0; m < cells.length; m++) if (cells[m]) keep.push(cells[m].id);
      tiles = tiles.filter(function (x) { return keep.indexOf(x.id) >= 0; });
    }, 160);
  }

  function reset() {
    cells = []; tiles = []; score = 0; uid = 0; over = false; reached = false;
    for (var i = 0; i < N * N; i++) cells.push(null);
    best = loadBest();
    elOver.classList.add('hide');
    spawn(); spawn();
    render();
    fit();
  }

  function fit() {
    var stage = document.getElementById('stage');
    var s = Math.min(stage.clientWidth, stage.clientHeight);
    if (!s || s < 60) s = 260;
    board.style.width = s + 'px';
    board.style.height = s + 'px';
  }

  // ---- 输入：键盘 + 触摸滑动 ----
  var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
               a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k && k.indexOf('Arrow') === 0) e.preventDefault();
    var d = KEYS[k];
    if (d) move(d);
  });

  var sx = 0, sy = 0, tracking = false;
  board.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  board.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  board.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  document.getElementById('restart').onclick = reset;
  document.getElementById('again').onclick = reset;

  if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('resize', fit);
  reset();
})();
</script>
